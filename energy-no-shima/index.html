/* けっかの こうひょう。ここで 答えを 言うのでは なく、見えた ことを ことばに する */
function jkVerdict(A, B){
  var st = curStage(), sim = jkSim(), r = jikkenState();
  var w = sim.words || {};
  var mName = w.name || 'けっか';
  var d = Math.abs(A.val - B.val);
  var diff = d > (sim.eps || 0.05);
  /* ごさの はんいの ちがいを「かわらなかった」と 言いきると うそに なるので ことばを 分ける */
  var changed = diff ? 'かわった' : (d > 1e-9 ? 'ほとんど かわらなかった' : 'かわらなかった');
  var tName = '';
  st.vars.forEach(function(v){ if (v.id === st.target) tName = v.label; });
  if (!r.targetDiff)
    return { good:false, retry:true, lines:[
      w.sameSetup || 'A と B が 同じ じょうけんに なって いたよ。',
      'これでは「' + tName + '」を くらべられないね。'] };
  if (!r.othersSame)
    return { good:false, retry:true, lines:[
      mName + 'は ' + (diff ? 'ちがった' : '同じだった') + '。でも…',
      'A と B は ちがう ところが 2つ いじょう あるよ。',
      'これでは どちらが きいたのか 分からないね。'] };
  var predOK = (cur.pred === 'same' && !diff) ||
               (cur.pred === 'A' && diff && A.val > B.val) ||
               (cur.pred === 'B' && diff && B.val > A.val);
  return { good:true, retry:false, lines:[
    (predOK ? '⭐ よそう どおり！' : '✨ よそうと ちがった！ それが 発見だよ'),
    '「' + tName + '」だけを かえたら、' + mName + 'は ' + changed + '。',
    sim.line(A, B, diff)] };
}

/* ------------------ アニメ ------------------ */
function jkTick(){
  var sim = jkSim(), changed = false;
  ['A','B'].forEach(function(side){
    var inf = jkInfo(side);
    if (cur.fin[side] === null && cur.t >= inf.total) cur.fin[side] = inf.total;
    var fin = cur.fin[side];
    var shown = (fin !== null) ? fin : cur.t;
    var ro = jkRead(sim, inf, shown);
    var lt = document.getElementById('jk-lap' + side), tt = document.getElementById('jk-tim' + side);
    if (lt && lt.textContent !== ro.top){ lt.textContent = ro.top; changed = true; }
    if (tt && tt.textContent !== ro.bottom){ tt.textContent = ro.bottom; changed = true; }
    if (sim.tick) sim.tick(side, side === 'A' ? 170 : 430, inf, cur.t, fin);
  });
  /* えが なめらかに うごかない じっけんは、数字が かわった ときだけ かきなおす（かるくする ため） */
  if (!sim.tick && changed && cur.phase === 'run') renderBoard();
}
function jkStartRun(){
  cur.phase = 'run'; cur.t = 0; cur.fin = { A:null, B:null };
  renderBoard();
  var speed = jkSim().speed || JK.speed;
  var last = null;
  function step(now){
    if (cur.phase !== 'run' || cur.kind !== 'jikken'){ cur.raf = null; return; }
    if (last === null) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    cur.t += dt * speed;
    jkTick();
    if (cur.fin.A !== null && cur.fin.B !== null){ cur.raf = null; jkFinish(); return; }
    cur.raf = requestAnimationFrame(step);
  }
  cur.raf = requestAnimationFrame(step);
}
function jkFinish(){
  jkStop();
  ['A','B'].forEach(function(side){ if (cur.fin[side] === null) cur.fin[side] = jkInfo(side).total; });
  cur.phase = 'done';
  renderBoard();
}

function renderJikken(){
  if (cur.phase === 'set' || !jkSim()) jkRenderSet();
  else jkRenderRun();
}
function tapJikken(e){
  var g2 = attrUp(e.target, 'data-go2');
  if (g2 !== null){
    jkStop();
    if (g2 === 'run') jkStartRun();
    else { cur.phase = 'set'; renderBoard(); }
    return;
  }
  if (cur.phase === 'run'){ jkFinish(); return; }      /* まちきれない ときは タップで けっかへ */
  if (cur.phase === 'done') return;
  var pr = attrUp(e.target, 'data-pred');
  if (pr !== null){ cur.pred = pr; renderBoard(); return; }
  var v = attrUp(e.target, 'data-exp');
  if (v === null) return;
  var a = v.split('|');
  cur.exp[a[0]][a[1]] = parseInt(a[2], 10);
  renderBoard();
}
ENGINES.jikken = { load:loadJikken, render:renderJikken, tap:tapJikken };

/* ================================================================== *
 * こうじょう型 — リサイクル工場（60びょうの スコアアタック）
 *
 *   ★ここは「理科の もんだい」では なく **ゲーム**。
 *     ベルトコンベアで 流れて くる ゴミを、でんじしゃくクレーンで つかんで はこへ 入れる。
 *     60びょうで どれだけ あつめられるか。にがすと ゼロ。
 *
 *   あそんで いるだけで 手が おぼえる こと（説明は しない）:
 *     ・でんじしゃくの 強さは **まきかず × でんち**（ボタンに そう 書いて あるだけ）
 *     ・強くするほど **電気を たくさん つかう**（ゲージが 減る）→ 重さに 合わせて えらぶ ように なる
 *     ・**アルミは 何回 やっても つかない** → 見た だけで よけるように なる
 *     ・スイッチを 切れば はなせる（つかむ→はこぶ→はなすが 1タップで つながる）
 *
 *   むずかしさは 「流れて くる ゴミの おもさ」で つける。正かいの そうさは 用意して いない。
 * ================================================================== */

/* ---- ゴミの え（リサイクル工場で つかう）---- */

  if (kind === 'kan')
    return '<rect x="-12" y="-18" width="24" height="36" rx="3" fill="' + alu + '" stroke="' + aluD + '" stroke-width="2.5"/>' +
           '<ellipse cx="0" cy="-18" rx="12" ry="4" fill="#EEF3F7" stroke="' + aluD + '" stroke-width="2"/>' +

}
var FC = {
  H:470, rail:104, beltY:300, beltH:24, endX:410, boxX:538, boxW:116,
  armIdle:52, armDown:150, speed:600, time:60, power:100
};
/* えらべる でんじしゃく。max は もち上げられる 重さ ＝ (まきかず/100)×でんち×3 */
var FC_POWER = [
  { id:0, name:'よわ',   maki:100, den:1, max:3,  cost:1,  col:'#7FB6D6' },
  { id:1, name:'ちゅう', maki:300, den:1, max:9,  cost:3,  col:'#F5B324' },
  { id:2, name:'つよ',   maki:500, den:2, max:30, cost:10, col:'#E05A4A' }
];
/* ベルトを 流れて くる もの */
var FC_JUNK = [
  { id:'kugi',     name:'ねじ',       w:1,  mat:'tetsu' },
  { id:'spana',    name:'スパナ',     w:4,  mat:'tetsu' },
  { id:'ita',      name:'鉄板',       w:8,  mat:'tetsu' },
  { id:'katamari', name:'かたまり',   w:16, mat:'tetsu' },
  { id:'kan',      name:'アルミかん', w:2,  mat:'alumi' },
  { id:'haku',     name:'アルミはく', w:1,  mat:'alumi' }
];
function fcJunk(id){ for (var i=0;i<FC_JUNK.length;i++){ if (FC_JUNK[i].id === id) return FC_JUNK[i]; } return null; }
function fcPow(){ return FC_POWER[cur.pw]; }

function loadFactory(st){
  if (cur.fcRaf){ cancelAnimationFrame(cur.fcRaf); cur.fcRaf = null; }
  cur.items = []; cur.seq = 0;
  cur.pw = 0; cur.power = FC.power;
  cur.score = 0; cur.miss = 0; cur.combo = 0; cur.bestCombo = 0;
  cur.left = FC.time; cur.playing = false; cur.over = false;
  cur.cx = 300; cur.arm = FC.armIdle; cur.hold = null; cur.on = false;
  cur.chase = null; cur.phase = 'idle'; cur.flash = null; cur.spawnT = 0; cur.domKeys = null;
}
function factoryOK(){ return cur.over && cur.score >= curStage().target; }

/* ---- 1フレームぶん すすめる ---- */
function fcStep(dt){
  var st = curStage(), i, it;
  cur.left = Math.max(0, cur.left - dt);
  /* ゴミを 出す */
  cur.spawnT -= dt;
  if (cur.spawnT <= 0){
    cur.spawnT = st.every;
    var pool = st.pool;
    var pick = pool[(Math.random() * pool.length) | 0];
    cur.items.push({ key:'i' + (cur.seq++), kind:pick, x:-40 });
  }
  /* ベルトで 右へ */
  for (i = cur.items.length - 1; i >= 0; i--){
    it = cur.items[i];
    if (cur.hold === it.key) continue;
    it.x += st.belt * dt;
    if (it.x > FC.endX + 30){
      if (fcJunk(it.kind).mat === 'tetsu'){ cur.miss++; cur.combo = 0; fcFlash('にがした！', '#E05A4A'); }
      cur.items.splice(i, 1);
      if (cur.chase === it.key){ cur.chase = null; cur.phase = 'idle'; }
    }
  }
  /* クレーン */
  var tgt = null;
  if (cur.phase === 'chase'){
    tgt = null;
    for (i = 0; i < cur.items.length; i++) if (cur.items[i].key === cur.chase) tgt = cur.items[i];
    if (!tgt){ cur.phase = 'idle'; cur.chase = null; }
    else {
      var dx = tgt.x - cur.cx, mv = FC.speed * dt;
      cur.cx += Math.max(-mv, Math.min(mv, dx));
      cur.arm = Math.min(FC.armDown, cur.arm + 520 * dt);
      if (Math.abs(tgt.x - cur.cx) < 10 && cur.arm >= FC.armDown - 1) fcGrab(tgt);
    }
  } else if (cur.phase === 'carry'){
    var dx2 = FC.boxX - cur.cx, mv2 = FC.speed * dt;
    cur.cx += Math.max(-mv2, Math.min(mv2, dx2));
    cur.arm = Math.max(FC.armIdle, cur.arm - 520 * dt);
    if (Math.abs(FC.boxX - cur.cx) < 6) fcDrop();
  } else {
    cur.arm = Math.max(FC.armIdle, cur.arm - 520 * dt);
  }
  if (cur.flash){ cur.flash.t -= dt; if (cur.flash.t <= 0) cur.flash = null; }
  if (cur.left <= 0) fcFinish();
}
function fcFlash(text, col){ cur.flash = { text:text, col:col, t:1.0 }; }
function fcGrab(it){
  var j = fcJunk(it.kind), p = fcPow();
  cur.power = Math.max(0, cur.power - p.cost);
  cur.on = true;
  if (j.mat !== 'tetsu'){
    fcFlash('アルミは つかない！', '#8FA3B8'); cur.combo = 0;
    cur.on = false; cur.phase = 'idle'; cur.chase = null; return;
  }
  if (j.w > p.max){
    fcFlash(j.w + 'kg には 弱すぎ！', '#E08A00'); cur.combo = 0;
    cur.on = false; cur.phase = 'idle'; cur.chase = null; return;
  }
  cur.hold = it.key; cur.phase = 'carry'; cur.chase = null;
}
function fcDrop(){
  var it = null, i;
  for (i = 0; i < cur.items.length; i++) if (cur.items[i].key === cur.hold) it = cur.items[i];
  if (it){
    var j = fcJunk(it.kind);
    cur.combo++;
    if (cur.combo > cur.bestCombo) cur.bestCombo = cur.combo;
    var got = j.w * (cur.combo >= 3 ? 2 : 1);
    cur.score += got;
    fcFlash('＋' + got + 'kg' + (cur.combo >= 3 ? '　' + cur.combo + 'れんぞく！ ２ばい' : ''), '#2E9A4C');
    cur.items.splice(cur.items.indexOf(it), 1);
  }
  cur.hold = null; cur.on = false; cur.phase = 'idle';
}
function fcFinish(){
  cur.playing = false; cur.over = true;
  if (cur.fcRaf){ cancelAnimationFrame(cur.fcRaf); cur.fcRaf = null; }
  var st = curStage();

function fcLoop(){
  var last = null;
  function step(now){
    if (cur.kind !== 'factory' || !cur.playing){ cur.fcRaf = null; return; }
    if (last === null) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    fcStep(dt);
    fcRender(false);
    if (cur.playing) cur.fcRaf = requestAnimationFrame(step);
  }
  cur.fcRaf = requestAnimationFrame(step);
}

function fcCraneSVG(){

function fcSync(){
  var dyn = document.getElementById('fc-dyn');
  if (!dyn) return false;
  var keys = cur.items.map(function(it){ return it.key; }).join(',');
  if (keys !== cur.domKeys){ dyn.innerHTML = fcItemsSVG() + fcCraneSVG(); cur.domKeys = keys; }
  cur.items.forEach(function(it){
    var g = document.getElementById('fc-' + it.key);
    if (!g) return;
    var y = (cur.hold === it.key) ? (FC.rail + cur.arm + 40) : (FC.beltY - 22);
    var x = (cur.hold === it.key) ? cur.cx : it.x;

  });
  var cg = document.getElementById('fc-crane');
  if (cg){
    cg.setAttribute('transform', 'translate(' + cur.cx.toFixed(1) + ',0)');
    var cb = document.getElementById('fc-cable'), am = document.getElementById('fc-arm'), mg = document.getElementById('fc-mag');
    if (cb) cb.setAttribute('y2', (FC.rail + cur.arm).toFixed(1));
    if (am) am.setAttribute('transform', 'translate(0,' + (FC.rail + cur.arm).toFixed(1) + ')');
    if (mg) mg.setAttribute('fill', cur.on ? '#E05A4A' : '#8FA3B8');
  }
  var fl = document.getElementById('fc-flash');
  if (fl){
    fl.textContent = cur.flash ? cur.flash.text : '';
    if (cur.flash){ fl.setAttribute('fill', cur.flash.col); fl.setAttribute('opacity', Math.min(1, cur.flash.t * 1.6).toFixed(2)); }
  }
  var sc = document.getElementById('fc-score'), tm = document.getElementById('fc-time'), pw = document.getElementById('fc-pw');

  if (tm){
    tm.textContent = Math.ceil(cur.left) + '';

  if (pw) pw.setAttribute('width', (166 * cur.power / FC.power).toFixed(1));

function tapFactory(e){

  }
  var pw = attrUp(e.target, 'data-pw');
  if (pw !== null){
    pw = parseInt(pw, 10);
    if (cur.power >= FC_POWER[pw].cost) cur.pw = pw;
    else fcFlash('でんきが 足りない…', '#8FA3B8');
    renderFactory(); return;
  }
  if (!cur.playing) return;
  var pk = attrUp(e.target, 'data-pick');

    if (cur.power < fcPow().cost){ fcFlash('でんきが 足りない！ よわい ほうへ', '#8FA3B8'); return; }

  }

function fcEventPoint(e){

}
function fcNodeAt(p){

}
function downFactory(e){

  var key=attrUp(e.target,'data-fcnode'),it=key!==null?fcItemByKey(key):fcNodeAt(fcEventPoint(e));

}
function moveFactory(e){
  if(!cur.playing||cur.dropT>0||cur.special||cur.rescue||cur.sortQuiz||!cur.dragging||!cur.chain.length)return;
  if(e.cancelable)e.preventDefault();var p=fcEventPoint(e),it=p?fcNodeAt(p):null;if(!it)return;
  var last=fcItemByKey(cur.chain[cur.chain.length-1]);
  if(cur.chain.length>1&&it.key===cur.chain[cur.chain.length-2]){cur.chain.pop();renderFactory();return;}
  if(it.kind===cur.chainType&&!fcChainHas(it.key)&&fcAdjacent(last,it)){cur.chain.push(it.key);renderFactory();}
}
function upFactory(){

   クイズも 結果の ボタンも ぜんぶ 効かなく なって 見つかった。
   HANDOFF の きまり「その 型の コードは ぜんぶ engines/○○.js に 置く」。 */
/* リサイクル工場のクイズ／結果は SVG の透明な当たり判定を使わず、
   Safariでも安定して押せる通常のHTMLボタンで受ける。 */
var fcLastControlTouch=0;
function fcControlAction(e){
  if(cur.kind!=='factory')return false;
  var ans=attrUp(e.target,'data-fc-answer-html');
  if(ans!==null){if(fcAnswerQuiz(parseInt(ans,10)))renderFactory();return true;}
  if(attrUp(e.target,'data-fc-back-html')!==null){openIsland(gameById(cur.gameId).island);return true;}
  if(attrUp(e.target,'data-fc-again-html')!==null){cur.done=false;loadFactory(curStage());cur.playing=true;renderFactory();fcLoop();return true;}
  return false;
}
document.getElementById('fc-controls').addEventListener('touchend',function(e){
  if(fcControlAction(e)){fcLastControlTouch=Date.now();if(e.cancelable)e.preventDefault();}
},{passive:false});
document.getElementById('fc-controls').addEventListener('click', function(e){
  if(Date.now()-fcLastControlTouch<700)return;fcControlAction(e);
});



/* ================================================================== *
 * はつでん型 — 手回し発電 れんだ ゲーム（6年 電気の利用）
 *
 *   ★これは ゲーム。10びょうの あいだ ボタンを **れんだ** して 発電し、
 *     ためた 電気で つないだ ものを できるだけ 長く はたらかせる。
 *
 *   あそんで いる うちに 手が おぼえる こと（文では 教えない）:
 *     ・**はやく 回すほど 1回の 発電量が 大きい**（ほんとうに そう。回すのが 速い＝電圧が 高い）
 *     ・**豆電球は 電気を 食う**。同じ 電気で LEDは 5ばい 長く 光る
 *       → けっか画面で かならず「LEDなら ◯びょう」と ならべて 見せる
 *     ・レベルが 上がるほど 電気を 食う ものに なる ＝ 自然と れんだが 速く なる
 * ================================================================== */
var HD = { H:472, crank:10, cap:150, base:0.8 };

/* ---- つなぐ もの。use ＝ 1びょうに つかう 電気 ----
   ここは この 型（はつでん）しか つかわない ので この ファイルに 置く。
   よその エンジンの ファイルに 置くと、その 型が 入って いない アプリで
   「cdLoad is not defined」に なって この ゲームだけ あそべなく なる
   （じっさい 2026-09-10 の 1ゲームずつ 分割で 出た。CLAUDE.md §8 / HANDOFF の きまり）。 */
var CD_LOADS = [
  { id:'mame',  name:'豆電球',  use:2.0,  col:'#F5B324' },
  { id:'led',   name:'LED',     use:0.4,  col:'#4FC46A' },
  { id:'motor', name:'モーター', use:1.5,  col:'#3EA7D8' },
  { id:'buzz',  name:'ブザー',  use:0.8,  col:'#E8618C' }
];
function cdLoad(id){ for (var i=0;i<CD_LOADS.length;i++){ if (CD_LOADS[i].id === id) return CD_LOADS[i]; } return null; }
function hdLoad(){ return cdLoad(curStage().load); }
function loadHatsuden(st){
  if (cur.hdRaf){ cancelAnimationFrame(cur.hdRaf); cur.hdRaf = null; }
  cur.phase = 'ready';
  cur.turns = 0; cur.charge = 0; cur.ang = 0; cur.tgtAng = 0;
  cur.taps = []; cur.rate = 0; cur.left = HD.crank;
  cur.runSec = 0; cur.runTotal = 0; cur.best = 0;
}
function hatsudenOK(){ return cur.phase === 'done' && cur.runTotal >= curStage().need; }
/* いまの 回す はやさ（1びょうに 何回）から ボーナスを 出す。
   はやく 回す ＝ 電圧が 高い ＝ 1回で たくさん 発電できる ―― ほんものの しくみ。 */
function hdBonus(){ return 1 + Math.max(0, Math.min(1, (cur.rate - 2) / 5)); }

function hdLoadArt(id, on){
  var s = '';
  if (id === 'led'){
    s += '<path d="M-13 10 v-12 a13,13 0 0 1 26,0 v12 Z" fill="' + (on ? '#7BE59B' : '#DDE7EC') + '" stroke="#5A7C93" stroke-width="2.5"/>';
    s += '<line x1="-6" y1="10" x2="-6" y2="26" stroke="#8FA3B8" stroke-width="3"/><line x1="6" y1="10" x2="6" y2="30" stroke="#8FA3B8" stroke-width="3"/>';
  } else if (id === 'motor'){
    s += '<rect x="-16" y="-14" width="32" height="28" rx="5" fill="#B7C8D6" stroke="#5A7C93" stroke-width="2.5"/>';
    s += '<line x1="16" y1="0" x2="26" y2="0" stroke="#5A7C93" stroke-width="3"/>';
    s += '<g transform="translate(30,0)' + (on ? ' rotate(35)' : '') + '"><ellipse cx="0" cy="0" rx="4" ry="14" fill="' +
         (on ? '#3EA7D8' : '#DDE7EC') + '" stroke="#5A7C93" stroke-width="2"/></g>';
  } else if (id === 'buzz'){
    s += '<rect x="-16" y="-12" width="20" height="24" rx="3" fill="#B7C8D6" stroke="#5A7C93" stroke-width="2.5"/>';
    s += '<path d="M4 -12 L18 -22 v44 L4 12 Z" fill="#DDE7EC" stroke="#5A7C93" stroke-width="2.5"/>';
    if (on) for (var i = 0; i < 3; i++)
      s += '<path d="M' + (22 + i * 7) + ' -10 q6 10 0 20" fill="none" stroke="#E8618C" stroke-width="2.5" stroke-linecap="round"/>';
  } else {
    if (on) s += '<circle cx="0" cy="-4" r="26" fill="#F5B324" opacity=".35"/>';
    s += '<circle cx="0" cy="-4" r="16" fill="' + (on ? '#FFE066' : '#EFF3F6') + '" stroke="#5A7C93" stroke-width="2.5"/>';
    s += '<path d="M-6 6 h12 v8 h-12 Z" fill="#B7C8D6" stroke="#5A7C93" stroke-width="2"/>';
    s += '<path d="M-5 -8 l5 8 l5 -8" fill="none" stroke="#C9820A" stroke-width="2"/>';
    if (on) for (var k = 0; k < 6; k++){
      var a = k * Math.PI / 3;
      s += '<line x1="' + (Math.cos(a) * 24).toFixed(1) + '" y1="' + (-4 + Math.sin(a) * 24).toFixed(1) +
           '" x2="' + (Math.cos(a) * 32).toFixed(1) + '" y2="' + (-4 + Math.sin(a) * 32).toFixed(1) +
           '" stroke="#F5B324" stroke-width="3" stroke-linecap="round"/>';
    }
  }
  return s;
}
/* ---- 毎フレーム さわる ところだけ 書きかえる（作りなおすと れんだが 通らない） ---- */
function hdSync(){
  var h = document.getElementById('hd-handle');
  if (!h) return false;
  h.setAttribute('transform', 'rotate(' + cur.ang.toFixed(1) + ')');
  var g = document.getElementById('hd-gauge');
  if (g){
    var fh = 168 * Math.min(1, cur.charge / HD.cap);
    g.setAttribute('y', (272 - fh).toFixed(1)); g.setAttribute('height', fh.toFixed(1));
  }
  var t = document.getElementById('hd-turns'); if (t) t.textContent = cur.turns + ' 回';
  var c = document.getElementById('hd-chg');   if (c) c.textContent = Math.round(cur.charge) + '';
  var tm = document.getElementById('hd-timer');
  if (tm) tm.textContent = (cur.phase === 'crank') ? Math.ceil(cur.left) + '' : '';
  var sp = document.getElementById('hd-speed');
  if (sp) sp.setAttribute('width', (150 * Math.min(1, cur.rate / 8)).toFixed(1));
  var sl = document.getElementById('hd-splabel');
  if (sl) sl.textContent = (hdBonus() >= 1.7 ? 'ちょうかいてん！' : (hdBonus() >= 1.3 ? 'いい ちょうし！' : 'もっと はやく！'));
  var rs = document.getElementById('hd-run');
  if (rs) rs.textContent = cur.runSec.toFixed(1) + ' びょう';
  var lp = document.getElementById('hd-lamp');
  if (lp) lp.innerHTML = hdLoadArt(curStage().load, cur.phase === 'use');
  return true;
}
function hdStep(dt){
  var st = curStage();
  /* ハンドルは 目ひょうの 角度へ ぐいぐい 回る（れんだ するほど 速く 見える） */
  cur.ang += (cur.tgtAng - cur.ang) * Math.min(1, dt * 11);
  /* さいきん 1びょうの タップ数 */
  var now = cur.clock;
  cur.taps = cur.taps.filter(function(x){ return now - x < 1; });
  cur.rate = cur.taps.length;
  if (cur.phase === 'crank'){
    cur.left -= dt;
    if (cur.left <= 0){
      cur.left = 0;
      if (cur.charge <= 0){ cur.phase = 'ready'; renderHatsuden(); return; }
      cur.phase = 'use'; cur.runSec = 0;
      cur.runTotal = cur.charge / hdLoad().use;
      renderHatsuden(); return;
    }
  } else if (cur.phase === 'use'){
    cur.runSec = Math.min(cur.runTotal, cur.runSec + dt * 4);      /* 4ばい はやおくり */
    cur.charge = Math.max(0, hdLoad().use * (cur.runTotal - cur.runSec));
    if (cur.runSec >= cur.runTotal){
      cur.phase = 'done';
      cur.noStar = !(cur.runTotal >= st.star);
      renderHatsuden(); return;
    }
  }
}
function hdLoop(){
  if (cur.hdRaf) return;
  var last = null;
  function step(now){
    if (cur.kind !== 'hatsuden' || (cur.phase !== 'crank' && cur.phase !== 'use')){ cur.hdRaf = null; return; }
    if (last === null) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now; cur.clock += dt;
    hdStep(dt);
    if (cur.phase === 'crank' || cur.phase === 'use'){ hdSync(); cur.hdRaf = requestAnimationFrame(step); }
    else cur.hdRaf = null;
  }
  cur.hdRaf = requestAnimationFrame(step);
}
function renderHatsuden(){
  var st = curStage(), L = hdLoad(), i;
  setBoardBox(600, HD.H);
  var s = '', crank = (cur.phase === 'crank'), use = (cur.phase === 'use');
  /* ---- ミッション帯 ---- */
  s += '<rect x="20" y="8" width="560" height="34" rx="12" fill="#FFF8E4" stroke="#F5B324" stroke-width="2"/>';
  s += '<text x="36" y="31" font-size="13" font-weight="900" fill="#8A5B00">🎯 ' + st.goal + '</text>';
  s += '<text x="564" y="31" font-size="13" font-weight="900" fill="#8A5B00" text-anchor="end">★は ' + st.star + 'びょう いじょう</text>';

  /* ---- 手回し発電機 ---- */
  s += '<g transform="translate(140,196)">';
  s += '<rect x="-58" y="-44" width="116" height="88" rx="12" fill="#E8EEF3" stroke="#8FA3B8" stroke-width="3"/>';
  s += '<circle cx="0" cy="0" r="30" fill="#B7C8D6" stroke="#5A7C93" stroke-width="3"/>';
  s += '<g id="hd-handle" transform="rotate(' + cur.ang.toFixed(1) + ')">';
  s += '<line x1="0" y1="0" x2="0" y2="-44" stroke="#5A7C93" stroke-width="7" stroke-linecap="round"/>';
  s += '<circle cx="0" cy="-48" r="11" fill="#E05A4A" stroke="#B03A45" stroke-width="3"/></g>';
  s += '<text x="0" y="64" font-size="12" font-weight="900" fill="#5A7C93" text-anchor="middle">手回し発電機</text>';
  s += '<text id="hd-turns" x="0" y="84" font-size="17" font-weight="900" fill="#0F3350" text-anchor="middle">' + cur.turns + ' 回</text>';
  s += '</g>';
  /* はやさメーター */
  s += '<rect x="66" y="300" width="150" height="14" rx="7" fill="#DCE5EB"/>';
  s += '<rect id="hd-speed" x="66" y="300" width="' + (150 * Math.min(1, cur.rate / 8)).toFixed(1) +
       '" height="14" rx="7" fill="#F5B324"/>';
  s += '<text x="60" y="312" font-size="11" font-weight="900" fill="#8FA3B8" text-anchor="end">はやさ</text>';
  s += '<text id="hd-splabel" x="141" y="332" font-size="12" font-weight="900" fill="#C9820A" text-anchor="middle">' +
       (crank ? 'もっと はやく！' : '') + '</text>';

  /* ---- コンデンサー ---- */
  s += '<rect x="266" y="104" width="68" height="168" rx="10" fill="#F1F6F9" stroke="#8FA3B8" stroke-width="3"/>';
  var fh = 168 * Math.min(1, cur.charge / HD.cap);
  s += '<rect id="hd-gauge" x="270" y="' + (272 - fh).toFixed(1) + '" width="60" height="' + fh.toFixed(1) +
       '" rx="6" fill="#F5B324" opacity=".9"/>';
  s += '<text x="300" y="292" font-size="12" font-weight="900" fill="#5A7C93" text-anchor="middle">ためた 電気</text>';
  s += '<text id="hd-chg" x="300" y="94" font-size="18" font-weight="900" fill="#0F3350" text-anchor="middle">' +
       Math.round(cur.charge) + '</text>';

  /* ---- つないで いる もの ---- */
  s += '<g id="hd-lamp" transform="translate(470,180)">' + hdLoadArt(st.load, use) + '</g>';
  s += '<text x="470" y="238" font-size="15" font-weight="900" fill="#0F3350" text-anchor="middle">' + L.name + '</text>';
  s += '<text x="470" y="258" font-size="12" font-weight="900" fill="#8FA3B8" text-anchor="middle">1びょうに ' + L.use + ' つかう</text>';
  s += '<rect x="396" y="276" width="148" height="44" rx="14" fill="#EAF3F8"/>';
  s += '<text x="470" y="294" font-size="11" font-weight="900" fill="#5A7C93" text-anchor="middle">はたらいた 時間</text>';
  s += '<text id="hd-run" x="470" y="313" font-size="17" font-weight="900" fill="#0F3350" text-anchor="middle">' +
       cur.runSec.toFixed(1) + ' びょう</text>';

  /* ---- ボタン ---- */
  if (cur.phase === 'ready'){
    s += '<g transform="translate(300,398)"><rect x="-150" y="-40" width="300" height="80" rx="40" fill="#2E9A4C"/>' +
         '<text x="0" y="-4" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">▶ スタート</text>' +
         '<text x="0" y="20" font-size="13" font-weight="900" fill="#D6F0DC" text-anchor="middle">' + HD.crank + 'びょう れんだ！</text>' +
         '<rect x="-150" y="-40" width="300" height="80" fill="transparent" data-hdgo="1"/></g>';
  } else if (crank){
    s += '<circle cx="300" cy="398" r="46" fill="#FFF8E4" stroke="#F5B324" stroke-width="4"/>';
    s += '<text id="hd-timer" x="300" y="408" font-size="30" font-weight="900" fill="#8A5B00" text-anchor="middle">' +
         Math.ceil(cur.left) + '</text>';
    s += '<g transform="translate(300,398)"><rect x="-260" y="-40" width="196" height="80" rx="40" fill="#E05A4A"/>' +
         '<text x="-162" y="10" font-size="24" font-weight="900" fill="#fff" text-anchor="middle">⚡ まわす！</text>' +
         '<rect x="-260" y="-40" width="196" height="80" fill="transparent" data-hdturn="1"/></g>';
    s += '<g transform="translate(300,398)"><rect x="64" y="-40" width="196" height="80" rx="40" fill="#E05A4A"/>' +
         '<text x="162" y="10" font-size="24" font-weight="900" fill="#fff" text-anchor="middle">⚡ まわす！</text>' +
         '<rect x="64" y="-40" width="196" height="80" fill="transparent" data-hdturn="1"/></g>';
  } else if (use){
    s += '<text x="300" y="406" font-size="17" font-weight="900" fill="#5A7C93" text-anchor="middle">はたらいて いるよ…</text>';
  }

  /* ---- けっか ---- */
  if (cur.phase === 'done'){
    var win = (cur.runTotal >= st.need);
    var ledSec = cur.turns > 0 ? (hdLoad().use * cur.runTotal) / cdLoad('led').use : 0;
    s += '<rect x="0" y="0" width="600" height="' + HD.H + '" fill="#0F3350" opacity=".42"/>';
    s += '<g transform="translate(300,222)"><rect x="-196" y="-110" width="392" height="220" rx="24" fill="#fff"/>';
    s += '<text x="0" y="-70" font-size="22" font-weight="900" fill="' + (win ? '#2E9A4C' : '#E08A00') +
         '" text-anchor="middle">' + (win ? 'ミッション たっせい！' : 'もう ちょっと！') + '</text>';
    s += '<text x="0" y="-36" font-size="18" font-weight="900" fill="#0F3350" text-anchor="middle">' +
         L.name + 'が ' + cur.runTotal.toFixed(1) + 'びょう はたらいた</text>';
    s += '<text x="0" y="-12" font-size="13" font-weight="900" fill="#5A7C93" text-anchor="middle">もくひょう ' +
         st.need + 'びょう　／　★ ' + st.star + 'びょう　／　回した 回数 ' + cur.turns + '回</text>';
    if (st.load !== 'led')
      s += '<text x="0" y="22" font-size="14" font-weight="900" fill="#C9820A" text-anchor="middle">💡 同じ 電気でも LEDなら ' +
           ledSec.toFixed(0) + 'びょう 光る！</text>';
    else
      s += '<text x="0" y="22" font-size="14" font-weight="900" fill="#C9820A" text-anchor="middle">💡 同じ 電気で 豆電球なら ' +
           (ledSec * cdLoad('led').use / cdLoad('mame').use).toFixed(0) + 'びょうしか もたない</text>';
    s += '<rect x="-90" y="46" width="180" height="42" rx="21" fill="#1B7FA8"/>' +
         '<text x="0" y="74" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">↺ もう いちど</text>' +
         '<rect x="-90" y="46" width="180" height="42" fill="transparent" data-hdgo="1"/></g>';
  }
  document.getElementById('board').innerHTML = s;
  if (crank) setStatus('れんだ！ はやく 回すほど たくさん 発電できる', false);
  else if (use) setStatus('', false);
  else if (cur.phase === 'done') setStatus('', false);
  else setStatus('スタートを おして ' + HD.crank + 'びょう れんだ しよう', false);
  tryClear(hatsudenOK());
}
function tapHatsuden(e){
  if (attrUp(e.target, 'data-hdgo') !== null){
    loadHatsuden(curStage());
    cur.phase = 'crank'; cur.clock = 0; cur.left = HD.crank;
    renderHatsuden(); hdLoop(); return;
  }
  if (attrUp(e.target, 'data-hdturn') !== null && cur.phase === 'crank'){
    cur.turns++;
    cur.taps.push(cur.clock);
    cur.charge = Math.min(HD.cap, cur.charge + HD.base * hdBonus());
    cur.tgtAng += 360;                                  /* タップ1回＝ハンドル1回転 */
    hdSync();                                           /* ばんは 作りなおさない（れんだが 通らなく なる） */
    return;
  }
}
ENGINES.hatsuden = { load:loadHatsuden, render:renderHatsuden, tap:tapHatsuden };

/* ================================================================== *
 * でんじしゃくバトル型 — わくの 中に 交ごに 置いて いく（クラスター系）
 *
 *   ★1ターンの ながれ（ユーザー合意 2026-08-25）
 *     ①サイコロ … **N極か S極かは 運**。えらべない（えらべると N ばかりに なって
 *                  「しりぞけ合う だけ」の たんちょうな ゲームに なる ―― 一度 やらかした）
 *     ②コイルを 巻く … ボタンを **おしっぱなし**に すると ぐるぐる 巻かれ、
 *                  まきかずが ふえるほど 磁力が 強く なる。**巻いて いる あいだ
 *                  ばんの「あぶない 輪」が リアルタイムで 大きく なる**ので、
 *                  盤面を 見ながら どこで 止めるかを きめる
 *     ③置く … わくの 中を タップ
 *
 *   ・同じ極は しりぞけ合い、ちがう極は 引き合う。くっついたら その こまは
 *     **だれの ものでも ぜんぶ 置いた 人の 手もとに もどる**
 *   ・**わく（茶いろの ふち）から おし出された こまも 落ちて 手もとに もどる**
 *     （2026-08-25 ユーザー指てき。ふちぎわは あぶない ＝ どこに 置くかが もっと きんちょうする）
 *   ・もどる ところは ぜんぶ **アニメーションで 見せる**。きゅうに 消えると
 *     何が おきたのか 分からない。くっつく／落ちる → 手もとへ とんで いく → **手もとの 数が ふえる**
 *   ・手もとの 数 ＝ のこりの 線 ÷ 100かい（＝ でんじしゃく 1こ ぶん）。
 *     「あと 何こ 置けるか」が トレイの チップで ひと目で 分かる
 *   ・エナメル線を 先に つかい切った 人の 勝ち
 *
 *   あそんで いる うちに 手が おぼえる こと（文では 教えない）:
 *     ・**まきかずが 多いほど 磁力が 強い**（巻きながら 輪が ふくらむので 体で わかる）
 *     ・**同じ極は しりぞけ、ちがう極は 引き合う**（サイコロの 目で 輪の 大きさが 変わる）
 *     ・**近いほど 力が 強い**（きょりの 2じょうに 反比例）
 * ================================================================== */
var MG = {
  cx:300, cy:210, R:160, H:562,
  K:2800, damp:0.80, steps:110,
  pull:1.45,                                    /* ちがう極が くっつく きょり（こま2つの 半けい×） */
  push:15,                                      /* 同じ極を これより 近づけると はじき飛ばされる めやす（じりょくで のびる） */
  care:0.55,                                    /* CPU の 用心ぶかさ。1.0 だと とどく きょりを ぴったり 読みきる ＝
                                                   人には ぜったい できない 打ち方に なる（あぶない はんいは 見えない）。
                                                   0.72 ＝「強い こまは 遠くから 引き寄せる」と 分かって いる 人 くらい */
  minMaki:100, maxMaki:400, windSpeed:230,      /* 1びょうに 230かい 巻ける（100→400で やく1.3びょう） */

/* ★レベルの かわりに **自分で えらぶ** 3つ（2026-08-26 ユーザー指てき）。

var MGOPT = {

function mgR(){ return MGOPT.ring[mgSet.ring].R; }
function mgStage(){ return MGOPT.stage[mgSet.stage] || MGOPT.stage[0]; }
function mgNum(){ return MGOPT.num[mgSet.num]; }

/* まきかず → 大きさ と 磁力。多いほど 大きく 強い（ひとつづきの 数） */

  return Math.max(5, MG.rMin + (maki - MG.minMaki) / (MG.maxMaki - MG.minMaki) * (MG.rMax - MG.rMin));

function mgForce(maki){ return maki / 100; }
/* ★くっつく きょり。**同じ極は どんなに 近づけても ぜったいに くっつかない**。

   ひっくりかえる ことは ない。ちがう極どうしだけ、この きょりまで 近づいたら くっつく。
   （2026-08-26 まで 同じ極も くっついて いた ―― ぼうじしゃく時代の「ひっくりかえる」ルールの

/* 「置いても だいじょうぶ」の めやす（CPU が つかう）。同じ極は くっつかないが、

function mgSafeD(a, b){

/* ★じりょくが とどく きょり。ここより 遠い こまは **力を 受けない ＝ 1ミリも 動かない**。

   「ばん ぜんたいが かってに 動く」ように 見えて、どこに 置いたら 何が おきるのかが 読めなく なる。

function mgReach(a, b){ return a.r + b.r + MG.reach * Math.sqrt(a.m * b.m); }
/* 置いた こまと、その まわり（とどく きょりの 中）だけが 動く。

/* 手もとの でんじしゃくの 数（100かい ＝ 1こ ぶん）。ここが「あと 何こ 置けるか」 */

function mgTrayCx(who){ return (who === 0) ? 156 : 444; }
function mgSlot(who, i){

}

function loadJishaku(st){

  cur.turn = 0; cur.maki = MG.minMaki; cur.pole = 1;

function jishakuOK(){ return cur.winner === 0; }
/* ステージの ふちまでの 距離。＋なら中、−なら外。
   置ける場所・落下・CPU・描画が ぜんぶ同じ形を使うので、見た目だけの飾りにしない。 */
function mgStageVertices(R){
  var out = [], shape = mgStage().shape, i, a;
  if (shape === 'square') return [
    [MG.cx - R, MG.cy - R], [MG.cx + R, MG.cy - R],
    [MG.cx + R, MG.cy + R], [MG.cx - R, MG.cy + R]

  for (i = 0; i < 6; i++){

    if (((ay > y) !== (by > y)) && x < (bx - ax) * (y - ay) / (by - ay) + ax) inside = !inside;

function mgStageRay(ang, extra){

  if (shape === 'square') return '<rect x="' + (MG.cx - R) + '" y="' + (MG.cy - R) + '" width="' + (R * 2) +

function mgKeepOnStage(p){
  var pad = p.r * MG.wall;
  if (mgStageEdge(p.x, p.y) >= -pad) return;
  var tx = p.x, ty = p.y, lo = 0, hi = 1, i;
  for (i = 0; i < 20; i++){
    var q = (lo + hi) / 2, x = MG.cx + (tx - MG.cx) * q, y = MG.cy + (ty - MG.cy) * q;
    if (mgStageEdge(x, y) >= -pad) lo = q; else hi = q;
  }
  p.x = MG.cx + (tx - MG.cx) * lo; p.y = MG.cy + (ty - MG.cy) * lo;
  p.vx *= 0.2; p.vy *= 0.2;
}
function mgRandomSpot(r){
  for (var i = 0; i < 40; i++){
    var x = MG.cx + (Math.random() * 2 - 1) * mgR();
    var y = MG.cy + (Math.random() * 2 - 1) * mgR();

}
function mgCanPut(x, y, r){
  if (mgStageEdge(x, y) < r + 2) return false;
  for (var i = 0; i < cur.pieces.length; i++){
    var p = cur.pieces[i];
    if (Math.hypot(x - p.x, y - p.y) < (r + p.r) * 1.02) return false;
  }
  return true;

/* ここに 置いたら どれだけ よゆうが あるか（m ＝ 置く こまの じりょく）。
   マイナスなら「あぶない ところ」 */
function mgClear(x, y, r, pole, m){
  var me = { r:r, pole:pole, m:(m === undefined) ? 1 : m }, worst = 9999;
  for (var i = 0; i < cur.pieces.length; i++){
    var p = cur.pieces[i];
    worst = Math.min(worst, Math.hypot(x - p.x, y - p.y) - mgSafeD(me, p));
  }
  return worst;
}
/* ふちまでの よゆう。マイナスなら もう 落ちて いる */
function mgEdge(x, y, r){ return mgStageEdge(x, y) - r * MG.fall; }
/* わくから おし出されて 落ちた こま（中心が ふちに かかったら たおれる） */
function mgFellIdx(){
  var out = [];

/* seed ＝ いま 置いた こま（省りゃくすると さいごに 足した こま）。
   **動くのは seed の まわりだけ**。力そのものは きょりの 2じょうに 反比例の まま
   （とどく はんいの 中では 何も いじって いない）で、はんいの 外は ゼロに する */
/* rec ＝ true なら **1ステップごとの ばしょを ぜんぶ おぼえる**（`p.path`）。
   これを そのまま 再生すると「強い ほど 勢いよく 飛ぶ」が 目に 見える。
   前は 出発点と 到着点を まっすぐ つないで いた ので、どんな 力でも 同じ 速さに 見えて いた。
   CPU の 先読み（何百回も 走る）では rec を 立てない */
function mgSim(seed, rec){
  var P = cur.pieces, i, j, s, last = 0;
  if (seed === undefined) seed = P.length - 1;
  var on = mgActive(seed);
  for (i = 0; i < P.length; i++){ P[i].vx = 0; P[i].vy = 0; if (rec) P[i].path = [[P[i].x, P[i].y]]; }
  for (s = 0; s < MG.steps; s++){
    if (s % 4 === 3 && mgClusters().length){ if (rec) mgTrim(last); return; }   /* くっついたら そこで 止める（止めないと はじけ飛ぶ） */
    for (i = 0; i < P.length; i++){
      if (!on[i]) continue;                           /* 遠い こまは 動かさない */
      var fx = 0, fy = 0;
      for (j = 0; j < P.length; j++){
        if (i === j) continue;
        var dx = P[i].x - P[j].x, dy = P[i].y - P[j].y;
        var d = Math.sqrt(dx*dx + dy*dy);
        if (d > mgReach(P[i], P[j])) continue;        /* とどかない ＝ 力ゼロ */
        var minD = (P[i].r + P[j].r) * 0.9;
        if (d < minD) d = minD;
        var sign = (P[i].pole === P[j].pole) ? 1 : -1;
        var f = sign * MG.K * P[i].m * P[j].m / (d * d);
        fx += dx / d * f; fy += dy / d * f;
      }
      P[i].vx = (P[i].vx + fx / P[i].m) * MG.damp;
      P[i].vy = (P[i].vy + fy / P[i].m) * MG.damp;
    }
    for (i = 0; i < P.length; i++){
      if (!on[i]) continue;
      P[i].x += P[i].vx * 0.05; P[i].y += P[i].vy * 0.05;
      /* ★かべは ない。ふちを こえた こまは 落ちる（あとで mgFellIdx が 見つける）。

      mgKeepOnStage(P[i]);

    if (rec){
      var moved = 0;
      for (i = 0; i < P.length; i++){
        if (!on[i]) continue;
        var pv = P[i].path[P[i].path.length - 1];
        moved = Math.max(moved, Math.hypot(P[i].x - pv[0], P[i].y - pv[1]));
        P[i].path.push([P[i].x, P[i].y]);
      }
      if (moved > 0.12) last = s + 1;                 /* まだ 動いて いた さいごの コマ */
    }
  }
  if (rec) mgTrim(last);
}
/* 止まった あとの コマを 切りすてる（じっと して いる 時間を 再生しても しかたない） */
function mgTrim(last){
  var P = cur.pieces, i;
  for (i = 0; i < P.length; i++)
    if (P[i].path && P[i].path.length > last + 1) P[i].path.length = Math.max(1, last + 1);
}
/* いま 何コマめかの ばしょ（0→1 で 再生する） */
function mgAt(p){
  if (!p.path || p.path.length < 2) return [p.x, p.y];
  var t = (cur.pathT === undefined) ? 1 : cur.pathT;
  var f = t * (p.path.length - 1), i = Math.floor(f), u = f - i;
  if (i >= p.path.length - 1) return p.path[p.path.length - 1];
  return [p.path[i][0] + (p.path[i + 1][0] - p.path[i][0]) * u,
          p.path[i][1] + (p.path[i + 1][1] - p.path[i][1]) * u];

function mgClusters(){
  var P = cur.pieces, n = P.length, seen = [], out = [], i, j;
  var adj = [];
  for (i = 0; i < n; i++) adj.push([]);
  for (i = 0; i < n; i++) for (j = i + 1; j < n; j++){
    if (Math.hypot(P[i].x - P[j].x, P[i].y - P[j].y) < mgStickD(P[i], P[j])){ adj[i].push(j); adj[j].push(i); }
  }
  for (i = 0; i < n; i++){

    }

/* ---- サイコロ：N か S かは 運。ここが えらべると ゲームが つまらなく なる ---- */
function mgRollDice(){

  cur.maki = Math.min(MG.minMaki, cur.hands[cur.turn]); cur.winding = false;
  var face = (Math.random() < 0.5) ? 1 : -1;
  var t0 = null;
  if (cur.mgRaf) cancelAnimationFrame(cur.mgRaf);
  function step(now){
    if (cur.kind !== 'jishaku' || cur.mgPhase !== 'dice'){ cur.mgRaf = null; return; }
    if (t0 === null) t0 = now;
    var k = Math.min(1, (now - t0) / 800);
    cur.dice = k;
    cur.pole = (k < 1) ? (((now / 90) | 0) % 2 ? 1 : -1) : face;
    renderJishaku();
    if (k < 1) cur.mgRaf = requestAnimationFrame(step);
    else {
      cur.mgRaf = null; cur.pole = face; cur.mgPhase = 'play';
      cur.mgMsg = (face === 1 ? 'N きょく' : 'S きょく') + 'が 出た！ コイルを 巻こう';
      cur.mgBad = false;
      renderJishaku();
      if (cur.turn === 1 && !cur.duo) setTimeout(mgCpu, 550);

/* ---- コイルを 巻く（おしっぱなし）---- */
function mgWireMax(){ return Math.min(MG.maxMaki, cur.hands[cur.turn]); }
function mgLeftAt(maki){ return Math.floor(cur.hands[cur.turn] / Math.max(1, Math.round(maki))); }
function mgWindStart(){
  if (cur.mgPhase !== 'play' || cur.winding) return;
  if (cur.turn === 1 && !cur.duo) return;
  if (cur.maki >= mgWireMax()) return;
  cur.winding = true;
  var last = null;
  if (cur.windRaf) cancelAnimationFrame(cur.windRaf);
  function step(now){
    if (cur.kind !== 'jishaku' || !cur.winding){ cur.windRaf = null; return; }
    if (last === null) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    cur.maki = Math.min(mgWireMax(), cur.maki + MG.windSpeed * dt);
    if (cur.maki >= mgWireMax()) cur.winding = false;
    mgWindSync();
    cur.windRaf = requestAnimationFrame(step);

  cur.windRaf = requestAnimationFrame(step);
}

}
/* 巻いて いる あいだは **輪の 大きさと コイルの え だけ**を 書きかえる

/* ---- 置く → 動かす → くっつく／落ちる → 手もとへ もどす ---- */
function mgPlace(x, y){

  if (cur.hands[who] <= 0 || cur.mgPhase !== 'play') return;
  if (!mgCanPut(x, y, r)){ cur.mgMsg = 'そこには 置けないよ（わくの 外／こまに かさなる）'; cur.mgBad = true; renderJishaku(); return; }
  mgWindStop();

  cur.hands[who] -= used;                        /* 巻いた ぶんだけ 線が へる */
  cur.pieces.push({ x:x, y:y, r:r, m:mgForce(cur.maki), maki:used, pole:cur.pole, own:who, vx:0, vy:0 });
  cur.pieces.forEach(function(p){ p.path = [[p.x, p.y]]; });     /* まず ぜんぶ 止まって いる ことに する */
  var me = cur.pieces.length - 1;
  cur.field = mgMakeField(me);                                   /* ★じりょくが どこまで とどいて 何に はたらいたか */
  if (!mgClusters().length) mgSim(me, true);                     /* うごきを 1コマずつ おぼえる */
  var frames = 1;
  cur.pieces.forEach(function(p){ frames = Math.max(frames, p.path.length); });
  cur.pathT = 0; cur.fxT = 0;

  mgClusters().forEach(function(c){
    var sx = 0, sy = 0;
    c.forEach(function(k){ sx += cur.pieces[k].x; sy += cur.pieces[k].y; });
    c.forEach(function(k){ if (!fellSet[k]) stickSet[k] = { x: sx / c.length, y: sy / c.length }; });
  });

  for (i = 0; i < cur.pieces.length; i++){

  if (idx.length){

}
function mgTurnEnd(who, nStick, nFall, back){
  if (nStick + nFall > 0){
    cur.stuck[who] += nStick + nFall;
    cur.mgMsg = (nFall ? (nStick ? 'くっついて わくからも おちた！ ' : 'わくから おちた！ ') : 'くっついた！ ') +
                (nStick + nFall) + 'こ 手もとに もどって、線が ' + back + 'かい ふえた…';
    cur.mgBad = true;
  } else {
    cur.mgMsg = 'ナイス！ うまく 置けた';
    cur.mgBad = false;
  }
  if (cur.hands[who] <= 0){ cur.hands[who] = 0; cur.winner = who; cur.mgPhase = 'done'; }
  else cur.turn = 1 - cur.turn;
  if (cur.winner === 0) cur.noStar = (cur.stuck[0] > 0);

}
/* アニメの もと（k は 0→1）。jishaku から はなれたら 止まる */
function mgTween(ms, onFrame, onDone){
  if (cur.mgRaf) cancelAnimationFrame(cur.mgRaf);
  var t0 = null;
  function step(now){
    if (cur.kind !== 'jishaku'){ cur.mgRaf = null; return; }
    if (t0 === null) t0 = now;
    var k = Math.min(1, (now - t0) / ms);
    onFrame(k);
    renderJishaku();
    if (k < 1) cur.mgRaf = requestAnimationFrame(step);
    else { cur.mgRaf = null; if (onDone) onDone(); }
  }
  cur.mgRaf = requestAnimationFrame(step);
}
/* くっついた／落ちた こまを **ばんから 手もとへ 運ぶ**。
   ここが 見えないと「きゅうに 消えた」に なって しまう ので、
   1こずつ 少し ずらして 飛ばし、着いた しゅんかんに 線が ふえる */
function mgLeave(who, idx, fellSet, stickSet, after){
  var list = [], base = mgStock(who), sorted = idx.slice().sort(function(a, b){ return a - b; });
  sorted.forEach(function(k, n){
    var p = cur.pieces[k], slot = mgSlot(who, base + n);
    list.push({
      p:p, own:who, fell: (fellSet[k] === 1),
      sx:p.x, sy:p.y,
      hx: stickSet[k] ? stickSet[k].x : p.x,
      hy: stickSet[k] ? stickSet[k].y : p.y,
      tx:slot.x, ty:slot.y,
      spin: (p.x < MG.cx) ? -1 : 1,
      delay: n * 0.13, k:0, landed:false, landT:0

  });
  idx.slice().sort(function(a, b){ return b - a; }).forEach(function(k){ cur.pieces.splice(k, 1); });

  var span = 0.90 + (list.length - 1) * 0.13 + 0.30;         /* びょう */
  mgTween(span * 1000, function(k){
    cur.mgT = k * span;
    list.forEach(function(L){
      L.k = Math.max(0, Math.min(1, (cur.mgT - L.delay) / 0.90));
      if (L.k >= 1 && !L.landed){ L.landed = true; L.landT = cur.mgT; cur.hands[who] += L.p.maki; cur.gain[who] += L.p.maki; }
    });
  }, function(){
    list.forEach(function(L){ if (!L.landed){ L.landed = true; cur.hands[who] += L.p.maki; cur.gain[who] += L.p.maki; } });

function mgPop(who){
  var v = 0;
  (cur.leaving || []).forEach(function(L){
    if (L.landed && L.own === who) v = Math.max(v, 1 - (cur.mgT - L.landT) / 0.55);
  });

function mgCpu(){
  if (cur.kind !== 'jishaku' || cur.winner !== null || cur.turn !== 1 || cur.hands[1] <= 0) return;
  var lv = mgCpuLv(), best = null, bs = -1e9, cap = mgWireMax();
  var tries = Math.round(50 + 90 * lv);
  var cands = [];
  for (var q = 0; q <= 4; q++) cands.push(Math.round(MG.minMaki + (MG.maxMaki - MG.minMaki) * q / 4));
  cands.forEach(function(mk0){
    var mk = Math.min(mk0, cap);

    var r = mgSize(mk);
    for (var a = 0; a < tries; a++){

      if (!mgCanPut(x, y, r)) continue;
      var room = mgClear(x, y, r, cur.pole, mgForce(mk));
      if (room < 0) continue;
      /* 線を たくさん つかえる ほど よい。ただし よゆうが ない 置き方と ふちぎわは さける */
      var sc = mk / 80 + Math.min(room, 40) * lv * 0.12 + Math.min(mgEdge(x, y, r), 26) * lv * 0.10;

/* 矢じるし 1本（むきは dir、長さ len） */
function mgArrow(x, y, ang, len, col, op){
  var c = Math.cos(ang), sn = Math.sin(ang);
  var x2 = x + c * len, y2 = y + sn * len;
  var s = '<line x1="' + x.toFixed(1) + '" y1="' + y.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) +
          '" stroke="' + col + '" stroke-width="3.4" stroke-linecap="round" opacity="' + op.toFixed(2) + '"/>';
  var h = 6.5;
  s += '<path d="M' + x2.toFixed(1) + ' ' + y2.toFixed(1) +
       ' L' + (x2 - c * h + sn * h * 0.75).toFixed(1) + ' ' + (y2 - sn * h - c * h * 0.75).toFixed(1) +
       ' L' + (x2 - c * h - sn * h * 0.75).toFixed(1) + ' ' + (y2 - sn * h + c * h * 0.75).toFixed(1) +
       ' Z" fill="' + col + '" opacity="' + op.toFixed(2) + '"/>';
  return s;
}
/* はんいの え（こまの 下に かく ぶん） */
function mgFieldBackArt(){
  var f = cur.field;
  if (!f || !cur.pieces[f.i]) return '';
  var k = cur.fxT, p = cur.pieces[f.i], pos = mgAt(p);
  var grow = Math.min(1, k / 0.22), fade = (k > 0.72) ? Math.max(0, 1 - (k - 0.72) / 0.28) : 1;
  var e = 1 - Math.pow(1 - grow, 3);                     /* ぱっと ひろがって ゆっくり 止まる */
  var R = f.r * e;
  var col = (f.pole === 1) ? '#E0574A' : '#3E7AD8';
  var s = '<circle cx="' + pos[0].toFixed(1) + '" cy="' + pos[1].toFixed(1) + '" r="' + R.toFixed(1) +
          '" fill="url(#mg-field)" opacity="' + (0.85 * fade).toFixed(2) + '"/>';
  s += '<circle cx="' + pos[0].toFixed(1) + '" cy="' + pos[1].toFixed(1) + '" r="' + R.toFixed(1) +
       '" fill="none" stroke="' + col + '" stroke-width="2" stroke-dasharray="7 6" opacity="' + (0.55 * fade).toFixed(2) + '"/>';
  /* ひろがる しゅんかんの 波 */
  if (k < 0.34){
    var w = k / 0.34;
    s += '<circle cx="' + pos[0].toFixed(1) + '" cy="' + pos[1].toFixed(1) + '" r="' + (f.r * w * 1.12).toFixed(1) +
         '" fill="none" stroke="' + col + '" stroke-width="' + (5 * (1 - w)).toFixed(1) +
         '" opacity="' + (0.7 * (1 - w)).toFixed(2) + '"/>';
  }
  return s;
}
/* はたらいた 力の 矢じるし（こまの 上に かく ぶん） */
function mgFieldFrontArt(){
  var f = cur.field;
  if (!f || !cur.pieces[f.i]) return '';
  var k = cur.fxT, s = '';
  if (k < 0.10) return '';
  var fade = (k > 0.72) ? Math.max(0, 1 - (k - 0.72) / 0.28) : Math.min(1, (k - 0.10) / 0.10);
  var a = cur.pieces[f.i], pa = mgAt(a);
  var puls = 1 + 0.18 * Math.sin(k * 18);
  f.pairs.forEach(function(q){
    var b = cur.pieces[q.j];
    if (!b) return;
    var pb = mgAt(b), dx = pb[0] - pa[0], dy = pb[1] - pa[1], d = Math.hypot(dx, dy) || 1;
    var ang = Math.atan2(dy, dx), col = q.same ? '#E0574A' : '#2E9A4C';
    var len = Math.max(11, Math.min(22, d * 0.22)) * puls;   /* くっついた あとでも 見える 長さは のこす */
    /* 同じ極 … おたがい 外がわへ ／ ちがう極 … おたがい 内がわへ */
    if (q.same){
      s += mgArrow(pa[0] - Math.cos(ang) * (a.r + 3), pa[1] - Math.sin(ang) * (a.r + 3), ang + Math.PI, len, col, fade);
      s += mgArrow(pb[0] + Math.cos(ang) * (b.r + 3), pb[1] + Math.sin(ang) * (b.r + 3), ang, len, col, fade);
    } else {
      s += mgArrow(pa[0] + Math.cos(ang) * (a.r + 3 + len), pa[1] + Math.sin(ang) * (a.r + 3 + len), ang + Math.PI, len, col, fade);
      s += mgArrow(pb[0] - Math.cos(ang) * (b.r + 3 + len), pb[1] - Math.sin(ang) * (b.r + 3 + len), ang, len, col, fade);
    }
    s += '<circle cx="' + pb[0].toFixed(1) + '" cy="' + pb[1].toFixed(1) + '" r="' + (b.r + 5).toFixed(1) +
         '" fill="none" stroke="' + col + '" stroke-width="2.6" opacity="' + (0.75 * fade).toFixed(2) + '"/>';
  });
  return s;
}

/* ================================================================== *

  50:  { g:50,  name:'ふつう', col:'#3EA7D8', dark:'#1B6E96', hit:false, spring:1.15 },

  var s = swingInit(st), k = 0, lim = Math.round((maxT || 20) / SW_DT);
  for (var n = 0; n < lim; n++){
    while (k < script.length && script[k][0] <= s.t + 1e-9){
      var a = script[k][1];
      if (a === 'g') swingGrab(st, s);
      else if (a === 'r') swingRelease(s);
      else if (a.indexOf('w:') === 0) swingSetW(st, s, +a.slice(2));
      else if (a.indexOf('r:') === 0) swingSetR(st, s, +a.slice(2));
      else if (a.indexOf('L:') === 0) swingSetL(st, s, a.slice(2));
      k++;
    }
    swingStep(st, s, SW_DT);
    if (s.clear || s.dead) break;
  }
  return s;
}

function swingStop(){ if (cur.swRaf){ cancelAnimationFrame(cur.swRaf); cur.swRaf = null; } }
function loadSwing(st){
  swingStop();
  /* **えらんだ おもさ・大きさは その もんだいの あいだ ずっと おぼえて おく。**
     しっぱいの たびに もどると えらび直しが めんどう、という 指てきで こうした。
     べつの もんだいに うつったら もとに もどす。 */
  var key = cur.gameId + ':' + cur.si;
  if (cur.swKeepFor !== key){ cur.swKeep = null; cur.swKeepFor = key; }
  cur.sw = swingInit(st, cur.swKeep);
  cur.swDemo = null; cur.swAcc = 0; cur.swLast = 0; cur.swTries = 0;
  cur.swPickHtml = null;
  swingLoop();
}
function swingLoop(){
  swingStop();
  cur.swLast = 0; cur.swAcc = 0;
  var step = function(ts){
    if (cur.kind !== 'swing'){ cur.swRaf = null; return; }
    if (!cur.swLast) cur.swLast = ts;
    var d = Math.min(0.05, (ts - cur.swLast) / 1000);
    cur.swLast = ts; cur.swAcc += d;
    var s = cur.sw, st = curStage();
    while (cur.swAcc >= SW_DT){
      cur.swAcc -= SW_DT;
      if (cur.swDemo){
        while (cur.swDemo.k < cur.swDemo.list.length && cur.swDemo.list[cur.swDemo.k][0] <= s.t + 1e-9){
          var a = cur.swDemo.list[cur.swDemo.k][1];
          if (a === 'g') swingGrab(st, s);
          else if (a === 'r') swingRelease(s);
          else if (a.indexOf('w:') === 0) swingSetW(st, s, +a.slice(2));
          else if (a.indexOf('r:') === 0) swingSetR(st, s, +a.slice(2));
          else if (a.indexOf('L:') === 0) swingSetL(st, s, a.slice(2));
          cur.swDemo.k++;
        }
      }
      swingStep(st, s, SW_DT);
      if (s.dead || s.clear) break;
    }
    renderSwing();
    if (s.clear){ cur.swRaf = null; tryClear(true); return; }
    if (s.dead){
      cur.swRaf = null;
      setTimeout(function(){
        if (cur.kind !== 'swing' || cur.done) return;
        cur.swTries++; cur.sw = swingInit(curStage(), cur.swKeep); cur.swDemo = null; swingLoop();
      }, 850);
      return;
    }
    cur.swRaf = requestAnimationFrame(step);
  };
  cur.swRaf = requestAnimationFrame(step);
}
function swingDemo(){
  var st = curStage();
  if (!st.ex) return;
  cur.noStar = true;                      /* お手本を 見たら パーフェクトは つかない */
  cur.sw = swingInit(st);                 /* お手本は かならず もんだいの さいしょの おもさから */
  cur.swDemo = { list:st.ex, k:0 };
  swingLoop();
}

function renderSwing(){

  (st.movers || []).forEach(function(mv){

  });
  (st.spikes || []).forEach(function(k){
    var n = Math.max(1, Math.round(k.w / 14)), d = k.w / n, sp = '';
    for (var i = 0; i < n; i++) sp += 'M' + (k.x + i * d) + ' ' + (k.y + k.h) + ' L' + (k.x + i * d + d / 2) + ' ' + k.y + ' L' + (k.x + (i + 1) * d) + ' ' + (k.y + k.h) + ' ';
    g += '<path d="' + sp + '" fill="#E05A4A" stroke="#9A2D20" stroke-width="2" stroke-linejoin="round"/>';

  g += '<circle cx="' + st.goal.x + '" cy="' + st.goal.y + '" r="' + (st.goal.r + 6) + '" fill="#2E9A4C" opacity=".18"/>';
  g += '<circle cx="' + st.goal.x + '" cy="' + st.goal.y + '" r="' + st.goal.r + '" fill="#CBEFD4" stroke="#2E9A4C" stroke-width="3"/>';
  g += '<text x="' + st.goal.x + '" y="' + (st.goal.y + 8) + '" font-size="22" text-anchor="middle">🏁</text>';
  /* フック（とどく ものは 目立たせる） */
  /* フックは 大きく（2026-08-29 「紐を つける ところが 小さい」の 指てき）。
     verify.mjs が この 大きさで とげ／かべに かさなって いないかを 見はって いる。 */
  var near = s.hook ? s.hook.i : swingNearHook(st, s);
  st.hooks.forEach(function(h, i){
    var on = (i === near);
    if (on) g += '<circle cx="' + h.x + '" cy="' + h.y + '" r="26" fill="#F5B324" opacity=".28"/>';
    g += '<circle cx="' + h.x + '" cy="' + h.y + '" r="' + SW_HOOK + '" fill="' + (on ? '#F5B324' : '#CBD6DE') +
         '" stroke="#5A7C93" stroke-width="4"/>';
    g += '<circle cx="' + h.x + '" cy="' + h.y + '" r="' + (SW_HOOK - 7) + '" fill="none" stroke="' +
         (on ? '#9A6B00' : '#8FA3B8') + '" stroke-width="3"/>';
  });
  /* ひも と ボール */
  if (s.hook){
    var hk = st.hooks[s.hook.i];
    g += '<line x1="' + hk.x + '" y1="' + hk.y + '" x2="' + s.x.toFixed(1) + '" y2="' + s.y.toFixed(1) +
         '" stroke="#5A7C93" stroke-width="4"/>';
  } else if (near >= 0 && !s.dead && !s.clear){

  g += '<circle cx="' + s.x.toFixed(1) + '" cy="' + s.y.toFixed(1) + '" r="' + s.r +

  if (s.r >= 11) g += '<text x="' + s.x.toFixed(1) + '" y="' + (s.y + 4).toFixed(1) +
       '" font-size="' + (s.r >= 15 ? 11 : 9) + '" font-weight="900" fill="#fff" text-anchor="middle">' + s.w + 'g</text>';
  if (s.dead) g += '<g transform="translate(300,' + (SW_H / 2) + ')"><rect x="-118" y="-24" width="236" height="46" rx="22" fill="#E05A4A"/>' +
    '<text x="0" y="8" font-size="19" font-weight="900" fill="#fff" text-anchor="middle">' + (s.msg || 'ざんねん') + '</text></g>';
  /* えらびボタン：うえの れつ＝おもさ、したの れつ＝大きさ。
     どちらも **ぶら下がって いる あいだだけ** かえられる。 */
  /* えらびボタンは **SVGでは なく ほんものの HTMLボタン**に した（2026-08-29）。
     SVGの とうめいな あたり判定は ブラウザに よって きかない ことが あり、
     じっさいに Safari で「100gを おしても かわらない」が 起きた。

  var can = swingCanSet(s) && !s.dead && !s.clear;
  var ph = '';
  if (!s.started && !s.dead) ph += '<div class="sw-note">まず ここで えらぼう（あとから ぶら下がって いる ときも かえられるよ）</div>';
  ph += '<div class="sw-box' + (!s.started && !s.dead ? ' first' : '') + '">';
  function row(items, label, sel, key, draw){
    ph += '<div class="sw-row"><div class="sw-lab">' + label + '</div>';
    items.forEach(function(v){
      var on = (sel === v), d = draw(v);
      ph += '<button class="sw-b' + (on ? ' on' : '') + '" data-' + key + '="' + v + '"' +
            (can || on ? '' : ' disabled') +
            ' style="' + (on ? 'background:' + d.col + ';border-color:' + d.dark + ';' : '') + '">' +
            '<span class="dot" style="width:' + (d.r * 2) + 'px;height:' + (d.r * 2) + 'px;background:' +
            (on ? '#fff' : d.col) + '"></span>' + d.t + '</button>';
    });

  }
  row(swW(st), 'おもさ', s.w, 'sww', function(v){
    return { col:SWW[v].col, dark:SWW[v].dark, r:8, t:v + 'g' };
  });
  row(swR(st), '大きさ', s.r, 'swr', function(v){

  });
  row(swL(st), 'ひも', s.lk, 'swl', function(v){

    '" text-anchor="middle">' + (gold ? '★ きんカード ★' : 'かがくカード') + '</text>' +
    '</svg>';

function onClear(){
  var g = gameById(cur.gameId), st = g.stages[cur.si], key = stageKey(g.id, cur.si);
  var old = save.stages[key];
  /* ★は「できた！」の おびが 出た しゅんかんに きめて ある（20-shell.js の showClearBar）。
     おびを 見て いる あいだに ヒントを ひらいても 下がらない。 */
  var perfect = (cur.gotStar === 0 || cur.gotStar === 1) ? cur.gotStar
              : ((cur.hint || cur.noStar) ? 0 : 1);
  if (old && old.p) perfect = 1;                    /* 一度とった パーフェクトは 下げない（§6 単調増加） */
  save.stages[key] = { c:1, p:perfect };
  var justFinished = gameDone(g.id) && !save.cards[g.id];
  if (gameDone(g.id)) save.cards[g.id] = gameGold(g.id) ? 2 : 1;
  store();
  renderStrip();

  document.getElementById('modal-jhs').innerHTML =
    g.jhs ? '<div class="jhs-note">🎓 中学でも つかうよ</div>' : '';
  document.getElementById('modal-title').textContent = perfect ? 'パーフェクト！' : 'クリア！';
  document.getElementById('modal-card').innerHTML = justFinished ? cardSVG(g, gameGold(g.id)) : '';
  document.getElementById('modal-learn').innerHTML =
    (justFinished ? '<b>「' + g.card + '」カード</b>を てにいれた！<br>' : '') + st.learn;
  var last = (cur.si >= g.stages.length - 1);
  /* ゲームが 1つだけの アプリには もどる 島が ない ので「とじる」に する */
  document.getElementById('modal-next').textContent =
    last ? (HOME_GAME ? 'とじる ▼' : '島に もどる ▶') : 'つぎへ ▶';
  document.getElementById('modal').className = 'modal on';
  confettiBurst(perfect ? 120 : 70);
}
document.getElementById('modal-again').onclick = function(){ closeModal(); loadStage(); };
document.getElementById('modal-next').onclick = function(){
  closeModal();
  var g = gameById(cur.gameId);
  if (cur.si >= g.stages.length - 1){
    if (HOME_GAME){ renderStrip(); return; }   /* 1ゲームの アプリ：もんだい えらびに もどるだけ */
    openIsland(g.island); return;
  }
  cur.si++; cur.hint = false; loadStage();
};

/* じぶんで かく コンフェッティ（外部ライブラリは つかわない） */
function confettiBurst(n){
  var cv = document.getElementById('confetti');
  var ctx = cv.getContext('2d');
  var W = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
  cv.style.display = 'block';
  var cols = ['#F5B324','#4FC46A','#3EA7D8','#E8618C','#8B7BE8','#FF8A5B'];
  var ps = [];
  for (var i=0;i<n;i++){
    ps.push({ x:W/2 + (Math.random()-.5)*W*.5, y:H*.42,
      vx:(Math.random()-.5)*13, vy:-8 - Math.random()*11,
      w:6 + Math.random()*8, h:8 + Math.random()*10,
      r:Math.random()*6.28, vr:(Math.random()-.5)*.32,
      c:cols[(Math.random()*cols.length)|0], life:0 });
  }
  setTimeout(function(){ ctx.clearRect(0,0,W,H); cv.style.display = 'none'; }, 6500);  /* rAFが とまっても のこらないように */
  var t0 = 0;
  function tick(){
    ctx.clearRect(0,0,W,H);
    var alive = 0;
    ps.forEach(function(p){
      p.vy += .42; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      if (p.y < H + 40){ alive++;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
      }
    });
    t0++;
    if (alive && t0 < 260) requestAnimationFrame(tick);
    else { ctx.clearRect(0,0,W,H); cv.style.display = 'none'; }
  }
  requestAnimationFrame(tick);
}

/* ------------------------------------------------------------------ *
 * 8. がめん：ホーム（地図）と 島
 * ------------------------------------------------------------------ */
function islandArt(isl, state){
  var s = '<svg class="isl-art" viewBox="0 0 200 156">' +
    '<ellipse cx="100" cy="132" rx="84" ry="16" fill="rgba(4,50,72,.28)"/>' +
    '<path d="M12 122 Q24 92 58 86 Q78 50 112 56 Q152 60 166 96 Q188 102 188 122 Z" fill="' + isl.sand + '"/>' +
    '<path d="M40 100 Q70 58 106 62 Q146 66 160 100 Z" fill="' + isl.color + '"/>' +
    '<text x="100" y="102" font-size="46" text-anchor="middle">' + (state === 'lock' ? '🔒' : isl.emoji) + '</text>';
  if (state === 'done') s += '<text x="158" y="112" font-size="30" text-anchor="middle">🏁</text>';
  return s + '</svg>';
}
function renderHome(){
  /* 島が 1つだけの アプリには 海の 地図が ない（ビルドが とりのぞく）。
     その ときは 何も しない。 */
  if (!document.getElementById('map-inner')) return;
  var open = methodOpen(), h = '', total = 0, got = 0;
  GAMES.forEach(function(g){
    if (g.soon || !g.stages) return;
    total += g.stages.length;
    got += clearedCount(g.id);
  });
  ISLANDS.forEach(function(isl){
    var lock = isl.needAll && !open;
    var list = playableOf(isl.id);
    var state = lock ? 'lock' : (list.length && islandDone(isl.id) ? 'done' : 'go');
    var n = 0, all = 0;
    list.forEach(function(g){ all += g.stages.length; n += clearedCount(g.id); });
    var label = lock ? '4つの島 クリアで ひらく'
              : (all ? n + ' / ' + all + ' もん' : 'じゅんびちゅう');
    h += '<button class="island' + (lock ? ' locked' : '') + '" style="--x:' + isl.mx + '%; --y:' + isl.my +
         '%; --nx:' + isl.nx + '%; --ny:' + isl.ny + '%" data-isl="' + isl.id + '">' + islandArt(isl, state) +
         '<span class="isl-name">' + isl.emoji + ' ' + isl.name + '</span>' +
         '<span class="isl-count">' + label + '</span></button>';
  });
  document.getElementById('map-inner').innerHTML = h;
  document.getElementById('home-prog').style.width = (total ? (got / total * 100) : 0) + '%';
  document.getElementById('home-note').textContent = 'クリアした もんだい　' + got + ' / ' + total;
}
if (document.getElementById('map-inner')) document.getElementById('map-inner').addEventListener('click', function(e){
  var id = attrUp(e.target, 'data-isl');
  if (!id) return;
  var isl = islandById(id);
  if (isl.needAll && !methodOpen()){
    alert('🔬 かんがえかたの島は、ほかの 4つの島を ぜんぶ クリアすると ひらくよ！');
    return;
  }
  openIsland(id);
});

function openIsland(id){
  /* ゲームが 1つだけの アプリ（でんき回路 など）には 島の がめんが ない。
     「島に もどる」で 行ける ところが ない ので、ゲームの がめんに とどまる。
     こうしないと まっ白な がめんに おちる（クリア後・リサイクル工場・ふりこ が
     openIsland を よぶ）。 */
  if (HOME_GAME){ go('game'); return; }
  /* 島が 1つだけの アプリには 島の がめんが 1まいしか ない（地図を とりのぞいて いる）。
     🔬かんがえかたの島の ゲームも その 1まいの 下に ならべて いる ので、
     どこから よばれても じぶんの 島の がめんを 出す。
     こうしないと 🔬の ゲームを おえた とき「🔬かんがえかたの島」だけの がめんに
     おりてしまい、もどるボタンが ない ので **そこから 出られなく なる**。 */
  if (HOME_ISLAND) id = HOME_ISLAND;
  var isl = islandById(id);
  document.getElementById('isl-bar-title').textContent = isl.emoji + ' ' + isl.name;
  var hero = document.getElementById('isl-hero');
  hero.style.background = 'linear-gradient(180deg,' + isl.color + ' 0%, ' + isl.color + 'CC 100%)';
  hero.innerHTML = '<div class="emoji">' + isl.emoji + '</div><h2>' + isl.name + '</h2><p>' + isl.desc + '</p>';
  var h = '';
  gamesOf(id).forEach(function(g){
    var n = g.stages ? clearedCount(g.id) : 0;
    var all = g.stages ? g.stages.length : 0;
    var pct = all ? (n / all * 100) : 0;
    var card = save.cards[g.id];
    h += '<button class="game-card' + (g.soon ? ' soon' : '') + '" data-g="' + g.id + '">' +
      '<span class="gc-ico" style="background:' + isl.color + '22">' + g.icon + '</span>' +
      '<span class="gc-body">' +
        '<span class="gc-name">' + g.name +
          (card ? (card === 2 ? ' <span class="tag jhs">★きんカード</span>' : ' <span class="tag grade">カード</span>') : '') +
          '<span class="tag grade">' + g.grade + '</span>' +
          (g.jhs ? '<span class="tag jhs">🎓中学でも</span>' : '') +
          (g.soon ? '<span class="tag soon">じゅんびちゅう</span>' : '') +
        '</span>' +
        '<span class="gc-sub">' + g.sub + (all ? '　' + n + '/' + all : '') + '</span>' +
        (all ? '<span class="gc-meter"><i style="width:' + pct + '%"></i></span>' : '') +
      '</span></button>';
  });
  /* 地図の ない アプリ（島が 1つだけ）では、🔬かんがえかたの島の 行き場が なくなる。
     じぶんの 島の ゲームの 下に つづけて 出す。ひらく までは 「あと なに が いるか」を 見せる。 */
  if (HOME_ISLAND && id === HOME_ISLAND) h += methodSection();
  document.getElementById('game-list').innerHTML = h;
  go('island');
}
/* まだ クリアして いない いちばん さいしょの もんだいの ばんごう */
function firstTodo(g){
  var si = 0;
  for (var i=0;i<g.stages.length;i++){ if (!stageRec(g.id, i)){ si = i; break; } si = i; }
  return si;
}
/* ゲームが 1つだけの アプリには この 一覧が ない（ビルドが がめんごと とりのぞく）。 */
if (document.getElementById('game-list')) document.getElementById('game-list').addEventListener('click', function(e){
  var id = attrUp(e.target, 'data-g');
  if (!id) return;
  var g = gameById(id);
  if (g.soon){ alert('この ミニゲームは じゅんびちゅう。もうすこし まってね！'); return; }
  startGame(id, firstTodo(g));
});

/* 🔬かんがえかたの島の ぶぶん（地図の ない アプリだけで つかう）。
   ひらいて いれば ゲームを ならべ、まだなら 何を すれば ひらくかを 出す。 */
function methodSection(){
  var isl = islandById('method');
  if (!isl) return '';
  if (!methodOpen()){
    return '<div class="method-lock">' +
      '<span class="ml-ico">🔒</span>' +
      '<b>' + isl.emoji + ' ' + isl.name + '</b>' +
      '<span>⚡🧪🌱🌏 <b>4つの島 ぜんぶ</b>を クリアすると ひらくよ。' +
      'ほかの島は 🏠アプリ集から いけるよ。</span></div>';
  }
  var h = '<div class="method-head">' + isl.emoji + ' ' + isl.name + '　<span>' + isl.desc + '</span></div>';
  gamesOf('method').forEach(function(g){
    var n = clearedCount(g.id), all = g.stages ? g.stages.length : 0;
    var card = save.cards[g.id];
    h += '<button class="game-card" data-g="' + g.id + '">' +
      '<span class="gc-ico" style="background:' + isl.color + '22">' + g.icon + '</span>' +
      '<span class="gc-body">' +
        '<span class="gc-name">' + g.name +
          (card ? (card === 2 ? ' <span class="tag jhs">★きんカード</span>' : ' <span class="tag grade">カードGET</span>') : '') +
          '<span class="tag grade">' + g.grade + '</span>' +
          (g.jhs ? '<span class="tag jhs">🎓中学でも</span>' : '') +
        '</span>' +
        '<span class="gc-sub">' + g.sub + (all ? '　' + n + '/' + all : '') + '</span>' +
        (all ? '<span class="gc-meter"><i style="width:' + (all ? (n / all * 100) : 0) + '%"></i></span>' : '') +
      '</span></button>';
  });
  return h;
}

/* ------------------------------------------------------------------ *
 * 9. がめんの きりかえ と きどう
 * ------------------------------------------------------------------ */
function go(name){
  /* ゲームの 画面から 出る ときは、うごいて いる アニメを とめる
     （とめないと 見えない ところで まわり つづけて バッテリーを 食う） */
  /* ゲームの がめんから 出たら 走って いる アニメを 止める。型（エンジン）に stop を
     書いて おくと ここで よばれる（書かなくても よい）。 */
  if (name !== 'game'){
    for (var _k in ENGINES) if (ENGINES[_k].stop) ENGINES[_k].stop();
    hideClearBar();                                  /* できた！の おびを のこさない */
  }
  ['home','island','game'].forEach(function(n){
    var el = document.getElementById('screen-' + n);   /* 地図の ない アプリでは home が ない */
    if (el) el.className = 'screen' + (n === name ? ' on' : '');
  });
  if (name === 'home') renderHome();
  window.scrollTo(0, 0);
}
load();
renderHome();
/* 島が 1つだけの アプリ（エネルギーの島 など）には 海の 地図が ない
   （ビルドが がめんごと とりのぞく）。島の 中（ミニゲームの 一覧）から はじめる。
   🔬かんがえかたの島は その 一覧の 下に つづけて 出る（91-home.js の methodSection）。 */
/* ゲームが 1つだけの アプリ（でんき回路 など）は、その ゲームを いきなり ひらく。
   ゲームえらびも ポータルが する ので、1つしか ない 一覧を 見せる いみが ない。
   つづきから はじまる（まだ クリアして いない さいしょの もんだい）。 */
if (HOME_GAME) startGame(HOME_GAME, firstTodo(gameById(HOME_GAME)));
else if (HOME_ISLAND) openIsland(HOME_ISLAND);
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
