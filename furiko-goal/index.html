<!DOCTYPE html>
<html lang="ja">
<head>
<!-- kagasen-hozon -->
<script>
/* =====================================================================
   hozon-guard.js v1 — 「きろくが だまって きえる」を ふせぐ 共通の見はり（2026-09-16）
   ★このファイルは「原本」。各アプリの <head> には build-hozon.mjs が
     「kagasen-hozon」の目印コメントの あいだに そのまま埋めこむ。
     直したら `node build-hozon.mjs` → 各 sw.js の CACHE を繰り上げ（ツールが自動でやる）。
   ★ES2017+α縛り（?. ?? は書かない）。ほかのスクリプトより先に動くこと（<head> の先頭）。

   なぜ要るか:
     localStorage は kagasen.github.io の **全アプリで分け合う 約5MB**。
     どれか1つ（思考ツールの写真・学級ボードの手書き など）が うめると、
     ほかのアプリの保存が失敗する。ほとんどのアプリは失敗を catch(e){} で だまって
     すてていたので、子どもは「あそんだのに きえた」と感じていた。

   やること:
     1. localStorage.setItem が失敗したら、すてても よい記録（古い日付の
        kagasen_click_* ＝ポータルの「今日もう数えた」印）を掃除して、1回だけ やりなおす
     2. それでも だめなら、画面の上に おしらせを出す（子どもむけ＋おとなむけ1行：
        合計と 大きい順3つのアプリ名）。アプリの動きは 変えない（例外は そのまま投げる）
     3. ひらいたときにも 古い kagasen_click_* を掃除する（毎日1つずつ ふえていた）
     4. ブラウザに「このサイトのデータを 勝手に消さないで」と1回たのむ（storage.persist）
        Firefox は 許可ダイアログが出て 子どもが こまるので たのまない

   ★子どもの記録は **1つも消さない**。消すのは kagasen_click_* の「古い日付」だけ。
   ページ側で自前のおしらせを出すとき（typing/shop.html）は
   window.KAGASEN_HOZON_QUIET = true にすると、ここの おしらせは出ない。
   ===================================================================== */
(function () {
  'use strict';
  var LS;
  try { LS = window.localStorage; } catch (e) { return; }
  if (!LS || !window.Storage || Storage.prototype.__kagasenHozon) return;

  /* キーの名前の はじまり → アプリ名（おとなむけの表示用）。アプリを増やしたら1行足す */
  var NAMES = [
    ['cb-v2', '教室サポートボード'],
    ['sikou-tool-app', '思考ツール'],
    ['kanji_', '漢字の冒険'],
    ['kannjibusyu-ta', '漢字部首シューティング'],
    ['kotobasagashi', '言葉さがし'],
    ['lua_state', '自分レベルアップアドベンチャー'],
    ['rekishiBattle', 'レキシバトル'],
    ['sakka_', '作家の時間'],
    ['science-island', 'りかの島（理科アプリ）'],
    ['sekai-o-mawarou', 'せかいをまわろう！'],
    ['shinmatorikusu', '心マトリクス'],
    ['homeworkSubmissionData', '宿題提出ポスト'],
    ['relay_runners', '体育リレー'],
    ['todofuken', '都道府県の冒険'],
    ['typing', 'キッズタイピング'],
    ['kagasen_tokkun70', 'キッズタイピング'],
    ['ugokiNoKiroku', 'うごきのきろく'],
    ['kagasen_', 'アプリ集のトップ']
  ];
  function appName(k) {
    for (var i = 0; i < NAMES.length; i++) if (k.indexOf(NAMES[i][0]) === 0) return NAMES[i][1];
    return k;
  }

  /* ---------- 1. すててよい記録の掃除 ---------- */
  function souji() {
    var today = new Date().toISOString().split('T')[0];   /* ポータルと同じ数え方（UTCの日付） */
    var dead = [];
    try {
      for (var i = 0; i < LS.length; i++) {
        var k = LS.key(i);
        var m = k && /^kagasen_click_.+_(\d{4}-\d{2}-\d{2})$/.exec(k);
        if (m && m[1] !== today) dead.push(k);
      }
      for (var j = 0; j < dead.length; j++) LS.removeItem(dead[j]);
    } catch (e) {}
    return dead.length;
  }

  /* ---------- 2. どれだけ うまっているか ---------- */
  function report() {
    var byApp = {}, total = 0;
    try {
      for (var i = 0; i < LS.length; i++) {
        var k = LS.key(i);
        var n = (k.length + (LS.getItem(k) || '').length) * 2;   /* UTF-16で数える */
        total += n;
        var a = appName(k);
        byApp[a] = (byApp[a] || 0) + n;
      }
    } catch (e) {}
    var rows = Object.keys(byApp).map(function (a) { return { a: a, n: byApp[a] }; });
    rows.sort(function (x, y) { return y.n - x.n; });
    return { total: total, rows: rows };
  }
  function mb(n) { return (n / 1024 / 1024).toFixed(1) + 'MB'; }

  /* ---------- おしらせ ---------- */
  var shown = false;
  function oshirase() {
    if (shown || window.KAGASEN_HOZON_QUIET) return;
    if (!document.body) { document.addEventListener('DOMContentLoaded', oshirase); return; }
    shown = true;
    var r = report();
    var adult;
    if (r.total >= 3 * 1024 * 1024) {
      var big = r.rows.filter(function (x) { return x.n >= 50 * 1024; }).slice(0, 3);
      adult = 'おとなの方へ：この端末の保存場所（かがせんのHAPPYアプリ集の全アプリで共通。iPad などでは約5MB）がいっぱいです（使用 ' +
        mb(r.total) + '）。大きい順：' +
        (big.length ? big : r.rows.slice(0, 1)).map(function (x) { return x.a + ' ' + mb(x.n); }).join('、') +
        '。使っていないアプリのデータを整理するか、バックアップを書き出してください。';
    } else {
      adult = 'おとなの方へ：ブラウザが保存を止めています（プライベートブラウズ・ストレージの制限など）。' +
        'ふつうのタブで開くか、ブラウザの設定を確認してください。';
    }
    var st = document.createElement('style');
    st.textContent =
      '#kagasen-hozon{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:2147483000;' +
      'width:min(560px,calc(100% - 24px));box-sizing:border-box;background:#FEF2F2;color:#7F1D1D;' +
      'border:3px solid #F87171;border-radius:16px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.25);' +
      'font:600 16px/1.5 "Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","BIZ UDPGothic",sans-serif;text-align:left}' +
      '#kagasen-hozon b{display:block;font-size:18px;margin-bottom:2px}' +
      '#kagasen-hozon small{display:block;font-size:12px;font-weight:600;opacity:.9;margin-top:6px}' +
      '#kagasen-hozon button{float:right;min-width:72px;min-height:48px;margin:0 0 6px 10px;border:none;border-radius:12px;' +
      'background:#DC2626;color:#fff;font:inherit;font-size:16px;cursor:pointer}' +
      '@media print{#kagasen-hozon{display:none}}';
    var box = document.createElement('div');
    box.id = 'kagasen-hozon';
    box.setAttribute('role', 'alert');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'とじる';
    btn.onclick = function () { box.remove(); };
    var t1 = document.createElement('b'); t1.textContent = '⚠️ きろくが ほぞんできませんでした';
    var t2 = document.createElement('span'); t2.textContent = 'おうちの人か 先生に この画面を 見せてね。';
    var t3 = document.createElement('small'); t3.textContent = adult;
    box.appendChild(btn); box.appendChild(t1); box.appendChild(t2); box.appendChild(t3);
    document.head.appendChild(st);
    document.body.appendChild(box);
  }

  /* ---------- 見はり本体 ---------- */
  var origSet = Storage.prototype.setItem;
  Storage.prototype.setItem = function (k, v) {
    try { return origSet.call(this, k, v); } catch (e) {
      if (this !== LS) throw e;
      if (souji() > 0) {
        try { return origSet.call(this, k, v); } catch (e2) { e = e2; }
      }
      oshirase();
      throw e;   /* アプリの動きは これまでと同じ */
    }
  };
  Storage.prototype.__kagasenHozon = 1;
  window.kagasenHozon = { report: report, souji: souji, oshirase: oshirase };

  /* ---------- 3. ひらいたときの掃除 ／ 4. 消さないでのお願い ---------- */
  souji();
  try {
    var sm = navigator.storage;
    if (sm && sm.persist && sm.persisted && !/Firefox\//.test(navigator.userAgent)) {
      sm.persisted().then(function (p) { if (!p) return sm.persist(); }).catch(function () {});
    }
  } catch (e) {}
})();
</script>

<style>
/* =====================================================================
   サイエンスアイランド — 小学校理科を5つの島でめぐる学習ゲーム
   設計と経緯は HANDOFF.md を読むこと。
   ES2017+α縛り（?. ?? は書かない＝古いiPadで全滅する）。
   ===================================================================== */
:root{
  --sea:#1B7FA8; --sea-d:#0E5B7C; --sea-l:#5FC6E8;
  --ink:#0F3350; --paper:#FFFDF6; --line:rgba(15,51,80,.12);
  --gold:#F5B324; --ok:#2E9A4C; --ng:#E05A4A;
  --fam:'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','BIZ UDPGothic','Yu Gothic',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  font-family:var(--fam); color:var(--ink); background:var(--sea);
  overflow-x:hidden; -webkit-text-size-adjust:100%;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
.screen{display:none; min-height:100%;}
.screen.on{display:block;}

/* ---------- ホーム（海の地図） ---------- */
#screen-home{
  background:
    radial-gradient(ellipse at 50% 8%, #8FE0F5 0%, rgba(143,224,245,0) 60%),
    linear-gradient(180deg,#4FB6DC 0%, var(--sea) 45%, var(--sea-d) 100%);
  padding:0 0 86px;
}
.home-head{padding:26px 16px 10px; text-align:center;}
.home-title{
  margin:0; font-size:clamp(28px,7vw,46px); font-weight:900; color:#fff; letter-spacing:.04em;
  text-shadow:0 3px 0 rgba(14,91,124,.45), 0 8px 20px rgba(0,0,0,.22);
}
.home-sub{margin:8px 0 0; color:#EAF9FF; font-size:clamp(13px,3.3vw,16px); font-weight:700; opacity:.95;}
.progress-bar{
  max-width:420px; margin:16px auto 0; background:rgba(255,255,255,.25);
  border-radius:999px; height:16px; overflow:hidden; box-shadow:inset 0 2px 5px rgba(0,0,0,.15);
}
.progress-bar>i{display:block; height:100%; background:linear-gradient(90deg,#FFE082,var(--gold)); border-radius:999px; transition:width .5s;}
.progress-note{text-align:center; color:#fff; font-weight:800; font-size:13px; margin-top:6px;}

.map-wrap{position:relative; max-width:900px; margin:14px auto 0; padding:0 12px;}
.map-inner{position:relative; width:100%; padding-top:80%;}
.island{
  position:absolute; left:var(--x); top:var(--y); transform:translate(-50%,-50%);
  width:31%; max-width:230px; min-width:132px;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:0; text-align:center; transition:transform .18s;
}
.island:active{transform:translate(-50%,-50%) scale(.95);}
.island .isl-art{width:100%; filter:drop-shadow(0 10px 16px rgba(0,0,0,.28));}
.island .isl-name{
  margin-top:-6px; font-size:clamp(13px,3.2vw,17px); font-weight:900; color:#fff;
  text-shadow:0 2px 0 rgba(14,91,124,.6), 0 4px 10px rgba(0,0,0,.3);
}
.island .isl-count{
  font-size:11px; font-weight:800; color:#0F3350; background:rgba(255,255,255,.9);
  border-radius:999px; padding:2px 10px; margin-top:3px;
}
.island.locked{opacity:.72;}
.island.locked .isl-count{background:rgba(255,255,255,.75);}
/* スマホ（せまい画面）では 島が かさなるので、たてに ながい ジグザグの 地図にする */
@media (max-width:560px){
  .map-inner{padding-top:235%;}
  .island{left:var(--nx); top:var(--ny); width:42%; min-width:120px; max-width:180px;}
}

/* ---------- 共通のヘッダ ---------- */
.bar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:10px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px; background:rgba(255,255,255,.94);
  box-shadow:0 2px 10px rgba(15,51,80,.14); backdrop-filter:blur(6px);
}
.bar .back{
  min-height:44px; min-width:44px; padding:0 14px; border-radius:999px; background:#EAF3F8;
  font-weight:900; font-size:15px; color:var(--ink); display:inline-flex; align-items:center; gap:4px;
}
.bar .back:active{transform:translateY(1px);}
.bar .ttl{font-weight:900; font-size:clamp(16px,4.2vw,21px); flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ---------- 島の画面 ---------- */
#screen-island{background:var(--paper);}
.isl-hero{padding:18px 16px 20px; color:#fff; text-align:center;}
.isl-hero .emoji{font-size:44px; line-height:1;}
.isl-hero h2{margin:6px 0 4px; font-size:clamp(20px,5.4vw,28px); font-weight:900;
  text-shadow:0 2px 6px rgba(0,0,0,.2);}
.isl-hero p{margin:0; font-size:14px; font-weight:700; opacity:.95;}
/* 島が 1つだけの アプリで、ゲームの 下に つづけて 出す 🔬かんがえかたの島 */
.method-head{margin:18px 4px 10px; font-size:15px; font-weight:900; color:#0F3350;
  border-top:2px dashed rgba(15,51,80,.18); padding-top:16px;}
.method-head span{font-size:13px; font-weight:700; opacity:.7;}
.method-lock{margin:18px 4px 4px; padding:16px 14px; border-radius:16px;
  border:2px dashed rgba(15,51,80,.20); background:rgba(255,255,255,.55);
  display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center;}
.method-lock .ml-ico{font-size:30px; line-height:1;}
.method-lock b{font-size:15px; color:#0F3350;}
.method-lock span{font-size:13px; font-weight:700; color:#0F3350; opacity:.8; line-height:1.6;}
.game-list{max-width:720px; margin:0 auto; padding:16px 12px 130px; display:grid; gap:12px;}
.game-card{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:#fff; border:2px solid var(--line); border-radius:18px; padding:14px 14px;
  box-shadow:0 4px 12px rgba(15,51,80,.07); min-height:76px; transition:transform .15s;
}
.game-card:active{transform:translateY(2px);}
.game-card .gc-ico{
  flex:0 0 54px; height:54px; border-radius:16px; display:grid; place-items:center;
  font-size:26px; background:#EAF3F8;
}
.game-card .gc-body{flex:1; min-width:0;}
.game-card .gc-name{font-size:17px; font-weight:900; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.game-card .gc-sub{font-size:13px; font-weight:700; color:#4A6C85; margin-top:2px;}
.game-card .gc-meter{margin-top:7px; height:9px; border-radius:999px; background:#E7EEF3; overflow:hidden;}
.game-card .gc-meter>i{display:block; height:100%; background:linear-gradient(90deg,#7BD98F,var(--ok)); border-radius:999px;}
.game-card.soon{opacity:.55;}
.tag{font-size:10px; font-weight:900; border-radius:999px; padding:2px 8px; white-space:nowrap;}
.tag.grade{background:#EAF3F8; color:#33637F;}
.tag.jhs{background:#FFF0CF; color:#8A5B00;}
.tag.soon{background:#EEE; color:#777;}

/* ---------- ゲーム画面 ---------- */
#screen-game{background:var(--paper); padding-bottom:130px;}
.stage-strip{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; padding:10px 12px 0;}
.stage-dot{
  width:34px; height:34px; border-radius:12px; display:grid; place-items:center;
  font-size:14px; font-weight:900; background:#E7EEF3; color:#7791A5;
}
.stage-dot.done{background:#CBEFD4; color:#1E6E37;}
.stage-dot.gold{background:linear-gradient(135deg,#FFE9A8,#F5B324); color:#7A5200;}
.stage-dot.now{outline:3px solid var(--sea); outline-offset:2px; background:#fff; color:var(--ink);}
.quest{
  max-width:640px; margin:12px auto 0; padding:12px 16px; background:#fff;
  border:2px solid var(--line); border-radius:16px; text-align:center;
}
.quest .q-n{font-size:12px; font-weight:900; color:#7791A5;}
.quest .q-t{font-size:clamp(16px,4.4vw,20px); font-weight:900; margin-top:2px;}
.quest .q-h{font-size:14px; font-weight:700; color:#4A6C85; margin-top:8px; display:none; line-height:1.75; text-align:left;}
.quest .q-h.on{display:block;}
.quest .q-h .ans{margin-top:10px; border-top:1px dashed #C7D6E0; padding-top:6px;}
.quest .q-h summary{cursor:pointer; color:#1B7FA8; font-weight:900; padding:11px 0; min-height:26px;}  /* 指で 押せる 48px */
.quest .q-h .ans-in{background:#F2F8FC; border-radius:12px; padding:8px 12px 10px; margin-top:4px;}
.quest .q-h ol{margin:6px 0 0 22px; padding:0;}
.quest .q-h li{margin:4px 0;}
.quest .q-h .ans-note{color:#6B8398; margin-top:8px;}
.sw-pick{display:none; margin:8px auto 0; max-width:520px;}
.sw-pick.on{display:block;}
.sw-pick .sw-note{font-size:13px; font-weight:900; color:#8A5B00; text-align:center; margin-bottom:6px;}
.sw-pick .sw-box{border-radius:16px; padding:8px 10px;}
.sw-pick .sw-box.first{background:#FFF6DE; border:3px solid #F5B324;}
.sw-pick .sw-row{display:flex; align-items:center; gap:6px; margin:4px 0;}
.sw-pick .sw-lab{font-size:13px; font-weight:900; color:#8FA3B8; width:48px; flex:none; text-align:right;}
.sw-pick .sw-b{flex:1; min-height:48px; display:flex; align-items:center; justify-content:center; gap:8px;
  font-family:inherit; font-size:14px; font-weight:900; color:#4A6C85; background:#F2F6F9;
  border:3px solid #C3D0DA; border-radius:14px; cursor:pointer; padding:0 6px;}
.sw-pick .sw-b .dot{border-radius:50%; display:inline-block; border:2px solid rgba(0,0,0,.25);}
.sw-pick .sw-b.on{color:#fff;}
.sw-pick .sw-b:disabled{opacity:.45; cursor:default;}
.quest .q-h button.mini{font-family:inherit; font-size:14px; font-weight:900; color:#fff; background:#1B7FA8;
  border:none; border-radius:12px; padding:11px 18px; min-height:44px; cursor:pointer;}
.board-wrap{max-width:640px; margin:12px auto 0; padding:0 10px; position:relative;}
.fc-controls{position:absolute; inset:0 10px; pointer-events:none; z-index:8;}
.fc-controls.on{pointer-events:auto;}
.fc-controls button{font:900 15px/1.2 inherit; min-height:54px; border:0; border-radius:17px; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; box-shadow:0 3px 0 rgba(15,51,80,.18);}
.fc-controls button:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(15,51,80,.18);}
.fc-answer-buttons{position:absolute; left:17%; right:17%; top:41.2%; display:grid; gap:10px; pointer-events:auto;}
.fc-answer-buttons button{background:#EEF4F7; color:#173F55; border:2px solid #7CA6B7;}
.fc-answer-buttons button:nth-child(2){background:#EAF6F1;}
.fc-result-buttons{position:absolute; left:17.2%; right:17.2%; top:65.3%; display:grid; grid-template-columns:1fr 1fr; gap:18px; pointer-events:auto;}
.fc-result-buttons .back-result{background:#EEF4F7; color:#315A70; border:2px solid #AFC8D3;}
.fc-result-buttons .again-result{background:#1B7FA8; color:#fff;}
.board{
  width:100%; background:#FFFFFF; border:2px solid var(--line); border-radius:20px;
  box-shadow:0 6px 18px rgba(15,51,80,.08); display:block; touch-action:manipulation;
}
.tools{max-width:640px; margin:12px auto 0; padding:0 10px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
.tool{
  min-height:48px; padding:0 18px; border-radius:999px; background:#EAF3F8; color:var(--ink);
  font-weight:900; font-size:15px; display:inline-flex; align-items:center; gap:6px;
  border:2px solid transparent;
}
.tool:active{transform:translateY(1px);}
.tool.primary{background:var(--sea); color:#fff;}
.status{
  max-width:640px; margin:10px auto 0; padding:0 12px; text-align:center;
  font-size:15px; font-weight:900; min-height:24px; color:#4A6C85;
}
.status.short{color:var(--ng);}

/* ---------- 見なおして いる あいだの おび ----------
   クリアの まどは せいかいの あと すぐ 出す（できた よろこびを へらさない）。
   まどの「🔍 見なおす」を おすと まどが どいて この おびに かわり、
   じぶんが 作った もの（回路・つり合い・ならべた じゅんばん…）を ゆっくり 見られる。
   おびから けっかに もどる ことも、そのまま つぎへ すすむ ことも できる。
   2026-09-10 ユーザーの きぼう。はじめは おびで クリアを 止めて いたが、
   「完成した ときの うれしさが 半減する」ので すぐ 出す 形に もどした。 */
.clear-bar{
  max-width:640px; margin:12px auto 0; padding:12px 14px; display:none;
  align-items:center; justify-content:center; gap:10px 14px; flex-wrap:wrap;
  background:#E9F9EE; border:3px solid var(--ok); border-radius:20px;
  animation:pop .3s cubic-bezier(.2,1.3,.5,1);
}
.clear-bar.on{display:flex;}
.clear-bar .cb-msg{font-size:16px; font-weight:900; color:#1E7A3C;}
.clear-bar .cb-go, .clear-bar .cb-back{
  min-height:48px; padding:0 22px; border-radius:999px; border:none;
  font-family:var(--fam); font-weight:900; font-size:16px;
  display:inline-flex; align-items:center; gap:6px; cursor:pointer;
}
.clear-bar .cb-go{background:var(--ok); color:#fff;}
.clear-bar .cb-back{background:#fff; color:#1E7A3C; border:2px solid var(--ok);}
.clear-bar .cb-go:active, .clear-bar .cb-back:active{transform:translateY(1px);}
.modal-look{
  margin-top:10px; width:100%; min-height:44px; border-radius:999px; border:2px solid var(--line);
  background:transparent; color:#4A6C85; font-family:var(--fam); font-weight:900; font-size:14px; cursor:pointer;
}
.modal-look:active{transform:translateY(1px);}

/* ---------- クリアのモーダル ---------- */
.modal{
  position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center;
  background:rgba(6,40,60,.6); padding:20px; backdrop-filter:blur(3px);
}
.modal.on{display:flex;}
.modal-box{
  background:var(--paper); border-radius:26px; padding:24px 20px; max-width:380px; width:100%;
  text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.35); animation:pop .35s cubic-bezier(.2,1.3,.5,1);
}
@keyframes pop{from{transform:scale(.7); opacity:0;} to{transform:scale(1); opacity:1;}}
.modal-box h3{margin:0 0 6px; font-size:26px; font-weight:900; color:var(--ok);}
.modal-box .learn{
  background:#FFF8E4; border:2px dashed var(--gold); border-radius:16px; padding:12px 14px;
  margin:14px 0; font-size:14px; font-weight:700; text-align:left; line-height:1.7;
}
.modal-box .learn b{color:#8A5B00;}
.jhs-note{
  display:inline-flex; align-items:center; gap:6px; background:#FFF0CF; color:#8A5B00;
  border-radius:999px; padding:6px 12px; font-size:12px; font-weight:900; margin-bottom:10px;
}
.modal-btns{display:flex; gap:10px; margin-top:6px;}
.modal-btns .tool{flex:1; justify-content:center;}
.card-get{margin:10px auto 0; width:150px;}
#confetti{position:fixed; inset:0; pointer-events:none; z-index:300; display:none;}

/* 「どの でんきゅうでも いい」タイプの goal を つくる ヘルパー。
   もんだいが 「3このうち 1こだけ 消せるように」と 言って いるのに、消すのを l3 に 決めうちに
   すると、l1 で 作った 子が ×に なる。おなじ 勉強なので ぜんぶ 通す（goal.anyOf に わたす）。 */
function goalOnly1Off(ids){                        /* 並列。スイッチを 切ると どれか 1こだけ 消える */
  return ids.map(function(x){
    var rest = ids.filter(function(y){ return y !== x; });
    var all = {}; ids.forEach(function(y){ all[y] = 'full'; });
    return [ { sw:{s1:true},  on:ids.slice(), bright:all },
             { sw:{s1:false}, on:rest, off:[x] } ];
  });
}
function goalTrunkSplit(ids){                      /* 1こ とおった あと 2本に わかれる。みきは どれでも いい */
  return ids.map(function(t){
    var br = {};
    ids.forEach(function(y){ br[y] = (y === t ? 'dim' : 'faint'); });
    return [ { on:ids.slice(), bright:br } ];
  });
}

function gameById(id){ for(var i=0;i<GAMES.length;i++){ if(GAMES[i].id===id) return GAMES[i]; } return null; }
function islandById(id){ for(var i=0;i<ISLANDS.length;i++){ if(ISLANDS[i].id===id) return ISLANDS[i]; } return null; }
function gamesOf(islandId){ return GAMES.filter(function(g){ return g.island===islandId; }); }
function playableOf(islandId){ return gamesOf(islandId).filter(function(g){ return !g.soon; }); }

/* ------------------------------------------------------------------ *
 * 3. セーブ（CLAUDE.md §3：記録を絶対に壊さない）
 * ------------------------------------------------------------------ */
var SAVE_KEY = 'science-island-save-v1';
var save = { v:1, stages:{}, cards:{}, opt:{} };

function load(){
  var raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch(e){ raw = null; }
  if (!raw) return;
  var d = null;
  try { d = JSON.parse(raw); } catch(e){ return; }
  if (!d || typeof d !== 'object') return;
  /* --- スキーマ移行のフック。形をかえても 古いデータを すてない --- *
     いまは v1 だけ。v2 に するときは ここで d.v===1 のデータを つめかえる。 */
  if (d.stages) save.stages = d.stages;
  if (d.cards)  save.cards  = d.cards;
  if (d.opt)    save.opt    = d.opt;            /* 自分で えらんだ せってい（でんじしゃくバトル など） */
  save.v = 1;
}
function store(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){}
}
function stageKey(gameId, i){ return gameId + '-' + (i+1); }
function stageRec(gameId, i){
  var r = save.stages[stageKey(gameId,i)];
  return r ? r : null;
}
function clearedCount(gameId){
  var g = gameById(gameId);
  if (!g || !g.stages) return 0;
  var n = 0;
  for (var i=0;i<g.stages.length;i++){ if (stageRec(gameId,i)) n++; }
  return n;
}
function gameDone(gameId){
  var g = gameById(gameId);
  if (!g || !g.stages) return false;
  return clearedCount(gameId) >= g.stages.length;
}
function gameGold(gameId){
  var g = gameById(gameId);
  if (!g || !g.stages) return false;
  for (var i=0;i<g.stages.length;i++){
    var r = stageRec(gameId,i);
    if (!r || !r.p) return false;
  }
  return true;
}
function islandDone(islandId){
  var all  = ALL_GAMES.filter(function(g){ return g[1] === islandId; });
  var list = playableOf(islandId);
  /* その島の ゲームを ぜんぶ 持って いる アプリの ときだけ、じぶんで 数える。
     1ゲームだけの アプリ（でんき回路 など）で これを やると、その 1つを クリアしただけで
     「エネルギーの島 クリア」に なって しまう。 */
  if (list.length && list.length >= all.length){
    for (var i=0;i<list.length;i++){ if(!gameDone(list[i].id)) return false; }
    return true;
  }
  /* この アプリには そろって いない 島（島ごと・ゲームごとに アプリを 分けた ため）。
     セーブは 4アプリで 同じ もの（同一オリジンの localStorage）を 見て いるので、
     その島の ゲームが ぜんぶ 図かんに のって いれば クリアずみと 分かる。
     こうしないと「4島 クリアで かんがえかたの島が ひらく」が どの アプリでも
     ひらかなく なる（じぶんの 島の ゲームしか 数えられない ため）。 */
  if (!all.length) return false;
  for (var j=0;j<all.length;j++){ if(!save.cards[all[j][0]]) return false; }
  return true;
}
function methodOpen(){
  return islandDone('energy') && islandDone('particle') && islandDone('life') && islandDone('earth');
}

/* ------------------------------------------------------------------ *
 * 6. ゲームの じょうたい と 型（エンジン）の わりふり
 *
 *    型は ENGINES に { load(stage), render(), tap(event) } の かたちで とうろくする。
 *    ミニゲームの kind が きほんの型。stage.kind を 書けば その1もんだけ
 *    べつの型に できる（例：月と太陽は「ならべる」と「むすぶ」を まぜている）。
 *    あたらしい型を ふやすときは ENGINES に 1つ 足すだけで すむように すること。
 * ------------------------------------------------------------------ */
var ENGINES = {};
var cur = {
  gameId:null, si:0, kind:null, hint:false, done:false,
  parts:[], wires:[], sel:null,      /* つなぐ型（回路・むすぶ）で つかう */
  slots:[], tray:[]                  /* ならべる型で つかう */
};

function curStage(){ var g = gameById(cur.gameId); return g ? g.stages[cur.si] : null; }
function engine(){ return ENGINES[cur.kind]; }
function setBoardBox(w, h){ document.getElementById('board').setAttribute('viewBox', '0 0 ' + w + ' ' + h); }
function setStatus(msg, bad){
  document.getElementById('status').className = bad ? 'status short' : 'status';
  document.getElementById('status').textContent = msg || '';
}
function closeModal(){ document.getElementById('modal').className = 'modal'; }
/* せいかいした ときの ながれ（2026-09-10）
     せいかい → 480ms あと に クリアの まど（できた よろこびは すぐ 出す）
     まどの「🔍 見なおす」→ まどが どいて 見なおしの おび → 「けっかに もどる」か「つぎへ」

   さいしょは おびで クリアを 止めて いたが、ユーザーに 実きで ためして もらい
   「完成した ときの うれしさが 半減する」と 分かった ので、まどは すぐ 出す 形に した。
   かわりに **まどを どけて 見なおせる 出口**を まどの 中に つけて ある。
   タイマーは おぼえて おいて loadStage で 取り消す（はじめから・もんだい きりかえ の ため）。 */
function tryClear(ok){
  if (!cur.done && ok){ cur.done = true; cur.clearTimer = setTimeout(onClear, 480); }
}
function showClearBar(){
  var bar = document.getElementById('clear-bar');
  bar.className = 'clear-bar on';
  if (bar.scrollIntoView) bar.scrollIntoView({ block:'nearest' });
}
function hideClearBar(){ document.getElementById('clear-bar').className = 'clear-bar'; }
function renderBoard(){ var e = engine(); if (e) e.render(); }

/* タップされた ところから 親を たどって data-○○ を さがす。
   ぜんぶの 型（エンジン）と ホームの 地図が つかう ので、ここ（共通）に 置く。 */
function attrUp(el, name){
  while (el && el !== document){
    if (el.getAttribute){ var v = el.getAttribute(name); if (v !== null) return v; }
    el = el.parentNode;
  }
  return null;
}

function startGame(gameId, si){
  var g = gameById(gameId);
  if (!g || g.soon) return;
  cur.gameId = gameId; cur.si = si; cur.sel = null; cur.done = false;
  cur.hint = false;                           /* 1もん目は そうさの せつめいを 出すが ヒントあつかいには しない */
  loadStage();
  document.getElementById('game-bar-title').textContent = g.name;
  /* ゲームが 1つだけの アプリには「◀ もどる」が ない（ビルドが とりのぞく）。
     出口は 左下の「アプリ集」ボタン。 */
  var backBtn = document.getElementById('game-back');
  if (backBtn) backBtn.onclick = function(){ openIsland(g.island); };
  go('game');
}
function loadStage(){
  var g = gameById(cur.gameId), st = g.stages[cur.si];
  if (cur.clearTimer){ clearTimeout(cur.clearTimer); cur.clearTimer = null; }
  closeModal();
  hideClearBar();
  cur.kind = st.kind || g.kind;
  cur.sel = null; cur.done = false; cur.noStar = false;
  document.getElementById('q-n').textContent =
    (g.stages.length > 1) ? ('だい' + (cur.si + 1) + 'もん / ' + g.stages.length + 'もん') : g.sub;
  document.getElementById('q-t').textContent = st.t;
  document.getElementById('q-h').innerHTML = st.h + hintAnswer(st, cur.kind);   /* ヒントも learn と 同じく <b> を つかえる */
  /* ヒントの 中に ボタンを 出す 型は、その ボタンを じぶんで つなぐ（hintBind）。
     ここに 型ごとの しょりを 書かない こと。 */
  var hintEng = ENGINES[cur.kind];
  if (hintEng && hintEng.hintBind) hintEng.hintBind();
  document.getElementById('q-h').className = 'q-h' + (cur.si === 0 ? ' on' : '');
  renderStrip();
  var pk = document.getElementById('sw-pick');
  pk.className = 'sw-pick'; pk.innerHTML = '';   /* ふりこ以外の 型では かくす */
  var fcCtl = document.getElementById('fc-controls');
  fcCtl.innerHTML = '';                          /* リサイクル工場いがいでは かくす */
  engine().load(st);
  renderBoard();
}
function renderStrip(){
  var g = gameById(cur.gameId), h = '';
  if (g.stages.length <= 1){ document.getElementById('stage-strip').innerHTML = ''; return; }
  for (var i=0;i<g.stages.length;i++){
    var r = stageRec(g.id, i);
    var cls = 'stage-dot' + (r ? (r.p ? ' gold' : ' done') : '') + (i === cur.si ? ' now' : '');
    h += '<button class="' + cls + '" data-go="' + i + '">' + (i + 1) + '</button>';
  }
  document.getElementById('stage-strip').innerHTML = h;
}

function sameWire(w, a, b){ return (w[0] === a && w[1] === b) || (w[0] === b && w[1] === a); }
function hasWire(a, b){
  for (var i=0;i<cur.wires.length;i++){ if (sameWire(cur.wires[i], a, b)) return true; }
  return false;
}

/* ヒントの 中に 入れる「こたえの れい」。中身は それぞれの 型（エンジン）が
   ENGINES.○○.hintAnswer に 書く。書かない 型は ヒントだけ 出て こたえの れいは 出ない。
   ここに 型の 名まえを ならべない こと（型を 足すたびに ここを 直す ことに なる）。 */
function hintAnswer(st, kind){
  var e = ENGINES[kind];
  return (e && e.hintAnswer) ? e.hintAnswer(st) : '';
}

/* ------------------------------------------------------------------ *
 * がめんの そうさを 型（エンジン）に わたす ところ。
 *
 * ★ここは 共通。2026-09-10 まで engines/swing.js（ふりこ）の 中に あった。
 *   ゲーム 1つずつの アプリに 分けた とき、ふりこの 入って いない アプリで
 *   **ばんめんの タップも もんだいえらびも ヒントも ぜんぶ 効かなく なった**。
 *   エラーは 1つも 出ない（おしても 何も おきないだけ）ので、気づくのが むずかしい。
 *   型に かんけいない そうさは かならず ここに 書く こと。
 * ------------------------------------------------------------------ */
/* ばんめんの タップは、いまの 型に わたすだけ */
document.getElementById('board').addEventListener('click', function(e){
  if (cur.done) return;
  var eng = engine();
  if (eng) eng.tap(e);
});
/* おしっぱなしを つかう 型（でんじしゃくバトルの コイル巻き）のための down/up。
   Pointer Events は 古い iPad に ない ので mouse と touch の 両方を 見る。 */
['mousedown', 'touchstart'].forEach(function(ev){
  document.getElementById('board').addEventListener(ev, function(e){
    if (cur.done) return;
    var eng = engine();
    if (eng && eng.down) eng.down(e);
  });
});
/* なぞって つなぐ型（リサイクル工場）。指が こまの間へ動いても 追えるよう document で見る。 */
document.addEventListener('mousemove', function(e){
  var eng=engine(); if(eng&&eng.move)eng.move(e);
});
document.addEventListener('touchmove', function(e){
  var eng=engine(); if(eng&&eng.move)eng.move(e);
}, {passive:false});
['mouseup', 'touchend', 'touchcancel'].forEach(function(ev){
  document.addEventListener(ev, function(e){
    var eng = engine();
    if (eng && eng.up) eng.up(e);
  });
});
document.getElementById('stage-strip').addEventListener('click', function(e){
  var i = attrUp(e.target, 'data-go');
  if (i === null) return;
  i = parseInt(i, 10);
  /* どのもんだいにも いつでも とべる（2026-08-28 ユーザーの きぼうで じゅんばんの
     ロックを 外した）。むずかしくて つまった とき、先に すすんで あとで もどれる ように。
     クリアの きろくは もんだいごとに もつので、とばしても 記ろくは こわれない。 */
  cur.si = i; cur.hint = false; loadStage();
});
document.getElementById('btn-hint').onclick = function(){
  var h = document.getElementById('q-h');
  h.className = (h.className.indexOf('on') >= 0) ? 'q-h' : 'q-h on';
  if (cur.si !== 0) cur.hint = true;
};
document.getElementById('btn-reset').onclick = function(){ loadStage(); };


/* ================================================================== *
 * ふりこアクション型（swing）— ふりこで ゆれて ゴールを めざす
 *
 *   ふりこの うごきは **ほんものの 式**で といて いる：θ'' = -(g/L)sinθ。
 *   ここに **おもさは 出て こない**。だから 3つの ボールは どれも
 *   「同じ 長さの ひもなら 同じ はやさで ゆれる」―― 5年「ふりこのきまり」そのもの。
 *   おもさが きいて くるのは ぶつかった とき（かべを こわす）・ばねで はねる とき・
 *   風に 流される とき。**周期には きかない／力には きく**を あそびながら 体で おぼえる。
 *
 *   そうさ：ばんめんを おして いる あいだ 近くの フックに ぶら下がる → はなすと 飛ぶ。
 *   ボールの 入れかえは **ぶら下がって いる あいだだけ**（入れかえても ゆれ方が
 *   かわらない ことが その場で 分かる）。
 * ================================================================== */
var SWG = 900, SW_DT = 1 / 120, SW_ROPE = 175, SW_GRAB = 168, SW_DAMP = 0.10, SW_HOOK = 14;
var SW_W = 600, SW_H = 400;
/* **おもさ**と**大きさ**は べつべつに えらべる（2026-08-29 ユーザーの きぼう）。
   おもさ …… かべを こわす 力・ばねで はねる 高さ に きく
   大きさ …… ボールの あたりの 大きさ だけ
   **どちらも ふりこの ゆれる はやさには きかない**（ひもの 長さだけで きまる）。 */
var SWW = {
  100: { g:100, name:'おもい', col:'#C0503C', dark:'#7E2E1E', hit:true,  spring:0.75 },
  50:  { g:50,  name:'ふつう', col:'#3EA7D8', dark:'#1B6E96', hit:false, spring:1.15 },
  10:  { g:10,  name:'かるい', col:'#F0B429', dark:'#9C6F00', hit:false, spring:1.75 }
};
/* 大きさは 6/12/18。**さが 大きい ほど「せまい すきま」を つかった 面が 作れる**
   （d=12/24/36 なので、すきま 16〜22px は 小さい ボールだけ 通れる）。 */
var SW_WS = [100, 50, 10], SW_RS = [18, 12, 6];
var SWR = { 18:'大きい', 12:'ふつう', 6:'小さい' };
/* **ひもの ながさ**（2026-08-29 ユーザーの ていあん）。
   ふりこの 1おうふくの 時間は **ひもの 長さだけ**で きまる ―― それを 自分で さわれる ように した。
   みじかい＝たぐりよせる（はやく ゆれる）／長い＝くり出す（ゆっくり 大きく ゆれる）。
   スタートでも きくので、長い ほど 支点から 遠く＝低く なり **はじめの いきおいも 大きく なる**。 */
var SW_LS = ['short', 'normal', 'long'];
var SWL = { short:'みじかい', normal:'ふつう', long:'長い' };
/* **長さは「きまった 数」**（2026-08-29 ユーザーの 指てきで こう した）。
   まえは「つかんだ ときの きょり ＋70」と いう **その ときしだいの 長さ**だったので、
   近くの フックを つかむと 長いを えらんで いても みじかく なって しまった。
   いまは みじかい=90／長い=200 の **いつも 同じ 長さ**。ふつうだけ「つかんだ ところの まま」。 */
var SW_LN = { short:90, long:200 };
var SW_LMAX = 240;
function swL(st){ return (st && st.lens) || SW_LS; }
function swRopeLen(lk, dist){
  if (SW_LN[lk]) return SW_LN[lk];                       /* みじかい／長いは いつも 同じ 長さ */
  return Math.max(34, Math.min(SW_ROPE, dist));          /* ふつうは つかんだ ところの まま */
}
/* 「長い」は 出せる だけ 出す。いっぱいまで のばすと かべに あたる ときは 少しずつ みじかく して ためす。 */
function swRopeFit(st, s, hx, hy, th, dist){
  var want = swRopeLen(s.lk, dist);
  for (var L = want; L >= 40; L -= 6){
    if (!swBlocked(st, s, hx + L * Math.sin(th), hy + L * Math.cos(th))) return L;
  }
  return Math.max(34, Math.min(SW_ROPE, dist));
}
/* かべ（岩・ひび・うごく かべ）に めり込んで いるか だけを 見る。
   **すきまより ボールが 大きい ときに かどから すりぬける のを ふせぐ**ため、
   1こま すすんだ あと ここで たしかめて、めり込んで いたら 元の ばしょに もどす。 */
function swSolid(st, s, x, y){
  var r = s.r, i;
  for (i = 0; i < (st.blocks || []).length; i++){
    var b = st.blocks[i];
    if (s.broken[i]) continue;
    if (x + r > b.x && x - r < b.x + b.w && y + r > b.y && y - r < b.y + b.h) return true;
  }
  for (i = 0; i < (st.movers || []).length; i++){
    var mv = st.movers[i], my = swMoverY(mv, s.t);
    if (x + r > mv.x && x - r < mv.x + mv.w && y + r > my && y - r < my + mv.h) return true;
  }
  return false;
}
/* その ばしょに おいたら 何かに あたるか（ひもの 長さを かえる ときの 安全かくにん） */
function swBlocked(st, s, x, y){
  var r = s.r, i;
  if (x < r + 4 || x > SW_W - r - 4 || y < r + 4 || y > SW_H - r - 4) return true;
  for (i = 0; i < (st.blocks || []).length; i++){
    var b = st.blocks[i];
    if (s.broken[i]) continue;
    if (x + r > b.x && x - r < b.x + b.w && y + r > b.y && y - r < b.y + b.h) return true;
  }
  for (i = 0; i < (st.movers || []).length; i++){
    var mv = st.movers[i], my = swMoverY(mv, s.t);
    if (x + r > mv.x && x - r < mv.x + mv.w && y + r > my && y - r < my + mv.h) return true;
  }
  for (i = 0; i < (st.spikes || []).length; i++){
    var k = st.spikes[i];
    if (x + r > k.x && x - r < k.x + k.w && y + r > k.y && y - r < k.y + k.h) return true;
  }
  return false;
}
function swW(st){ return (st && st.weights) || SW_WS; }
function swR(st){ return (st && st.sizes) || SW_RS; }

function swingInit(st, keep){
  var s = { x:st.start.x, y:st.start.y, vx:0, vy:0,
            w:(keep && keep.w) || st.w0 || 50, r:(keep && keep.r) || st.r0 || 12,
            lk:(keep && keep.lk) || st.l0 || 'normal',
            hook:null, t:0, dead:false, clear:false,
            broken:{}, started:false, fx:0, msg:'' };
  /* **さいしょから いちばん 近い フックに ぶら下がった じょうたいで とまって いる。**
     おす まで うごかない ―― かってに 落ちて しまう のを やめた（2026-08-29）。 */
  var i = swingNearHook(st, s);
  if (i >= 0){
    var h = st.hooks[i], dx = s.x - h.x, dy = s.y - h.y;
    var dist = Math.max(28, Math.sqrt(dx * dx + dy * dy));
    var th = Math.atan2(dx, dy), L = swRopeFit(st, s, h.x, h.y, th, dist);
    s.hook = { i:i, L:L, th:th, om:0 };
    s.x = h.x + L * Math.sin(th); s.y = h.y + L * Math.cos(th);
  }
  return s;
}
/* ボールと フックの あいだに かべが ないか（かべごしには ひもを かけられない）。
   ここを 見て いないと **かべごしに つかんで、つかんだ しゅんかんの いち直しで
   かべの むこうへ すりぬけられる** ―― すきまも こわせる かべも 意味が なくなる
   （2026-08-29 に 見つけた 穴）。 */
function swSightClear(st, s, x0, y0, x1, y1){
  /* かべを **ボールの 大きさぶん ふくらませて** しらべる。
     そうしないと「せんは 通るが ボールは 通れない すきま」の むこうの フックを つかめて しまい、
     つかんだ ときの いち直しで すきまを ワープして しまう（2026-08-29 に 見つけた 穴）。 */
  var r = s.r, n = 20, i, j;
  for (i = 1; i < n; i++){
    var x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
    for (j = 0; j < (st.blocks || []).length; j++){
      var b = st.blocks[j];
      if (s.broken[j]) continue;                  /* こわした かべは もう じゃま しない */
      if (x > b.x - r && x < b.x + b.w + r && y > b.y - r && y < b.y + b.h + r) return false;
    }
    for (j = 0; j < (st.movers || []).length; j++){
      var mv = st.movers[j];                      /* うごく かべは 上下に うごく はんい ぜんぶで 見る（きびしめ） */
      if (x > mv.x - r && x < mv.x + mv.w + r &&
          y > mv.y - (mv.ay || 0) - r && y < mv.y + mv.h + (mv.ay || 0) + r) return false;
    }
  }
  return true;
}
/* とどく はんいの、いちばん 近い フック（ボールより 上に ある もの） */
function swingNearHook(st, s){
  var best = -1, bd = 1e9;
  st.hooks.forEach(function(h, i){
    var dx = h.x - s.x, dy = h.y - s.y, d = Math.sqrt(dx * dx + dy * dy);
    if (dy > 26) return;                       /* ボールより 下の フックには つかまらない */
    if (d > SW_GRAB || d < 26) return;
    if (!swSightClear(st, s, s.x, s.y, h.x, h.y)) return;   /* かべごしは だめ */
    if (d < bd){ bd = d; best = i; }
  });
  return best;
}
function swingGrab(st, s){
  if (!s.started){ s.started = true; return true; }   /* さいしょの ひと おしで うごきだす */
  if (s.hook || s.dead || s.clear) return false;
  var i = swingNearHook(st, s);
  if (i < 0) return false;
  var h = st.hooks[i], dx = s.x - h.x, dy = s.y - h.y;
  var dist = Math.max(28, Math.sqrt(dx * dx + dy * dy));
  var th = Math.atan2(dx, dy), L = swRopeFit(st, s, h.x, h.y, th, dist);
  /* いち直しの 先まで まっすぐ 行けない なら、うごかさない（かべを ワープ しない） */
  if (!swSightClear(st, s, s.x, s.y, h.x + L * Math.sin(th), h.y + L * Math.cos(th))) L = Math.min(SW_ROPE, dist);
  /* いまの 速さの うち「ひもと 直角の ぶん」だけが 回る 力に なる */
  var om = (s.vx * Math.cos(th) - s.vy * Math.sin(th)) / L;
  s.hook = { i:i, L:L, th:th, om:om };
  s.x = h.x + L * Math.sin(th); s.y = h.y + L * Math.cos(th);
  return true;
}
function swingRelease(s){
  if (!s.hook) return;
  var h = s.hook;
  s.vx = h.om * h.L * Math.cos(h.th);
  s.vy = -h.om * h.L * Math.sin(h.th);
  s.hook = null;
}
/* おもさ／大きさを かえる。ぶら下がって いる あいだだけ できる。
   かえても θ も ω も さわらない ＝ **ゆれ方は まったく かわらない**（ふりこのきまり）。 */
/* かえられるのは **スタート前（まだ うごきだして いない）** と **ぶら下がって いる あいだ**。
   スタート前は フックに とどいて いなくても かならず えらべる（2026-08-29）。 */
function swingCanSet(s){ return !s.started || !!s.hook; }
function swingSetW(st, s, w){
  if (swW(st).indexOf(w) < 0 || !swingCanSet(s) || s.w === w) return false;
  s.w = w; return true;
}
function swingSetR(st, s, r){
  if (swR(st).indexOf(r) < 0 || !swingCanSet(s) || s.r === r) return false;
  s.r = r; return true;
}
/* ひもの 長さを かえる。**ぶら下がった まま かえると その場で ゆれ方が かわる**ので、
   「みじかい ほうが はやく ゆれる」を 目で 見て たしかめられる。
   せっせん方向の 速さは そのままに して、ω ＝ v ÷ L で 回りぐあいを 出しなおす。 */
function swingSetL(st, s, lk){
  if (swL(st).indexOf(lk) < 0 || !swingCanSet(s) || s.lk === lk) return false;
  s.lk = lk;
  if (s.hook){
    var hk = st.hooks[s.hook.i];
    var dx = s.x - hk.x, dy = s.y - hk.y;
    var dist = Math.max(28, Math.sqrt(dx * dx + dy * dy));
    var th = s.hook.th, L2 = swRopeFit(st, s, hk.x, hk.y, th, dist);
    var nx = hk.x + L2 * Math.sin(th), ny = hk.y + L2 * Math.cos(th);
    if (L2 !== s.hook.L){
      var v = Math.abs(s.hook.om) * s.hook.L, sgn = (s.hook.om >= 0 ? 1 : -1);
      s.hook.L = L2; s.hook.om = sgn * v / L2;
      s.x = nx; s.y = ny;
    }
  }
  return true;
}
/* うごく かべの いま の いち。t だけで きまる ので、お手本の さいせいでも まったく 同じ。
   ay ＝ 上下に うごく はば ／ per ＝ 1おうふくの 時間（びょう）。
   **ふりこの しゅうきと 合わせる**と「いつ はなすか」が だいじな 面に なる。 */
function swMoverY(m, t){
  return m.y + (m.ay || 0) * Math.sin(2 * Math.PI * t / (m.per || 2));
}
function swingHit(st, s){
  var B = SWW[s.w], r = s.r, i;
  for (i = 0; i < (st.movers || []).length; i++){
    var mv = st.movers[i], my = swMoverY(mv, s.t);
    if (s.x + r < mv.x || s.x - r > mv.x + mv.w || s.y + r < my || s.y - r > my + mv.h) continue;
    var qxL = (mv.x - r) - s.x, qxR = (mv.x + mv.w + r) - s.x;
    var qyT = (my - r) - s.y, qyB = (my + mv.h + r) - s.y;
    var qx = (Math.abs(qxL) < Math.abs(qxR)) ? qxL : qxR;
    var qy = (Math.abs(qyT) < Math.abs(qyB)) ? qyT : qyB;
    if (s.hook) swingRelease(s);
    if (Math.abs(qx) < Math.abs(qy)){ s.x += qx; s.vx = -s.vx * 0.3; }
    else { s.y += qy; s.vy = -s.vy * 0.3; }
  }
  for (i = 0; i < (st.blocks || []).length; i++){
    var b = st.blocks[i];
    if (s.broken[i]) continue;
    if (s.x + r < b.x || s.x - r > b.x + b.w || s.y + r < b.y || s.y - r > b.y + b.h) continue;
    var sp = Math.sqrt(s.vx * s.vx + s.vy * s.vy);
    /* ひび入りブロックは **おもい ボールが 十分な いきおいで** ぶつかった ときだけ こわれる */
    if (b.type === 'brick' && B.hit && sp > 230){ s.broken[i] = 1; s.fx = 10; continue; }
    var pxL = (b.x - r) - s.x, pxR = (b.x + b.w + r) - s.x;
    var pyT = (b.y - r) - s.y, pyB = (b.y + b.h + r) - s.y;
    var px = (Math.abs(pxL) < Math.abs(pxR)) ? pxL : pxR;
    var py = (Math.abs(pyT) < Math.abs(pyB)) ? pyT : pyB;
    if (s.hook) swingRelease(s);
    if (Math.abs(px) < Math.abs(py)){ s.x += px; s.vx = -s.vx * 0.3; }
    else { s.y += py; s.vy = -s.vy * 0.3; }
  }
  for (i = 0; i < (st.spikes || []).length; i++){
    var k = st.spikes[i];
    if (s.x + r > k.x && s.x - r < k.x + k.w && s.y + r > k.y && s.y - r < k.y + k.h){ s.dead = true; s.msg = 'とげに あたった！'; }
  }
  for (i = 0; i < (st.springs || []).length; i++){
    var sp2 = st.springs[i];
    if (s.vy > 0 && s.x + r > sp2.x && s.x - r < sp2.x + sp2.w && s.y + r > sp2.y && s.y - r < sp2.y + 16){
      if (s.hook) swingRelease(s);
      s.y = sp2.y - r - 1; s.vy = -400 * B.spring; s.fx = 8;
    }
  }
}
/* 1こま すすめる。**画面が なくても 動く**（verify.mjs が お手本を 再生して たしかめる） */
function swingStep(st, s, dt){
  if (s.dead || s.clear || !s.started) return;      /* おす まで うごかない */
  var B = SWW[s.w];
  s.t += dt;
  if (s.fx > 0) s.fx--;
  if (s.hook){
    var h = s.hook, hk = st.hooks[h.i];
    h.om += (-(SWG / h.L) * Math.sin(h.th) - SW_DAMP * h.om) * dt;   /* θ'' = -(g/L)sinθ */
    h.th += h.om * dt;
    s.x = hk.x + h.L * Math.sin(h.th);
    s.y = hk.y + h.L * Math.cos(h.th);
    s.vx = h.om * h.L * Math.cos(h.th);
    s.vy = -h.om * h.L * Math.sin(h.th);
    swingHit(st, s);
    if (s.hook && swSolid(st, s, s.x, s.y)){    /* ぶら下がった まま かべに 入りこまない */
      h.th -= h.om * dt; h.om *= -0.2;
      s.x = hk.x + h.L * Math.sin(h.th); s.y = hk.y + h.L * Math.cos(h.th);
    }
  } else {
    s.vy += SWG * dt;
    (st.winds || []).forEach(function(w){
      if (s.x > w.x && s.x < w.x + w.w && s.y > w.y && s.y < w.y + w.h)
        s.vx += w.a * (50 / B.g) * dt;         /* 同じ 力でも かるい ほど 大きく 流される */
    });
    var ox = s.x, oy = s.y;
    s.x += s.vx * dt; s.y += s.vy * dt;
    swingHit(st, s);
    /* まだ かべに めり込んで いたら 元の ばしょへ もどす（すきまを むりやり すりぬけない） */
    if (swSolid(st, s, s.x, s.y)){ s.x = ox; s.y = oy; s.vx *= -0.2; s.vy *= -0.2; }
  }
  var gx = st.goal.x - s.x, gy = st.goal.y - s.y;
  if (Math.sqrt(gx * gx + gy * gy) < st.goal.r + s.r) s.clear = true;
  if (s.y > SW_H + 30){ s.dead = true; s.msg = '下に おちた！'; }
  if (s.x < -30 || s.x > SW_W + 30){ s.dead = true; s.msg = 'そとに 出て しまった！'; }
}
/* お手本（ex）を さいごまで 走らせる。画面なしでも 同じ けっかに なる（時間きざみが 一定）。
   ex は [びょう, 'g'（つかむ）／'r'（はなす）／'b:heavy' など] の ならび。 */
function swingRun(st, script, maxT){
  var s = swingInit(st), k = 0, lim = Math.round((maxT || 20) / SW_DT);
  for (var n = 0; n < lim; n++){
    while (k < script.length && script[k][0] <= s.t + 1e-9){
      var a = script[k][1];
      if (a === 'g') swingGrab(st, s);
      else if (a === 'r') swingRelease(s);
      else if (a.indexOf('w:') === 0) swingSetW(st, s, +a.slice(2));
      else if (a.indexOf('r:') === 0) swingSetR(st, s, +a.slice(2));
      else if (a.indexOf('L:') === 0) swingSetL(st, s, a.slice(2));
      k++;
    }
    swingStep(st, s, SW_DT);
    if (s.clear || s.dead) break;
  }
  return s;
}

function swingStop(){ if (cur.swRaf){ cancelAnimationFrame(cur.swRaf); cur.swRaf = null; } }
function loadSwing(st){
  swingStop();
  /* **えらんだ おもさ・大きさは その もんだいの あいだ ずっと おぼえて おく。**
     しっぱいの たびに もどると えらび直しが めんどう、という 指てきで こうした。
     べつの もんだいに うつったら もとに もどす。 */
  var key = cur.gameId + ':' + cur.si;
  if (cur.swKeepFor !== key){ cur.swKeep = null; cur.swKeepFor = key; }
  cur.sw = swingInit(st, cur.swKeep);
  cur.swDemo = null; cur.swAcc = 0; cur.swLast = 0; cur.swTries = 0;
  cur.swPickHtml = null;
  swingLoop();
}
function swingLoop(){
  swingStop();
  cur.swLast = 0; cur.swAcc = 0;
  var step = function(ts){
    if (cur.kind !== 'swing'){ cur.swRaf = null; return; }
    if (!cur.swLast) cur.swLast = ts;
    var d = Math.min(0.05, (ts - cur.swLast) / 1000);
    cur.swLast = ts; cur.swAcc += d;
    var s = cur.sw, st = curStage();
    while (cur.swAcc >= SW_DT){
      cur.swAcc -= SW_DT;
      if (cur.swDemo){
        while (cur.swDemo.k < cur.swDemo.list.length && cur.swDemo.list[cur.swDemo.k][0] <= s.t + 1e-9){
          var a = cur.swDemo.list[cur.swDemo.k][1];
          if (a === 'g') swingGrab(st, s);
          else if (a === 'r') swingRelease(s);
          else if (a.indexOf('w:') === 0) swingSetW(st, s, +a.slice(2));
          else if (a.indexOf('r:') === 0) swingSetR(st, s, +a.slice(2));
          else if (a.indexOf('L:') === 0) swingSetL(st, s, a.slice(2));
          cur.swDemo.k++;
        }
      }
      swingStep(st, s, SW_DT);
      if (s.dead || s.clear) break;
    }
    renderSwing();
    if (s.clear){ cur.swRaf = null; tryClear(true); return; }
    if (s.dead){
      cur.swRaf = null;
      setTimeout(function(){
        if (cur.kind !== 'swing' || cur.done) return;
        cur.swTries++; cur.sw = swingInit(curStage(), cur.swKeep); cur.swDemo = null; swingLoop();
      }, 850);
      return;
    }
    cur.swRaf = requestAnimationFrame(step);
  };
  cur.swRaf = requestAnimationFrame(step);
}
function swingDemo(){
  var st = curStage();
  if (!st.ex) return;
  cur.noStar = true;                      /* お手本を 見たら パーフェクトは つかない */
  cur.sw = swingInit(st);                 /* お手本は かならず もんだいの さいしょの おもさから */
  cur.swDemo = { list:st.ex, k:0 };
  swingLoop();
}

function renderSwing(){

  });

           '" rx="4" fill="#D99A5B" stroke="#8A5B22" stroke-width="3"/>';
      g += '<path d="M' + (b.x + b.w * .3) + ' ' + b.y + ' l' + (b.w * .18) + ' ' + (b.h * .4) +
           ' l' + (-b.w * .12) + ' ' + (b.h * .3) + ' l' + (b.w * .2) + ' ' + (b.h * .3) +
           '" fill="none" stroke="#7A4A18" stroke-width="2.5" stroke-linejoin="round"/>';
      g += '<text x="' + (b.x + b.w / 2) + '" y="' + (b.y + b.h / 2 + 4) +

    } else {

           '" rx="5" fill="#9AA6B0" stroke="#5D6874" stroke-width="3"/>';
    }
  });
  (st.movers || []).forEach(function(mv){
    var my = swMoverY(mv, s.t);
    g += '<rect x="' + (mv.x - 3) + '" y="' + (mv.y - (mv.ay || 0) - 4) + '" width="' + (mv.w + 6) +
         '" height="' + (mv.h + (mv.ay || 0) * 2 + 8) + '" rx="8" fill="#E7EDF2"/>';
    g += '<rect x="' + mv.x + '" y="' + my.toFixed(1) + '" width="' + mv.w + '" height="' + mv.h +
         '" rx="6" fill="#8B7BE8" stroke="#4E3FA8" stroke-width="3"/>';
    g += '<text x="' + (mv.x + mv.w / 2) + '" y="' + (my + mv.h / 2 + 5).toFixed(1) +
         '" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">↕</text>';
  });
  (st.springs || []).forEach(function(k){
    g += '<rect x="' + k.x + '" y="' + (k.y + 8) + '" width="' + k.w + '" height="10" rx="5" fill="#7E6B54"/>';
    g += '<path d="M' + (k.x + 6) + ' ' + (k.y + 8) + ' q' + (k.w / 4) + ' -14 ' + (k.w / 2) + ' 0 q' +
         (k.w / 4) + ' 14 ' + (k.w / 2 - 6) + ' 0" fill="none" stroke="#2E9A4C" stroke-width="5" stroke-linecap="round"/>';
    g += '<text x="' + (k.x + k.w / 2) + '" y="' + (k.y - 6) + '" font-size="11" font-weight="900" fill="#2E9A4C" text-anchor="middle">ばね</text>';
  });
  (st.spikes || []).forEach(function(k){
    var n = Math.max(1, Math.round(k.w / 14)), d = k.w / n, sp = '';
    for (var i = 0; i < n; i++) sp += 'M' + (k.x + i * d) + ' ' + (k.y + k.h) + ' L' + (k.x + i * d + d / 2) + ' ' + k.y + ' L' + (k.x + (i + 1) * d) + ' ' + (k.y + k.h) + ' ';
    g += '<path d="' + sp + '" fill="#E05A4A" stroke="#9A2D20" stroke-width="2" stroke-linejoin="round"/>';
  });
  /* ゴール */
  g += '<circle cx="' + st.goal.x + '" cy="' + st.goal.y + '" r="' + (st.goal.r + 6) + '" fill="#2E9A4C" opacity=".18"/>';
  g += '<circle cx="' + st.goal.x + '" cy="' + st.goal.y + '" r="' + st.goal.r + '" fill="#CBEFD4" stroke="#2E9A4C" stroke-width="3"/>';
  g += '<text x="' + st.goal.x + '" y="' + (st.goal.y + 8) + '" font-size="22" text-anchor="middle">🏁</text>';
  /* フック（とどく ものは 目立たせる） */
  /* フックは 大きく（2026-08-29 「紐を つける ところが 小さい」の 指てき）。
     verify.mjs が この 大きさで とげ／かべに かさなって いないかを 見はって いる。 */
  var near = s.hook ? s.hook.i : swingNearHook(st, s);
  st.hooks.forEach(function(h, i){
    var on = (i === near);
    if (on) g += '<circle cx="' + h.x + '" cy="' + h.y + '" r="26" fill="#F5B324" opacity=".28"/>';
    g += '<circle cx="' + h.x + '" cy="' + h.y + '" r="' + SW_HOOK + '" fill="' + (on ? '#F5B324' : '#CBD6DE') +
         '" stroke="#5A7C93" stroke-width="4"/>';
    g += '<circle cx="' + h.x + '" cy="' + h.y + '" r="' + (SW_HOOK - 7) + '" fill="none" stroke="' +
         (on ? '#9A6B00' : '#8FA3B8') + '" stroke-width="3"/>';
  });
  /* ひも と ボール */
  if (s.hook){
    var hk = st.hooks[s.hook.i];
    g += '<line x1="' + hk.x + '" y1="' + hk.y + '" x2="' + s.x.toFixed(1) + '" y2="' + s.y.toFixed(1) +
         '" stroke="#5A7C93" stroke-width="4"/>';
  } else if (near >= 0 && !s.dead && !s.clear){
    g += '<line x1="' + st.hooks[near].x + '" y1="' + st.hooks[near].y + '" x2="' + s.x.toFixed(1) + '" y2="' + s.y.toFixed(1) +
         '" stroke="#F5B324" stroke-width="3" stroke-dasharray="5 6" opacity=".8"/>';
  }
  if (s.fx > 0) g += '<circle cx="' + s.x.toFixed(1) + '" cy="' + s.y.toFixed(1) + '" r="' + (s.r + s.fx * 2) + '" fill="#FFD54F" opacity="' + (s.fx / 20).toFixed(2) + '"/>';
  g += '<circle cx="' + s.x.toFixed(1) + '" cy="' + s.y.toFixed(1) + '" r="' + s.r +
       '" fill="' + B.col + '" stroke="' + B.dark + '" stroke-width="3"/>';
  if (s.r >= 11) g += '<text x="' + s.x.toFixed(1) + '" y="' + (s.y + 4).toFixed(1) +
       '" font-size="' + (s.r >= 15 ? 11 : 9) + '" font-weight="900" fill="#fff" text-anchor="middle">' + s.w + 'g</text>';
  if (s.dead) g += '<g transform="translate(300,' + (SW_H / 2) + ')"><rect x="-118" y="-24" width="236" height="46" rx="22" fill="#E05A4A"/>' +
    '<text x="0" y="8" font-size="19" font-weight="900" fill="#fff" text-anchor="middle">' + (s.msg || 'ざんねん') + '</text></g>';
  /* えらびボタン：うえの れつ＝おもさ、したの れつ＝大きさ。
     どちらも **ぶら下がって いる あいだだけ** かえられる。 */
  /* えらびボタンは **SVGでは なく ほんものの HTMLボタン**に した（2026-08-29）。
     SVGの とうめいな あたり判定は ブラウザに よって きかない ことが あり、
     じっさいに Safari で「100gを おしても かわらない」が 起きた。
     HTMLの <button> なら どの ブラウザでも かならず 押せる。 */
  var can = swingCanSet(s) && !s.dead && !s.clear;
  var ph = '';
  if (!s.started && !s.dead) ph += '<div class="sw-note">まず ここで えらぼう（あとから ぶら下がって いる ときも かえられるよ）</div>';
  ph += '<div class="sw-box' + (!s.started && !s.dead ? ' first' : '') + '">';
  function row(items, label, sel, key, draw){
    ph += '<div class="sw-row"><div class="sw-lab">' + label + '</div>';
    items.forEach(function(v){
      var on = (sel === v), d = draw(v);
      ph += '<button class="sw-b' + (on ? ' on' : '') + '" data-' + key + '="' + v + '"' +
            (can || on ? '' : ' disabled') +
            ' style="' + (on ? 'background:' + d.col + ';border-color:' + d.dark + ';' : '') + '">' +
            '<span class="dot" style="width:' + (d.r * 2) + 'px;height:' + (d.r * 2) + 'px;background:' +
            (on ? '#fff' : d.col) + '"></span>' + d.t + '</button>';
    });
    ph += '</div>';
  }
  row(swW(st), 'おもさ', s.w, 'sww', function(v){
    return { col:SWW[v].col, dark:SWW[v].dark, r:8, t:v + 'g' };
  });
  row(swR(st), '大きさ', s.r, 'swr', function(v){
    return { col:'#7E8FA0', dark:'#4A5A6A', r:Math.max(5, Math.round(v * 0.55)), t:SWR[v] };
  });
  row(swL(st), 'ひも', s.lk, 'swl', function(v){
    return { col:'#5FA98C', dark:'#2F6E56', r:7, t:SWL[v] };
  });
  ph += '</div>';
  /* **中みが かわった ときだけ** 作りなおす。
     アニメは 1びょうに 60回 えを かきなおすので、毎回 ボタンを 作りなおすと
     ゆびを はなす まえに ボタンが 入れかわり、**click が 一度も 成立しない**
     （2026-08-29 「100gを おしても かわらない」の 正体は これ）。 */
  var pk = document.getElementById('sw-pick');
  if (pk.className !== 'sw-pick on') pk.className = 'sw-pick on';
  if (cur.swPickHtml !== ph){ pk.innerHTML = ph; cur.swPickHtml = ph; }
  /* 上の あんない帯（ばんめんの そとに 出すので、ばねや かべに かさならない） */
  var top = '';
  if (!s.started && !s.dead && !s.clear){
    top = '<g transform="translate(300,24)"><rect x="-232" y="-20" width="464" height="40" rx="20" fill="#2E9A4C"/>' +

  } else if (cur.swDemo){
    top = '<g transform="translate(300,24)"><rect x="-140" y="-20" width="280" height="40" rx="20" fill="#1B7FA8"/>' +
          '<text x="0" y="7" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">お手本を さいせい中</text></g>';
  }
  document.getElementById('board').innerHTML = top + '<g transform="translate(0,44)">' + g + '</g>';

  if (cur.swDemo) msg = 'お手本を 見て いるよ';
  else if (!s.started) msg = 'まず おもさ・大きさ・ひもを えらぼう' +

  else if (s.hook) msg = 'ぶら下がり中（ひもの 長さ ' + Math.round(s.hook.L) +
    '）。いま おもさ・大きさ・ひもを かえられるよ。もう一度 タップ すると はなれて 飛ぶ！';
  else if (near >= 0) msg = 'いま タップ すると きいろい フックに つかまるよ';

  setStatus(msg, false);
}
/* そうさは **かんぜんな タップ式**（2026-08-29 ユーザーの 指てきで こうした）。
     1回目の タップ … ふりこが うごきだす（ついたまま）
     つぎの タップ  … ロープが はなれて 飛ぶ
     そのつぎ       … また 近くの フックに つかまる
   **ゆびを はなしても 切れない。**まえは「300ms いじょう おして はなすと 飛ぶ」も 生かして
   いたが、ばんめんを ちょっと 長めに おしただけで 糸が 切れて しまい、
   ぶら下がった まま おもさを かえる ことが できなかった。 */
function tapSwing(){}   /* えらびボタンは ばんめんの そと（HTML）なので、ここでは 何も しない */
function downSwing(e){
  if (cur.swDemo) return;

  if (s.dead || s.clear) return;
  if (!s.started){ s.started = true; renderBoard(); return; }
  if (s.hook) swingRelease(s);                 /* ついて いる → はなれて 飛ぶ */
  else swingGrab(curStage(), s);               /* とんで いる → 近くの フックに つかまる */

document.getElementById('sw-pick').addEventListener('click', function(e){
  var el = e.target;
  while (el && el !== this && !(el.getAttribute && (el.getAttribute('data-sww') || el.getAttribute('data-swr') || el.getAttribute('data-swl')))) el = el.parentNode;
  if (!el || el === this) return;
  if (cur.kind !== 'swing' || cur.swDemo || cur.done) return;
  var w = el.getAttribute('data-sww'), r = el.getAttribute('data-swr');
  var lk = el.getAttribute('data-swl');
  if (w) swingSetW(curStage(), cur.sw, +w);
  else if (r) swingSetR(curStage(), cur.sw, +r);
  else if (lk) swingSetL(curStage(), cur.sw, lk);
  cur.swKeep = { w:cur.sw.w, r:cur.sw.r, lk:cur.sw.lk };   /* しっぱいしても この えらびを のこす */

function cardSVG(g, gold){
  var base = gold ? '#F5B324' : '#8FBFD8';
  var bg   = gold ? '#FFF6DE' : '#EFF7FB';
  return '<svg class="card-get" viewBox="0 0 150 200">' +
    '<rect x="4" y="4" width="142" height="192" rx="16" fill="' + bg + '" stroke="' + base + '" stroke-width="5"/>' +
    '<rect x="14" y="14" width="122" height="120" rx="10" fill="#fff" stroke="' + base + '" stroke-width="2"/>' +
    '<text x="75" y="96" font-size="62" text-anchor="middle">' + g.icon + '</text>' +
    '<text x="75" y="158" font-size="15" font-weight="900" fill="#0F3350" text-anchor="middle">' + g.card + '</text>' +
    '<text x="75" y="180" font-size="12" font-weight="900" fill="' + (gold ? '#8A5B00' : '#4A6C85') +
    '" text-anchor="middle">' + (gold ? '★ きんカード ★' : 'かがくカード') + '</text>' +
    '</svg>';
}

function onClear(){
  var g = gameById(cur.gameId), st = g.stages[cur.si], key = stageKey(g.id, cur.si);
  var old = save.stages[key];
  var perfect = (cur.hint || cur.noStar) ? 0 : 1;   /* ヒントを 見た／ミッションの 目標を こえた */
  if (old && old.p) perfect = 1;                    /* 一度とった パーフェクトは 下げない（§6 単調増加） */
  save.stages[key] = { c:1, p:perfect };
  var justFinished = gameDone(g.id) && !save.cards[g.id];
  if (gameDone(g.id)) save.cards[g.id] = gameGold(g.id) ? 2 : 1;
  store();
  renderStrip();

  document.getElementById('modal-jhs').innerHTML =
    g.jhs ? '<div class="jhs-note">🎓 中学でも つかうよ</div>' : '';
  document.getElementById('modal-title').textContent = perfect ? 'パーフェクト！' : 'クリア！';
  document.getElementById('modal-card').innerHTML = justFinished ? cardSVG(g, gameGold(g.id)) : '';
  document.getElementById('modal-learn').innerHTML =
    (justFinished ? '<b>「' + g.card + '」カード</b>を てにいれた！<br>' : '') + st.learn;
  var last = (cur.si >= g.stages.length - 1);
  /* ゲームが 1つだけの アプリには もどる 島が ない ので「とじる」に する */
  document.getElementById('modal-next').textContent =
    last ? (HOME_GAME ? 'とじる ▼' : '島に もどる ▶') : 'つぎへ ▶';
  openClearModal();
  confettiBurst(perfect ? 120 : 70);
}
/* まどを 出すだけ（中みは もう 作って ある）。見なおしから もどる ときも ここを 通る ので、
   コンフェッティや セーブを やりなおさない。 */
function openClearModal(){ document.getElementById('modal').className = 'modal on'; }

/* つぎの もんだいへ。まどの「つぎへ」と、見なおしの おびの「つぎへ」が どちらも ここへ。 */
function goNextStage(){
  closeModal(); hideClearBar();
  var g = gameById(cur.gameId);
  if (cur.si >= g.stages.length - 1){
    if (HOME_GAME){ renderStrip(); return; }   /* 1ゲームの アプリ：もんだい えらびに もどるだけ */
    openIsland(g.island); return;
  }
  cur.si++; cur.hint = false; loadStage();
}
document.getElementById('modal-again').onclick = function(){ closeModal(); loadStage(); };

/* じぶんで かく コンフェッティ（外部ライブラリは つかわない） */
function confettiBurst(n){
  var cv = document.getElementById('confetti');
  var ctx = cv.getContext('2d');
  var W = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
  cv.style.display = 'block';
  var cols = ['#F5B324','#4FC46A','#3EA7D8','#E8618C','#8B7BE8','#FF8A5B'];
  var ps = [];
  for (var i=0;i<n;i++){
    ps.push({ x:W/2 + (Math.random()-.5)*W*.5, y:H*.42,
      vx:(Math.random()-.5)*13, vy:-8 - Math.random()*11,
      w:6 + Math.random()*8, h:8 + Math.random()*10,
      r:Math.random()*6.28, vr:(Math.random()-.5)*.32,
      c:cols[(Math.random()*cols.length)|0], life:0 });
  }
  setTimeout(function(){ ctx.clearRect(0,0,W,H); cv.style.display = 'none'; }, 6500);  /* rAFが とまっても のこらないように */
  var t0 = 0;
  function tick(){
    ctx.clearRect(0,0,W,H);
    var alive = 0;
    ps.forEach(function(p){
      p.vy += .42; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      if (p.y < H + 40){ alive++;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
      }
    });
    t0++;
    if (alive && t0 < 260) requestAnimationFrame(tick);
    else { ctx.clearRect(0,0,W,H); cv.style.display = 'none'; }
  }
  requestAnimationFrame(tick);
}

/* ------------------------------------------------------------------ *
 * 8. がめん：ホーム（地図）と 島
 * ------------------------------------------------------------------ */
function islandArt(isl, state){
  var s = '<svg class="isl-art" viewBox="0 0 200 156">' +
    '<ellipse cx="100" cy="132" rx="84" ry="16" fill="rgba(4,50,72,.28)"/>' +
    '<path d="M12 122 Q24 92 58 86 Q78 50 112 56 Q152 60 166 96 Q188 102 188 122 Z" fill="' + isl.sand + '"/>' +
    '<path d="M40 100 Q70 58 106 62 Q146 66 160 100 Z" fill="' + isl.color + '"/>' +
    '<text x="100" y="102" font-size="46" text-anchor="middle">' + (state === 'lock' ? '🔒' : isl.emoji) + '</text>';
  if (state === 'done') s += '<text x="158" y="112" font-size="30" text-anchor="middle">🏁</text>';
  return s + '</svg>';
}
function renderHome(){
  /* 島が 1つだけの アプリには 海の 地図が ない（ビルドが とりのぞく）。
     その ときは 何も しない。 */
  if (!document.getElementById('map-inner')) return;
  var open = methodOpen(), h = '', total = 0, got = 0;
  GAMES.forEach(function(g){
    if (g.soon || !g.stages) return;
    total += g.stages.length;
    got += clearedCount(g.id);
  });
  ISLANDS.forEach(function(isl){
    var lock = isl.needAll && !open;
    var list = playableOf(isl.id);
    var state = lock ? 'lock' : (list.length && islandDone(isl.id) ? 'done' : 'go');
    var n = 0, all = 0;
    list.forEach(function(g){ all += g.stages.length; n += clearedCount(g.id); });
    var label = lock ? '4つの島 クリアで ひらく'
              : (all ? n + ' / ' + all + ' もん' : 'じゅんびちゅう');
    h += '<button class="island' + (lock ? ' locked' : '') + '" style="--x:' + isl.mx + '%; --y:' + isl.my +
         '%; --nx:' + isl.nx + '%; --ny:' + isl.ny + '%" data-isl="' + isl.id + '">' + islandArt(isl, state) +
         '<span class="isl-name">' + isl.emoji + ' ' + isl.name + '</span>' +
         '<span class="isl-count">' + label + '</span></button>';
  });
  document.getElementById('map-inner').innerHTML = h;
  document.getElementById('home-prog').style.width = (total ? (got / total * 100) : 0) + '%';
  document.getElementById('home-note').textContent = 'クリアした もんだい　' + got + ' / ' + total;
}
if (document.getElementById('map-inner')) document.getElementById('map-inner').addEventListener('click', function(e){
  var id = attrUp(e.target, 'data-isl');
  if (!id) return;
  var isl = islandById(id);
  if (isl.needAll && !methodOpen()){
    alert('🔬 かんがえかたの島は、ほかの 4つの島を ぜんぶ クリアすると ひらくよ！');
    return;
  }
  openIsland(id);
});

function openIsland(id){
  /* ゲームが 1つだけの アプリ（でんき回路 など）には 島の がめんが ない。
     「島に もどる」で 行ける ところが ない ので、ゲームの がめんに とどまる。
     こうしないと まっ白な がめんに おちる（クリア後・リサイクル工場・ふりこ が
     openIsland を よぶ）。 */
  if (HOME_GAME){ go('game'); return; }
  /* 島が 1つだけの アプリには 島の がめんが 1まいしか ない（地図を とりのぞいて いる）。
     🔬かんがえかたの島の ゲームも その 1まいの 下に ならべて いる ので、
     どこから よばれても じぶんの 島の がめんを 出す。
     こうしないと 🔬の ゲームを おえた とき「🔬かんがえかたの島」だけの がめんに
     おりてしまい、もどるボタンが ない ので **そこから 出られなく なる**。 */
  if (HOME_ISLAND) id = HOME_ISLAND;
  var isl = islandById(id);
  document.getElementById('isl-bar-title').textContent = isl.emoji + ' ' + isl.name;
  var hero = document.getElementById('isl-hero');
  hero.style.background = 'linear-gradient(180deg,' + isl.color + ' 0%, ' + isl.color + 'CC 100%)';
  hero.innerHTML = '<div class="emoji">' + isl.emoji + '</div><h2>' + isl.name + '</h2><p>' + isl.desc + '</p>';
  var h = '';
  gamesOf(id).forEach(function(g){
    var n = g.stages ? clearedCount(g.id) : 0;
    var all = g.stages ? g.stages.length : 0;
    var pct = all ? (n / all * 100) : 0;
    var card = save.cards[g.id];
    h += '<button class="game-card' + (g.soon ? ' soon' : '') + '" data-g="' + g.id + '">' +
      '<span class="gc-ico" style="background:' + isl.color + '22">' + g.icon + '</span>' +
      '<span class="gc-body">' +
        '<span class="gc-name">' + g.name +
          (card ? (card === 2 ? ' <span class="tag jhs">★きんカード</span>' : ' <span class="tag grade">カード</span>') : '') +
          '<span class="tag grade">' + g.grade + '</span>' +
          (g.jhs ? '<span class="tag jhs">🎓中学でも</span>' : '') +
          (g.soon ? '<span class="tag soon">じゅんびちゅう</span>' : '') +
        '</span>' +
        '<span class="gc-sub">' + g.sub + (all ? '　' + n + '/' + all : '') + '</span>' +
        (all ? '<span class="gc-meter"><i style="width:' + pct + '%"></i></span>' : '') +
      '</span></button>';
  });
  /* 地図の ない アプリ（島が 1つだけ）では、🔬かんがえかたの島の 行き場が なくなる。
     じぶんの 島の ゲームの 下に つづけて 出す。ひらく までは 「あと なに が いるか」を 見せる。 */
  if (HOME_ISLAND && id === HOME_ISLAND) h += methodSection();
  document.getElementById('game-list').innerHTML = h;
  go('island');
}
/* まだ クリアして いない いちばん さいしょの もんだいの ばんごう */
function firstTodo(g){
  var si = 0;
  for (var i=0;i<g.stages.length;i++){ if (!stageRec(g.id, i)){ si = i; break; } si = i; }
  return si;
}
/* ゲームが 1つだけの アプリには この 一覧が ない（ビルドが がめんごと とりのぞく）。 */
if (document.getElementById('game-list')) document.getElementById('game-list').addEventListener('click', function(e){
  var id = attrUp(e.target, 'data-g');
  if (!id) return;
  var g = gameById(id);
  if (g.soon){ alert('この ミニゲームは じゅんびちゅう。もうすこし まってね！'); return; }
  startGame(id, firstTodo(g));
});

/* 🔬かんがえかたの島の ぶぶん（地図の ない アプリだけで つかう）。
   ひらいて いれば ゲームを ならべ、まだなら 何を すれば ひらくかを 出す。 */
function methodSection(){
  var isl = islandById('method');
  if (!isl) return '';
  if (!methodOpen()){
    return '<div class="method-lock">' +
      '<span class="ml-ico">🔒</span>' +
      '<b>' + isl.emoji + ' ' + isl.name + '</b>' +
      '<span>⚡🧪🌱🌏 <b>4つの島 ぜんぶ</b>を クリアすると ひらくよ。' +
      'ほかの島は 🏠アプリ集から いけるよ。</span></div>';
  }
  var h = '<div class="method-head">' + isl.emoji + ' ' + isl.name + '　<span>' + isl.desc + '</span></div>';
  gamesOf('method').forEach(function(g){
    var n = clearedCount(g.id), all = g.stages ? g.stages.length : 0;
    var card = save.cards[g.id];
    h += '<button class="game-card" data-g="' + g.id + '">' +
      '<span class="gc-ico" style="background:' + isl.color + '22">' + g.icon + '</span>' +
      '<span class="gc-body">' +
        '<span class="gc-name">' + g.name +
          (card ? (card === 2 ? ' <span class="tag jhs">★きんカード</span>' : ' <span class="tag grade">カードGET</span>') : '') +
          '<span class="tag grade">' + g.grade + '</span>' +
          (g.jhs ? '<span class="tag jhs">🎓中学でも</span>' : '') +
        '</span>' +
        '<span class="gc-sub">' + g.sub + (all ? '　' + n + '/' + all : '') + '</span>' +
        (all ? '<span class="gc-meter"><i style="width:' + (all ? (n / all * 100) : 0) + '%"></i></span>' : '') +
      '</span></button>';
  });
  return h;
}

/* ------------------------------------------------------------------ *
 * 9. がめんの きりかえ と きどう
 * ------------------------------------------------------------------ */
function go(name){
  /* ゲームの 画面から 出る ときは、うごいて いる アニメを とめる
     （とめないと 見えない ところで まわり つづけて バッテリーを 食う） */
  /* ゲームの がめんから 出たら 走って いる アニメを 止める。型（エンジン）に stop を
     書いて おくと ここで よばれる（書かなくても よい）。 */
  if (name !== 'game'){
    for (var _k in ENGINES) if (ENGINES[_k].stop) ENGINES[_k].stop();
    hideClearBar();                                  /* できた！の おびを のこさない */
  }
  ['home','island','game'].forEach(function(n){
    var el = document.getElementById('screen-' + n);   /* 地図の ない アプリでは home が ない */
    if (el) el.className = 'screen' + (n === name ? ' on' : '');
  });
  if (name === 'home') renderHome();
  window.scrollTo(0, 0);
}
load();
renderHome();
/* 島が 1つだけの アプリ（エネルギーの島 など）には 海の 地図が ない
   （ビルドが がめんごと とりのぞく）。島の 中（ミニゲームの 一覧）から はじめる。
   🔬かんがえかたの島は その 一覧の 下に つづけて 出る（91-home.js の methodSection）。 */
/* ゲームが 1つだけの アプリ（でんき回路 など）は、その ゲームを いきなり ひらく。
   ゲームえらびも ポータルが する ので、1つしか ない 一覧を 見せる いみが ない。
   つづきから はじまる（まだ クリアして いない さいしょの もんだい）。 */
if (HOME_GAME) startGame(HOME_GAME, firstTodo(gameById(HOME_GAME)));
else if (HOME_ISLAND) openIsland(HOME_ISLAND);
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
