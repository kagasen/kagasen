<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>語彙線 サウンドチェック</title>
  <style>
    body { margin: 0; padding: 24px; background: #152439; color: #f5f8ff; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 800px; margin: auto; }
    h1 { font-size: 1.5rem; }
    p { color: #bed0e8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    button { min-height: 56px; padding: 10px 14px; border: 2px solid #81b7df; border-radius: 13px; background: #244563; color: white; font: inherit; cursor: pointer; }
    button:active { background: #40759a; }
    label { display: block; margin: 20px 0; }
    input[type="range"] { width: min(300px, 70vw); vertical-align: middle; }
    h2 { margin-top: 28px; font-size: 1.15rem; }
  </style>
</head>
<body>
  <main>
    <h1>語彙線 サウンドチェック</h1>
    <p>最初のタップで音声を有効にします。BGMと効果音を重ねて試せます。</p>
    <label><input id="mute" type="checkbox"> 消音</label>
    <label>BGM音量 <input id="bgm-volume" type="range" min="0" max="1" step="0.01" value="1"></label>
    <h2>BGM</h2>
    <div class="grid" id="music"></div>
    <h2>効果音</h2>
    <div class="grid" id="sounds"></div>
  </main>
  <script src="sfx.js"></script>
  <script>
    (function () {
      'use strict';
      var sounds = [
        ['select', function () { GoiSFX.select(); }],
        ['tick(2)', function () { GoiSFX.tick(2); }],
        ['tick(6)', function () { GoiSFX.tick(6); }],
        ['tick(12)', function () { GoiSFX.tick(12); }],
        ['tick(2→12)', function () {
          for (var n = 2; n <= 12; n++) {
            (function (step) {
              window.setTimeout(function () { GoiSFX.tick(step); }, (step - 2) * 125);
            }(n));
          }
        }],
        ['word(1)', function () { GoiSFX.word(1); }],
        ['word(3)', function () { GoiSFX.word(3); }],
        ['hit', function () { GoiSFX.hit(); }],
        ['miss', function () { GoiSFX.miss(); }],
        ['ouch', function () { GoiSFX.ouch(); }],
        ['enemyDown', function () { GoiSFX.enemyDown(); }],
        ['chance', function () { GoiSFX.chance(); }],
        ['quizTick', function () { GoiSFX.quizTick(); }],
        ['correct', function () { GoiSFX.correct(); }],
        ['wrong', function () { GoiSFX.wrong(); }],
        ['superCharge', function () { GoiSFX.superCharge(); }],
        ['special(1)', function () { GoiSFX.special(1); }],
        ['special(2)', function () { GoiSFX.special(2); }],
        ['special(3)', function () { GoiSFX.special(3); }],
        ['jackpot', function () { GoiSFX.jackpot(); }],
        ['clear', function () { GoiSFX.clear(); }],
        ['gameover', function () { GoiSFX.gameover(); }],
        ['button', function () { GoiSFX.button(); }]
      ];
      var holder = document.getElementById('sounds');
      sounds.forEach(function (entry) {
        var button = document.createElement('button');
        button.type = 'button';
        button.textContent = entry[0];
        button.addEventListener('click', function () {
          GoiSFX.unlock();
          entry[1]();
        });
        holder.appendChild(button);
      });
      var music = document.getElementById('music');
      ['title', 'map', 'battle', 'boss', 'ending'].forEach(function (name) {
        var button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'bgm(' + name + ')';
        button.addEventListener('click', function () {
          GoiSFX.unlock();
          GoiSFX.bgm(name);
        });
        music.appendChild(button);
      });
      var stop = document.createElement('button');
      stop.type = 'button';
      stop.textContent = 'stopBgm';
      stop.addEventListener('click', function () { GoiSFX.stopBgm(); });
      music.appendChild(stop);
      document.getElementById('bgm-volume').addEventListener('input', function (event) {
        GoiSFX.setBgmVolume(event.target.value);
      });
      document.getElementById('mute').addEventListener('change', function (event) {
        GoiSFX.setMuted(event.target.checked);
      });
    }());
  </script>
</body>
</html>
