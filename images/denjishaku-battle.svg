<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img">
  <title>でんじしゃくバトル ― しりぞけ合う 力で はじき出せ</title>
  <defs>
    <linearGradient id="dj-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3B4"/><stop offset="1" stop-color="#F2A33C"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#dj-bg)"/>
  <path d="M0 214 q40 -14 80 0 t80 0 t80 0 t80 0 t80 0 V260 H0 Z" fill="#D98420" opacity=".45"/>
  <!-- ばん -->
  <rect x="40" y="88" width="320" height="112" rx="20" fill="#FFF6DE" stroke="#7A4A10" stroke-width="7"/>
  <!-- しりぞけ合う 力の なみ -->
  <g fill="none" stroke="#E08A16" stroke-width="6" stroke-linecap="round" opacity=".85">
    <path d="M196 112 a34 34 0 0 0 0 64"/><path d="M212 100 a52 52 0 0 0 0 88"/>
    <path d="M156 112 a34 34 0 0 1 0 64"/><path d="M140 100 a52 52 0 0 1 0 88"/>
  </g>
  <!-- ひだりの こま（N・あか） -->
  <g transform="translate(96,144)">
    <circle r="34" fill="#E24B4B" stroke="#7A4A10" stroke-width="7"/>
    <text y="10" font-size="30" font-weight="900" fill="#FFF6DE" text-anchor="middle" font-family="system-ui,sans-serif">N</text>
  </g>
  <!-- みぎの こま（S・あお） -->
  <g transform="translate(258,144)">
    <circle r="34" fill="#4A79D8" stroke="#7A4A10" stroke-width="7"/>
    <text y="10" font-size="30" font-weight="900" fill="#FFF6DE" text-anchor="middle" font-family="system-ui,sans-serif">S</text>
  </g>
  <!-- はじき飛ばされる こま -->
  <g transform="translate(330,110)">
    <circle r="20" fill="#4A79D8" stroke="#7A4A10" stroke-width="6" opacity=".9"/>
    <path d="M-34 16 l-16 10" stroke="#7A4A10" stroke-width="6" stroke-linecap="round" opacity=".6"/>
    <path d="M-30 -2 l-18 2" stroke="#7A4A10" stroke-width="6" stroke-linecap="round" opacity=".4"/>
  </g>
</svg>
