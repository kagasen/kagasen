<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img">
  <title>でんき回路 ― つないで あかりを つけよう</title>
  <!-- カードでは 上下が 切られる。主役は かならず y=78〜182 に おく。左上（★ボタン）も よける。 -->
  <defs>
    <linearGradient id="dk-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3B4"/><stop offset="1" stop-color="#F2A33C"/>
    </linearGradient>
    <radialGradient id="dk-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF6C8" stop-opacity=".95"/><stop offset="1" stop-color="#FFF6C8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="260" fill="url(#dk-bg)"/>
  <path d="M0 214 q40 -14 80 0 t80 0 t80 0 t80 0 t80 0 V260 H0 Z" fill="#D98420" opacity=".45"/>
  <circle cx="262" cy="126" r="86" fill="url(#dk-glow)"/>
  <!-- 回路の せん -->
  <g fill="none" stroke="#7A4A10" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 168 H262"/><path d="M120 168 V120"/><path d="M262 168 V150"/>
    <path d="M120 120 H176"/>
  </g>
  <!-- かん電池 -->
  <g>
    <rect x="86" y="150" width="86" height="38" rx="9" fill="#FFF6DE" stroke="#7A4A10" stroke-width="7"/>
    <rect x="172" y="160" width="14" height="18" rx="4" fill="#7A4A10"/>
    <path d="M104 160 v18 M120 160 v18" stroke="#F2A33C" stroke-width="7" stroke-linecap="round"/>
    <text x="146" y="176" font-size="19" font-weight="900" fill="#7A4A10" text-anchor="middle" font-family="system-ui,sans-serif">＋</text>
  </g>
  <!-- 豆電球（ひかって いる） -->
  <g>
    <path d="M262 78 a34 34 0 0 1 21 61 v10 h-42 v-10 a34 34 0 0 1 21 -61 Z" fill="#FFF6C8" stroke="#7A4A10" stroke-width="7" stroke-linejoin="round"/>
    <rect x="245" y="146" width="34" height="20" rx="6" fill="#D9BE8E" stroke="#7A4A10" stroke-width="6"/>
    <path d="M252 116 l10 -14 10 14" fill="none" stroke="#E08A16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#FFF6C8" stroke-width="7" stroke-linecap="round">
      <path d="M316 92 h22"/><path d="M306 66 l14 -16"/><path d="M262 52 v-20"/><path d="M208 92 h-22"/><path d="M218 66 l-14 -16"/>
    </g>
  </g>
  <!-- スイッチ -->
  <g>
    <circle cx="176" cy="120" r="8" fill="#7A4A10"/><circle cx="230" cy="120" r="8" fill="#7A4A10"/>
    <path d="M176 120 L226 96" stroke="#FFF6DE" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
