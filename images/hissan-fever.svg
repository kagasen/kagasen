<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img">
  <title>ひっさんフィーバー ― ひっさんを 1けたずつ とこう</title>
  <!-- カードでは 上下が 切られる。主役は かならず y=78〜182 に おく。左上（★ボタン）も よける。 -->
  <rect width="400" height="260" fill="#FFF1C2"/>
  <g opacity=".55">
    <path d="M200 130 L0 60 V0 H60 Z M200 130 L140 0 H230 Z M200 130 L320 0 H400 V40 Z M200 130 L400 150 V220 Z M200 130 L300 260 H200 Z M200 130 L80 260 H0 V210 Z" fill="#FFD3E3"/>
  </g>
  <g fill="#FF6FA5" stroke="#2B2340" stroke-width="2"><path d="M20 10 h20 l-10 16 z"/><path d="M60 10 h20 l-10 16 z" fill="#3E6BFF"/><path d="M340 10 h20 l-10 16 z" fill="#2FC79A"/><path d="M370 10 h20 l-10 16 z" fill="#9A7BFF"/></g>
  <!-- ひっさんの カード -->
  <rect x="34" y="66" width="182" height="128" rx="18" fill="#FFFDF8" stroke="#2B2340" stroke-width="6"/>
  <g font-family="system-ui,sans-serif" font-weight="800" fill="#2B2340" text-anchor="middle">
    <text x="176" y="86" font-size="16" fill="#3E6BFF">1</text>
    <text x="150" y="112" font-size="30">2</text><text x="180" y="112" font-size="30">7</text>
    <text x="92" y="146" font-size="30" fill="#3E6BFF">＋</text>
    <text x="150" y="146" font-size="30">3</text><text x="180" y="146" font-size="30">5</text>
    <text x="150" y="182" font-size="30" fill="#1D2B7A">6</text>
  </g>
  <rect x="80" y="154" width="116" height="5" rx="2" fill="#2B2340"/>
  <rect x="164" y="160" width="30" height="30" rx="7" fill="#DCE6FF" stroke="#7C95FF" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="179" y="184" font-family="system-ui,sans-serif" font-weight="900" font-size="22" fill="#7C95FF" text-anchor="middle">?</text>
  <!-- ぞうさん -->
  <g transform="translate(236 70) scale(1.05)" stroke="#2B2340" stroke-width="3.5">
    <path d="M38 92 l-14 -16" stroke="#FF6FA5" stroke-width="11" stroke-linecap="round"/><path d="M82 92 l14 -16" stroke="#FF6FA5" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="60" cy="98" rx="23" ry="13" fill="#FF6FA5"/>
    <circle cx="21" cy="44" r="20" fill="#FF6FA5"/><circle cx="99" cy="44" r="20" fill="#FF6FA5"/>
    <circle cx="21" cy="45" r="11" fill="#FFABCF" stroke="none"/><circle cx="99" cy="45" r="11" fill="#FFABCF" stroke="none"/>
    <ellipse cx="60" cy="54" rx="36" ry="33" fill="#FF6FA5"/>
    <path d="M41 50 q6 -8 12 0 M67 50 q6 -8 12 0" fill="none" stroke-linecap="round" stroke-width="4"/>
    <path d="M50 66 q10 12 20 0 z" fill="#2B2340" stroke="none"/>
  </g>
  <!-- 1兆！ -->
  <text x="300" y="104" font-family="system-ui,sans-serif" font-weight="900" font-size="40" fill="#FFC83D" stroke="#2B2340" stroke-width="6" paint-order="stroke" text-anchor="middle" transform="rotate(-8 300 104)">1兆!</text>
  <g fill="#FFC83D" stroke="#B7791F" stroke-width="2"><circle cx="232" cy="78" r="8"/><circle cx="372" cy="150" r="9"/><circle cx="228" cy="176" r="7"/></g>
</svg>
