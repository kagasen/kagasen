<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img">
  <title>ことばパズルバトル ― 玉を うごかして 部首の なかまを そろえよう</title>
  <!-- カードでは 上下が 切られる。主役は かならず y=78〜182 に おく。左上（★ボタン）も よける。 -->
  <defs>
    <radialGradient id="b" cx=".35" cy=".28"><stop offset="0" stop-color="#9AD4FF"/><stop offset=".7" stop-color="#1E6FD9"/></radialGradient>
    <radialGradient id="g" cx=".35" cy=".28"><stop offset="0" stop-color="#9BF0AE"/><stop offset=".7" stop-color="#18934D"/></radialGradient>
    <radialGradient id="r" cx=".35" cy=".28"><stop offset="0" stop-color="#FF9C8C"/><stop offset=".7" stop-color="#D62B3A"/></radialGradient>
    <radialGradient id="p" cx=".35" cy=".28"><stop offset="0" stop-color="#FFC2DE"/><stop offset=".7" stop-color="#E0428A"/></radialGradient>
  </defs>
  <rect width="400" height="260" fill="#2B1B6E"/>
  <rect x="40" y="70" width="320" height="120" rx="16" fill="#221755"/>
  <g font-family="'Hiragino Maru Gothic ProN',sans-serif" font-weight="900" font-size="30" text-anchor="middle" fill="#fff">
    <circle cx="80" cy="102" r="25" fill="url(#g)"/><text x="80" y="113">林</text>
    <circle cx="136" cy="102" r="25" fill="url(#p)"/><text x="136" y="113">心</text>
    <circle cx="80" cy="158" r="25" fill="url(#r)"/><text x="80" y="169">火</text>
    <circle cx="136" cy="158" r="25" fill="url(#g)"/><text x="136" y="169">村</text>
    <g opacity=".95">
      <circle cx="192" cy="130" r="27" fill="url(#b)" stroke="#fff" stroke-width="4"/><text x="192" y="141">海</text>
      <circle cx="248" cy="130" r="27" fill="url(#b)" stroke="#fff" stroke-width="4"/><text x="248" y="141">池</text>
      <circle cx="304" cy="130" r="27" fill="url(#b)" stroke="#fff" stroke-width="4"/><text x="304" y="141">波</text>
    </g>
    <circle cx="192" cy="186" r="25" fill="url(#r)"/><circle cx="248" cy="186" r="25" fill="url(#p)"/>
    <circle cx="248" cy="76" r="25" fill="url(#g)"/><circle cx="304" cy="76" r="25" fill="url(#r)"/>
  </g>
  <text x="330" y="96" text-anchor="middle" font-family="'Hiragino Maru Gothic ProN',sans-serif" font-weight="900" font-size="22" fill="#FFC93C" stroke="#7A3B00" stroke-width="1.2">3コンボ!</text>
  <text x="248" y="176" text-anchor="middle" font-family="'Hiragino Maru Gothic ProN',sans-serif" font-weight="900" font-size="15" fill="#fff">💧さんずいの なかま</text>
</svg>
