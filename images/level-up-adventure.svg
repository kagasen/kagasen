      <path d="M-17 -3 Q-18 -19 0 -20 Q18 -19 17 -3 Q9 -13 0 -11 Q-9 -13 -17 -3Z" fill="#6b4a2f"/>
      <path d="M-2 -20 Q2 -26 6 -22" stroke="#6b4a2f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
