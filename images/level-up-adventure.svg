    <text x="242" y="44" font-size="13" font-weight="800" text-anchor="end" fill="#4b3a2f">2 / 2</text>
    <rect x="24" y="52" width="218" height="9" rx="4.5" fill="url(#lv-prog)"/>
    <rect x="24" y="68" width="218" height="16" rx="8" fill="#fdeeC9"/>
