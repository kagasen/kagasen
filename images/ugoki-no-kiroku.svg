<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif">
  <defs>
    <linearGradient id="ug-t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d94ff"/><stop offset="1" stop-color="#1d6ae5"/></linearGradient>
    <linearGradient id="ug-t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#ea6a12"/></linearGradient>
    <linearGradient id="ug-t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="ug-t4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#e0359a"/></linearGradient>
    <linearGradient id="ug-t5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0899b3"/></linearGradient>
    <linearGradient id="ug-t6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  </defs>
  <rect width="400" height="260" fill="#eef6ff"/>
  <!-- なわとび -->
  <g>
    <rect x="12" y="26" width="118" height="100" rx="16" fill="url(#ug-t1)"/>
    <text x="71" y="62" font-size="26" text-anchor="middle">🪢</text>
    <text x="71" y="90" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">なわとび</text>
    <text x="71" y="110" font-size="10" font-weight="700" text-anchor="middle" fill="#e3f0ff">わざ19こ＋30びょう</text>
  </g>
  <!-- てつぼう -->
  <g>
    <rect x="141" y="26" width="118" height="100" rx="16" fill="url(#ug-t2)"/>
    <text x="200" y="62" font-size="26" text-anchor="middle">🤾</text>
    <text x="200" y="90" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">てつぼう</text>
    <text x="200" y="110" font-size="10" font-weight="700" text-anchor="middle" fill="#ffedd9">けんてい20わざ</text>
  </g>
  <!-- マットうんどう -->
  <g>
    <rect x="270" y="26" width="118" height="100" rx="16" fill="url(#ug-t3)"/>
    <text x="329" y="62" font-size="26" text-anchor="middle">🤸</text>
    <text x="329" y="90" font-size="15" font-weight="800" text-anchor="middle" fill="#ffffff">マットうんどう</text>
    <text x="329" y="110" font-size="10" font-weight="700" text-anchor="middle" fill="#dcfce7">わざ10こ</text>
  </g>
  <!-- とびばこ -->
  <g>
    <rect x="12" y="134" width="118" height="100" rx="16" fill="url(#ug-t4)"/>
    <text x="71" y="170" font-size="26" text-anchor="middle">🦘</text>
    <text x="71" y="198" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">とびばこ</text>
    <text x="71" y="218" font-size="10" font-weight="700" text-anchor="middle" fill="#ffe0f1">わざ×なんだん？</text>
  </g>
  <!-- すいえい -->
  <g>
    <rect x="141" y="134" width="118" height="100" rx="16" fill="url(#ug-t5)"/>
    <text x="200" y="170" font-size="26" text-anchor="middle">🏊</text>
    <text x="200" y="198" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">すいえい</text>
    <text x="200" y="218" font-size="10" font-weight="700" text-anchor="middle" fill="#d6f7fc">けんてい22だんかい</text>
  </g>
  <!-- マラソン -->
  <g>
    <rect x="270" y="134" width="118" height="100" rx="16" fill="url(#ug-t6)"/>
    <text x="329" y="170" font-size="26" text-anchor="middle">🏃</text>
    <text x="329" y="198" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">マラソン</text>
    <text x="329" y="218" font-size="10" font-weight="700" text-anchor="middle" fill="#ede4ff">きょり・タイム</text>
  </g>
</svg>
