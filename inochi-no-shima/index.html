  /* 山（上流がわ）と 海（下流がわ） */
  s += '<path d="M26 114 L82 74 L138 114 Z" fill="#BFD9C4" stroke="#8FB89A" stroke-width="2"/>';
  s += '<text x="82" y="107" font-size="11" font-weight="900" fill="#4A6C58" text-anchor="middle">山</text>';
  s += '<path d="M580 420 L462 420 Q512 376 580 368 Z" fill="#BEDCEE" stroke="#7FB6D6" stroke-width="2"/>';
  s += '<text x="536" y="408" font-size="12" font-weight="900" fill="#3B5A70" text-anchor="middle">海</text>';
  /* 川 */
  s += '<path d="' + d + '" fill="none" stroke="#C9A98A" stroke-width="56" stroke-linecap="round"/>';
  s += '<path d="' + d + '" fill="none" stroke="#8FC9E8" stroke-width="44" stroke-linecap="round"/>';
  /* 流れる むき */
  [[150,118,18],[240,90,0],[340,196,72],[440,300,0],[520,318,32]].forEach(function(q){
    s += '<g transform="translate(' + q[0] + ',' + q[1] + ') rotate(' + q[2] + ')">' +
         '<path d="M-9 -7 L7 0 L-9 7 Z" fill="#fff" opacity=".85"/></g>';
  });
  s += '<text x="46" y="182" font-size="12" font-weight="900" fill="#5A7C93">水は こちらから ながれる</text>';
  return s;
}
ARTS.kawa = kawaArt;
ART_MSG.kawa = '川の 図を タップ してね';

/* --- グラフを 読む（ふりこの 長さ と 1おうふくの 時間） --- */
var GR_PTS = [[110,234,'25cm','1.0'],[247,194,'50cm','1.4'],[383,163,'75cm','1.7'],[520,137,'100cm','2.0']];
function graphArt(){
  var s = '', i;
  s += '<rect x="20" y="60" width="560" height="300" rx="14" fill="#F7FAFC" stroke="#DCE5EB" stroke-width="2"/>';
  /* じく */
  s += '<line x1="110" y1="330" x2="556" y2="330" stroke="#5A7C93" stroke-width="3"/>';
  s += '<line x1="110" y1="330" x2="110" y2="86" stroke="#5A7C93" stroke-width="3"/>';
  for (i = 1; i <= 4; i++){
    var gy = 330 - i * 48;
    s += '<line x1="110" y1="' + gy + '" x2="556" y2="' + gy + '" stroke="#E4EBF0" stroke-width="2"/>';
    s += '<text x="100" y="' + (gy + 5) + '" font-size="11" font-weight="900" fill="#8FA3B8" text-anchor="end">' + (i * 0.5).toFixed(1) + '</text>';
  }
  /* 点と 線 */
  var dd = '';
  GR_PTS.forEach(function(q, qi){
    dd += (qi ? ' L' : 'M') + q[0] + ' ' + q[1];
    s += '<text x="' + q[0] + '" y="352" font-size="12" font-weight="900" fill="#5A7C93" text-anchor="middle">' + q[2] + '</text>';
  });
  s += '<path d="' + dd + '" fill="none" stroke="#3EA7D8" stroke-width="4" stroke-linecap="round"/>';
  GR_PTS.forEach(function(q){
    s += '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="8" fill="#fff" stroke="#1B7FA8" stroke-width="4"/>';
    var vx = (q[0] > 480) ? q[0] - 26 : q[0] + 26;      /* たてじくの めもりと かさならない ように よこへ */
    s += '<text x="' + vx + '" y="' + (q[1] - 6) + '" font-size="11" font-weight="900" fill="#1B7FA8" text-anchor="middle">' + q[3] + '</text>';
  });
  /* しらべて いない ところ */
  s += '<rect x="536" y="170" width="60" height="60" rx="10" fill="#FFF3E0" stroke="#E08A00" stroke-width="2.5" stroke-dasharray="6 5"/>';
  s += '<text x="566" y="207" font-size="24" font-weight="900" fill="#E08A00" text-anchor="middle">？</text>';
  /* じくの 名まえ */
  s += '<rect x="238" y="374" width="156" height="26" rx="10" fill="#EAF3F8"/>';
  s += '<text x="316" y="392" font-size="13" font-weight="900" fill="#3B5A70" text-anchor="middle">ふりこの 長さ</text>';
  s += '<g transform="translate(48,208) rotate(-90)"><rect x="-78" y="-13" width="156" height="26" rx="10" fill="#EAF3F8"/>' +
       '<text x="0" y="5" font-size="13" font-weight="900" fill="#3B5A70" text-anchor="middle">1おうふくの 時間</text></g>';
  return s;
}
ARTS.graph = graphArt;
ART_MSG.graph = 'グラフの 上を タップ してね';

function renderMitsukeru(){
  var st = curStage(), ask = st.asks[cur.qi];
  setBoardBox(600, st.boardH || 476);
  var s = '';
  /* きいて いること */
  s += '<rect x="20" y="14" width="560" height="46" rx="14" fill="#EAF3F8" stroke="#9FC3D6" stroke-width="2"/>';
  s += '<text x="300" y="34" font-size="12" font-weight="900" fill="#5A7C93" text-anchor="middle">' +
       (cur.qi + 1) + ' / ' + st.asks.length + '　どこかな？</text>';
  /* SVGの <text> の 中では <b> は つかえない（そこで 文が 切れて しまう）ので タグを 取る */
  s += '<text x="300" y="53" font-size="15" font-weight="900" fill="#0F3350" text-anchor="middle">' +
       (ask ? ask.q.replace(/<[^>]+>/g, '') : '') + '</text>';
  s += (ARTS[st.art || 'karada'] || bodyArt)();

  /* みつけた ところに しるしを つける */
  cur.found.forEach(function(id){
    var tg = mkTarget(id), h = tg.hits[0];
    tg.hits.forEach(function(hh){
      s += '<circle cx="' + hh[0] + '" cy="' + hh[1] + '" r="' + (hh[2] - 4) +
           '" fill="none" stroke="#2E9A4C" stroke-width="3"/>';
    });
    if (tg.lx === undefined){
      /* 名まえが えの 中に ある 図（水よう液など）は ✓ だけ */
      s += '<g transform="translate(' + (h[0] + h[2] - 10) + ',' + (h[1] - h[2] + 10) + ')">' +
           '<circle cx="0" cy="0" r="14" fill="#2E9A4C"/>' +
           '<text x="0" y="6" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">✓</text></g>';
      return;
    }
    var right = tg.lx > 300;
    s += '<line x1="' + tg.lx + '" y1="' + tg.ly + '" x2="' + h[0] + '" y2="' + h[1] +
         '" stroke="#2E9A4C" stroke-width="2.5" stroke-dasharray="4 4"/>';
    var w = tg.label.length * 15 + 30;
    s += '<g transform="translate(' + tg.lx + ',' + tg.ly + ')">' +
         '<rect x="' + (right ? 0 : -w) + '" y="-15" width="' + w + '" height="30" rx="12" fill="#2E9A4C"/>' +
         '<text x="' + (right ? w/2 : -w/2) + '" y="6" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">✓ ' +
         tg.label + '</text></g>';
  });
  /* あたり（見えない） */
  st.targets.forEach(function(tg){
    if (cur.found.indexOf(tg.id) >= 0) return;
    tg.hits.forEach(function(hh){
      s += '<circle cx="' + hh[0] + '" cy="' + hh[1] + '" r="' + hh[2] +
           '" fill="transparent" data-find="' + tg.id + '"/>';
    });
  });
  document.getElementById('board').innerHTML = s;

  if (cur.miss) setStatus('それは「' + cur.miss + '」だね。もういちど さがして みよう！', false);
  else setStatus(ART_MSG[st.art || 'karada'] || 'えの 上を タップ してね', false);
  tryClear(cur.qi >= st.asks.length);
}
function tapMitsukeru(e){
  var id = attrUp(e.target, 'data-find');
  if (id === null) return;
  var st = curStage(), ask = st.asks[cur.qi];
  if (!ask) return;
  if (id === ask.t){
    cur.found.push(id); cur.qi++; cur.miss = null;
  } else {
    var tg = mkTarget(id);
    cur.miss = tg ? tg.label : '';
  }
  renderBoard();
}
ENGINES.mitsukeru = { load:loadMitsukeru, render:renderMitsukeru, tap:tapMitsukeru };

/* ================================================================== *
 * そだて型 — じょうけんを えらんで 植物を そだてる（5年 発芽と成長／6年 受粉）
 *
 *   4つの じょうけんを 自分で ON/OFF して そだてる。どこまで 育つかは
 *   **ルールで 計算する**（正かいの くみあわせは 書いて いない）:
 *     水 と あたたかさ が ないと 芽が 出ない（日光・肥料は 発芽には いらない！）
 *     日光が ないと 白い もやしに なる ／ 肥料が ないと 大きく ならない
 *     花が さいたら じゅふんさせて はじめて 実が できる
 *   ★は「よけいな じょうけんを つけない」。＝ ほんとうに 必要な ものを 見つける あそび。
 * ================================================================== */
var SD = { conds:[
  { id:'mizu',     icon:'💧', name:'水を やる' },
  { id:'atatakai', icon:'🌡️', name:'あたたかい へや' },
  { id:'hikari',   icon:'☀️', name:'日光に あてる' },
  { id:'hiryo',    icon:'🌿', name:'肥料を やる' }
], H:430, gy:352 };
function sodateStage(){
  var c = cur.cond;
  if (!(c.mizu && c.atatakai)) return 0;        /* 芽が 出ない */
  if (!c.hikari) return 1;                      /* 芽は 出るが 白い もやし */
  if (!c.hiryo) return 2;                       /* 葉は 出るが 小さい */
  return cur.jufun ? 4 : 3;                     /* 花 → じゅふんで 実 */
}
function sodateOn(){ var n = 0; SD.conds.forEach(function(c){ if (cur.cond[c.id]) n++; }); return n; }
function loadSodate(st){
  if (cur.sdRaf){ cancelAnimationFrame(cur.sdRaf); cur.sdRaf = null; }
  cur.cond = { mizu:false, atatakai:false, hikari:false, hiryo:false };
  cur.jufun = false; cur.grown = -1; cur.day = 0; cur.sdRun = false; cur.sdMsg = '';
}
function sodateOK(){ return cur.grown >= curStage().need; }
/* ---- 植物の え。stage 0=たね 1=もやし 2=小さい葉 3=花 4=実 ---- */
function plantArt(stage, k){
  var s = '', gy = SD.gy, cx = 0;
  /* はち と 土 */
  s += '<path d="M-62 ' + (gy - 46) + ' h124 l-12 76 q-2 8 -10 8 h-80 q-8 0 -10 -8 Z" fill="#D98E5F" stroke="#A8663E" stroke-width="3" stroke-linejoin="round"/>';
  s += '<rect x="-66" y="' + (gy - 56) + '" width="132" height="14" rx="5" fill="#C77E52" stroke="#A8663E" stroke-width="3"/>';
  s += '<path d="M-56 ' + (gy - 42) + ' h112 v12 h-112 Z" fill="#6B4A32"/>';
  if (stage <= 0){
    s += '<ellipse cx="0" cy="' + (gy - 34) + '" rx="7" ry="5" fill="#B4844F" stroke="#8C6135" stroke-width="2"/>';
    return s;
  }
  var green = (stage === 1) ? '#E8E4C8' : '#4FC46A', dark = (stage === 1) ? '#C8C4A2' : '#2E9A4C';
  var h = (stage === 1) ? 54 : (stage === 2 ? 62 : 96);
  var top = gy - 42 - h * k;
  s += '<path d="M0 ' + (gy - 40) + ' Q' + (stage === 1 ? -14 : 4) + ' ' + ((gy - 40 + top) / 2) + ' 0 ' + top.toFixed(1) +
       '" fill="none" stroke="' + dark + '" stroke-width="' + (stage === 1 ? 4 : 7) + '" stroke-linecap="round"/>';
  /* 葉 */
  var leaves = (stage === 1) ? 2 : (stage === 2 ? 2 : 4);
  for (var i = 0; i < leaves; i++){
    var ly = gy - 56 - (h * k) * (0.35 + i * 0.2), sgn = (i % 2 ? 1 : -1);
    var lw = (stage === 1) ? 12 : (stage === 2 ? 20 : 30);
    /* マイナスの 数を 文字の '-' と つなぐと "--24" に なって パスが こわれる。数で 計算して から 出す */
    s += '<path d="M0 ' + ly.toFixed(1) + ' q' + (sgn * lw).toFixed(1) + ' ' + (-lw * 0.6).toFixed(1) + ' ' +
         (sgn * lw * 1.6).toFixed(1) + ' 2 q' + (-sgn * lw * 0.8).toFixed(1) + ' ' + (lw * 0.7).toFixed(1) + ' ' +
         (-sgn * lw * 1.6).toFixed(1) + ' -2 Z" fill="' + green + '" stroke="' + dark + '" stroke-width="2"/>';
  }
  if (stage >= 3){
    /* 花 */
    for (var p = 0; p < 6; p++){
      var a = p * Math.PI / 3;
      s += '<ellipse cx="' + (Math.cos(a) * 13).toFixed(1) + '" cy="' + (top + Math.sin(a) * 13).toFixed(1) +
           '" rx="9" ry="7" fill="#F7A8C4" stroke="#D07A9C" stroke-width="2" transform="rotate(' +
           (p * 60) + ' ' + (Math.cos(a) * 13).toFixed(1) + ' ' + (top + Math.sin(a) * 13).toFixed(1) + ')"/>';
    }
    s += '<circle cx="0" cy="' + top.toFixed(1) + '" r="8" fill="#F5B324" stroke="#C9820A" stroke-width="2"/>';
  }
  if (stage >= 4){
    s += '<circle cx="26" cy="' + (top + 26).toFixed(1) + '" r="14" fill="#E05A4A" stroke="#B03A45" stroke-width="2.5"/>';
    s += '<path d="M26 ' + (top + 12).toFixed(1) + ' q6 -8 12 -6" fill="none" stroke="#2E9A4C" stroke-width="3" stroke-linecap="round"/>';
  }
  return s;
}
function renderSodate(){
  var st = curStage();
  setBoardBox(600, SD.H);
  var stg = (cur.grown >= 0) ? cur.grown : 0;
  var k = cur.sdRun ? Math.min(1, cur.day / 7) : (cur.grown >= 0 ? 1 : 0);
  var s = '';
  /* ---- ミッション帯 ---- */
  s += '<rect x="20" y="8" width="560" height="34" rx="12" fill="#FFF8E4" stroke="#F5B324" stroke-width="2"/>';
  s += '<text x="36" y="31" font-size="13" font-weight="900" fill="#8A5B00">🎯 ' + st.goal + '</text>';
  s += '<text x="564" y="31" font-size="13" font-weight="900" fill="' + (sodateOn() > st.star ? '#E08A00' : '#8A5B00') +
       '" text-anchor="end">つけた じょうけん ' + sodateOn() + '　★' + st.star + 'つまで</text>';

  /* ---- じょうけんの スイッチ ---- */
  SD.conds.forEach(function(c, ci){
    var y = 78 + ci * 46, on = cur.cond[c.id];
    s += '<g transform="translate(148,' + y + ')">' +
         '<rect x="-118" y="-19" width="236" height="38" rx="14" fill="' + (on ? '#2E9A4C' : '#fff') +
         '" stroke="' + (on ? '#1E6E37' : '#B9C6D1') + '" stroke-width="' + (on ? 4 : 3) + '"/>' +
         '<text x="-96" y="6" font-size="17" text-anchor="middle">' + c.icon + '</text>' +
         '<text x="6" y="6" font-size="14" font-weight="900" fill="' + (on ? '#fff' : '#3B5A70') +
         '" text-anchor="middle">' + c.name + '</text>' +
         '<text x="98" y="6" font-size="12" font-weight="900" fill="' + (on ? '#fff' : '#A9B7C2') +
         '" text-anchor="middle">' + (on ? 'ON' : 'OFF') + '</text>' +
         (cur.sdRun ? '' : '<rect x="-118" y="-19" width="236" height="38" fill="transparent" data-cond="' + c.id + '"/>') +
         '</g>';
  });
  /* ---- そだてる ボタン ---- */
  s += '<g transform="translate(148,282)">' +
       '<rect x="-104" y="-23" width="208" height="46" rx="23" fill="' + (cur.sdRun ? '#DCE5EB' : '#1B7FA8') + '"/>' +
       '<text x="0" y="7" font-size="16" font-weight="900" fill="' + (cur.sdRun ? '#A9B7C2' : '#fff') +
       '" text-anchor="middle">▶ 7日 そだてる</text>' +
       (cur.sdRun ? '' : '<rect x="-104" y="-23" width="208" height="46" fill="transparent" data-grow="1"/>') + '</g>';
  /* じゅふん（花が さいて いる ときだけ） */
  if (!cur.sdRun && cur.grown === 3 && !cur.jufun)
    s += '<g transform="translate(148,340)">' +
         '<rect x="-104" y="-21" width="208" height="42" rx="21" fill="#E8618C"/>' +
         '<text x="0" y="6" font-size="15" font-weight="900" fill="#fff" text-anchor="middle">🖌 じゅふんさせる</text>' +
         '<rect x="-104" y="-21" width="208" height="42" fill="transparent" data-jufun="1"/></g>';

  /* ---- 日づけ と 植木ばち ---- */
  s += '<text x="430" y="72" font-size="15" font-weight="900" fill="#5A7C93" text-anchor="middle">' +
       (cur.grown < 0 ? 'まだ たねの まま' : (cur.day | 0) + '日目') + '</text>';
  if (cur.cond.hikari)
    s += '<circle cx="546" cy="98" r="20" fill="#F5B324" opacity=".9"/><text x="546" y="105" font-size="20" text-anchor="middle">☀️</text>';
  s += '<g transform="translate(430,0)">' + plantArt(stg, k) + '</g>';
  s += '<rect x="300" y="' + (SD.gy + 40) + '" width="260" height="3" rx="1" fill="#DCE5EB"/>';
  document.getElementById('board').innerHTML = s;

  if (cur.sdMsg) setStatus(cur.sdMsg, cur.sdBad === true);
  else if (cur.sdRun) setStatus('そだって いるよ…', false);
  else setStatus('じょうけんを えらんで「7日 そだてる」を おそう', false);
  tryClear(sodateOK());
}
var SD_MSG = [
  '芽が 出なかった…。たねが 芽を 出すのに ひつような ものは そろって いるかな？',
  '芽は 出たけれど 白くて ひょろひょろ（もやし）。日光が ないと 緑に なれないんだ。',
  '緑の 葉に なった！ でも 小さいまま。もっと 大きく そだてるには？',
  '大きく そだって 花が さいた！ 実を つけるには じゅふんが いるよ。',
  '実が できた！ 中には つぎの いのち（たね）が 入って いる。'
];
function sodateGo(){
  var st = curStage(), goal = sodateStage();
  cur.sdRun = true; cur.day = 0; cur.grown = goal; cur.sdMsg = '';
  renderBoard();
  var last = null;
  function step(now){
    if (cur.kind !== 'sodate' || !cur.sdRun){ cur.sdRaf = null; return; }
    if (last === null) last = now;
    cur.day = Math.min(7, cur.day + Math.min(0.05, (now - last) / 1000) * 3.2);
    last = now;
    renderBoard();
    if (cur.day >= 7){
      cur.sdRun = false;
      cur.sdMsg = SD_MSG[goal]; cur.sdBad = (goal < st.need);
      if (sodateOK()) cur.noStar = (sodateOn() > st.star);
      cur.sdRaf = null; renderBoard(); return;
    }
    cur.sdRaf = requestAnimationFrame(step);
  }
  cur.sdRaf = requestAnimationFrame(step);
}
function tapSodate(e){
  if (cur.sdRun) return;
  var cd = attrUp(e.target, 'data-cond');
  if (cd !== null){ cur.cond[cd] = !cur.cond[cd]; cur.sdMsg = ''; renderBoard(); return; }
  if (attrUp(e.target, 'data-jufun') !== null){
    cur.jufun = true; cur.grown = 4;
    cur.sdMsg = SD_MSG[4]; cur.sdBad = false;
    if (sodateOK()) cur.noStar = (sodateOn() > curStage().star);
    renderBoard(); return;
  }
  if (attrUp(e.target, 'data-grow') !== null){ sodateGo(); return; }
}
ENGINES.sodate = { load:loadSodate, render:renderSodate, tap:tapSodate };

/* ------------------------------------------------------------------ *
 * 7. クリアの しょり と ごほうび
 * ------------------------------------------------------------------ */
function cardSVG(g, gold){
  var base = gold ? '#F5B324' : '#8FBFD8';
  var bg   = gold ? '#FFF6DE' : '#EFF7FB';
  return '<svg class="card-get" viewBox="0 0 150 200">' +
    '<rect x="4" y="4" width="142" height="192" rx="16" fill="' + bg + '" stroke="' + base + '" stroke-width="5"/>' +
    '<rect x="14" y="14" width="122" height="120" rx="10" fill="#fff" stroke="' + base + '" stroke-width="2"/>' +
    '<text x="75" y="96" font-size="62" text-anchor="middle">' + g.icon + '</text>' +
    '<text x="75" y="158" font-size="15" font-weight="900" fill="#0F3350" text-anchor="middle">' + g.card + '</text>' +
    '<text x="75" y="180" font-size="12" font-weight="900" fill="' + (gold ? '#8A5B00' : '#4A6C85') +
    '" text-anchor="middle">' + (gold ? '★ きんカード ★' : 'かがくカード') + '</text>' +
    '</svg>';
}

function onClear(){
  var g = gameById(cur.gameId), st = g.stages[cur.si], key = stageKey(g.id, cur.si);
  var old = save.stages[key];
  var perfect = (cur.hint || cur.noStar) ? 0 : 1;   /* ヒントを 見た／ミッションの 目標を こえた */
  if (old && old.p) perfect = 1;                    /* 一度とった パーフェクトは 下げない（§6 単調増加） */
  save.stages[key] = { c:1, p:perfect };
  var justFinished = gameDone(g.id) && !save.cards[g.id];
  if (gameDone(g.id)) save.cards[g.id] = gameGold(g.id) ? 2 : 1;
  store();
  renderStrip();

  document.getElementById('modal-jhs').innerHTML =
    g.jhs ? '<div class="jhs-note">🎓 中学でも つかうよ</div>' : '';
  document.getElementById('modal-title').textContent = perfect ? 'パーフェクト！' : 'クリア！';
  document.getElementById('modal-card').innerHTML = justFinished ? cardSVG(g, gameGold(g.id)) : '';
  document.getElementById('modal-learn').innerHTML =
    (justFinished ? '<b>「' + g.card + '」カード</b>を てにいれた！<br>' : '') + st.learn;
  var last = (cur.si >= g.stages.length - 1);
  /* ゲームが 1つだけの アプリには もどる 島が ない ので「とじる」に する */
  document.getElementById('modal-next').textContent =
    last ? (HOME_GAME ? 'とじる ▼' : '島に もどる ▶') : 'つぎへ ▶';
  openClearModal();
  confettiBurst(perfect ? 120 : 70);
}
/* まどを 出すだけ（中みは もう 作って ある）。見なおしから もどる ときも ここを 通る ので、
   コンフェッティや セーブを やりなおさない。 */
function openClearModal(){ document.getElementById('modal').className = 'modal on'; }

/* つぎの もんだいへ。まどの「つぎへ」と、見なおしの おびの「つぎへ」が どちらも ここへ。 */
function goNextStage(){
  closeModal(); hideClearBar();
  var g = gameById(cur.gameId);
  if (cur.si >= g.stages.length - 1){
    if (HOME_GAME){ renderStrip(); return; }   /* 1ゲームの アプリ：もんだい えらびに もどるだけ */
    openIsland(g.island); return;
  }
  cur.si++; cur.hint = false; loadStage();
}
document.getElementById('modal-again').onclick = function(){ closeModal(); loadStage(); };
document.getElementById('modal-next').onclick = goNextStage;
/* 「🔍 見なおす」… まどを どけて、じぶんが 作った ばんめんを 見せる。
   ばんめんは そのまま のこって いる（loadStage を よばない ので こわれない）。 */
document.getElementById('modal-look').onclick = function(){ closeModal(); showClearBar(); };
document.getElementById('cb-back').onclick = function(){ hideClearBar(); openClearModal(); };
document.getElementById('cb-next').onclick = goNextStage;

/* じぶんで かく コンフェッティ（外部ライブラリは つかわない） */
function confettiBurst(n){
  var cv = document.getElementById('confetti');
  var ctx = cv.getContext('2d');
  var W = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
  cv.style.display = 'block';
  var cols = ['#F5B324','#4FC46A','#3EA7D8','#E8618C','#8B7BE8','#FF8A5B'];
  var ps = [];
  for (var i=0;i<n;i++){
    ps.push({ x:W/2 + (Math.random()-.5)*W*.5, y:H*.42,
      vx:(Math.random()-.5)*13, vy:-8 - Math.random()*11,
      w:6 + Math.random()*8, h:8 + Math.random()*10,
      r:Math.random()*6.28, vr:(Math.random()-.5)*.32,
      c:cols[(Math.random()*cols.length)|0], life:0 });
  }
  setTimeout(function(){ ctx.clearRect(0,0,W,H); cv.style.display = 'none'; }, 6500);  /* rAFが とまっても のこらないように */
  var t0 = 0;
  function tick(){
    ctx.clearRect(0,0,W,H);
    var alive = 0;
    ps.forEach(function(p){
      p.vy += .42; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      if (p.y < H + 40){ alive++;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
      }
    });
    t0++;
    if (alive && t0 < 260) requestAnimationFrame(tick);
    else { ctx.clearRect(0,0,W,H); cv.style.display = 'none'; }
  }
  requestAnimationFrame(tick);
}

/* ------------------------------------------------------------------ *
 * 8. がめん：ホーム（地図）と 島
 * ------------------------------------------------------------------ */
function islandArt(isl, state){
  var s = '<svg class="isl-art" viewBox="0 0 200 156">' +
    '<ellipse cx="100" cy="132" rx="84" ry="16" fill="rgba(4,50,72,.28)"/>' +
    '<path d="M12 122 Q24 92 58 86 Q78 50 112 56 Q152 60 166 96 Q188 102 188 122 Z" fill="' + isl.sand + '"/>' +
    '<path d="M40 100 Q70 58 106 62 Q146 66 160 100 Z" fill="' + isl.color + '"/>' +
    '<text x="100" y="102" font-size="46" text-anchor="middle">' + (state === 'lock' ? '🔒' : isl.emoji) + '</text>';
  if (state === 'done') s += '<text x="158" y="112" font-size="30" text-anchor="middle">🏁</text>';
  return s + '</svg>';
}
function renderHome(){
  /* 島が 1つだけの アプリには 海の 地図が ない（ビルドが とりのぞく）。
     その ときは 何も しない。 */
  if (!document.getElementById('map-inner')) return;
  var open = methodOpen(), h = '', total = 0, got = 0;
  GAMES.forEach(function(g){
    if (g.soon || !g.stages) return;
    total += g.stages.length;
    got += clearedCount(g.id);
  });
  ISLANDS.forEach(function(isl){
    var lock = isl.needAll && !open;
    var list = playableOf(isl.id);
    var state = lock ? 'lock' : (list.length && islandDone(isl.id) ? 'done' : 'go');
    var n = 0, all = 0;
    list.forEach(function(g){ all += g.stages.length; n += clearedCount(g.id); });
    var label = lock ? '4つの島 クリアで ひらく'
              : (all ? n + ' / ' + all + ' もん' : 'じゅんびちゅう');
    h += '<button class="island' + (lock ? ' locked' : '') + '" style="--x:' + isl.mx + '%; --y:' + isl.my +
         '%; --nx:' + isl.nx + '%; --ny:' + isl.ny + '%" data-isl="' + isl.id + '">' + islandArt(isl, state) +
         '<span class="isl-name">' + isl.emoji + ' ' + isl.name + '</span>' +
         '<span class="isl-count">' + label + '</span></button>';
  });
  document.getElementById('map-inner').innerHTML = h;
  document.getElementById('home-prog').style.width = (total ? (got / total * 100) : 0) + '%';
  document.getElementById('home-note').textContent = 'クリアした もんだい　' + got + ' / ' + total;
}
if (document.getElementById('map-inner')) document.getElementById('map-inner').addEventListener('click', function(e){
  var id = attrUp(e.target, 'data-isl');
  if (!id) return;
  var isl = islandById(id);
  if (isl.needAll && !methodOpen()){
    alert('🔬 かんがえかたの島は、ほかの 4つの島を ぜんぶ クリアすると ひらくよ！');
    return;
  }
  openIsland(id);
});

function openIsland(id){
  /* ゲームが 1つだけの アプリ（でんき回路 など）には 島の がめんが ない。
     「島に もどる」で 行ける ところが ない ので、ゲームの がめんに とどまる。
     こうしないと まっ白な がめんに おちる（クリア後・リサイクル工場・ふりこ が
     openIsland を よぶ）。 */
  if (HOME_GAME){ go('game'); return; }
  /* 島が 1つだけの アプリには 島の がめんが 1まいしか ない（地図を とりのぞいて いる）。
     🔬かんがえかたの島の ゲームも その 1まいの 下に ならべて いる ので、
     どこから よばれても じぶんの 島の がめんを 出す。
     こうしないと 🔬の ゲームを おえた とき「🔬かんがえかたの島」だけの がめんに
     おりてしまい、もどるボタンが ない ので **そこから 出られなく なる**。 */
  if (HOME_ISLAND) id = HOME_ISLAND;
  var isl = islandById(id);
  document.getElementById('isl-bar-title').textContent = isl.emoji + ' ' + isl.name;
  var hero = document.getElementById('isl-hero');
  hero.style.background = 'linear-gradient(180deg,' + isl.color + ' 0%, ' + isl.color + 'CC 100%)';
  hero.innerHTML = '<div class="emoji">' + isl.emoji + '</div><h2>' + isl.name + '</h2><p>' + isl.desc + '</p>';
  var h = '';
  gamesOf(id).forEach(function(g){
    var n = g.stages ? clearedCount(g.id) : 0;
    var all = g.stages ? g.stages.length : 0;
    var pct = all ? (n / all * 100) : 0;
    var card = save.cards[g.id];
    h += '<button class="game-card' + (g.soon ? ' soon' : '') + '" data-g="' + g.id + '">' +
      '<span class="gc-ico" style="background:' + isl.color + '22">' + g.icon + '</span>' +
      '<span class="gc-body">' +
        '<span class="gc-name">' + g.name +
          (card ? (card === 2 ? ' <span class="tag jhs">★きんカード</span>' : ' <span class="tag grade">カード</span>') : '') +
          '<span class="tag grade">' + g.grade + '</span>' +
          (g.jhs ? '<span class="tag jhs">🎓中学でも</span>' : '') +
          (g.soon ? '<span class="tag soon">じゅんびちゅう</span>' : '') +
        '</span>' +
        '<span class="gc-sub">' + g.sub + (all ? '　' + n + '/' + all : '') + '</span>' +
        (all ? '<span class="gc-meter"><i style="width:' + pct + '%"></i></span>' : '') +
      '</span></button>';
  });
  /* 地図の ない アプリ（島が 1つだけ）では、🔬かんがえかたの島の 行き場が なくなる。
     じぶんの 島の ゲームの 下に つづけて 出す。ひらく までは 「あと なに が いるか」を 見せる。 */
  if (HOME_ISLAND && id === HOME_ISLAND) h += methodSection();
  document.getElementById('game-list').innerHTML = h;
  go('island');
}
/* まだ クリアして いない いちばん さいしょの もんだいの ばんごう */
function firstTodo(g){
  var si = 0;
  for (var i=0;i<g.stages.length;i++){ if (!stageRec(g.id, i)){ si = i; break; } si = i; }
  return si;
}
/* ゲームが 1つだけの アプリには この 一覧が ない（ビルドが がめんごと とりのぞく）。 */
if (document.getElementById('game-list')) document.getElementById('game-list').addEventListener('click', function(e){
  var id = attrUp(e.target, 'data-g');
  if (!id) return;
  var g = gameById(id);
  if (g.soon){ alert('この ミニゲームは じゅんびちゅう。もうすこし まってね！'); return; }
  startGame(id, firstTodo(g));
});

/* 🔬かんがえかたの島の ぶぶん（地図の ない アプリだけで つかう）。
   ひらいて いれば ゲームを ならべ、まだなら 何を すれば ひらくかを 出す。 */
function methodSection(){
  var isl = islandById('method');
  if (!isl) return '';
  if (!methodOpen()){
    return '<div class="method-lock">' +
      '<span class="ml-ico">🔒</span>' +
      '<b>' + isl.emoji + ' ' + isl.name + '</b>' +
      '<span>⚡🧪🌱🌏 <b>4つの島 ぜんぶ</b>を クリアすると ひらくよ。' +
      'ほかの島は 🏠アプリ集から いけるよ。</span></div>';
  }
  var h = '<div class="method-head">' + isl.emoji + ' ' + isl.name + '　<span>' + isl.desc + '</span></div>';
  gamesOf('method').forEach(function(g){
    var n = clearedCount(g.id), all = g.stages ? g.stages.length : 0;
    var card = save.cards[g.id];
    h += '<button class="game-card" data-g="' + g.id + '">' +
      '<span class="gc-ico" style="background:' + isl.color + '22">' + g.icon + '</span>' +
      '<span class="gc-body">' +
        '<span class="gc-name">' + g.name +
          (card ? (card === 2 ? ' <span class="tag jhs">★きんカード</span>' : ' <span class="tag grade">カードGET</span>') : '') +
          '<span class="tag grade">' + g.grade + '</span>' +
          (g.jhs ? '<span class="tag jhs">🎓中学でも</span>' : '') +
        '</span>' +
        '<span class="gc-sub">' + g.sub + (all ? '　' + n + '/' + all : '') + '</span>' +
        (all ? '<span class="gc-meter"><i style="width:' + (all ? (n / all * 100) : 0) + '%"></i></span>' : '') +
      '</span></button>';
  });
  return h;
}

/* ------------------------------------------------------------------ *
 * 9. がめんの きりかえ と きどう
 * ------------------------------------------------------------------ */
function go(name){
  /* ゲームの 画面から 出る ときは、うごいて いる アニメを とめる
     （とめないと 見えない ところで まわり つづけて バッテリーを 食う） */
  /* ゲームの がめんから 出たら 走って いる アニメを 止める。型（エンジン）に stop を
     書いて おくと ここで よばれる（書かなくても よい）。 */
  if (name !== 'game'){
    for (var _k in ENGINES) if (ENGINES[_k].stop) ENGINES[_k].stop();
    hideClearBar();                                  /* できた！の おびを のこさない */
  }
  ['home','island','game'].forEach(function(n){
    var el = document.getElementById('screen-' + n);   /* 地図の ない アプリでは home が ない */
    if (el) el.className = 'screen' + (n === name ? ' on' : '');
  });
  if (name === 'home') renderHome();
  window.scrollTo(0, 0);
}
load();
renderHome();
/* 島が 1つだけの アプリ（エネルギーの島 など）には 海の 地図が ない
   （ビルドが がめんごと とりのぞく）。島の 中（ミニゲームの 一覧）から はじめる。
   🔬かんがえかたの島は その 一覧の 下に つづけて 出る（91-home.js の methodSection）。 */
/* ゲームが 1つだけの アプリ（でんき回路 など）は、その ゲームを いきなり ひらく。
   ゲームえらびも ポータルが する ので、1つしか ない 一覧を 見せる いみが ない。
   つづきから はじまる（まだ クリアして いない さいしょの もんだい）。 */
if (HOME_GAME) startGame(HOME_GAME, firstTodo(gameById(HOME_GAME)));
else if (HOME_ISLAND) openIsland(HOME_ISLAND);
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
