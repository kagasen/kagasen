<style>
/* =====================================================================
   サイエンスアイランド — 小学校理科を5つの島でめぐる学習ゲーム
   設計と経緯は HANDOFF.md を読むこと。
   ES2017+α縛り（?. ?? は書かない＝古いiPadで全滅する）。
   ===================================================================== */
:root{
  --sea:#1B7FA8; --sea-d:#0E5B7C; --sea-l:#5FC6E8;
  --ink:#0F3350; --paper:#FFFDF6; --line:rgba(15,51,80,.12);
  --gold:#F5B324; --ok:#2E9A4C; --ng:#E05A4A;
  --fam:'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','BIZ UDPGothic','Yu Gothic',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  font-family:var(--fam); color:var(--ink); background:var(--sea);
  overflow-x:hidden; -webkit-text-size-adjust:100%;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
.screen{display:none; min-height:100%;}
.screen.on{display:block;}

/* ---------- ホーム（海の地図） ---------- */
#screen-home{
  background:
    radial-gradient(ellipse at 50% 8%, #8FE0F5 0%, rgba(143,224,245,0) 60%),
    linear-gradient(180deg,#4FB6DC 0%, var(--sea) 45%, var(--sea-d) 100%);
  padding:0 0 86px;
}
.home-head{padding:26px 16px 10px; text-align:center;}
.home-title{
  margin:0; font-size:clamp(28px,7vw,46px); font-weight:900; color:#fff; letter-spacing:.04em;
  text-shadow:0 3px 0 rgba(14,91,124,.45), 0 8px 20px rgba(0,0,0,.22);
}
.home-sub{margin:8px 0 0; color:#EAF9FF; font-size:clamp(13px,3.3vw,16px); font-weight:700; opacity:.95;}
.progress-bar{
  max-width:420px; margin:16px auto 0; background:rgba(255,255,255,.25);
  border-radius:999px; height:16px; overflow:hidden; box-shadow:inset 0 2px 5px rgba(0,0,0,.15);
}
.progress-bar>i{display:block; height:100%; background:linear-gradient(90deg,#FFE082,var(--gold)); border-radius:999px; transition:width .5s;}
.progress-note{text-align:center; color:#fff; font-weight:800; font-size:13px; margin-top:6px;}

.map-wrap{position:relative; max-width:900px; margin:14px auto 0; padding:0 12px;}
.map-inner{position:relative; width:100%; padding-top:80%;}
.island{
  position:absolute; left:var(--x); top:var(--y); transform:translate(-50%,-50%);
  width:31%; max-width:230px; min-width:132px;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:0; text-align:center; transition:transform .18s;
}
.island:active{transform:translate(-50%,-50%) scale(.95);}
.island .isl-art{width:100%; filter:drop-shadow(0 10px 16px rgba(0,0,0,.28));}
.island .isl-name{
  margin-top:-6px; font-size:clamp(13px,3.2vw,17px); font-weight:900; color:#fff;
  text-shadow:0 2px 0 rgba(14,91,124,.6), 0 4px 10px rgba(0,0,0,.3);
}
.island .isl-count{
  font-size:11px; font-weight:800; color:#0F3350; background:rgba(255,255,255,.9);
  border-radius:999px; padding:2px 10px; margin-top:3px;
}
.island.locked{opacity:.72;}
.island.locked .isl-count{background:rgba(255,255,255,.75);}
/* スマホ（せまい画面）では 島が かさなるので、たてに ながい ジグザグの 地図にする */
@media (max-width:560px){
  .map-inner{padding-top:235%;}
  .island{left:var(--nx); top:var(--ny); width:42%; min-width:120px; max-width:180px;}
}

/* ---------- 共通のヘッダ ---------- */
.bar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:10px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px; background:rgba(255,255,255,.94);
  box-shadow:0 2px 10px rgba(15,51,80,.14); backdrop-filter:blur(6px);
}
.bar .back{
  min-height:44px; min-width:44px; padding:0 14px; border-radius:999px; background:#EAF3F8;
  font-weight:900; font-size:15px; color:var(--ink); display:inline-flex; align-items:center; gap:4px;
}
.bar .back:active{transform:translateY(1px);}
.bar .ttl{font-weight:900; font-size:clamp(16px,4.2vw,21px); flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ---------- 島の画面 ---------- */
#screen-island{background:var(--paper);}
.isl-hero{padding:18px 16px 20px; color:#fff; text-align:center;}
.isl-hero .emoji{font-size:44px; line-height:1;}
.isl-hero h2{margin:6px 0 4px; font-size:clamp(20px,5.4vw,28px); font-weight:900;
  text-shadow:0 2px 6px rgba(0,0,0,.2);}
.isl-hero p{margin:0; font-size:14px; font-weight:700; opacity:.95;}
/* 島が 1つだけの アプリで、ゲームの 下に つづけて 出す 🔬かんがえかたの島 */
.method-head{margin:18px 4px 10px; font-size:15px; font-weight:900; color:#0F3350;
  border-top:2px dashed rgba(15,51,80,.18); padding-top:16px;}
.method-head span{font-size:13px; font-weight:700; opacity:.7;}
.method-lock{margin:18px 4px 4px; padding:16px 14px; border-radius:16px;
  border:2px dashed rgba(15,51,80,.20); background:rgba(255,255,255,.55);
  display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center;}
.method-lock .ml-ico{font-size:30px; line-height:1;}
.method-lock b{font-size:15px; color:#0F3350;}
.method-lock span{font-size:13px; font-weight:700; color:#0F3350; opacity:.8; line-height:1.6;}
.game-list{max-width:720px; margin:0 auto; padding:16px 12px 130px; display:grid; gap:12px;}
.game-card{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:#fff; border:2px solid var(--line); border-radius:18px; padding:14px 14px;
  box-shadow:0 4px 12px rgba(15,51,80,.07); min-height:76px; transition:transform .15s;
}
.game-card:active{transform:translateY(2px);}
.game-card .gc-ico{
  flex:0 0 54px; height:54px; border-radius:16px; display:grid; place-items:center;
  font-size:26px; background:#EAF3F8;
}
.game-card .gc-body{flex:1; min-width:0;}
.game-card .gc-name{font-size:17px; font-weight:900; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.game-card .gc-sub{font-size:13px; font-weight:700; color:#4A6C85; margin-top:2px;}
.game-card .gc-meter{margin-top:7px; height:9px; border-radius:999px; background:#E7EEF3; overflow:hidden;}
.game-card .gc-meter>i{display:block; height:100%; background:linear-gradient(90deg,#7BD98F,var(--ok)); border-radius:999px;}
.game-card.soon{opacity:.55;}
.tag{font-size:10px; font-weight:900; border-radius:999px; padding:2px 8px; white-space:nowrap;}
.tag.grade{background:#EAF3F8; color:#33637F;}
.tag.jhs{background:#FFF0CF; color:#8A5B00;}
.tag.soon{background:#EEE; color:#777;}

/* ---------- ゲーム画面 ---------- */
#screen-game{background:var(--paper); padding-bottom:130px;}
.stage-strip{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; padding:10px 12px 0;}
.stage-dot{
  width:34px; height:34px; border-radius:12px; display:grid; place-items:center;
  font-size:14px; font-weight:900; background:#E7EEF3; color:#7791A5;
}
.stage-dot.done{background:#CBEFD4; color:#1E6E37;}
.stage-dot.gold{background:linear-gradient(135deg,#FFE9A8,#F5B324); color:#7A5200;}
.stage-dot.now{outline:3px solid var(--sea); outline-offset:2px; background:#fff; color:var(--ink);}
.quest{
  max-width:640px; margin:12px auto 0; padding:12px 16px; background:#fff;
  border:2px solid var(--line); border-radius:16px; text-align:center;
}
.quest .q-n{font-size:12px; font-weight:900; color:#7791A5;}
.quest .q-t{font-size:clamp(16px,4.4vw,20px); font-weight:900; margin-top:2px;}
.quest .q-h{font-size:14px; font-weight:700; color:#4A6C85; margin-top:8px; display:none; line-height:1.75; text-align:left;}
.quest .q-h.on{display:block;}
.quest .q-h .ans{margin-top:10px; border-top:1px dashed #C7D6E0; padding-top:6px;}
.quest .q-h summary{cursor:pointer; color:#1B7FA8; font-weight:900; padding:11px 0; min-height:26px;}  /* 指で 押せる 48px */
.quest .q-h .ans-in{background:#F2F8FC; border-radius:12px; padding:8px 12px 10px; margin-top:4px;}
.quest .q-h ol{margin:6px 0 0 22px; padding:0;}
.quest .q-h li{margin:4px 0;}
.quest .q-h .ans-note{color:#6B8398; margin-top:8px;}
.sw-pick{display:none; margin:8px auto 0; max-width:520px;}
.sw-pick.on{display:block;}
.sw-pick .sw-note{font-size:13px; font-weight:900; color:#8A5B00; text-align:center; margin-bottom:6px;}
.sw-pick .sw-box{border-radius:16px; padding:8px 10px;}
.sw-pick .sw-box.first{background:#FFF6DE; border:3px solid #F5B324;}
.sw-pick .sw-row{display:flex; align-items:center; gap:6px; margin:4px 0;}
.sw-pick .sw-lab{font-size:13px; font-weight:900; color:#8FA3B8; width:48px; flex:none; text-align:right;}
.sw-pick .sw-b{flex:1; min-height:48px; display:flex; align-items:center; justify-content:center; gap:8px;
  font-family:inherit; font-size:14px; font-weight:900; color:#4A6C85; background:#F2F6F9;
  border:3px solid #C3D0DA; border-radius:14px; cursor:pointer; padding:0 6px;}
.sw-pick .sw-b .dot{border-radius:50%; display:inline-block; border:2px solid rgba(0,0,0,.25);}
.sw-pick .sw-b.on{color:#fff;}
.sw-pick .sw-b:disabled{opacity:.45; cursor:default;}
.quest .q-h button.mini{font-family:inherit; font-size:14px; font-weight:900; color:#fff; background:#1B7FA8;
  border:none; border-radius:12px; padding:11px 18px; min-height:44px; cursor:pointer;}
.board-wrap{max-width:640px; margin:12px auto 0; padding:0 10px; position:relative;}
.fc-controls{position:absolute; inset:0 10px; pointer-events:none; z-index:8;}
.fc-controls.on{pointer-events:auto;}
.fc-controls button{font:900 15px/1.2 inherit; min-height:54px; border:0; border-radius:17px; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; box-shadow:0 3px 0 rgba(15,51,80,.18);}
.fc-controls button:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(15,51,80,.18);}
.fc-answer-buttons{position:absolute; left:17%; right:17%; top:41.2%; display:grid; gap:10px; pointer-events:auto;}
.fc-answer-buttons button{background:#EEF4F7; color:#173F55; border:2px solid #7CA6B7;}
.fc-answer-buttons button:nth-child(2){background:#EAF6F1;}
.fc-result-buttons{position:absolute; left:17.2%; right:17.2%; top:65.3%; display:grid; grid-template-columns:1fr 1fr; gap:18px; pointer-events:auto;}
.fc-result-buttons .back-result{background:#EEF4F7; color:#315A70; border:2px solid #AFC8D3;}
.fc-result-buttons .again-result{background:#1B7FA8; color:#fff;}
.board{
  width:100%; background:#FFFFFF; border:2px solid var(--line); border-radius:20px;
  box-shadow:0 6px 18px rgba(15,51,80,.08); display:block; touch-action:manipulation;
}
.tools{max-width:640px; margin:12px auto 0; padding:0 10px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
.tool{
  min-height:48px; padding:0 18px; border-radius:999px; background:#EAF3F8; color:var(--ink);
  font-weight:900; font-size:15px; display:inline-flex; align-items:center; gap:6px;
  border:2px solid transparent;
}
.tool:active{transform:translateY(1px);}
.tool.primary{background:var(--sea); color:#fff;}
.status{
  max-width:640px; margin:10px auto 0; padding:0 12px; text-align:center;
  font-size:15px; font-weight:900; min-height:24px; color:#4A6C85;
}
.status.short{color:var(--ng);}

/* ---------- 見なおして いる あいだの おび ----------
   クリアの まどは せいかいの あと すぐ 出す（できた よろこびを へらさない）。
   まどの「🔍 見なおす」を おすと まどが どいて この おびに かわり、
   じぶんが 作った もの（回路・つり合い・ならべた じゅんばん…）を ゆっくり 見られる。
   おびから けっかに もどる ことも、そのまま つぎへ すすむ ことも できる。
   2026-09-10 ユーザーの きぼう。はじめは おびで クリアを 止めて いたが、
   「完成した ときの うれしさが 半減する」ので すぐ 出す 形に もどした。 */
.clear-bar{
  max-width:640px; margin:12px auto 0; padding:12px 14px; display:none;
  align-items:center; justify-content:center; gap:10px 14px; flex-wrap:wrap;
  background:#E9F9EE; border:3px solid var(--ok); border-radius:20px;
  animation:pop .3s cubic-bezier(.2,1.3,.5,1);
}
.clear-bar.on{display:flex;}
.clear-bar .cb-msg{font-size:16px; font-weight:900; color:#1E7A3C;}
.clear-bar .cb-go, .clear-bar .cb-back{
  min-height:48px; padding:0 22px; border-radius:999px; border:none;
  font-family:var(--fam); font-weight:900; font-size:16px;
  display:inline-flex; align-items:center; gap:6px; cursor:pointer;
}
.clear-bar .cb-go{background:var(--ok); color:#fff;}
.clear-bar .cb-back{background:#fff; color:#1E7A3C; border:2px solid var(--ok);}
.clear-bar .cb-go:active, .clear-bar .cb-back:active{transform:translateY(1px);}
.modal-look{
  margin-top:10px; width:100%; min-height:44px; border-radius:999px; border:2px solid var(--line);
  background:transparent; color:#4A6C85; font-family:var(--fam); font-weight:900; font-size:14px; cursor:pointer;
}
.modal-look:active{transform:translateY(1px);}

/* ---------- クリアのモーダル ---------- */
.modal{
  position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center;
  background:rgba(6,40,60,.6); padding:20px; backdrop-filter:blur(3px);
}
.modal.on{display:flex;}
.modal-box{
  background:var(--paper); border-radius:26px; padding:24px 20px; max-width:380px; width:100%;
  text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.35); animation:pop .35s cubic-bezier(.2,1.3,.5,1);
}
@keyframes pop{from{transform:scale(.7); opacity:0;} to{transform:scale(1); opacity:1;}}
.modal-box h3{margin:0 0 6px; font-size:26px; font-weight:900; color:var(--ok);}
.modal-box .learn{
  background:#FFF8E4; border:2px dashed var(--gold); border-radius:16px; padding:12px 14px;
  margin:14px 0; font-size:14px; font-weight:700; text-align:left; line-height:1.7;
}
.modal-box .learn b{color:#8A5B00;}
.jhs-note{
  display:inline-flex; align-items:center; gap:6px; background:#FFF0CF; color:#8A5B00;
  border-radius:999px; padding:6px 12px; font-size:12px; font-weight:900; margin-bottom:10px;
}
.modal-btns{display:flex; gap:10px; margin-top:6px;}
.modal-btns .tool{flex:1; justify-content:center;}
.card-get{margin:10px auto 0; width:150px;}
#confetti{position:fixed; inset:0; pointer-events:none; z-index:300; display:none;}
</style>
</head>
<body>


<!-- ========== 島：ミニゲームの一覧 ========== -->
<div id="screen-island" class="screen on">
  <div class="bar">
    <div class="ttl" id="isl-bar-title">島</div>
  </div>
  <div class="isl-hero" id="isl-hero"></div>
  <div class="game-list" id="game-list"></div>
</div>

<!-- ========== ゲーム ========== -->
<div id="screen-game" class="screen">
  <div class="bar">
    <button class="back" id="game-back">◀ もどる</button>
    <div class="ttl" id="game-bar-title">ゲーム</div>
  </div>
  <div class="stage-strip" id="stage-strip"></div>
  <div class="quest">
    <div class="q-n" id="q-n">だい1もん</div>
    <div class="q-t" id="q-t"></div>
    <div class="q-h" id="q-h"></div>
  </div>
  <div class="board-wrap"><svg class="board" id="board" viewBox="0 0 600 380" role="img" aria-label="かいろの ばん"></svg><div class="fc-controls" id="fc-controls"></div></div>
  <div class="sw-pick" id="sw-pick"></div>
  <div class="status" id="status"></div>
  <!-- クリアの まどを どけて 見なおして いる あいだ 出る おび。 -->
  <div class="clear-bar" id="clear-bar">
    <span class="cb-msg">🔍 じぶんの こたえを 見て いるよ</span>
    <button type="button" class="cb-back" id="cb-back">◀ けっかに もどる</button>
    <button type="button" class="cb-go" id="cb-next">▶ つぎへ すすむ</button>
  </div>
  <div class="tools">
    <button class="tool" id="btn-hint">💡 ヒント</button>
    <button class="tool" id="btn-reset">↺ はじめから</button>
  </div>
</div>

<!-- ========== クリア ========== -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div id="modal-jhs"></div>
    <h3 id="modal-title">クリア！</h3>
    <div id="modal-card"></div>
    <div class="learn" id="modal-learn"></div>
    <div class="modal-btns">
      <button class="tool" id="modal-again">↺ もういちど</button>
      <button class="tool primary" id="modal-next">つぎへ ▶</button>
    </div>
    <!-- まどを どけて、じぶんが 作った ものを 見なおす。あとで もどって これる。 -->
    <button class="modal-look" id="modal-look">🔍 じぶんの こたえを 見なおす</button>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
/* =====================================================================
   サイエンスアイランド — 本体
   ここでの約束（CLAUDE.md より）
     ・?. ?? は書かない（古いiPadで全滅する）
     ・ミニゲームは「型（エンジン）」＋「データ」。データを1行足せば増える
     ・子どもの記録は絶対に捨てない。load() で旧データを移行する
   ===================================================================== */
'use strict';

/* ------------------------------------------------------------------ *
 * 1. データ：島
 * ------------------------------------------------------------------ */
var ISLANDS = [
  { id:'energy',   name:'エネルギーの島',   emoji:'⚡', color:'#F2A33C', sand:'#F7D9A0',
    desc:'でんき・じしゃく・てこ・ふりこ', mx:20, my:26, nx:26, ny:9 },
  { id:'particle', name:'つぶつぶの島',     emoji:'🧪', color:'#8B7BE8', sand:'#D8D2F7',
    desc:'とけ方・水よう液・もえ方・重さ', mx:78, my:22, nx:74, ny:27 },
  { id:'life',     name:'いのちの島',       emoji:'🌱', color:'#4FC46A', sand:'#CDEFD3',
    desc:'からだ・しょくぶつ・生きもの',   mx:22, my:72, nx:26, ny:47 },
  { id:'earth',    name:'ちきゅうの島',     emoji:'🌏', color:'#3EA7D8', sand:'#C7E7F5',
    desc:'月と太陽・天気・大地',           mx:80, my:74, nx:74, ny:66 },
  { id:'method',   name:'かんがえかたの島', emoji:'🔬', color:'#E8618C', sand:'#F9CFDD',
    desc:'りかの こころ',                  mx:50, my:48, nx:50, ny:86, needAll:true }

   もんだいが 「3このうち 1こだけ 消せるように」と 言って いるのに、消すのを l3 に 決めうちに
   すると、l1 で 作った 子が ×に なる。おなじ 勉強なので ぜんぶ 通す（goal.anyOf に わたす）。 */
function goalOnly1Off(ids){                        /* 並列。スイッチを 切ると どれか 1こだけ 消える */
  return ids.map(function(x){
    var rest = ids.filter(function(y){ return y !== x; });
    var all = {}; ids.forEach(function(y){ all[y] = 'full'; });
    return [ { sw:{s1:true},  on:ids.slice(), bright:all },
             { sw:{s1:false}, on:rest, off:[x] } ];
  });
}
function goalTrunkSplit(ids){                      /* 1こ とおった あと 2本に わかれる。みきは どれでも いい */
  return ids.map(function(t){
    var br = {};
    ids.forEach(function(y){ br[y] = (y === t ? 'dim' : 'faint'); });
    return [ { on:ids.slice(), bright:br } ];
  });
}

function gameById(id){ for(var i=0;i<GAMES.length;i++){ if(GAMES[i].id===id) return GAMES[i]; } return null; }
function islandById(id){ for(var i=0;i<ISLANDS.length;i++){ if(ISLANDS[i].id===id) return ISLANDS[i]; } return null; }
function gamesOf(islandId){ return GAMES.filter(function(g){ return g.island===islandId; }); }
function playableOf(islandId){ return gamesOf(islandId).filter(function(g){ return !g.soon; }); }

/* ------------------------------------------------------------------ *
 * 3. セーブ（CLAUDE.md §3：記録を絶対に壊さない）
 * ------------------------------------------------------------------ */
var SAVE_KEY = 'science-island-save-v1';
var save = { v:1, stages:{}, cards:{}, opt:{} };

function load(){
  var raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch(e){ raw = null; }
  if (!raw) return;
  var d = null;
  try { d = JSON.parse(raw); } catch(e){ return; }
  if (!d || typeof d !== 'object') return;
  /* --- スキーマ移行のフック。形をかえても 古いデータを すてない --- *
     いまは v1 だけ。v2 に するときは ここで d.v===1 のデータを つめかえる。 */
  if (d.stages) save.stages = d.stages;
  if (d.cards)  save.cards  = d.cards;
  if (d.opt)    save.opt    = d.opt;            /* 自分で えらんだ せってい（でんじしゃくバトル など） */
  save.v = 1;
}
function store(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){}
}
function stageKey(gameId, i){ return gameId + '-' + (i+1); }
function stageRec(gameId, i){
  var r = save.stages[stageKey(gameId,i)];
  return r ? r : null;
}
function clearedCount(gameId){
  var g = gameById(gameId);
  if (!g || !g.stages) return 0;
  var n = 0;
  for (var i=0;i<g.stages.length;i++){ if (stageRec(gameId,i)) n++; }
  return n;
}
function gameDone(gameId){
  var g = gameById(gameId);
  if (!g || !g.stages) return false;
  return clearedCount(gameId) >= g.stages.length;
}
function gameGold(gameId){
  var g = gameById(gameId);
  if (!g || !g.stages) return false;
  for (var i=0;i<g.stages.length;i++){
    var r = stageRec(gameId,i);
    if (!r || !r.p) return false;
  }
  return true;
}
function islandDone(islandId){
  var all  = ALL_GAMES.filter(function(g){ return g[1] === islandId; });
  var list = playableOf(islandId);
  /* その島の ゲームを ぜんぶ 持って いる アプリの ときだけ、じぶんで 数える。
     1ゲームだけの アプリ（でんき回路 など）で これを やると、その 1つを クリアしただけで
     「エネルギーの島 クリア」に なって しまう。 */
  if (list.length && list.length >= all.length){
    for (var i=0;i<list.length;i++){ if(!gameDone(list[i].id)) return false; }
    return true;
  }
  /* この アプリには そろって いない 島（島ごと・ゲームごとに アプリを 分けた ため）。
     セーブは 4アプリで 同じ もの（同一オリジンの localStorage）を 見て いるので、
     その島の ゲームが ぜんぶ 図かんに のって いれば クリアずみと 分かる。
     こうしないと「4島 クリアで かんがえかたの島が ひらく」が どの アプリでも
     ひらかなく なる（じぶんの 島の ゲームしか 数えられない ため）。 */
  if (!all.length) return false;
  for (var j=0;j<all.length;j++){ if(!save.cards[all[j][0]]) return false; }
  return true;
}
function methodOpen(){
  return islandDone('energy') && islandDone('particle') && islandDone('life') && islandDone('earth');
}

/* ------------------------------------------------------------------ *
 * 6. ゲームの じょうたい と 型（エンジン）の わりふり
 *
 *    型は ENGINES に { load(stage), render(), tap(event) } の かたちで とうろくする。
 *    ミニゲームの kind が きほんの型。stage.kind を 書けば その1もんだけ
 *    べつの型に できる（例：月と太陽は「ならべる」と「むすぶ」を まぜている）。
 *    あたらしい型を ふやすときは ENGINES に 1つ 足すだけで すむように すること。
 * ------------------------------------------------------------------ */
var ENGINES = {};
var cur = {
  gameId:null, si:0, kind:null, hint:false, done:false,
  parts:[], wires:[], sel:null,      /* つなぐ型（回路・むすぶ）で つかう */
  slots:[], tray:[]                  /* ならべる型で つかう */
};

function curStage(){ var g = gameById(cur.gameId); return g ? g.stages[cur.si] : null; }
function engine(){ return ENGINES[cur.kind]; }
function setBoardBox(w, h){ document.getElementById('board').setAttribute('viewBox', '0 0 ' + w + ' ' + h); }
function setStatus(msg, bad){
  document.getElementById('status').className = bad ? 'status short' : 'status';
  document.getElementById('status').textContent = msg || '';
}
function closeModal(){ document.getElementById('modal').className = 'modal'; }
/* せいかいした ときの ながれ（2026-09-10）
     せいかい → 480ms あと に クリアの まど（できた よろこびは すぐ 出す）
     まどの「🔍 見なおす」→ まどが どいて 見なおしの おび → 「けっかに もどる」か「つぎへ」

   さいしょは おびで クリアを 止めて いたが、ユーザーに 実きで ためして もらい
   「完成した ときの うれしさが 半減する」と 分かった ので、まどは すぐ 出す 形に した。
   かわりに **まどを どけて 見なおせる 出口**を まどの 中に つけて ある。
   タイマーは おぼえて おいて loadStage で 取り消す（はじめから・もんだい きりかえ の ため）。 */
function tryClear(ok){
  if (!cur.done && ok){ cur.done = true; cur.clearTimer = setTimeout(onClear, 480); }
}
function showClearBar(){
  var bar = document.getElementById('clear-bar');
  bar.className = 'clear-bar on';
  if (bar.scrollIntoView) bar.scrollIntoView({ block:'nearest' });
}
function hideClearBar(){ document.getElementById('clear-bar').className = 'clear-bar'; }
function renderBoard(){ var e = engine(); if (e) e.render(); }

/* タップされた ところから 親を たどって data-○○ を さがす。
   ぜんぶの 型（エンジン）と ホームの 地図が つかう ので、ここ（共通）に 置く。 */
function attrUp(el, name){
  while (el && el !== document){
    if (el.getAttribute){ var v = el.getAttribute(name); if (v !== null) return v; }
    el = el.parentNode;
  }
  return null;
}

function startGame(gameId, si){
  var g = gameById(gameId);
  if (!g || g.soon) return;
  cur.gameId = gameId; cur.si = si; cur.sel = null; cur.done = false;
  cur.hint = false;                           /* 1もん目は そうさの せつめいを 出すが ヒントあつかいには しない */
  loadStage();
  document.getElementById('game-bar-title').textContent = g.name;
  /* ゲームが 1つだけの アプリには「◀ もどる」が ない（ビルドが とりのぞく）。
     出口は 左下の「アプリ集」ボタン。 */
  var backBtn = document.getElementById('game-back');
  if (backBtn) backBtn.onclick = function(){ openIsland(g.island); };
  go('game');
}
function loadStage(){
  var g = gameById(cur.gameId), st = g.stages[cur.si];
  if (cur.clearTimer){ clearTimeout(cur.clearTimer); cur.clearTimer = null; }
  closeModal();
  hideClearBar();
  cur.kind = st.kind || g.kind;
  cur.sel = null; cur.done = false; cur.noStar = false;
  document.getElementById('q-n').textContent =
    (g.stages.length > 1) ? ('だい' + (cur.si + 1) + 'もん / ' + g.stages.length + 'もん') : g.sub;
  document.getElementById('q-t').textContent = st.t;
  document.getElementById('q-h').innerHTML = st.h + hintAnswer(st, cur.kind);   /* ヒントも learn と 同じく <b> を つかえる */
  /* ヒントの 中に ボタンを 出す 型は、その ボタンを じぶんで つなぐ（hintBind）。
     ここに 型ごとの しょりを 書かない こと。 */
  var hintEng = ENGINES[cur.kind];
  if (hintEng && hintEng.hintBind) hintEng.hintBind();
  document.getElementById('q-h').className = 'q-h' + (cur.si === 0 ? ' on' : '');
  renderStrip();
  var pk = document.getElementById('sw-pick');
  pk.className = 'sw-pick'; pk.innerHTML = '';   /* ふりこ以外の 型では かくす */
  var fcCtl = document.getElementById('fc-controls');
  fcCtl.innerHTML = '';                          /* リサイクル工場いがいでは かくす */
  engine().load(st);
  renderBoard();
}
function renderStrip(){
  var g = gameById(cur.gameId), h = '';
  if (g.stages.length <= 1){ document.getElementById('stage-strip').innerHTML = ''; return; }
  for (var i=0;i<g.stages.length;i++){
    var r = stageRec(g.id, i);
    var cls = 'stage-dot' + (r ? (r.p ? ' gold' : ' done') : '') + (i === cur.si ? ' now' : '');
    h += '<button class="' + cls + '" data-go="' + i + '">' + (i + 1) + '</button>';
  }
  document.getElementById('stage-strip').innerHTML = h;
}

function sameWire(w, a, b){ return (w[0] === a && w[1] === b) || (w[0] === b && w[1] === a); }
function hasWire(a, b){
  for (var i=0;i<cur.wires.length;i++){ if (sameWire(cur.wires[i], a, b)) return true; }
  return false;
}

/* ヒントの 中に 入れる「こたえの れい」。中身は それぞれの 型（エンジン）が
   ENGINES.○○.hintAnswer に 書く。書かない 型は ヒントだけ 出て こたえの れいは 出ない。
   ここに 型の 名まえを ならべない こと（型を 足すたびに ここを 直す ことに なる）。 */
function hintAnswer(st, kind){
  var e = ENGINES[kind];
  return (e && e.hintAnswer) ? e.hintAnswer(st) : '';
}

/* ------------------------------------------------------------------ *
 * がめんの そうさを 型（エンジン）に わたす ところ。
 *
 * ★ここは 共通。2026-09-10 まで engines/swing.js（ふりこ）の 中に あった。
 *   ゲーム 1つずつの アプリに 分けた とき、ふりこの 入って いない アプリで
 *   **ばんめんの タップも もんだいえらびも ヒントも ぜんぶ 効かなく なった**。
 *   エラーは 1つも 出ない（おしても 何も おきないだけ）ので、気づくのが むずかしい。
 *   型に かんけいない そうさは かならず ここに 書く こと。
 * ------------------------------------------------------------------ */
/* ばんめんの タップは、いまの 型に わたすだけ */
document.getElementById('board').addEventListener('click', function(e){
  if (cur.done) return;
  var eng = engine();
  if (eng) eng.tap(e);
});
/* おしっぱなしを つかう 型（でんじしゃくバトルの コイル巻き）のための down/up。
   Pointer Events は 古い iPad に ない ので mouse と touch の 両方を 見る。 */
['mousedown', 'touchstart'].forEach(function(ev){
  document.getElementById('board').addEventListener(ev, function(e){
    if (cur.done) return;
    var eng = engine();
    if (eng && eng.down) eng.down(e);
  });
});
/* なぞって つなぐ型（リサイクル工場）。指が こまの間へ動いても 追えるよう document で見る。 */
document.addEventListener('mousemove', function(e){
  var eng=engine(); if(eng&&eng.move)eng.move(e);
});
document.addEventListener('touchmove', function(e){
  var eng=engine(); if(eng&&eng.move)eng.move(e);
}, {passive:false});
['mouseup', 'touchend', 'touchcancel'].forEach(function(ev){
  document.addEventListener(ev, function(e){
    var eng = engine();
    if (eng && eng.up) eng.up(e);
  });
});
document.getElementById('stage-strip').addEventListener('click', function(e){
  var i = attrUp(e.target, 'data-go');
  if (i === null) return;
  i = parseInt(i, 10);
  /* どのもんだいにも いつでも とべる（2026-08-28 ユーザーの きぼうで じゅんばんの
     ロックを 外した）。むずかしくて つまった とき、先に すすんで あとで もどれる ように。
     クリアの きろくは もんだいごとに もつので、とばしても 記ろくは こわれない。 */
  cur.si = i; cur.hint = false; loadStage();
});
document.getElementById('btn-hint').onclick = function(){
  var h = document.getElementById('q-h');
  h.className = (h.className.indexOf('on') >= 0) ? 'q-h' : 'q-h on';
  if (cur.si !== 0) cur.hint = true;
};
document.getElementById('btn-reset').onclick = function(){ loadStage(); };


/* ================================================================== *
 * 月の え（ならべる型・むすぶ型で つかう）
 *
 * p = 0 新月 / 0.25 上げんの月（右半分）/ 0.5 満月 / 0.75 下げんの月（左半分）。
 * 光って いる ところは「まるい ふちの 半分」＋「明暗の さかいめ（だ円）」の
 * 2つの こで つくる。さかいめの よこ半径 a = r*cos(2πp) が ＋なら みぎに、
 * −なら ひだりに ふくらむ。これで 8こ ぜんぶ 正しい 形に なる。
 * ================================================================== */
function moonPath(p, r){
  var th = 2 * Math.PI * p;
  var a = r * Math.cos(th);
  var waxing = p < 0.5;                 /* みちていく あいだは みぎがわが 光る（日本から 見た とき） */
  var limb = waxing ? 1 : 0;
  var term = waxing ? (a >= 0 ? 0 : 1) : (a >= 0 ? 1 : 0);
  return 'M0,' + (-r) + ' A' + r + ',' + r + ' 0 0,' + limb + ' 0,' + r +
         ' A' + Math.abs(a).toFixed(2) + ',' + r + ' 0 0,' + term + ' 0,' + (-r) + ' Z';
}
function moonArt(p, r){
  return '<circle cx="0" cy="0" r="' + r + '" fill="#2F3F52"/>' +
         '<path d="' + moonPath(p, r) + '" fill="#FFF3C4"/>' +
         '<circle cx="0" cy="0" r="' + r + '" fill="none" stroke="#8FA3B8" stroke-width="2"/>';
}
/* びんの 中の ろうそく。mode = closed（ふたあり）／top（上だけ あき）／both（上も 下も あき）。
   字が 読めなくても「どこから 空気が 入るか」が 見て 分かるように、すきまと 矢じるしを かく。 */
function jarArt(mode, r){
  var k = r / 26, bot = (mode === 'both') ? 18 : 24;
  var lid = (mode === 'closed' || mode === 'empty' || mode === 'out');
  var s = '<g transform="scale(' + k.toFixed(3) + ')">';
  s += '<line x1="-30" y1="25" x2="30" y2="25" stroke="#C99A6B" stroke-width="4" stroke-linecap="round"/>';
  /* びん（ガラス） */
  s += '<path d="M-17 -24 V' + bot + ' H17 V-24" fill="#F2F9FC" stroke="#8FA3B8" stroke-width="3" stroke-linejoin="round"/>';
  if (lid) s += '<rect x="-21" y="-31" width="42" height="8" rx="3" fill="#8FA3B8"/>';
  else {
    s += '<path d="M-17 -24 h-5 M17 -24 h5" stroke="#8FA3B8" stroke-width="3" stroke-linecap="round"/>';
    s += '<path d="M0 -30 v-9 M0 -39 l-5 6 M0 -39 l5 6" stroke="#5FA8C7" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
  }
  if (mode === 'both'){
    /* 下の すきま（ねんどで 少し うかせて ある）と、入って くる 空気 */
    s += '<rect x="-17" y="18" width="7" height="7" fill="#C08A5E"/><rect x="10" y="18" width="7" height="7" fill="#C08A5E"/>';
    s += '<path d="M-32 21 h9 M-23 21 l-6 -4 M-23 21 l-6 4" stroke="#5FA8C7" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
  }
  /* ろうそくと ほのお（empty＝中み なし／out＝もえた あと。けむりだけ） */
  if (mode !== 'empty'){
    s += '<rect x="-4" y="2" width="8" height="' + (bot - 2) + '" fill="#FFF6DE" stroke="#D9C89A" stroke-width="2"/>';
    if (mode === 'out')
      s += '<path d="M0 0 q-6 -5 0 -9 q6 -4 0 -9" fill="none" stroke="#B9C6D1" stroke-width="2.5" stroke-linecap="round"/>';
    else
      s += '<path d="M0 -2 q-6 5 0 10 q6 -5 0 -10 Z" fill="#F5B324"/>';
  }
  return s + '</g>';
}

/* メダカの たまごの 中の 変化（d = 0〜1 で そだちぐあい） */
OBJ_ART.tamago = function(r, d){
  d = (d === undefined) ? 0 : d;
  if (d > 1) d = d / 100;                             /* 'obj:tamago.35' の ように 百分率でも わたせる */

           '" stroke="#8C7355" stroke-width="1.6" opacity=".5"/>';

};
OBJ_ART.rousoku = function(r){
  return '<rect x="' + (-r*0.28) + '" y="' + (-r*0.35) + '" width="' + (r*0.56) + '" height="' + (r*1.2) +
         '" fill="#FFF6DE" stroke="#D9C89A" stroke-width="2.5"/>' +
         '<path d="M0 ' + (-r*0.45) + ' q' + (-r*0.34) + ' ' + (r*0.3) + ' 0 ' + (r*0.6) + ' q' + (r*0.34) + ' ' +
         (-r*0.3) + ' 0 ' + (-r*0.6) + ' Z" fill="#F5B324"/>';
};
/* 空の え。p＝雲（台風）の いち 0=西 1=東。「西から 東へ うつる」を 目で 見せる ためのもの */
function skyArt(p, kind, r){
  var x = (-0.62 + 1.24 * p) * r, s = '';
  s += '<rect x="' + (-r) + '" y="' + (-r*0.78) + '" width="' + (2*r) + '" height="' + (r*1.56) +
       '" rx="6" fill="#DCEEF8" stroke="#9FC3D6" stroke-width="2"/>';
  s += '<rect x="' + (-r) + '" y="' + (r*0.44) + '" width="' + (2*r) + '" height="' + (r*0.34) + '" fill="#9FD9A8"/>';
  s += '<text x="' + (-r*0.78) + '" y="' + (r*0.72) + '" font-size="' + (r*0.34).toFixed(0) + '" font-weight="900" fill="#5A7C93">西</text>';
  s += '<text x="' + (r*0.5) + '" y="' + (r*0.72) + '" font-size="' + (r*0.34).toFixed(0) + '" font-weight="900" fill="#5A7C93">東</text>';
  /* 見て いる ばしょ（まん中）。これが ないと 雲が どちらに いるのか 読みとりにくい */
  s += '<path d="M0 ' + (r*0.44) + ' l' + (-r*0.16) + ' ' + (-r*0.2) + ' h' + (r*0.32) + ' Z" fill="#E05A4A"/>';
  s += '<line x1="0" y1="' + (-r*0.78) + '" x2="0" y2="' + (r*0.44) + '" stroke="#B9C6D1" stroke-width="1.4" stroke-dasharray="3 3"/>';
  if (kind === 't'){
    s += '<g transform="translate(' + x.toFixed(1) + ',' + (-r*0.12) + ')">';
    for (var i = 0; i < 3; i++)
      s += '<path d="M0 0 q' + (r*0.34) + ' ' + (-r*0.28) + ' ' + (r*0.44) + ' ' + (r*0.06) +
           '" fill="none" stroke="#5A7C93" stroke-width="' + (r*0.11).toFixed(1) + '" stroke-linecap="round" transform="rotate(' + (i*120) + ')"/>';
    s += '<circle cx="0" cy="0" r="' + (r*0.09).toFixed(1) + '" fill="#E05A4A"/></g>';
  } else {
    s += '<g transform="translate(' + x.toFixed(1) + ',' + (-r*0.16) + ')">' +
         '<ellipse cx="0" cy="0" rx="' + (r*0.42) + '" ry="' + (r*0.26) + '" fill="#fff" stroke="#B9C6D1" stroke-width="1.8"/>' +
         '<ellipse cx="' + (-r*0.22) + '" cy="' + (r*0.06) + '" rx="' + (r*0.24) + '" ry="' + (r*0.18) + '" fill="#fff" stroke="#B9C6D1" stroke-width="1.8"/>' +
         '<ellipse cx="' + (r*0.24) + '" cy="' + (r*0.04) + '" rx="' + (r*0.2) + '" ry="' + (r*0.16) + '" fill="#fff" stroke="#B9C6D1" stroke-width="1.8"/></g>';
  }
  return s;
}
/* カードの え。あたらしい えを ふやすときは ここに 1行 足す */
function itemArt(art, r){
  if (!art) return '';
  if (art.indexOf('moon:') === 0) return moonArt(parseFloat(art.slice(5)), r);
  if (art.indexOf('jar:') === 0) return jarArt(art.slice(4), r);
  if (art.indexOf('obj:') === 0){
    var a2 = art.slice(4).split('.');                 /* obj:tamago.0.5 のように 数ちを わたせる */
    return OBJ_ART[a2[0]] ? OBJ_ART[a2[0]](r, a2.length > 1 ? (isNaN(parseFloat(a2[1])) ? a2[1] : parseFloat(a2[1])) : undefined) : '';
  }
  if (art.indexOf('sky:') === 0) return skyArt(parseFloat(art.slice(4).split(':')[0]), art.slice(4).split(':')[1], r);
  if (art.indexOf('emoji:') === 0)
    return '<text x="0" y="' + (r * 0.36) + '" font-size="' + Math.round(r * 1.5) +
           '" text-anchor="middle">' + art.slice(6) + '</text>';
  return '';
}
function shuffled(arr){
  var a = arr.slice(), i, j, t;
  for (i = a.length - 1; i > 0; i--){ j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

/* ================================================================== *
 * ならべる型 — カードを 正しい じゅんに ならべる
 *   items は「正しい じゅん」に 書く。loop:true なら わっか（じゅんかんする もの）
 *   なので、どこから 始めても せいかい（月の 満ち欠けが これ）。
 * ================================================================== */
var NB = { cw:80, ch:80, gap:10, lab:18, top:44 };
function nbCols(n){ return n <= 4 ? n : (n <= 6 ? 3 : 4); }
function nbCell(i, cols, oy){
  var gridW = cols * NB.cw + (cols - 1) * NB.gap;
  var ox = (600 - gridW) / 2;
  var c = i % cols, r = (i / cols) | 0;
  return { x: ox + c * (NB.cw + NB.gap) + NB.cw / 2,
           y: oy + r * (NB.ch + NB.lab + NB.gap) + NB.ch / 2 };
}
function nbItem(id){
  var items = curStage().items;
  for (var i=0;i<items.length;i++){ if (items[i].id === id) return items[i]; }
  return null;
}
function loadNaraberu(st){
  var ids = st.items.map(function(it){ return it.id; });
  cur.slots = ids.map(function(){ return null; });
  cur.tray = shuffled(ids);
  cur.trayHome = {};
  cur.tray.forEach(function(id, i){ cur.trayHome[id] = i; });
}
/* ならびが 合っているか。loop なら 何こ ずらしても せいかい */
function naraberuOK(){
  var st = curStage();
  if (!st || cur.slots.indexOf(null) >= 0) return false;
  var order = st.items.map(function(it){ return it.id; }), n = order.length, k, i, ok;
  if (!st.loop) return cur.slots.join(',') === order.join(',');
  for (k=0;k<n;k++){
    ok = true;
    for (i=0;i<n;i++){ if (cur.slots[i] !== order[(k + i) % n]){ ok = false; break; } }
    if (ok) return true;
  }
  return false;
}
function nbCard(cx, cy, item, opt){
  var half = NB.cw / 2, s = '<g transform="translate(' + cx + ',' + cy + ')">';
  s += '<rect x="' + (-half) + '" y="' + (-half) + '" width="' + NB.cw + '" height="' + NB.ch +
       '" rx="14" fill="' + (opt.sel ? '#DCF0F8' : '#fff') + '" stroke="' + (opt.sel ? '#1B7FA8' : '#B9C6D1') +
       '" stroke-width="' + (opt.sel ? 5 : 3) + '"/>';
  s += '<g transform="translate(0,-6)">' + itemArt(item.art, 26) + '</g>';
  s += '<text x="0" y="' + (half + 14) + '" font-size="12" font-weight="900" fill="#3B5A70" text-anchor="middle">' +
       item.label + '</text>';
  return s + '</g>';
}
function renderNaraberu(){
  var st = curStage(), n = st.items.length, cols = nbCols(n);
  var rows = Math.ceil(n / cols), rowH = NB.ch + NB.lab + NB.gap;
  var slotOY = NB.top, slotsH = rows * rowH;
  var trayOY = slotOY + slotsH + 40, boardH = trayOY + slotsH + 6;
  setBoardBox(600, boardH);

  var s = '';
  s += '<text x="300" y="26" font-size="15" font-weight="900" fill="#3B5A70" text-anchor="middle">▼ ここに じゅんに ならべよう</text>';
  /* わく */
  cur.slots.forEach(function(id, i){
    var c = nbCell(i, cols, slotOY), half = NB.cw / 2;
    if (id === null){
      s += '<g transform="translate(' + c.x + ',' + c.y + ')">' +
           '<rect x="' + (-half) + '" y="' + (-half) + '" width="' + NB.cw + '" height="' + NB.ch +
           '" rx="14" fill="#F1F6F9" stroke="#B9C6D1" stroke-width="3" stroke-dasharray="8 7"/>' +
           '<text x="0" y="9" font-size="26" font-weight="900" fill="#C3D0DA" text-anchor="middle">' + (i + 1) + '</text>' +
           '</g>';
    } else {
      s += nbCard(c.x, c.y, nbItem(id), { sel:false });
      s += '<text x="' + (c.x - half + 12) + '" y="' + (c.y - half + 18) +
           '" font-size="13" font-weight="900" fill="#8FA3B8" text-anchor="middle">' + (i + 1) + '</text>';
    }
    s += '<rect x="' + (c.x - half) + '" y="' + (c.y - half) + '" width="' + NB.cw + '" height="' +
         (NB.ch + NB.lab) + '" fill="transparent" data-slot="' + i + '"/>';
  });
  /* しきり と てもとの カード */
  s += '<line x1="40" y1="' + (trayOY - 26) + '" x2="560" y2="' + (trayOY - 26) +
       '" stroke="#DCE5EB" stroke-width="3"/>';
  s += '<text x="300" y="' + (trayOY - 6) + '" font-size="14" font-weight="900" fill="#8FA3B8" text-anchor="middle">てもとの カード</text>';
  cur.tray.forEach(function(id, i){
    if (id === null) return;
    var c = nbCell(i, cols, trayOY + 12), half = NB.cw / 2;
    s += nbCard(c.x, c.y, nbItem(id), { sel: cur.sel === id });
    s += '<rect x="' + (c.x - half) + '" y="' + (c.y - half) + '" width="' + NB.cw + '" height="' +
         (NB.ch + NB.lab) + '" fill="transparent" data-item="' + id + '"/>';
  });
  document.getElementById('board').innerHTML = s;

  var left = 0;
  cur.slots.forEach(function(x){ if (x === null) left++; });
  var ok = naraberuOK();
  if (left) setStatus('あと ' + left + 'まい', false);
  else if (!ok) setStatus('ぜんぶ おけた！ じゅんばんを 見なおして みよう', false);
  else setStatus('', false);
  tryClear(ok);
}
function tapNaraberu(e){
  var it = attrUp(e.target, 'data-item');
  if (it !== null){ cur.sel = (cur.sel === it) ? null : it; renderBoard(); return; }
  var si = attrUp(e.target, 'data-slot');
  if (si !== null){
    si = parseInt(si, 10);
    var here = cur.slots[si];
    if (cur.sel !== null){
      cur.tray = cur.tray.map(function(x){ return x === cur.sel ? null : x; });
      if (here !== null) cur.tray[cur.trayHome[here]] = here;      /* もとの ばしょに もどす */
      cur.slots[si] = cur.sel;
      cur.sel = null;
    } else if (here !== null){
      cur.slots[si] = null;
      cur.tray[cur.trayHome[here]] = here;
    }
    renderBoard(); return;
  }
  if (cur.sel !== null){ cur.sel = null; renderBoard(); }
}
ENGINES.naraberu = { load:loadNaraberu, render:renderNaraberu, tap:tapNaraberu };

/* ================================================================== *
 * じっけん型 — じょうけん制御（かえるのは 1つだけ）＋ ほんとうに じっけんを 走らせる
 *
 *   ながれ:  ①くみたて（A と B の じょうけんを えらぶ＋よそう）
 *            ②じっけん（アニメで 走る。ストップウォッチが うごく）
 *            ③けっか（時間を くらべて けつろん）
 *
 *   せいかいは「しらべたい じょうけんだけ ちがう。ほかは ぜんぶ 同じ」という
 *   <ルール> で 判定する。こたえの 組み合わせを 人が 用意する 必要が ない。
 *
 *   だいじ: 答えを 文で 教えない。**じっけんを 走らせて 見せる**。
 *   じょうけんを そろえずに 走らせる ことも できて、その ときは
 *   「時間は ちがったけど どっちが きいたの？」と 気づかせる。ここが この型の キモ。
 *
 *   st.sim で どの じっけんを 走らせるか きめる（SIMS に とうろく）。
 *   st.sim が なければ くみたてだけ（アニメなし）。
 * ================================================================== */
var JK = { rowH:74, top:112, speed:4 };
function jkVal(x){ return (x && x.label !== undefined) ? x.label : x; }
function jkNum(x){ return (x && x.v !== undefined) ? x.v : null; }

/* ---- じっけんの なかみ。あたらしい じっけんは ここに 1つ 足す ----
   やくそく（いらない ものは 書かなくて よい）:
     measure(v)          くらべる 数ち。**大きい ほうが よそうの「そのがわ」**
     total(v)            アニメの 長さ（びょう）
     summary(v)          じょうけんの 1行（「じっけん A」の 下）
     readout(inf,shown)  ばんの したの 数字 {top, bottom}
     art(side,cx,v,inf,t,stopped)  え
     line(A,B,diff)      けっかの 3行目（見えた ことを ことばに する）
     ask / hint          よそうの しつもん と したの ひとこと
     words.name          くらべて いる ものの 名まえ（「〜は かわった」の 〜）
     words.sameSetup     A と B が 同じに なって いた ときの 1行目
     speed               はやおくり（きめないと 4ばい）
     tick(side,cx,inf,t,fin)  毎フレームの こまかい こうしん。
                         なければ **数字が かわった ときだけ** かきなおす（かるくする ため）
   ------------------------------------------------------------------ */
var SIMS = {};

/* えらんだ じょうけんを 数ちに する（ぜんぶの じっけん 共通） */
function jkVals(side){
  var st = curStage(), v = {};
  st.vars.forEach(function(vr){
    var pick = cur.exp[side][vr.id];
    v[vr.id] = (pick === undefined) ? null : jkNum(vr.values[pick]);
  });
  return v;
}

/* ================== ①でんじしゃく ==================
   つよさ ∝ まきかず × でんりゅう。しんが 鉄で ないと クリップは つかない。
   ここも「つく こ数」を 計算で 出して いる（人が 用意した 正かいは ない）。 */
function jishakuN(v){
  if (v.shin !== 'tetsu') return 0;                 /* 鉄しんが ないと じしゃくに ならない */
  return Math.round((v.maki / 100) * v.denchi * 5);
}
SIMS.jishaku = {
  ask:  'よそう：クリップが たくさん つくのは？',
  hint: 'どちらが つよいか よそうして みよう',
  speed: 1,
  words:{ name:'つく クリップの 数', sameSetup:'A と B が 同じ でんじしゃくに なって いたよ。' },
  measure: function(v){ return jishakuN(v); },
  total: function(v){ return 1.0 + jishakuN(v) * 0.12 + 0.3; },
  summary: function(v){
    return (v.shin === 'tetsu' ? '鉄しん' : 'アルミしん') + ' ・ ' + v.maki + 'かい ・ でんち' + v.denchi + 'こ';
  },
  n: function(inf, shown){
    if (!inf.val) return 0;
    return Math.max(0, Math.min(inf.val, Math.floor((shown - 0.9) / 0.12)));
  },
  readout: function(inf, shown){
    return { top:'ついた クリップ', bottom: SIMS.jishaku.n(inf, shown) + ' こ' };
  },
  line: function(A, B, diff){
    return diff ? '（A は ' + A.val + 'こ、B は ' + B.val + 'こ ついた）'
                : 'どちらも ' + A.val + 'こ。同じ つよさ！';
  },
  art: function(side, cx, v, inf, t, stopped){
    var n = SIMS.jishaku.n(inf, stopped ? inf.total : t);
    var col = (side === 'A') ? '#3EA7D8' : '#E8618C';
    var s = '', i;
    /* かんでんち（よこに ならべる） */
    var bw = 46, bx0 = cx - ((v.denchi - 1) * (bw + 8)) / 2;
    for (i = 0; i < v.denchi; i++){
      var bx = bx0 + i * (bw + 8);
      s += '<g transform="translate(' + bx + ',80)">' +
           '<rect x="-23" y="-11" width="46" height="22" rx="5" fill="#F0B562" stroke="#C98C36" stroke-width="2"/>' +
           '<rect x="17" y="-5" width="8" height="10" rx="2" fill="#C98C36"/>' +
           '<text x="-4" y="5" font-size="11" font-weight="900" fill="#8A5B00" text-anchor="middle">＋−</text></g>';
    }
    /* どうせん（でんちから コイルへ） */
    s += '<path d="M' + (bx0 - 23) + ' 80 L' + (cx - 44) + ' 80 L' + (cx - 44) + ' 122 L' + (cx - 17) + ' 128" ' +
         'fill="none" stroke="#5A7C93" stroke-width="4" stroke-linecap="round"/>';
    s += '<path d="M' + (bx0 + (v.denchi - 1) * (bw + 8) + 23) + ' 80 L' + (cx + 44) + ' 80 L' + (cx + 44) +
         ' 122 L' + (cx + 17) + ' 128" fill="none" stroke="#5A7C93" stroke-width="4" stroke-linecap="round"/>';
    /* しん（鉄／アルミ） */
    var core = (v.shin === 'tetsu') ? '#9AA7B4' : '#DCE3E9';
    s += '<rect x="' + (cx - 9) + '" y="118" width="18" height="112" rx="4" fill="' + core +
         '" stroke="#7A8794" stroke-width="2"/>';
    s += '<text x="' + (cx + 44) + '" y="150" font-size="11" font-weight="900" fill="#8FA3B8" text-anchor="middle">' +
         (v.shin === 'tetsu' ? '鉄' : 'アルミ') + '</text>';
    /* コイル（まきかずに あわせて わっかの 数を かえる） */
    var loops = Math.round(v.maki / 20);             /* 100かい→5・200かい→10 の え */
    for (i = 0; i < loops; i++){
      var ly = 130 + i * (86 / loops);
      s += '<ellipse cx="' + cx + '" cy="' + ly.toFixed(1) + '" rx="17" ry="5" fill="none" stroke="#C97A3C" stroke-width="3.5"/>';
    }
    /* クリップ（下の はしに くっつく） */
    for (i = 0; i < n; i++){
      var r0 = (i / 5) | 0, c0 = i % 5;
      var cxx = cx + (c0 - 2) * 15, cyy = 234 + r0 * 17;
      /* ゼムクリップの かたち（まるい はしの はりがね） */
      s += '<g transform="translate(' + cxx + ',' + cyy + ')">' +
           '<path d="M-4 14 V5 a4,4 0 0 1 8,0 v10 a2.6,2.6 0 0 1 -5.2,0 V6" fill="none" stroke="' + col +
           '" stroke-width="2" stroke-linecap="round"/></g>';
    }
    if (!inf.val && (stopped || t > 1.1))
      s += '<text x="' + cx + '" y="252" font-size="13" font-weight="900" fill="#8FA3B8" text-anchor="middle">クリップは つかない…</text>';
    return s;
  }
};

/* ================== ②もののとけ方 ==================
   とける りょうは 「水の りょう」に ひれい し、「おん度」の きき方は **ものに よって ちがう**。
   じっさいの ようかい度（水50mLあたり・g）を まるめて つかう。 */
function tokeG(v){ return TOKE_MONO[v.mono].per50[v.ondo] * (v.mizu / 50); }
SIMS.tokekata = {
  ask:  'よそう：たくさん とけるのは？',
  hint: 'どちらが たくさん とけるか よそうして みよう',
  speed: 1,
  words:{ name:'とける りょう', sameSetup:'A と B が 同じ じょうけんに なって いたよ。' },
  eps: 2,                                           /* 1〜2g の ちがいは 実験の ごさ。「ほとんど かわらない」と 見る */
  measure: function(v){ return tokeG(v); },
  total: function(v){ return 1.0 + (tokeG(v) + 4) * 0.055; },
  summary: function(v){ return TOKE_MONO[v.mono].name + ' ・ 水' + v.mizu + 'mL ・ ' + v.ondo + 'ど'; },
  /* 入れた りょう（とける ぶん ＋ とけのこる 4g まで 入れて みる） */
  put: function(inf, shown){
    var max = inf.val + 4;
    return Math.max(0, Math.min(max, Math.floor(((shown - 0.6) / (inf.total - 0.6)) * max)));
  },
  readout: function(inf, shown){
    var p = SIMS.tokekata.put(inf, shown);
    return { top:'入れた ' + p + 'g', bottom:'とけた ' + Math.min(p, inf.val) + 'g' };
  },
  line: function(A, B, diff){
    if (diff) return '（A は ' + A.val + 'g、B は ' + B.val + 'g とけた）';
    return (A.val === B.val) ? 'どちらも ' + A.val + 'g。ぴったり 同じ！'
                             : '（A は ' + A.val + 'g、B は ' + B.val + 'g。ほとんど 同じ）';
  },
  art: function(side, cx, v, inf, t, stopped){
    var mono = TOKE_MONO[v.mono];
    var p = SIMS.tokekata.put(inf, stopped ? inf.total : t);
    var nokori = Math.max(0, p - inf.val);
    var s = '', i;
    /* ビーカー（水の りょうで 水めんの 高さが かわる） */
    var top = 110, bot = 266, bw = 56;
    var wy = (v.mizu >= 100) ? top + 24 : top + 82;
    s += '<rect x="' + (cx - bw) + '" y="' + wy + '" width="' + (bw * 2) + '" height="' + (bot - wy) +
         '" fill="' + mono.water + '"/>';
    s += '<path d="M' + (cx - bw) + ' ' + top + ' L' + (cx - bw) + ' ' + bot + ' L' + (cx + bw) + ' ' + bot +
         ' L' + (cx + bw) + ' ' + top + '" fill="none" stroke="#8FA3B8" stroke-width="4" stroke-linejoin="round"/>';
    s += '<line x1="' + (cx - bw) + '" y1="' + wy + '" x2="' + (cx + bw) + '" y2="' + wy +
         '" stroke="#7FB6D6" stroke-width="3"/>';

             mono.grain + '" stroke="' + mono.line + '" stroke-width="1"/>';

    for (i = 0; i < Math.min(nokori * 3, 24); i++){

    return s;
  }
};

/* ================== ③たねの 発芽 ==================
   10つぶ まいて 何こ 芽が 出るか。水・空気・温度が そろって いれば 9こ、
   1つでも かけて いれば 0こ。日光と 肥料では かわらない ―― それを 目で 見せる。 */
function hatsugaN(v){
  var kuki = (v.kuki === null || v.kuki === undefined) ? 1 : v.kuki;
  return (v.mizu && kuki && v.ondo >= 20) ? 9 : 0;
}
SIMS.hatsuga = {
  ask:  'よそう：たくさん 芽が 出るのは？',
  hint: 'どちらが たくさん 芽を 出すか よそうして みよう',
  speed: 1,
  words:{ name:'発芽した たねの 数', sameSetup:'A と B が 同じ じょうけんに なって いたよ。' },
  measure: function(v){ return hatsugaN(v); },
  total: function(v){ return 2.6; },
  summary: function(v){
    var t = [];
    t.push(v.mizu ? '水あり' : '水なし');
    if (v.kuki !== null && v.kuki !== undefined) t.push(v.kuki ? '空気あり' : '水の中');
    t.push(v.ondo + 'ど');
    if (v.hikari !== null && v.hikari !== undefined) t.push(v.hikari ? '日光あり' : '日光なし');
    if (v.hiryo !== null && v.hiryo !== undefined) t.push(v.hiryo ? '肥料あり' : '肥料なし');
    return t.join(' ・ ');
  },
  n: function(inf, shown){
    if (!inf.val) return 0;
    return Math.max(0, Math.min(inf.val, Math.floor((shown - 0.7) / 0.18)));
  },
  readout: function(inf, shown){
    return { top:'まいた たね 10つぶ', bottom: SIMS.hatsuga.n(inf, shown) + ' こ 発芽' };
  },
  line: function(A, B, diff){
    return diff ? '（A は ' + A.val + 'こ、B は ' + B.val + 'こ 発芽した）'
                : 'どちらも ' + A.val + 'こ。ぴったり 同じ！';
  },
  art: function(side, cx, v, inf, t, stopped){
    var n = SIMS.hatsuga.n(inf, stopped ? inf.total : t), i;
    var s = '', top = 130;
    /* シャーレ */
    s += '<ellipse cx="' + cx + '" cy="' + (top + 76) + '" rx="86" ry="26" fill="#EEF3F7" stroke="#8FA3B8" stroke-width="3"/>';
    s += '<path d="M' + (cx - 86) + ' ' + (top + 60) + ' v16 M' + (cx + 86) + ' ' + (top + 60) + ' v16" stroke="#8FA3B8" stroke-width="3"/>';
    s += '<ellipse cx="' + cx + '" cy="' + (top + 60) + '" rx="86" ry="26" fill="' + (v.mizu ? '#DCEBF5' : '#F6EFE2') +
         '" stroke="#8FA3B8" stroke-width="3"/>';
    if (v.kuki === 0)
      s += '<ellipse cx="' + cx + '" cy="' + (top + 44) + '" rx="86" ry="26" fill="#BEDCEE" opacity=".75" stroke="#7FB6D6" stroke-width="3"/>';
    /* たね 10つぶ */
    for (i = 0; i < 10; i++){
      var a = i * 2.39, rad = 62 * Math.sqrt((i + 0.5) / 10);
      var sx = cx + Math.cos(a) * rad, sy = top + 60 + Math.sin(a) * rad * 0.3;
      s += '<ellipse cx="' + sx.toFixed(1) + '" cy="' + sy.toFixed(1) + '" rx="6" ry="4.5" fill="#B4844F" stroke="#8C6135" stroke-width="1.5"/>';
      if (i < n)
        s += '<path d="M' + sx.toFixed(1) + ' ' + sy.toFixed(1) + ' q-3 -12 4 -18 q3 8 -1 18" fill="#4FC46A" stroke="#2E9A4C" stroke-width="1.6"/>';
    }
    /* おん度と 日光の ようす */
    s += '<text x="' + cx + '" y="' + (top - 22) + '" font-size="13" font-weight="900" fill="' +
         (v.ondo >= 20 ? '#E08A00' : '#3EA7D8') + '" text-anchor="middle">' +
         (v.ondo >= 20 ? '🌡️ あたたかい へや' : '🧊 さむい れいぞうこ') + '</text>';
    if (v.hikari === 0)
      s += '<text x="' + cx + '" y="' + (top - 44) + '" font-size="12" font-weight="900" fill="#5A7C93" text-anchor="middle">🌑 はこを かぶせて 光を 通さない</text>';
    else if (v.hikari === 1)

    return s;
  }
};

function jkStop(){
  if (cur.raf){ cancelAnimationFrame(cur.raf); cur.raf = null; }
}
function loadJikken(st){
  jkStop();
  cur.exp = { A:{}, B:{} };
  /* えらびようが 1つしか ない じょうけんは 先に 入れて おく（子どもを 迷わせない） */
  st.vars.forEach(function(v){
    if (v.values.length === 1){ cur.exp.A[v.id] = 0; cur.exp.B[v.id] = 0; }
  });
  cur.phase = 'set'; cur.pred = null; cur.t = 0; cur.fin = { A:null, B:null };
}
function jikkenState(){
  var st = curStage(), all = true, targetDiff = false, othersSame = true;
  st.vars.forEach(function(v){
    var a = cur.exp.A[v.id], b = cur.exp.B[v.id];
    if (a === undefined || b === undefined){ all = false; return; }
    if (v.id === st.target){ if (a !== b) targetDiff = true; }
    else if (a !== b) othersSame = false;
  });

}
function jikkenFair(){
  var r = jikkenState();
  return r.all && r.targetDiff && r.othersSame;
}
/* クリアは「くみ立てが 正しくて、じっけんを 走らせて けっかを 見た」ときだけ */
function jikkenOK(){ return cur.phase === 'done' && jikkenFair(); }

function jkSim(){ return SIMS[curStage().sim]; }
function jkInfo(side){

  var total = sim.total ? sim.total(v) : T * sim.laps;
  var val = sim.measure ? sim.measure(v) : T;
  return { v:v, T:T, total:total, val:val };
}

/* ------------------ ②③ じっけん／けっかの がめん ------------------ */
function jkRead(sim, inf, shown){

}
function jkRenderRun(){
  var sim = jkSim();

  var vd = done ? jkVerdict(A, B) : null;

    s += sim.art(side, cx, inf.v, inf, cur.t, fin !== null && done);
    s += '<rect x="' + (cx - 108) + '" y="312" width="216" height="62" rx="14" fill="' +
         (fin !== null ? '#E6F7EA' : '#F1F6F9') + '" stroke="' + (fin !== null ? '#2E9A4C' : '#DCE5EB') + '" stroke-width="2"/>';
    s += '<text id="jk-lap' + side + '" x="' + cx + '" y="335" font-size="14" font-weight="900" fill="#3B5A70" text-anchor="middle">' +

  });

      s += '<text x="300" y="' + (panelY + 26 + i * 22) + '" font-size="14" font-weight="900" fill="' +

      s += '<g transform="translate(300,' + by2 + ')"><rect x="-116" y="-17" width="232" height="34" rx="17" fill="#E08A00"/>' +
           '<text x="0" y="6" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">↺ もういちど くみたてる</text>' +

  if (done) tryClear(jikkenOK());

/* けっかの こうひょう。ここで 答えを 言うのでは なく、見えた ことを ことばに する */
function jkVerdict(A, B){
  var st = curStage(), sim = jkSim(), r = jikkenState();
  var w = sim.words || {};
  var mName = w.name || 'けっか';
  var d = Math.abs(A.val - B.val);
  var diff = d > (sim.eps || 0.05);
  /* ごさの はんいの ちがいを「かわらなかった」と 言いきると うそに なるので ことばを 分ける */
  var changed = diff ? 'かわった' : (d > 1e-9 ? 'ほとんど かわらなかった' : 'かわらなかった');
  var tName = '';
  st.vars.forEach(function(v){ if (v.id === st.target) tName = v.label; });
  if (!r.targetDiff)
    return { good:false, retry:true, lines:[
      w.sameSetup || 'A と B が 同じ じょうけんに なって いたよ。',
      'これでは「' + tName + '」を くらべられないね。'] };
  if (!r.othersSame)
    return { good:false, retry:true, lines:[
      mName + 'は ' + (diff ? 'ちがった' : '同じだった') + '。でも…',
      'A と B は ちがう ところが 2つ いじょう あるよ。',
      'これでは どちらが きいたのか 分からないね。'] };
  var predOK = (cur.pred === 'same' && !diff) ||
               (cur.pred === 'A' && diff && A.val > B.val) ||
               (cur.pred === 'B' && diff && B.val > A.val);
  return { good:true, retry:false, lines:[
    (predOK ? '⭐ よそう どおり！' : '✨ よそうと ちがった！ それが 発見だよ'),
    '「' + tName + '」だけを かえたら、' + mName + 'は ' + changed + '。',
    sim.line(A, B, diff)] };
}

/* ------------------ アニメ ------------------ */
function jkTick(){
  var sim = jkSim(), changed = false;
  ['A','B'].forEach(function(side){
    var inf = jkInfo(side);
    if (cur.fin[side] === null && cur.t >= inf.total) cur.fin[side] = inf.total;
    var fin = cur.fin[side];
    var shown = (fin !== null) ? fin : cur.t;
    var ro = jkRead(sim, inf, shown);
    var lt = document.getElementById('jk-lap' + side), tt = document.getElementById('jk-tim' + side);
    if (lt && lt.textContent !== ro.top){ lt.textContent = ro.top; changed = true; }
    if (tt && tt.textContent !== ro.bottom){ tt.textContent = ro.bottom; changed = true; }
    if (sim.tick) sim.tick(side, side === 'A' ? 170 : 430, inf, cur.t, fin);
  });
  /* えが なめらかに うごかない じっけんは、数字が かわった ときだけ かきなおす（かるくする ため） */
  if (!sim.tick && changed && cur.phase === 'run') renderBoard();
}
function jkStartRun(){
  cur.phase = 'run'; cur.t = 0; cur.fin = { A:null, B:null };
  renderBoard();
  var speed = jkSim().speed || JK.speed;
  var last = null;
  function step(now){
    if (cur.phase !== 'run' || cur.kind !== 'jikken'){ cur.raf = null; return; }
    if (last === null) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    cur.t += dt * speed;
    jkTick();
    if (cur.fin.A !== null && cur.fin.B !== null){ cur.raf = null; jkFinish(); return; }
    cur.raf = requestAnimationFrame(step);
  }
  cur.raf = requestAnimationFrame(step);
}
function jkFinish(){
  jkStop();
  ['A','B'].forEach(function(side){ if (cur.fin[side] === null) cur.fin[side] = jkInfo(side).total; });
  cur.phase = 'done';
  renderBoard();
}

function renderJikken(){
  if (cur.phase === 'set' || !jkSim()) jkRenderSet();
  else jkRenderRun();
}
function tapJikken(e){
  var g2 = attrUp(e.target, 'data-go2');
  if (g2 !== null){
    jkStop();
    if (g2 === 'run') jkStartRun();
    else { cur.phase = 'set'; renderBoard(); }
    return;
  }
  if (cur.phase === 'run'){ jkFinish(); return; }      /* まちきれない ときは タップで けっかへ */
  if (cur.phase === 'done') return;
  var pr = attrUp(e.target, 'data-pred');
  if (pr !== null){ cur.pred = pr; renderBoard(); return; }
  var v = attrUp(e.target, 'data-exp');
  if (v === null) return;
  var a = v.split('|');
  cur.exp[a[0]][a[1]] = parseInt(a[2], 10);
  renderBoard();
}
ENGINES.jikken = { load:loadJikken, render:renderJikken, tap:tapJikken };

/* ================================================================== *
 * みつける型 — 図の 上の 正しい ところを タップ する
 *
 *   targets に「あたり」の まるを おいて、asks で 1つずつ 聞く。
 *   まちがえても せめない。タップした ところの 名まえを 教えて、もういちど。
 *   あたった ものは 図に 名まえが のこるので、すすむほど 図が 完成する。
 * ================================================================== */
function loadMitsukeru(st){
  cur.qi = 0; cur.found = []; cur.miss = null;
}
function mkTarget(id){
  var ts = curStage().targets;
  for (var i=0;i<ts.length;i++){ if (ts[i].id === id) return ts[i]; }
  return null;
}
/* --- 図の とうろく。st.art で えらぶ（書かなければ 'karada'）。
       あたらしい 単元を 足すときは ここに 1つ 足すだけ --- */
var ARTS = {};
var ART_MSG = { karada:'からだの 図を タップ してね', suiyoueki:'びんを タップ してね' };

ARTS.karada = bodyArt;

/* --- 花の つくり（たてに 切った ところ）。おしべ・めしべ・花びら・がく・子ぼう --- */
function hanaArt(){
  var s = '';
  s += '<path d="M300 412 V300" stroke="#2E9A4C" stroke-width="9" stroke-linecap="round"/>';
  s += '<path d="M300 366 q-40 -8 -58 -34 q34 -6 58 18 Z" fill="#4FC46A" stroke="#2E9A4C" stroke-width="2.5"/>';
  /* 花びら（4まい） */
  [[196,146,-28],[404,146,28]].forEach(function(q){
    s += '<g transform="translate(' + q[0] + ',' + q[1] + ') rotate(' + q[2] + ')">' +
         '<path d="M0 46 q-42 -18 -40 -52 q2 -30 40 -34 q38 4 40 34 q2 34 -40 52 Z" fill="#F7A8C4" stroke="#D07A9C" stroke-width="3"/></g>';
  });
  /* がく */
  s += '<path d="M300 302 q-40 -4 -74 16 q30 18 74 0 Z" fill="#4FC46A" stroke="#2E9A4C" stroke-width="3"/>';
  s += '<path d="M300 302 q40 -4 74 16 q-30 18 -74 0 Z" fill="#4FC46A" stroke="#2E9A4C" stroke-width="3"/>';
  /* 子ぼう（実に なる ところ） */
  s += '<ellipse cx="300" cy="288" rx="30" ry="26" fill="#B9E4C4" stroke="#2E9A4C" stroke-width="3"/>';
  [[-10,288],[0,294],[10,286]].forEach(function(q){
    s += '<circle cx="' + (300 + q[0]) + '" cy="' + q[1] + '" r="5" fill="#fff" stroke="#2E9A4C" stroke-width="1.6"/>';
  });
  /* おしべ（2本。先に 花ふん） */
  [[-1, 238, 204], [1, 362, 204]].forEach(function(q){
    s += '<path d="M300 274 Q' + (300 + q[0] * 52) + ' 250 ' + q[1] + ' ' + (q[2] + 10) +
         '" fill="none" stroke="#C9A227" stroke-width="4"/>';
    s += '<ellipse cx="' + q[1] + '" cy="' + q[2] + '" rx="15" ry="11" fill="#F5B324" stroke="#C9820A" stroke-width="2.5" transform="rotate(' +
         (q[0] * 24) + ' ' + q[1] + ' ' + q[2] + ')"/>';
    for (var i = 0; i < 4; i++)
      s += '<circle cx="' + (q[1] + q[0] * (8 + i * 5)) + '" cy="' + (q[2] - 16 - i * 4) + '" r="2.6" fill="#F5B324"/>';
  });
  /* めしべ（子ぼうから 上へ。先が ちゅうとう） */
  s += '<path d="M300 268 V196" stroke="#7FBF8E" stroke-width="6" stroke-linecap="round"/>';
  s += '<ellipse cx="300" cy="186" rx="17" ry="13" fill="#B9E4C4" stroke="#2E9A4C" stroke-width="3"/>';
  return s;
}
ARTS.hana = hanaArt;
ART_MSG.hana = '花の 図を タップ してね';

/* --- 川を 上から 見た 図（S字に 2回 まがる）。外がわ／内がわを 目で 見て 考える --- */
function kawaArt(){

  var s = '';
  /* はいけいは しつもんバー（y=14〜60）を かくさない ように 下から */
