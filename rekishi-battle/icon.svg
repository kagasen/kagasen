<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- レキシバトル アプリアイコン: 金の兜（かぶと）と 交差した刀。
       ★ホーム画面では 小さく出るので **形だけで分かる**ように作る。
         ①刀は **兜より先に** 描いて、切っ先と つかが 兜の 外に出るようにする
           （中に かくれると「ただの棒」に見える。1回 そうなった）
         ②顔・文字・細かい絵は 入れない（ちぢめると つぶれる）
       ★色は アプリのホームと同じ 墨紺＋金（見つけやすさは 色で つくる）。 -->
  <rect width="512" height="512" rx="96" fill="#111b2b"/>
  <rect x="14" y="14" width="484" height="484" rx="84" fill="none" stroke="#6b5220" stroke-width="10"/>

  <!-- 交差した刀（兜の うしろ）。切っ先＝上の外がわ／つか＝下の外がわ -->
  <g stroke-linecap="round">
    <g stroke="#dfe6ea" stroke-width="19">
      <line x1="120" y1="404" x2="424" y2="182"/>
      <line x1="392" y1="404" x2="88" y2="182"/>
    </g>
    <g stroke="#e0b64d" stroke-width="27">           <!-- つば -->
      <line x1="150" y1="382" x2="158" y2="376"/>
      <line x1="362" y1="382" x2="354" y2="376"/>
    </g>
    <g stroke="#7b5c46" stroke-width="23">           <!-- つか -->
      <line x1="104" y1="424" x2="146" y2="392"/>
      <line x1="408" y1="424" x2="366" y2="392"/>
    </g>
  </g>

  <!-- 兜（かぶと） -->
  <path d="M256 150 c-80 0 -132 52 -132 112 c0 20 8 34 20 42 l224 0 c12 -8 20 -22 20 -42 c0 -60 -52 -112 -132 -112z"
        fill="#33405c" stroke="#0b1220" stroke-width="9"/>
  <!-- しころ（首まわり） -->
  <path d="M124 296 c-16 32 -20 66 -16 98 l64 0 c-6 -32 -6 -66 2 -98z" fill="#3f4f70" stroke="#0b1220" stroke-width="9"/>
  <path d="M388 296 c16 32 20 66 16 98 l-64 0 c6 -32 6 -66 -2 -98z" fill="#3f4f70" stroke="#0b1220" stroke-width="9"/>
  <!-- まびさし -->
  <rect x="140" y="288" width="232" height="32" rx="16" fill="#f0d183" stroke="#a5761f" stroke-width="8"/>
  <!-- 前立て（三日月）＝ぱっと見の 目じるし -->
  <path d="M256 76 c-62 24 -88 74 -80 120 c24 -50 58 -70 80 -76 c22 6 56 26 80 76 c8 -46 -18 -96 -80 -120z"
        fill="#f0d183" stroke="#a5761f" stroke-width="8" stroke-linejoin="round"/>
</svg>
