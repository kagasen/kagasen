  save.deck = [];              /* ★引いた人だけを 入れる（セーブの はじめのデッキは 持っていない人） */
  persist();
}

/* ---------- 画面の切りかえ ---------- */
var cur = "";
var state = { stage: null, quiz: null, starter: false };   /* starter＝はじめてのガチャ3回の さいちゅう */
function showView(id, title, backable) {
  cur = id;
  document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("on"); });
  $(id).classList.add("on");
  $("tb-title").innerHTML = rubi(title || "レキシバトル");
  $("tb-back").classList.toggle("tb-hidden", !backable);
  /* 🏠アプリ集へ もどるリンクは **ホームだけ**（ほかの画面では 左上は「もどる」が使う） */
  $("tb-home").classList.toggle("tb-hidden", id !== "v-home");
  /* ★人物をならべる画面だけ よこに ひろげる（上の main.wide） */
  document.querySelector("main").classList.toggle("wide", id === "v-hensei" || id === "v-cards");
  /* ★ホームだけ 墨紺＋金の 見た目にする（2026-08-11）。ここで body に 付けはずしするので、
     ほかの画面の クリーム色には いっさい さわらない（CSSは ぜんぶ `body.home` の中）。 */
  document.body.classList.toggle("home", id === "v-home");
  bgmPlay(bgmForView(id));      /* バトルに入ると 曲が変わる（同じ曲なら 鳴りなおさない） */
}
$("tb-back").onclick = function () {
  if (cur === "v-battle") { B = null; goHome(); return; }   /* バトル中断＝報酬なしでホームへ */
  goHome();
};

/* ---------- ホーム ---------- */
/* ★★シリーズ番号（1／2／3）。**2と3を見わけるときは かならず これを通すこと**。
   chars-data.js は 2にも3にも `hard: true` を付けている（＝「1シリーズではない」の意味）ので、
   `st.hard` だけで見ると **3が 2とおなじあつかい**になる（ガチャの確率・ざこの強さ・見出し）。
   1シリーズには series を書いていないので、無ければ 1。 */
function seriesOf(st) { return (st && st.series) || 1; }
/* ステージは まえの1つをクリアすると あく。並び順が 1→2→3 なので、
   **「2」を ぜんぶクリアすると「3」があく** のは これだけで自動的にそうなる。 */
function stageUnlocked(i) { return i === 0 || !!save.cleared[STAGES[i - 1].id]; }
function drawSoundBtn() {
  var b = $("btn-sound");
  b.textContent = SND_ON ? "🔊 おと オン" : "🔇 おと オフ";
  b.className = "sound-btn" + (SND_ON ? "" : " off");
  /* ★🔊が オフのときは 🎵も オフに見せる（おおもとのスイッチなので）。
     🎵の おぼえ（save.bgm）は そのままなので、🔊を もどせば 曲も もどる。 */
  var m = $("btn-bgm"), on = BGM_ON && SND_ON;
  m.textContent = on ? "🎵 きょく オン" : "🎵 きょく オフ";
  m.className = "sound-btn" + (on ? "" : " off");
}
$("btn-sound").onclick = function () {
  SND_ON = !SND_ON;
  save.sound = SND_ON;
  persist();
  drawSoundBtn();
  sfx("tap");            /* オンにした しゅんかんに 音が出て「もどった」と分かる */
  if (SND_ON) bgmPlay(bgmForView(cur)); else bgmStop(true);
};
$("btn-bgm").onclick = function () {
  BGM_ON = !BGM_ON;
  save.bgm = BGM_ON;
  persist();
  drawSoundBtn();
  sfx("tap");
  if (BGM_ON) bgmPlay(bgmForView(cur)); else bgmStop(true);
};
/* 🧑‍🤝‍🧑 ホームの 人物の行列（2026-08-11・ユーザー要望「歴史のキャラクターが出てきたり」）。
   ★★**CHARS は 時代順にならんでいる**（chars-data.js）ので、そこから 等間かくに ぬくだけで
     「弥生 → 明治」の **行列**になる。ここに名前を べた書きしないこと＝
     人物を足しても 自動で ならびが 更新される（CLAUDE.md §8）。
   ★もっている人は 立ち絵のまま、まだの人は うすい影絵（standHTML が rar なしで 影絵にする）
     ＝**集めるほど 行列に 色がついていく**。ホームに もどるたび 進みぐあいが 絵で分かる。 */
var PARADE_N = 11;
function drawParade() {
  var box = $("home-parade");
  if (!box) return;
  var s = "";
  for (var i = 0; i < PARADE_N; i++) {
    var ch = CHARS[Math.round(i * (CHARS.length - 1) / (PARADE_N - 1))];
    var rar = bestRarity(ch.id);
    s += '<span class="pd' + (rar ? "" : " no") + '" title="' + plain(ch.name) + '">'
       + standHTML(ch, rar, 46) + '</span>';
  }
  box.innerHTML = s;
}
function goHome() {
  B = null;
  drawSoundBtn();
  var got = ownedIds().length, total = 0;
  CHARS.forEach(function (c) { var cc = cardCnt(c.id); total += cc.n + cc.r + cc.sr; });
  var stars = 0;
  STAGES.forEach(function (st) { stars += chalCount(st.id); });
  $("home-stats").innerHTML = rubi("🃏 カード " + total + "まい ／ 人物《じんぶつ》 " + got + "／" + CHARS.length + "人")
    + '<div class="hs-star">' + rubi("⭐ " + stars + "／" + (STAGES.length * CHALS.length)) + '</div>';
  drawParade();
  var el = $("stage-list");
  el.innerHTML = "";
  /* シリーズの変わり目に 見出しを1つはさむ（51個が だらっと並ぶのを防ぐ）。
     ★★**シリーズが変わったところ**に出す（前は「最初の hard」を1回だけ探していたので、
       3を足したときに 3の見出しが出なかった）。シリーズを足しても 自動でついてくる。 */
  var SERIES_SEP = {
    2: { open: "🔥 ここから「2」！ もっと強《つよ》い てき／レアが 出やすい",
         lock: "🔒 ぜんぶ クリアすると「2」が あらわれる…" },
    3: { open: "💀 ここから「3」＝激《げき》ムズ！ スーパーレアの 力《ちから》が いる…",
         lock: "🔒 「2」を ぜんぶ クリアすると「3」が あらわれる…" }
  };
  STAGES.forEach(function (st, i) {
    var sep = (i > 0 && seriesOf(st) !== seriesOf(STAGES[i - 1])) ? SERIES_SEP[seriesOf(st)] : null;
    if (sep) {
      var h = document.createElement("div");
      h.className = "stage-sep s" + seriesOf(st) + (stageUnlocked(i) ? " open" : "");
      h.innerHTML = rubi(stageUnlocked(i) ? sep.open : sep.lock);
      el.appendChild(h);
    }
    var b = document.createElement("button");
    b.className = "stage-btn" + (seriesOf(st) === 2 ? " hard" : (seriesOf(st) === 3 ? " hard3" : ""));
    var open = stageUnlocked(i);
    b.disabled = !open;
    /* ★★その面の **時代の絵**を 札そのものにする（2026-08-11）。
       17枚の絵は もう あるのに、ホームでは 1枚も 使っていなかった＝
       「全く歴史観がない」の いちばんの原因。
       ★`loading="lazy"` は 必ず つけること。51枚を いっぺんに 読むと
         一覧を ひらいた しゅんかんが 重くなる。
       ★`onerror` で 絵を 消す。絵が 無くても 暗い札として ちゃんと 読める。 */
    b.innerHTML = (st.photo
        ? '<img class="sb-photo" loading="lazy" alt="" src="images/bg/' + st.photo + '.webp?v=' + ASSET_V
          + '" onerror="this.style.display=\'none\'">'
        : '')
      + '<span class="sb-veil"></span><span class="sb-in">'
      + '<span class="sb-name"><span class="sb-era">' + rubi(st.era) + '</span>' + rubi(st.name) + '</span>'
      /* ★その面の 主役（ticker）の顔。「この面は だれの面か」が 絵で 伝わる。
         もっていない人は 顔わくだけ（faceHTML が 名前1文字を 出す）＝集める目じるしにもなる。 */
      + '<span class="sb-faces">'
      + (open ? st.ticker.slice(0, 3).map(function (id) {
            var ch = CHAR_BY_ID[id];
            return ch ? faceHTML(ch, bestRarity(id) || "n", 34) : "";
          }).join("") : "")
      + '</span>'
      /* ★⭐は 3つ出す（クリアだけなら ⭐☆☆）。「まだ とれる ⭐が ある」が ひと目で分かる
         ＝ 一度クリアした面に もう一度 もどる理由になる（2026-08-09）。 */
      + '<span class="sb-state' + (chalCount(st.id) === CHALS.length ? " sb-all" : "") + '">'
      + (save.cleared[st.id] ? starText(st.id) : (open ? "▶" : "🔒")) + '</span>'
      + '</span>';
    if (open) b.onclick = function () { openStage(st); };
    el.appendChild(b);
  });
  showView("v-home", "レキシバトル", false);
}
$("btn-cards").onclick = function () { renderCards(); };

/* ---------- へんせい（3人えらぶ） ---------- */
function openStage(st) {
  state.stage = st;
  /* デッキを手持ちだけに掃除し、からっぽなら手持ち順で3人うめる */
  save.deck = save.deck.filter(function (id) { return ownedTotal(id) > 0; });
  ownedIds().forEach(function (id) { if (save.deck.length < 3 && save.deck.indexOf(id) < 0) save.deck.push(id); });
  renderHensei();
}
function renderHensei() {
  var st = state.stage;
  /* ★時代とステージ名は **1行**にまとめてある（人物のカードに 高さをゆずるため。2026-08-09） */
  /* ★見出しの時代は **札と同じ色の丸札**（2026-08-11）。人物の帯と 色が そろうので、
     「この色の帯の人を えらぶと ⭐（1.5倍）」が 目で つながる。 */
  $("hs-head").innerHTML = '<div><span class="hs-era">' + eraChipHTML(st.era) + '</span>'
    + '<span class="hs-name">' + rubi(st.name) + '</span></div>'
    + '<div class="hs-desc">' + rubi(st.desc) + '</div>'
    + '<div class="hs-tip">' + rubi("⭐マークは この時代の人物《じんぶつ》。えらぶと 1.5倍《ばい》 つよくなるよ！") + '</div>'
    /* ⚔ てきの とくちょう（2026-08-11・ユーザー要望「そういう情報があれば キャラを変える
         きっかけになるかも」）。★★**ここに出すのが 肝**。敵に個性をつけても、
       へんせい画面＝**人をえらぶ その場所**に書いていないと、負けてから気づくことになる。
       ★★を **太字**に変えて、いちばん だいじな ところが ひと目で 分かるようにする。 */
    + (function () {
        var k = kataOf(st);
        return '<div class="hs-kata"><span class="hk-ttl">' + k.icon + ' てきの とくちょう</span>'
          + '<span class="hk-name">' + k.name + '</span>'
          + '<span class="hk-tip">' + rubi(k.tip.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')) + '</span></div>';
      })()
    /* 2・3シリーズだけ、ごほうびが上がっていることを へんせいの時点で見せる（挑戦する理由になる）。
       ★3は **必要なもの（スーパーレア）も 書く**。書かないと 何度も負けてから気づくことになる。 */
    + (seriesOf(st) === 2
        ? '<div class="hs-desc hs-hard">' + rubi("🔥 「2」は てきが つよい！ そのかわり クイズ全問《ぜんもん》せいかいで レア45％・スーパーレア10％！") + '</div>'
        : (seriesOf(st) === 3
            ? '<div class="hs-desc hs-hard3">' + rubi("💀 「3」は 激《げき》ムズ！ スーパーレアが 3体《たい》ぐらい いないと きびしい。"
                + " そのかわり クイズ全問《ぜんもん》せいかいで レア50％・スーパーレア30％！") + '</div>'
            : ''));
  /* 🤝 いまのデッキで組めるコンビを見せる（2026-08-09）。
     ★これが無いと「そろえると強い」に **気づけない**（バトル中にたまたま出るのを待つことになる）。
       へんせい画面で見せることで、はじめて「だれと だれを つれていくか」を考える理由になる。
     ★まだ組めていないコンビは 出さない。ずかんの「ぜんぶ見せる」は べつの話で、
       ここに全部ならべると 持っていない人だらけの表になって じゃまになる。 */
  var have = {};
  save.deck.forEach(function (id) { have[id] = 1; });
  var got = PAIRS.filter(function (p) { return have[p.a] && have[p.b]; });
  $("hs-pairs").innerHTML = got.length
    ? '<div class="hp-ttl">' + rubi("🤝 いっしょに 出すと つよくなる コンビ") + '</div>'
      + got.map(function (p) {
          return '<div class="hp-row"><b>' + rubi(p.name) + '</b>'
               + '<span>' + CHAR_BY_ID[p.a].name + " ＋ " + CHAR_BY_ID[p.b].name + '</span></div>';
        }).join("")
    : '<div class="hp-ttl hp-non">' + rubi("🤝 コンビが そろうと つよくなる！ 同《おな》じ時代《じだい》の人を さがしてみよう") + '</div>';
  /* ⭐チャレンジ。**たたかう前に見せる**のがだいじ（あとで知っても もう1回やる気にならない） */
  var cc = chalOf(st.id);
  $("hs-chal").innerHTML = '<div class="hc-ttl">' + rubi("⭐ この ステージの めあて") + '</div>'
    + CHALS.map(function (k) {
        return '<div class="hc-row' + (cc[k.id] ? " got" : "") + '">'
             + '<span class="hc-i">' + (cc[k.id] ? k.icon : "☆") + '</span>' + rubi(chalName(k, st)) + '</div>';
      }).join("")
    /* ★2つ そろえたときの ごほうびを **たたかう前に**知らせる。
       知らないと わざわざ むずかしい かちかたを する理由が生まれない（2026-08-09）。
       ★★**アイコン（⏳🕊）で書かないこと**（2026-08-09・ユーザー指摘
         「砂時計と鳥ができたら、が なんのことか わからない」）。
         上の めあての行は **まだ取っていないと ☆** なので、⏳や🕊は どこにも 出ていない＝
         見くらべようがなかった。**かならず めあての文そのもの**を書く。
         `chalName()` を通しているので、弥生の「卑弥呼を つかって かつ」にも ついてくる。 */
    /* ★ふりがなの《》は のこしたまま rubi() に わたすこと（plain() で消すと ふりがなが 出ない） */
    /* ★★`his`の面は ⏳が「ひっさつを **つかって**」なので 🕊「**つかわずに**」とは
         同時に できない。その面は **⏳ひとつで** ボーナス（winBattle の hardWin と 対）。
         `use`の面は 両立するので これまでどおり 2つそろえて。
         ここを 直しわすれると 画面の やくそくと 中身が くいちがう。 */
    + '<div class="hc-bonus">' + rubi(stageChalKind(st) === "his"
        ? "🎁 「" + chalName(CHALS[1], st) + "」が できたら、"
          + "ガチャで レアが 出やすくなる！（＋" + Math.round(CHAL_R_BONUS * 100) + "％）"
        : "🎁 「" + chalName(CHALS[1], st) + "」と 「" + CHALS[2].name + "」を いっしょに できたら、"
          + "ガチャで レアが 出やすくなる！（＋" + Math.round(CHAL_R_BONUS * 100) + "％）") + '</div>'
    /* ★★まだ もっていない人が いるときは そう言う（2026-08-11）。
       合戦の面の ⏳は **名ざしの人物**が いないと ぜったいに とれない。
       それを 書かないと、子どもは「なんど やっても ⭐が つかない」だけになって、
       **とれない理由**に たどりつけない（CLAUDE.md §5「見て分かる」）。
       ★せめる言い方には しない。「ガチャで さがそう！」＝つぎの行動を 示す。 */
    + (function () {
        var yet = stageChalChars(st).filter(function (c) { return ownedTotal(c.id) <= 0; });
        return yet.length
          ? '<div class="hc-bonus">' + rubi("🔎 " + yet.map(function (c) {
              return plain(c.name) + "《" + c.yomi + "》";
            }).join("・") + " は まだ なかまに いないよ。ガチャで さがそう！") + '</div>'
          : "";
      })();
  var slots = $("deck-slots");
  slots.innerHTML = "";
  for (var i = 0; i < DECK_MAX; i++) {
    var d = document.createElement("div");
    var id = save.deck[i];
    if (id) {
      var ch = CHAR_BY_ID[id], rar = bestRarity(id);
      /* ★顔・名前・レベルだけ（レア度の帯は カードのほうで見える）。
         ここを みじかくしたぶん、下の 人物のカードが 多く見える（2026-08-09） */
      d.className = "dslot filled";
      d.innerHTML = faceHTML(ch, rar, window.innerWidth < 640 ? 24 : 32)
        + '<span class="dname">' + (eraBonus(ch) ? "⭐" : "") + ch.name + '</span>'
        + lvBadge(id);
    } else {
      d.className = "dslot";
      d.textContent = (i + 1) + "人目";
    }
    slots.appendChild(d);
  }
  var grid = $("hensei-grid");
  grid.innerHTML = "";
  ownedIds().forEach(function (id) {
    var ch = CHAR_BY_ID[id], rar = bestRarity(id);
    var b = document.createElement("button");
    b.className = "pick-btn" + (save.deck.indexOf(id) >= 0 ? " sel" : "");
    /* ★★カードを たてに みじかくした（191px→約128px。2026-08-09・ユーザー要望
         「キャラクター選びが一番楽しめる。なるべくスクロールなしで選びたい」）。
       8だんを 5だんに たたんだだけで、**中身は 1つも消していない**:
         時代・タイプ・ねだん を 1行にまとめ、レア度は **レベルの札の色**で見せる
         （もともと ノーマル=茶／レア=銀／スーパーレア=金 に 色分けしてあった。
          文字で書きなおすと 同じことを2回言うことになる）。 */
    /* ★時代は **いちばん上の帯**（2026-08-11・ユーザー要望）。名前より先に 目に入る。
       もとは 下の「あと○でレア！」と 同じ行に 小さな茶色の字で まざっていた（読み飛ばされていた）。
       帯にしても 高さは +11px で すむ（帯は 札の いちばん上の すきまを つかっている）。 */
    b.innerHTML = eraBandHTML(ch)
      + faceHTML(ch, rar, 38)
      + '<span class="pk-nm">' + ch.name + '</span>'
      + lvBadge(id)
      + '<span class="lv-next">' + nextGoal(id) + '</span>'
      /* ★いまのレベルの つよさを 数字で（2026-08-11・ユーザー要望）。
         図鑑と おなじ charPower を使う＝**2か所で ちがう数字を 出さない**。
         ⭐じだいボーナスは ここでも 入れない（名前の頭の ⭐印が その合図）。
         かいふく型は こうげきの かわりに かいふく量なので、しるしを ✨ に変える。 */
      + (function () {
          var p = charPower(ch);
          return '<span class="pk-meta"><span class="type-chip t-' + ch.type + '">' + TYPES[ch.type].icon + TYPES[ch.type].label + '</span>'
            + '<span class="pk-pow">' + (ch.type === "inori" ? "✨" : "⚔") + p.atk + ' 🛡' + p.hp + '</span>'
            + '<span class="rar-tag">🪙' + charStat(id).cost + '</span></span>';
        })();
    b.onclick = function () {
      var at = save.deck.indexOf(id);
      if (at >= 0) save.deck.splice(at, 1);
      else if (save.deck.length < DECK_MAX) save.deck.push(id);
      persist();
      renderHensei();
    };
    grid.appendChild(b);
  });
  $("btn-fight").disabled = save.deck.length < 1;
  showView("v-hensei", "なかまを えらんでね（" + save.deck.length + "／" + DECK_MAX + "）", true);
}
$("btn-fight").onclick = function () { if (save.deck.length >= 1) startBattle(); };

/* =====================================================================
   ★⭐チャレンジ（2026-08-09・ユーザー要望「クリア後に もどる理由がほしい」）
   ---------------------------------------------------------------------
   34面もあるのに **1回クリアしたら 二度と もどらない** のが もったいなかった。
   1つの面に ⭐が3つあると「もう1回 やってみよう」が生まれる。
   ★ぜんぶ **自動で判定できるもの**だけにしてある（ステージごとにデータを書かなくてよい。§8）。
   ★ねらいは ごほうびより **学習**。とくに「その時代の人だけで勝つ」は
     ⭐じだいボーナス（同じ時代をセットで覚える）を もう一段 強くする もの。
   ★★セーブは **save.cleared を いっさい さわらない**（ステージの かいじょう判定に
     使っているので、形を変えると 進みぐあいが こわれる。CLAUDE.md §3）。
     新しい入れもの `save.chal` を べつに足してある＝**古いセーブは そのまま生きる**。
   ===================================================================== */
var CHALS = [
  { id: "clear", icon: "⭐", name: "クリアする" },
  { id: "era",   icon: "⏳", name: "その時代《じだい》の人《ひと》だけで かつ" },
  { id: "nohis", icon: "🕊", name: "ひっさつを つかわずに かつ" }
];

/* ★★★⭐2つ目は **面ごとの 手書きミッション**（2026-08-11・ユーザー要望）
   ---------------------------------------------------------------
   ①「星２つ目のミッションは 例えば 織田信長と豊臣秀吉、徳川家康を つかって
      それぞれ必殺技を使う みたいなミッションもいいと思う！」
   ②「星２つ目のミッションを 全て作成して！ 基本難し目に設定で、できる限りその時代に合った
      キャラ3名以上を使って勝つ みたいにすることで、**キャラの固定化をなくします**」

   ⏳は もともと ぜんぶ自動判定（その時代の人だけで かつ）で、**どの面も おなじ めあて**。
   それだと 強い人ばかり 出すクセが ついて、**42人のうち 数人しか 育たない**。
   そこで 17面 ぜんぶに 手書きの めあてを 置いた。

   ★★★**42人 ぜんいんが どこかの めあてに 出る**ように 組んである（下の表で 確認ずみ）。
     ＝どの人物にも「この子を そだてる理由」が 1つ以上ある。
     人物を 足したときは **その人が どこにも 出ていない状態にしないこと**。

   ★2つの型がある（1つの面に どちらか 1つ）:
       { use: [人物id, …] } … その人たちを **ぜんいん 出して** かつ（3人以上が 基本）
       { his: [人物id, …] } … その人たちの **ひっさつを ぜんぶ** つかって かつ
     ・`use` は「その時代の人を そろえて おぼえる」ための型。
     ・`his` は 合戦の面や、その時代に 3人 いない面（弥生1人・鎌倉2人）で つかう。
       「できる限り 3名以上」＝**3人 いない時代は むりに ふやさず、ひっさつで むずかしくする**。
   ★人物idは chars-data.js の id。**ここに1行足すだけで増える**（CLAUDE.md §8）。
   ★「2」「3」シリーズは st.base で 1シリーズの めあてを 受けつぐ（クイズと 同じ流儀）。
   ★ここに 書かない面は 自動判定（その時代の人 だけで／つかって かつ）に もどる。
   ★★**⭐の数は 3つのまま**（4つ目には しない）。ふやすと ステージ一覧の ⭐⭐⭐が
     面によって そろわなくなる。CHALS[1] の **id は "era" のまま**なので、
     もう ⭐をとってある子の きろくは そのまま 生きる（CLAUDE.md §3）。
   ★★`his` の面だけ 🎁レア率ボーナスの じょうけんが 変わる（下の hardWin の★）。
     「ひっさつを つかって」と「ひっさつを つかわずに」は 同時に できないため。
     **`use` の面は これまでどおり ⏳＋🕊**（出して勝つのと ひっさつ無しは 両立する）。 */
var STAGE_CHAL = {
  /* 弥生 — 卑弥呼ひとりしか いない。人数で むずかしくできないので ひっさつで */
  st1:  { his: ["himiko"] },
  /* 飛鳥 — 国づくりの3人。つぎの 大化の改新で 4人ぜんいんに 上がる（だんだん むずかしく） */
  st4:  { use: ["shotoku", "imoko", "kamatari"] },
  st2:  { use: ["shotoku", "imoko", "nakanooe", "kamatari"] },
  /* 奈良 — 大仏づくりの3人。3人とも かいふく型なので **出すだけ**の型にしてある
     （ひっさつ縛りにすると 火力が足りず 勝てない） */
  st5:  { use: ["shomu", "gyoki", "ganjin"] },
  /* 平安 — 貴族と 武士で 面を 分ける。同じ時代でも **出す人が ちがう** */
  st6:  { use: ["michinaga", "murasaki", "seishonagon"] },   /* 貴族の世 — 国風文化の3人 */
  st3:  { his: ["kiyomori", "yoshitsune"] },                 /* 壇ノ浦 — 平氏と源氏、両方の大将 */
  /* 鎌倉 — 2人しか いないので ひっさつ（2人とも 撃つ） */
  st7:  { his: ["yoritomo", "tokimune"] },
  /* 室町 — 金閣の義満・銀閣の義政・水墨画の雪舟 */
  st8:  { use: ["yoshimitsu", "yoshimasa", "sesshu"] },
  /* 安土桃山 — 3人ぜんいん。★ザビエル（かいふく）を 入れることで
     「強い武将だけ 出す」クセを くずす＝固定化ふせぎの ねらいそのもの */
  st9:  { use: ["xavier", "nobunaga", "hideyoshi"] },
  st10: { his: ["nobunaga", "hideyoshi", "ieyasu"] },        /* 天下統一 — 三英傑（ユーザーの例） */
  /* 江戸 — 9人いるので 4面で **ひとりも かぶらない**ように 分けた */
  st11: { his: ["ieyasu", "iemitsu"] },                      /* 関ヶ原 — 幕府をひらいた家康と 固めた家光 */
  st12: { his: ["chikamatsu", "hiroshige"] },                /* 花さく江戸の文化 — 浄瑠璃と 浮世絵 */
  st13: { use: ["norinaga", "genpaku", "tadataka"] },        /* 新しい学問 — 国学・蘭学・測量 */
  st14: { use: ["perry", "kaishu"] },                        /* 黒船来航 — 来た人と むかえた人 */
  /* 明治・大正 — 11＋1人。3面で ぜんいんに 出番がまわるように 4人ずつ */
  st15: { use: ["saigo", "okubo", "takayoshi", "yukichi"] }, /* 明治維新 — 維新三傑＋福沢諭吉 */
  st16: { use: ["meiji", "hirobumi", "itagaki", "okuma"] },  /* 憲法と国会 — 発布した天皇と 政治の3人 */
  st17: { use: ["mutsu", "komura", "togo", "noguchi"] }      /* 世界の中の日本 — 条約改正・日露・医学 */
};
/* その面の 専用めあて（なければ null）。★「2」「3」シリーズは 元の面から 受けつぐ */
function stageChal(st) {
  if (!st) return null;
  return STAGE_CHAL[st.id] || STAGE_CHAL[st.base] || null;
}
/* 専用めあての 型（"his" か "use" か。なければ null） */
function stageChalKind(st) {
  var sc = stageChal(st);
  return sc ? (sc.his ? "his" : "use") : null;
}
/* 専用めあての 人物たち（データに ない id を 書いてしまっても 落ちないように ふるいにかける） */
function stageChalChars(st) {
  var sc = stageChal(st);
  if (!sc) return [];
  return (sc.his || sc.use).map(function (id) { return CHAR_BY_ID[id]; }).filter(Boolean);
}

/* ★★人数の少ない時代は ⏳を ゆるめる（2026-08-09・ユーザー指示）
   ---------------------------------------------------------------
   **同じ人物は場に1人まで**（設計合意1）なので、その時代の人が3人しか いなければ
   場に3人までしか 立てられない。弥生時代（卑弥呼ひとり）では **たったの1人**で、
   ⏳は とれる気がしない めあてになっていた。
   そこで **その時代の人が ERA_ONLY_MIN 人より少ないステージ**だけ、
   「その時代の人 **だけ** で かつ」→「その時代の人を **つかって** かつ」に ゆるめる。
   ★いまの人数で ここに かかるのは 弥生1(st1) / 鎌倉2(st7)。室町・安土桃山は3人＝そのまま。
     **人物を足すと 自動で きりかわる**（ステージごとに 何も書かなくてよい。CLAUDE.md §8）。
   ★奈良(3人)は 人数では かからないが、下の eraCanFight で ゆるいほうに入る。
   ★ゆるくても ⭐の数は同じ（⏳は⏳）。ここを別あつかいにすると、
     ステージ一覧の「⭐⭐⭐」が そろわない面ができて 気持ちわるいため。 */
var ERA_ONLY_MIN = 3;
/* そのステージの時代の人物（ガチャの eraPoolFor も ここを通す。同じ条件を2か所に書かない） */
function eraChars(st) {
  if (!st || !st.bonusEra) return [];
  return CHARS.filter(function (ch) {
    var e = plain(ch.era);
    return st.bonusEra.some(function (k) { return e.indexOf(k) >= 0; });
  });
}
/* ★★かいふくの人しか いない時代も ⏳を ゆるめる（2026-08-11・ユーザー指摘
     「弥生時代と奈良時代は回復キャラしかいないので（その時代の人だけ は）難しい」）
   ---------------------------------------------------------------
   人数だけ見ていたのが 抜けだった。**奈良時代は ちょうど3人（聖武天皇・行基・鑑真）**なので
   上の ERA_ONLY_MIN には かからないが、3人とも かいふく型（atk 12）で
   **てきを たおせる人が ひとりも いない**＝「その時代の人だけで かつ」は 手も足も出ない。
   そこで **こうげきできる人（かいふく以外）が 0人の時代**も ゆるいほうに入れる。
   ★いま かかるのは 弥生(1人・0)と 奈良(3人・0)だけ。安土桃山は ザビエルが かいふくでも
     信長・秀吉が いるので そのまま（＝ほかの面の むずかしさは 1つも 変わらない）。
   ★**人物を足すと 自動で きりかわる**（奈良に 武士や 知恵の人を 1人足せば もとの
     「だけで かつ」に もどる）。ステージごとに 何も書かなくてよい（CLAUDE.md §8）。 */
function eraCanFight(st) {
  return eraChars(st).some(function (ch) { return ch.type !== "inori"; });
}
function eraChalEasy(st) {
  return eraChars(st).length < ERA_ONLY_MIN || !eraCanFight(st);
}
/* めあての文。⏳だけ ステージによって 変わる。
   ①合戦の面（STAGE_CHAL にある）＝ その面の主役の ひっさつ
   ②人が少ない・かいふくしか いない時代 ＝ ゆるい「つかって かつ」
   ③そのほか ＝ もとの「その時代の人だけで かつ」 */
function chalName(k, st) {
  if (k.id !== "era") return k.name;
  var cs = stageChalChars(st);
  if (cs.length) {
    /* ★名前は 《よみ》つきで つなぐ（呼び出し側が rubi() を通すので ここでは 消さない）。
       「・」で ならべる＝4人でも 1行～2行に おさまる。
       ★★「ぜんいん」を 入れること。入れないと「どれか1人でいい」と 読まれる
         （☆のうちは まだ 何も 起きていないので、文だけが たより）。 */
    var names = cs.map(function (c) { return plain(c.name) + "《" + c.yomi + "》"; }).join("・");
    return stageChalKind(st) === "his"
      ? names + " の ひっさつを ぜんぶ つかって かつ"
      : names + " を ぜんいん 出《だ》して かつ";
  }
  if (!eraChalEasy(st)) return k.name;
  var pool = eraChars(st);
  return pool.length === 1
    ? plain(pool[0].name) + "《" + pool[0].yomi + "》を つかって かつ"
    : "その時代《じだい》の人《ひと》を つかって かつ";
}
/* この たたかいで ⏳の じょうけんを みたしたか（B を見るので バトル中・勝った直後だけ） */
function eraChalOk() {
  if (!B || B.deployed <= 0) return false;   /* だれも出していないなら つけない（下の★） */
  var cs = stageChalChars(state.stage);
  if (cs.length) {
    /* ★**ぜんいんぶん** そろえること。ひとりでも のこっていたら つかない。
       his … B.hisBy（fireHissatsu で 人物idごとに ○。同じ人を2回撃っても 1つぶん）
       use … B.depBy（deploy で ○。**出しただけで ○**＝たおされても 消えない。
              倒されたら 消す にすると、うしろの波で 死ぬたびに めあてが 逃げていく） */
    var mark = stageChalKind(state.stage) === "his" ? B.hisBy : B.depBy;
    return cs.every(function (c) { return mark[c.id]; });
  }
  return eraChalEasy(state.stage) ? B.eraAny : B.allEra;
}
function chalOf(id) { return save.chal[id] || {}; }
function chalCount(id) {
  var c = chalOf(id), n = 0;
  CHALS.forEach(function (k) { if (c[k.id]) n++; });
  return n;
}
/* ステージ一覧に出す「⭐⭐☆」。3つとも ついていれば 金色（CSSの .sb-all） */
function starText(id) {
  var c = chalOf(id), out = "";
  CHALS.forEach(function (k) { out += c[k.id] ? "⭐" : "☆"; });
  return out;
}
/* 勝ったときに ⭐を つける。★新しくついた ⭐だけを 返す（勝利画面で見せるため） */
function giveStars() {
  var id = state.stage.id;
  if (!save.chal[id]) save.chal[id] = {};
  var c = save.chal[id], got = [];
  function put(k) { if (!c[k]) { c[k] = true; got.push(k); } }
  put("clear");
  /* ★「出撃した人が ひとりもいない」ときは ⭐にしない。つくる型は
     だれも出さなくても 時間で完成して 勝てるので、それで ⭐が2つ付くのは おかしい。
     （その判定は eraChalOk() の中にある） */
  if (eraChalOk()) put("era");
  if (!B.usedHis) put("nohis");
  persist();
  return got;
}

/* ---------- カードいちらん・人物ずかん ---------- */
/* いちらん ⇄ 年表 の 切りかえ（2026-08-09）。おぼえておいて つぎに開いたときも 同じ画面 */
function setCardsView(v) {
  state.cardsView = v;
  $("tab-list").className = "ctab" + (v === "list" ? " on" : "");
  $("tab-time").className = "ctab" + (v === "time" ? " on" : "");
  $("tab-tri").className  = "ctab" + (v === "tri"  ? " on" : "");
  $("cards-grid").style.display = v === "list" ? "" : "none";
  $("timeline").className = v === "time" ? "on" : "";
  $("trivia-box").className = v === "tri" ? "on" : "";
  if (v === "time") renderTimeline();
  if (v === "tri") renderTrivia();
}
/* ★音は **指で押したときだけ**。setCardsView の中に書くと、画面をひらくたびに鳴る */
$("tab-list").onclick = function () { sfx("tap"); setCardsView("list"); };
$("tab-time").onclick = function () { sfx("tap"); setCardsView("time"); };
$("tab-tri").onclick  = function () { sfx("tap"); setCardsView("tri"); };

/* 📜 年表ずかん。CHARS は時代順にならんでいる（chars-data.js）ので、
   **ならび順のまま 時代で かたまりに切る**だけで年表になる。
   ★ここで CHARS を 並べかえないこと。ならび順そのものが 年表の目もり。 */
function renderTimeline() {
  var box = $("timeline");
  box.innerHTML = "";
  var cur = null, sec = null, row = null, have = 0, all = 0;
  function closeSec() {
    if (!sec) return;
    sec.querySelector(".tl-cnt").textContent = have + "／" + all + "人";
    if (have === all) sec.className = "tl-era full";
  }
  CHARS.forEach(function (ch) {
    var e = plain(ch.era);
    if (e !== cur) {
      closeSec();
      cur = e; have = 0; all = 0;
      sec = document.createElement("div");
      sec.className = "tl-era";
      sec.style.borderLeftColor = eraColor(ch.era);   /* 年表の たて線＝その時代の色 */
      sec.innerHTML = '<div><span class="tl-ttl">' + rubi(ch.era) + '</span><span class="tl-cnt"></span></div>';
      row = document.createElement("div");
      row.className = "tl-row";
      sec.appendChild(row);
      box.appendChild(sec);
    }
    all++;
    var rar = bestRarity(ch.id);
    var b = document.createElement("button");
    b.className = "tl-p";
    if (rar) {
      have++;
      b.innerHTML = standHTML(ch, rar, 66) + '<span class="tl-nm">' + ch.name + '</span>';
      b.onclick = function () { openCharModal(ch); };
    } else {
      /* まだ持っていない人も 場所だけ見せる（消すと「あと何人いるか」が分からなくなる） */
      b.innerHTML = standHTML(ch, null, 66) + '<span class="tl-nm">？？？</span>';
      b.disabled = true;
    }
    row.appendChild(b);
  });
  closeSec();
}
function renderCards() {
  setCardsView(state.cardsView || "list");
  var grid = $("cards-grid");
  grid.innerHTML = "";
  CHARS.forEach(function (ch) {
    var b = document.createElement("button");
    var rar = bestRarity(ch.id);
    if (rar) {
      b.className = "card-mini";
      b.innerHTML = standHTML(ch, rar, 78) + '<span>' + ch.name + '</span>'
        + '<span class="rchip r' + rar + '">' + RAR_LABEL[rar] + '</span>'
        + lvBadge(ch.id);
      b.onclick = function () { openCharModal(ch); };
    } else {
      /* まだ持っていない人は影絵。「あと だれが いるんだろう」で集めたくさせる */
      b.className = "card-mini unknown";
      b.innerHTML = standHTML(ch, null, 78) + '<span>？？？</span>';
      b.disabled = true;
    }
    grid.appendChild(b);
  });
  showView("v-cards", "カードいちらん", true);
}
function openCharModal(ch) {
  var c = cardCnt(ch.id), rar = bestRarity(ch.id);
  var html = '<div style="text-align:center;">' + standHTML(ch, rar, 132) + '</div>'
    + '<h3 style="text-align:center;">' + nameRuby(ch) + '</h3>'
    + '<div class="m-era" style="text-align:center;">' + eraChipHTML(ch.era) + '　<span class="type-chip t-' + ch.type + '">' + TYPES[ch.type].icon + TYPES[ch.type].label + '</span></div>'
    + '<div class="m-skill">⚡ わざ: ' + rubi(ch.skill) + '</div>'
    + (function () {
        var sd = charStat(ch.id);
        var an = ch.type === "inori" ? "かいふく" : "こうげき";
        return '<div class="m-skill">' + an + ' <span class="m-star">' + starBar(sd.a) + '</span>　まもり <span class="m-star">' + starBar(sd.d) + '</span>　はやさ <span class="m-star">' + starBar(sd.s) + '</span>　🪙' + sd.cost + '</div>'
          + '<div class="m-era">' + statComment(sd, ch.type) + '</div>';
      })()
    /* ★いまのレベルでの ほんとうの数字（2026-08-11・ユーザー要望）。
       ★★★星は「その人の 生まれつきの 得意・不得意」で **レベルでは 変わらない**。
         だから 星だけ見ても「育った人と 育っていない人」の 差が 分からなかった。
         ここが「どっちを つれて行くか」を 数字で くらべられる ゆいいつの場所。
       ★じだいボーナスは 上の charPower に **入れていない**ので、
         そのステージで ⭐が つくと どうなるかを **かっこの中**で そえる（×ERA_MULT）。 */
    + (function () {
        var p = charPower(ch), pe = charPower(ch, ERA_MULT);   /* pe＝⭐が ついたとき */
        var an = ch.type === "inori" ? "かいふく" : "こうげき";
        var ei = TYPES[ch.type].icon;
        return '<div class="m-pow"><span class="mp-ttl">Lv.' + charLevel(ch.id) + ' のいまの つよさ</span>'
          + '<span class="mp-row">' + ei + ' ' + an + ' <b>' + p.atk + '</b>'
          + '　🛡 まもり <b>' + p.hp + '</b>'
          + '　💨 はやさ <b>' + p.spd + '</b></span>'
          + '<span class="mp-note">⭐じだいボーナスが つくステージでは '
          + an + ' <b>' + pe.atk + '</b>・まもり <b>' + pe.hp + '</b>（' + ERA_MULT + 'ばい）</span></div>';
      })()
    /* ★かいふく型だけ、はたらきかたを ことばで 出す（2026-08-11）。
       ★★ここが **カードを集める理由**に つながる いちばんの場所。
         「レアになると 2人、スーパーレアになると ぜんいん」を 数字の下に 書いておかないと、
         せっかく レア度で のびるようにしても **プレイヤーが 気づけない**。
       ★いまのレア度の ところを 太字にして、つぎに どうなるかも 見せる。 */
    + (ch.type !== "inori" ? "" : (function () {
        var p = charPower(ch), r = bestRarity(ch.id) || "n";
        var lab = { n: "ノーマル＝1人", r: "レア＝2人", sr: "スーパーレア＝ぜんいん" };
        var line = ["n", "r", "sr"].map(function (k) {
          return (k === r ? "<b>" + lab[k] + "</b>" : lab[k]);
        }).join(" → ");
        /* ★rubi() は 最後に **まとめて** かける。中の 文字列だけに かけると
           付けわすれが 出る（実際 「重《おも》い」が そのまま 画面に出た）。
           タグの中に 漢字《かな》は 無いので、まとめて かけて 問題ない。 */
        return rubi('<div class="m-heal">✨ かいふく型《がた》の はたらき'
          + '<span class="mh-row">4びょうごとに みかた ぜんいんを <b>+' + Math.round(p.atk * 1.2) + '</b></span>'

/* ---------- 🎓 まめちしき（2026-08-10・ユーザー要望） ----------
   ユーザーの言葉:「カードを獲得した後に その時代の ちょっとした豆知識や 面白い雑学などを
   200個くらい用意してもらい、それが出てくると もっと歴史に興味を持ってくれるかな」。
   ★★**クイズとは 役わりが ちがう**。クイズは「おぼえたかを ためす」もので、点数（ガチャの確率）に
     つながる。まめちしきは **点数に つながらない**＝ただ「へえ！」と思ってもらうだけ。
     ここに 得点を つけないこと。つけたとたん「読まされるもの」になり、
     おもしろがって読む という ねらいが 消える。
   ★出す順は ①ひいた人物の話 → ②その人の時代の話 → ③どこでもいいから まだ読んでいない話。
     ①②の中でも **まだ読んでいないものを 先に**（クイズの freshFirst と同じ考え方）。
   ★★おぼえるのは **配列の ばんごう**（save.tseen）。新しい まめちしきは
     かならず REKISHI_TRIVIA の **うしろに 足すこと**（あいだに入れると 番号がずれる）。 */
function tSeenSet() {
  var m = {}, a = save.tseen || [];
  for (var i = 0; i < a.length; i++) m[a[i]] = 1;
  return m;
}
/* この人物の カードをもらったときに 出す まめちしきの ばんごう（無ければ -1） */
function pickTrivia(ch) {
  if (!TRIVIA.length) return -1;
  var seen = tSeenSet(), era = plain(ch.era);
  var mine = [], myEra = [], rest = [];
  for (var i = 0; i < TRIVIA.length; i++) {
    var t = TRIVIA[i];
    if (t.who === ch.id) mine.push(i);
    else if (t.era === era) myEra.push(i);
    else rest.push(i);
  }
  /* まだ読んでいないものを 先に。3つの かたまりを 順に見て、最初に見つかった かたまりから ひく */
  var groups = [mine, myEra, rest];
  for (var g = 0; g < groups.length; g++) {
    var fresh = groups[g].filter(function (i) { return !seen[i]; });
    if (fresh.length) return pick(fresh);
  }
  /* ぜんぶ読みおわった人は、その人の話から ランダムに（読みなおしても うれしいので消さない） */
  return mine.length ? pick(mine) : pick(rest.concat(myEra));
}
/* 読んだ しるしを つける（★カード・⭐とは べつのキーなので、消えても 記録は無事） */
function tSeenPush(i) {
  if (i < 0) return;
  var a = (save.tseen || []).slice();
  if (a.indexOf(i) < 0) a.push(i);
  save.tseen = a;
  persist();
}
/* ごほうび画面に 出す HTML。★「○／200」も いっしょに出す＝**集めるもの**にする
   （出しっぱなしの ひとことだと、読みとばされる。数が ふえるのが 見えると 読む） */
function triviaHTML(i) {
  if (i < 0) return "";
  var t = TRIVIA[i], head = t.who ? (CHAR_BY_ID[t.who] ? CHAR_BY_ID[t.who].name : "") : plain(t.era);
  var got = (save.tseen || []).length;
  return '<div class="tri-card">'
    + '<div class="tri-ttl">🎓 まめちしき　<span class="tri-cnt">' + got + '／' + TRIVIA.length + '</span></div>'
    + '<div class="tri-who">' + head + '</div>'
    + '<div class="tri-body">' + rubi(t.t) + '</div></div>';
}
/* 🎓 あつめた まめちしきの いちらん（カードいちらんの3つめのタブ）。
   ★まだ読んでいないものは「？？？」で 場所だけ見せる（年表ずかんと 同じ流儀＝
     「あと何こ あるのか」が 見えないと 集める気にならない）。 */
function renderTrivia() {
  var box = $("trivia-box");
  box.innerHTML = "";
  var seen = tSeenSet(), got = (save.tseen || []).length;
  var head = document.createElement("div");
  head.className = "tri-head";
  head.innerHTML = "あつめた まめちしき <b>" + got + "／" + TRIVIA.length + "</b>"
    + '<div class="tri-note">' + rubi("カードを もらうと 1つ 読める。人物《じんぶつ》の話と 時代《じだい》の話が あるよ") + '</div>';
  box.appendChild(head);
  /* ならびは 人物ぶん（時代順）→ 時代ぶん。CHARS の ならびが 年表なので、そのまま つかう */
  var groups = [], byKey = {};
  function grp(key, label) {
    if (!byKey[key]) { byKey[key] = { label: label, items: [] }; groups.push(byKey[key]); }
    return byKey[key];
  }
  CHARS.forEach(function (ch) { grp("w:" + ch.id, ch.name); });
  CHARS.forEach(function (ch) { grp("e:" + plain(ch.era), plain(ch.era) + " のこと"); });
  TRIVIA.forEach(function (t, i) {
    var g = t.who ? byKey["w:" + t.who] : byKey["e:" + t.era];
    if (g) g.items.push(i);
  });
  groups.forEach(function (g) {
    if (!g.items.length) return;
    var sec = document.createElement("div");
    sec.className = "tri-sec";
    var have = g.items.filter(function (i) { return seen[i]; }).length;
    if (have === g.items.length) sec.className = "tri-sec full";
    sec.innerHTML = '<div class="tri-sttl">' + g.label
      + '<span class="tri-scnt">' + have + '／' + g.items.length + '</span></div>'
      + g.items.map(function (i) {
          return seen[i] ? '<div class="tri-line">' + rubi(TRIVIA[i].t) + '</div>'
                         : '<div class="tri-line yet">？？？</div>';
        }).join("");
    box.appendChild(sec);
  });
}

    im[1].src = src;
    if (im[0].complete && im[0].naturalWidth > 0) el.className = "on";
    else im[0].onload = function () { el.className = "on"; };
    /* 敵の城とおなじ場所（右はし）に置く。みかたは この手前まで歩いてきて はたらく */
    el.style.left = unitLeft(B.W - EDGE_PAD);
  }
  B.built = 0;
  /* ★build.sec は もう「制限時間」ではない（2026-08-09）。
     **何もしなくても そこで完成する時間**＝「あと◯びょう」の ものさし。
     時計は もう数えない（のこりは かんせい度から出す。drawBuild を見ること）。 */
  B.evIdx = 0;            /* つぎに起きる できごとの番号 */
  B.workMult = 1;         /* いまの工事の速さ（できごとで変わる） */
  B.workUntil = 0;        /* いつまで その速さか */
  B.buildStop = true;     /* まだ だれも 出していない＝工事は 止まっている（下の★を見ること） */
  drawBuild();
}
/* かんせい度が節目をこえたら、史実の できごとが1回だけ起きる。
   ★ねらいは「たんたんと バーがのびるだけ」を やめること。
     じゃまが入って あせり → 追い風で ほっとする → さいごの山場、という波を作る。 */
function buildEvents(st) {
  /* st.base は「2」シリーズが持つ もとのステージid（st5b → st5）。
     ★これが無いと 2のつくる型で できごとが1つも起きず、バーがのびるだけの
       たんたんとした画面になってしまう。 */
  var evs = BUILD_EVENTS[st.id] || BUILD_EVENTS[st.base];
  if (!evs || B.evIdx >= evs.length) return;
  var ev = evs[B.evIdx];
  if (B.built < st.build.need * ev.at) return;
  B.evIdx++;
  B.workMult = EV_MULT[ev.kind];
  B.workUntil = B.t + EV_SEC[ev.kind];
  cutIn('<span class="cut-wave">' + (ev.kind === "help" ? "✨ " : "⚠️ ") + rubi(ev.text) + '</span>');
  if (ev.kind === "hard") sendWave(st, Math.round(waveSize(st, B.wave) * BUILD_WAVE));
  if (ev.kind === "last") sendWave(st, Math.round(waveSize(st, B.wave) * BUILD_WAVE * 1.6));
}

/* かんせい度バーと、できあがっていく物の見た目を更新する */
function drawBuild() {
  var d = state.stage.build;
  var p = Math.max(0, Math.min(1, B.built / d.need));
  $("build-fill").style.width = (p * 100) + "%";
  /* 盤の右はしの絵も いっしょに そだてる（下から 色がついていく）。
     ★毎フレーム走るので、作りなおすのではなく **高さの数字だけ**を書きかえる
       （要素は spawnSite が B.siteFill に覚えてある＝毎回さがさない）。 */
  if (B.siteFill) B.siteFill.style.height = (p * siteImgH() * SITE_FILL) + "px";
  /* ★のこり時間は **時計ではなく すすみ具合から** 出す（2026-08-09）。
     ＝「いまのまま（だれも出さないまま）だと あと何秒で完成するか」。
     みかたを出せば 早くへり、敵を城に通せば（BUILD_BREAK）**また ふえる**＝
     「通すと そのぶん 長く耐えることになる」が 数字で見える。 */
  var left = Math.max(0, Math.ceil((1 - p) * d.sec));
  /* ★みかたが0人だと 工事は すすまない（2026-08-11）。
     そのあいだ「あと◯びょう」を出すと **うそになる**（待っても へらない）ので、
     かわりに「人を出そう」と さそう。ここが「キャラを出さずに勝てる」を
     直したことを 子どもに 伝える ゆいいつの場所。 */
  if (B.buildStop) {
    $("build-txt").innerHTML = rubi(d.name) + " の " + d.word + "度　" + Math.floor(p * 100) + "%"
      + '<span class="b-time stop">' + rubi("人《ひと》を 出《だ》すと すすむよ！") + '</span>';
    $("buildbar").className = "on";
    return;
  }
  /* ★つくっている物の絵は #build-ico（バーの左はし）に **1回だけ** 入れる。
     ここ（drawBuild）は毎フレーム走るので、innerHTML に img を書くと
     毎回 img が作りなおされて ちらつく。 */
  $("build-txt").innerHTML = rubi(d.name) + " の " + d.word + "度　" + Math.floor(p * 100) + "%"
    + '<span class="b-time' + (left <= 15 ? " hurry" : "") + '">あと ' + left + 'びょう</span>';
  $("buildbar").className = "on" + (left <= 15 ? " hurry" : "");
}

function spawnEnemy(def, kind, back) {
  var u = {
    side: "e", kind: kind, alive: true,
    hp: def.hp, maxHp: def.hp, atk: def.atk, range: def.range, speed: def.speed, cd: def.cd, cdT: 0.6,
    stun: 0,          /* 🌀 かみかぜで 動けない のこり秒（2026-08-10） */
    /* back=うしろにずらす距離。波でまとめて出すとき、重なって1体に見えないように */
    /* ボスは町の手前。名前どうしが重なって読めなくなるので、ユニット幅ぶん離して置く。
       ざこは町のあたりから湧いて左へ歩く
       （back で後ろにずらすので、右の枠外から入ってくるように見える＝はみ出しではない） */
    /* ★つくる型だけ、湧く場所を **つくっている物の絵より うしろ** にずらす（2026-08-09）。
       絵を盤に置いたら、湧く場所(B.W-EDGE_PAD)が **絵のまん中と ぴったり同じ**なので、
       波が来るたびに 大仏や本が 敵で かくれてしまった。うしろから 歩いて出てくる形にすると
       「災いが おくから やってくる」に見えて、絵も かくれない。
       ★ずらすぶんだけ 前線に着くのが おそくなる＝つくる型が ほんの少し やさしくなる。
         きつく戻したいときは この0.95を0にする。 */
    x: (kind === "boss" ? B.W - EDGE_PAD - UNIT_W
                        : B.W - EDGE_PAD + (state.stage.mode === "build" ? UNIT_W * 0.95 : 0))
       + (back || 0)
  };
  /* ざこは名前を出さない。波でまとめて出ると「今川の兵今川の兵…」と重なって読めなくなるうえ、
     どうせ全員おなじ名前で学習の役に立たないため（ボスの名前＝史実の相手役はちゃんと出す） */
  /* ★敵の絵（2026-08-07）。chars-data.js の boss/minion に img: "mitsuhide" と書くと
     images/enemies/{img}/stand|walk|atk|down.webp を出す。書かなければ 今までどおり絵文字。
     絵が読めなかったときも 絵文字のまま出る（.has-sprite が付かないため）。 */
  u.el = mkUnitEl('<span class="emoji' + (kind === "boss" ? " big" : "") + '">' + def.icon + '</span>'
                  + (def.img ? spriteHTML(def.img, "enemies") : ""),
                  kind === "minion" ? "" : plain(def.name));
  u.el.style.left = unitLeft(u.x);
  u.el.classList.add("enemy");
  if (kind === "boss") u.el.classList.add("boss");   /* ボスは大きく見せる（CSS） */
  if (def.img) attachSprite(u);
  $("bfield").appendChild(u.el);
  B.units.push(u);
  return u;
}

  var bic = $("build-ico"), bim = st.build && st.build.img;

    if (bic.complete && bic.naturalWidth > 0) bic.className = "on";
    else bic.onload = function () { bic.className = "on"; };

  $("buildsite").className = "";

  ph.style.backgroundPosition = "center " +

        /* ★ボスが 何回目か（さいしょに立っているのが 1回目）。3シリーズの3回目だけ つよくする */

       （2026-07-28に発見。B は毎回作りなおすので、作った本人のときだけ実行する）。 */
  var myB = B;
  requestAnimationFrame(function () {
    if (B !== myB || cur !== "v-battle") return;
    B.W = f.clientWidth;
    /* 地面の線の高さ。.unit の bottom:15% とそろえる（矢の高さの基準にする） */
    B.groundY = f.clientHeight * 0.15;
    spawnBase();
    if (st.mode === "build") {
      spawnSite();                          /* 敵の城のかわりに「つくるもの」を置く */
      /* ★つくるモードにボスを出さないこと。ボスは町の手前＝ちょうど現場に立つので、
         みかたが ずっとボスと戦って いつまでも はたらけない（2026-08-05に実際そうなった）。
         じゃまをするのは 波でくる災いだけ、という位置づけにしてある。 */
    } else {
      spawnEbase();
      spawnEnemy(bsDef(st), "boss");        /* ★てきの型ぶんを かけてから 出す（§ENEMY_KATA） */
    }
    buildDeployRow();
    buildPowerRow();
    buildRain();
    tickerStart();
    B.last = performance.now();
    requestAnimationFrame(tick);
  });
}

/* その人物が いま場に出ているか。
   ★同じ人物は場に1人まで（2026-08-06・ユーザー指示）。「織田信長は2人いない」＝
     歴史の人物なので、やられて いなくなるまで もう一度は出せない。ほかの人物は出せる。 */
function onField(id) {
  if (!B) return false;
  for (var i = 0; i < B.units.length; i++) {
    var u = B.units[i];
    if (u.alive && u.kind === "ally" && u.ch.id === id) return true;
  }
  return false;
}
/* ---------- 🤝 史実のコンビ（2026-08-09・ユーザー要望） ----------
   **2人そろって場に出ているあいだ、2人とも こうげきが つよくなる**。
   ★ねらい: これまで このゲームは「人物を ひとりずつ」しか おぼえさせていなかった
     （ティッカーもクイズも人物単体、組み合わせの理由は ⭐じだいボーナスだけ）。
     歴史のおもしろさは「**だれと だれが 組んで 何をしたか**」なので、そこを
     デッキ編成の判断と ごほうびに つなげる。データは chars-data.js の REKISHI_PAIRS。
   ★**1人が いくつのコンビに入っていても、かかる倍率は 1回ぶんだけ**（PAIR_ATK）。
     西郷隆盛は 勝海舟とも 大久保利通とも 組めるので、かけ算にすると
     3人つれてくるだけで こうげきが 2倍近くなってしまう。
   ★はた(u.mor)とは 別の入れもの(u.pr)にしてある。まぜると 🚩の しるしが
     コンビだけの人にも 付いてしまうため。ダメージは atkMul() で かけ合わせる。 */
var PAIR_ATK = 1.35;      /* コンビが そろっているときの こうげき倍率（叩き台） */
/* いま そろっているコンビ。tick が毎フレーム作りなおす（安いので おぼえておかない） */
function livePairs() {
  var out = [];
  for (var i = 0; i < PAIRS.length; i++) {
    if (onField(PAIRS[i].a) && onField(PAIRS[i].b)) out.push(PAIRS[i]);
  }
  return out;
}
/* こうげきに かける倍率（はた × コンビ）。**ダメージを出す所は かならず これを通す** */
function atkMul(u) { return (u.mor || 1) * (u.pr || 1); }

/* ---------- 🏅 たたかいの ふりかえり（2026-08-10・ユーザー要望） ----------
   だれが いちばん はたらいたかを 数えて、勝ったあとに 見せる。
   ★ねらいは **人物の名前と 業績を むすびつける**こと。42人を あつめるゲームなのに、
     これまでは「だれが 効いたのか」が 画面のどこにも のこらなかった。
     「今日のMVPは 織田信長」と 名ざしで ほめると、その人の わざの名前も いっしょに おぼえる。
   ★数えるのは `hit()` の中 1か所（第4引数 by）。**ダメージを出す所を ふやしたら
     by を わたすこと**。わたさなくても こわれない（数に入らないだけ）。
   ★みかたのユニットから id をとる（さく・城には ch が無いので null＝数えない）。 */
function byOf(u) { return (u && u.kind === "ally" && u.ch) ? u.ch.id : null; }

/* 出撃ボタン（デッキの人物ぶん）。おかねが足りてクールタイム明けなら光る */
function buildDeployRow() {
  var row = $("deploy-btns");
  row.innerHTML = "";
  B.btns = [];
  /* デッキが7人になったので、せまい画面では顔を小さくしないと ボタンがつぶれる */
  var fw = window.innerWidth < 620 ? 28 : 40;
  save.deck.forEach(function (id) {
    var ch = CHAR_BY_ID[id], cost = charStat(id).cost;
    var b = document.createElement("button");
    b.className = "dep-btn";
    b.innerHTML = '<div class="cd-fill"></div><span class="dep-out">でてる</span><div class="dep-in">' + faceHTML(ch, bestRarity(id) || "n", fw)
      + '<span class="dep-cost">🪙' + cost + '</span>'
      + (eraBonus(ch) ? '<span class="era-star">⭐</span>' : '')
      /* バトル中も「いま出そうとしている人物がどれだけ育っているか」が見えるようにする */
      + '</div><span class="dep-name">' + ch.name + ' <span class="dep-lv">Lv.' + charLevel(id) + '</span></span>';
    b.onclick = function () { deploy(id); };
    B.btns.push({ id: id, cost: cost, el: b, fill: b.querySelector(".cd-fill") });
    row.appendChild(b);
  });
}
function deploy(id) {
  if (!B || B.over) return;
  var ch = CHAR_BY_ID[id], cost = charStat(id).cost;
  if (onField(id)) return;                       /* 同じ人物は場に1人まで */
  if (B.money < cost || (B.cds[id] || 0) > 0) return;
  B.money -= cost;
  B.cds[id] = DEPLOY_CD;
  sfx("deploy");
  /* ⭐チャレンジ ⏳の判定。「だけで」は 1人でも ちがう時代を出したら 消え、
     「つかって」（人数の少ない時代）は その時代の人を 1人でも出せば つく */
  B.deployed++;
  B.depBy[id] = true;   /* ⭐チャレンジ「○○を ぜんいん 出して かつ」に ○がつく（2026-08-11） */
  if (eraBonus(ch)) B.eraAny = true; else B.allEra = false;
  spawnAlly(ch);
}

/* 🤝 コンビが そろったとき、2人の頭の上に しるしを出す（どの2人か が ひと目で分かる） */
function popupPair(p) {
  B.units.forEach(function (u) {
    if (u.alive && u.kind === "ally" && (u.ch.id === p.a || u.ch.id === p.b))
      popup(u.x, "🤝 コンビ！", "heal");
  });
}
function popup(x, txt, cls) {
  var d = document.createElement("div");
  d.className = "dmg" + (cls ? " " + cls : "");
  d.textContent = txt;
  d.style.left = (x - 10 + Math.random() * 20) + "px";
  d.style.bottom = "42%";
  $("bfield").appendChild(d);
  setTimeout(function () { d.remove(); }, 700);
}
/* quiet=true … ひっさつゲージをためない・数字も出さない。
   かみなりが みかたに当たったぶんや、ききんの じわ削り に使う
   （自分で自分をなぐって ゲージをためる ずる を防ぐため。§6） */
/* ★by＝**なぐった みかたの id**（2026-08-10・ふりかえり/MVP のために足した。書かなくても動く）。
   人物なら CHAR の id、城のちから（ゆみ・かみなり…）なら "_pw"。
   ★★数えるのは **じっさいに入ったぶん**（`Math.min(dmg, u.hp)`）。
     のこりHPより 大きい数字を そのまま足すと、とどめを さした人だけが
     「ざこ1体に 9999ダメージ」になって MVPが かたよる（オーバーキル）。
   ★みかたが うけたダメージは 数えない（u.side が "e" のときだけ）。 */
/* ★★★🛡 むてき（2026-08-11・ユーザー要望「年貢と必殺技の祈りが弱すぎます」）。
   `u.inv` に **のこり秒**を入れておくと、そのあいだ **みかたは ダメージを 受けない**。
   ★みかた（side==="a"）だけ。敵に つけないこと。
   ★城(base)も みかたなので まもられる＝「年貢で 城を まもる」も できる。
   ★へらすのは tick（§むてきの 時計）。 */
function makeInv(u, sec) {
  if (!u || !u.alive || u.side !== "a") return;
  u.inv = Math.max(u.inv || 0, sec);      /* 短いので 上書きしない＝長いほうを のこす */
  u.el.classList.add("inv");
}
function hit(u, dmg, quiet, by) {
  if (!u.alive) return;
  /* 🛡 むてきの あいだは ダメージ 0。★`quiet` でも 止めること（矢や 火の じわじわも 止める）。
     ★ここ1か所で 止めるのが だいじ。こうげき・矢・火・技…と 入り口が たくさんあるので、
       それぞれで 見るようにすると **かならず 見のがす**。 */
  if (u.side === "a" && (u.inv || 0) > 0) {
    if (!quiet) popup(u.x, "🛡", "heal");
    return;
  }
  if (by && u.side === "e" && B && !B.over) {
    var got = Math.max(0, Math.min(dmg, u.hp));
    if (by === "_pw") B.dmgPw += got;
    else B.dmgBy[by] = (B.dmgBy[by] || 0) + got;
  }
  u.hp -= dmg;
  /* ★つくる型では、城をなぐられると せっかくの工事も こわれる。
     「敵を通しても いたくない」＝ ピンチが来ない のが つまらなさの原因だった。 */
  if (u.kind === "base" && state.stage.mode === "build" && B && !B.over && B.built > 0) {
    B.built = Math.max(0, B.built - dmg * BUILD_BREAK);
    drawBuild();
    if (!B.breakT || B.t - B.breakT > 1.4) {     /* 出しすぎないよう1.4秒に1回 */
      B.breakT = B.t;
      popup(u.x + UNIT_W, "工事が こわれた！", "");
    }
  }
  /* ひっさつゲージは みかたが受けたダメージでも早くたまる
     （押されているときほど早く満タンになる＝逆転の芽。CLAUDE.md §6「理不尽にしない」）。
     ここでは ためるだけ。実際に足すのは tick で、1秒あたりの上のせに上限をかけている
     （味方が増えるほど被弾も増えるので、そのままだと終盤に必殺技を連打できてしまう） */
  if (u.side === "a" && !quiet) B.gaugeDmg += dmg * GAUGE_DEF;
  if (!quiet) popup(u.x, dmg);
  u.el.classList.remove("hitfx");
  void u.el.offsetWidth;
  u.el.classList.add("hitfx");
  if (u.hp <= 0) {
    u.hp = 0;
    u.alive = false;
    setPose(u, "down");          /* たおれたコマを見せてから消える（.dead が0.4秒でフェード） */
    u.el.classList.add("dead");
    /* ★城（base/ebase）では鳴らさない。城がこわれた音は 勝ち負けの音と かさなるため */
    if (u.kind !== "base" && u.kind !== "ebase") sfx("kill");
    if (u.kind === "minion" && B && !B.over) {           /* ざこをたおすとおかね */
      B.money = Math.min(moneyCap(), B.money + KILL_MONEY);
      popup(u.x, "🪙+" + KILL_MONEY, "coin");
    }
    if (u.kind === "boss" && B && !B.over) {             /* ボスは守り役。たおすと大ボーナス */
      B.money = Math.min(moneyCap(), B.money + 100);
      popup(u.x, "🪙+100", "coin");
      /* ★「2」シリーズは ボスが たおれても もういちど 出てくる（2026-08-08・ユーザー指示）。
         ここで すぐ出さずに 時間をあけるのは、たおれたコマ(.dead)が 0.4秒かけて消えるので、
         その前に出すと 同じボスが2体ならんで見えるため。実際に出すのは tick の中。 */
      if (B.bossMore > 0) { B.bossMore--; B.bossBackT = BOSS_BACK_SEC; }
    }
    if (u.kind === "ebase") winBattle();                 /* 敵の城・町をこわしたら勝ち */
    if (u.kind === "base") loseBattle();                 /* みかたの城がこわれたら負け */
  }
}
/* ---------- ざこ敵の「波」（2026-07-28） ----------
   もとは「同時に minion.max 体まで・minion.every 秒ごとに1体ずつ」だった。
   これだと敵の圧が時間で増えないのに味方だけ積み上がるので、**味方が1体も死なない**。
   実測で29体出撃して戦死0・みかたの城は100%のまま＝ただの行進になっていた。
   そこで「まとまって来る → 休み → もっと大きい波」というリズムに変えた。
   ★ねらいは「敵を強くする」ことではなく、**しのぐ／ためる の判断が生まれる間**を作ること。
   ★数はステージごとの minion.max から自動で決まるので、ステージを足しても何も書かなくてよい。 */
var WAVE_REST = 2.4;      /* 波と波のあいだの休み＝minion.every の何倍か（叩き台） */
var WAVE_GROW = 4;        /* 波が進んで増える体数の上限（叩き台） */

/* =====================================================================
   ⚔ てきの「型」（2026-08-11・ユーザー要望）
   ---------------------------------------------------------------------
   ユーザーの言葉:「敵もその面に合わせて個性を出してもいいかも。元寇なら相手もてつはうを
     使ってきたり、ボスはあんまりだけど雑魚がやたら強いとか、逆にボスが強くて雑魚が弱いとか、
     ボスも雑魚も弱いけど、、めっちゃ速いとか。そういう情報があればキャラを変えるきっかけになる」。
   ★★★**入れる前の実測**（17ステージぜんぶ ならべて 数えた）:
       ボスHP÷ざこHP は **7.3〜9.3倍で ほぼ一定**
       ざこの速さは 34〜42＝**1.24倍の幅しかない**
       こうげき・HPは 番号順に **きれいに単調増加**しているだけ
     ＝「どのステージも 同じ形の敵が 少しずつ強くなるだけ」で、**デッキを変える理由が
       1つも 生まれていなかった**。ユーザーの言う3パターンは 17面に **1つも無かった**。
   ---------------------------------------------------------------------
   ★仕組み: ステージのデータ（chars-data.js）は **さわらない**。ここの かけ算だけで
     ざこ／ボスの すがたを 変える。BUILD_EVENTS と同じ流儀で id をキーにする
     （2・3シリーズは st.base で もとの面の型を つぐ）。
   ★★**ぜんたいの きつさは 変えないつもり**で作ってある（強くする所と 弱くする所を 対にした）。
     ただし **数値は ぜんぶ 叩き台**（CLAUDE.md §2.3）。遊んでみて きつければ ここだけ さわる。
     ステージのデータには 一切 手を入れていないので、**この表を消せば 元にもどる**。
   ★maxAdd だけ かけ算ではなく **足し算**（体数は 1〜2 の世界なので ×1.2 では 変わらない）。
   ===================================================================== */
var ENEMY_KATA = {
  futsu: { icon: "⚔", name: "ふつう",
           tip: "とくちょうの ない てき。バランスよく せめよう",
           minion: {}, boss: {} },
  /* ★★どの型も **強くする所と 弱くする所を 対にしてある**。片方だけ上げると
       ただの「むずかしい面」になって、型ではなく 難易度になってしまう。
       ★実測して 直した例: かたまりは はじめ ざこHP×2.0 と ボスHP×1.5 の **両方を上げていた**。
         のろい(×0.5)だけでは 釣り合わず ただの難化だったので、**こうげきを 下げる**形にした。 */
  gun:   { icon: "🏴", name: "ぐんたい",
           tip: "ざこが **多くて つよい**！ ボスは そこまでではない。かべ役で とめよう",
           minion: { hp: 1.3, atk: 1.15, maxAdd: 1 }, boss: { hp: 0.55, atk: 0.75 } },
  ikki:  { icon: "🐉", name: "いっきうち",
           tip: "ボスが **とても つよい**！ ざこは 弱いので ボスに そなえよう",
           minion: { hp: 0.55, atk: 0.7, every: 1.3, maxAdd: -1 }, boss: { hp: 1.8, atk: 1.35 } },
  haya:  { icon: "💨", name: "はやて",
           tip: "ぜんぶ 弱いけど **めちゃくちゃ 速い**！ すぐ 城まで 来るよ",
           minion: { hp: 0.6, atk: 0.75, speed: 1.8, every: 0.85 }, boss: { hp: 0.7, atk: 0.8, speed: 2.0 } },
  kata:  { icon: "🪨", name: "かたまり",
           tip: "とても **かたい**けど **のろくて 力は よわい**。じっくり けずれば かてる",
           minion: { hp: 1.9, atk: 0.8, speed: 0.5, every: 1.35, maxAdd: -1 },
           boss: { hp: 1.4, atk: 0.85, speed: 0.5 } }
};
/* ★どのステージが どの型か。**史実の すがたに 合わせてある**＝
     おぼえた歴史と 敵の強さが むすびつく（元寇＝元の大軍／桶狭間＝今川の大軍 など）。
   ★書いていないステージは futsu（ふつう）。st1・st4 は はじめての面なので わざと ふつう。 */
var STAGE_KATA = {
  st2: "ikki",   /* 大化の改新＝蘇我入鹿を討つ話 */
  st5: "kata",   /* 大仏づくり＝えきびょうが じわじわ */
  st6: "haya",   /* 貴族の世＝物の怪が すばやい */
  st3: "ikki",   /* 壇ノ浦＝平知盛との 決戦 */
  st7: "gun",    /* 元寇＝元の大軍（ユーザーが 例に出した面） */
  st8: "gun",    /* 金閣＝応仁の乱の あばれ足軽が 大量に */
  st9: "gun",    /* 桶狭間＝「少ない軍で 大軍にいどむ」＝ステージ説明そのもの */
  st10: "ikki",  /* 本能寺＝明智光秀 */
  st11: "gun",   /* 関ヶ原＝天下分け目の 大決戦 */
  st12: "haya",  /* 江戸の文化＝火の粉が もえひろがる */
  st13: "kata",  /* 新しい学問＝なぞの霧の巨人 */
  st14: "ikki",  /* 黒船＝黒船のたいほう */
  st15: "gun",   /* 明治維新＝旧幕府軍 */
  st16: "haya",  /* 憲法と国会＝はんたいのこえが わっと ひろがる */
  st17: "ikki"   /* 世界の中の日本＝バルチック艦隊 */
};
function kataOf(st) {
  return ENEMY_KATA[STAGE_KATA[st.id] || STAGE_KATA[st.base] || "futsu"] || ENEMY_KATA.futsu;
}
/* ★型を かけたあとの ざこ／ボスのデータを返す。**もとの st.minion / st.boss は 書きかえない**
     （ステージのデータそのものなので、書きかえると 2回目のバトルで 二重にかかる）。 */
function kataDef(st, which) {
  var src = (which === "boss" ? st.boss : st.minion);
  if (!src) return src;
  var m = kataOf(st)[which] || {}, d = {};
  for (var k in src) d[k] = src[k];
  if (m.hp)    d.hp    = Math.round(src.hp  * m.hp);
  if (m.atk)   d.atk   = Math.round(src.atk * m.atk);
  if (m.speed) d.speed = Math.round(src.speed * m.speed);
  if (m.every) d.every = src.every * m.every;
  if (m.maxAdd) d.max  = Math.max(1, src.max + m.maxAdd);
  return d;
}
function mnDef(st) { return kataDef(st, "minion"); }
function bsDef(st) { return kataDef(st, "boss"); }

function waveSize(st, wave) {
  var mx = mnDef(st).max;
  return Math.min(mx + WAVE_GROW, mx - 1 + wave);
}

/* ★ステージが進むほど ざこ敵をきつくする係数（2026-07-28・「後半もレベル1の5人で
   適当にやってても勝てた」というユーザーの指摘で追加）。
   時代順＝STAGES の並び順から自動で決まるので、ステージを足しても何も書かなくてよい。
   最初のステージで1.0倍、最後のステージで STAGE_PRESS_MAX 倍。
   ★なぜ必要か: ざこの強さはデータ上 130→440(3.4倍) しか伸びないのに、
     人物の育成は Lv1→Lv30 で 3.25倍・レアで技も増える。つまり後半ほど
     「育てなくても勝てる」状態だった。ここを伸ばして、育成が効くようにしている。

       ×1.0 → Lv1○ / レア○   ×1.5 → Lv1○(苦しい) / レア○
       ×2.0 → Lv1× / レア○ ← ねらいの形   ×2.5 → 両方×（きつすぎ） */
var STAGE_PRESS_MAX = 2.0;
/* ★2026-08-08「2」シリーズを足したときの直し:
   もとは STAGES 全体の並び順で決めていたが、そこへ17ステージ足すと
   1シリーズの st17 が「34個中の17番目」になり、係数が 2.0倍 → 1.5倍に **下がって**しまう
   （＝すでに遊んでいる1シリーズが 勝手にかんたんになる）。
   そこで **シリーズの中での順番**で決める。1シリーズは今までとまったく同じ 1.0〜2.0倍、
   2シリーズも その中で 1.0〜2.0倍（強さの上のせは chars-data.js の HARD2 が受け持つ）。 */
function pressList(st) {

/* ★★★「3」だけ press が **だんだん下がる**（1.7 → 1.15。2026-08-09・実測して こうした）
   ---------------------------------------------------------------------------------
   1・2シリーズは 1.0→2.0 と **上がって**いく。3で同じことをすると 終わりのほうが
   **人間には ぜったい勝てない強さ**になる。理由は かけ算が3つ重なるから:
     ①もとの17面が すでに 後半ほど つよい（st1のざこHP130 → st17は440＝3.4倍）
     ②そこへ HARD3 の倍率がかかる
     ③さらに press が 2.0までのびる
   実測: 上がる形（1.3→2.3）だと **スーパーレア7体（デッキで作れる いちばん強い形）でも
     st11c・st17c で 負けた**＝クリアする道が 1つも無い。
   ★★プレイヤーの上限は はっきりしている: SRのLv30で 3.25倍、Lv41まで育てても 3.8倍。
     「3の入口に SR3体」と決めた時点で、残りの のびしろは **1.5倍ぶんしか無い**。

     `first` … **3の入口(st1c)の きびしさ**。ユーザーが 実機で さわる のは ここ。
     `last`  … **最後(st17c)が 上限デッキで 届くか**の 安全弁。
     ユーザーが「まだ簡単」と言うたびに **first を上げ、last を下げて**きた:
       1回目 1.7→1.35 ／ 2回目（×1.2のとき）last 1.35→1.15 ／
       3回目（まだ簡単）**first 1.7→2.6・last →0.8**。

       画面ぜんたいの HP も こうげきも 3のほうが 2割ほど 上。1体で くらべないこと。
   実測の手ごたえ（3回目のあと・さく/はた/かしこいひっさつ を使う自動プレイ）:
     st1c＝SR3体で 64秒かけて ◯ ／ st17c＝SR7体 ◯49秒 ／ st9c＝SR5体 ×。 */
/* ★★★**2026-08-10（4回目）: last 0.8 → 0.7**。同じ日に HARD3 を ぜんぶ ×1.2 したので、
   **最後の st17c まで まるごと 1.2倍**きつくなり、安全弁が うすくなったため。
   実測（自動プレイ・SR7のデッキ・ゆみ/かみなり/年貢/かみかぜ/さく/はた/かしこいひっさつを使う）:
     st17c に かてる last の しきい値 … **0.6（前の数字） → 0.45（新しい数字）**
     ＝ 終わりの面は **1.33倍** きつくなった計算（1.2の かけ算が 数×速さ×強さで 重なるため）。
   → last を 0.8→0.7 に下げて、**終わりの面は 1.33×(0.7/0.8)＝およそ 1.16倍**に とどめた。
     **入口(first 2.6)は 1.2倍 まるごと 上がったまま**＝ユーザーが 実機でさわる所は 指示どおり。
   ★★もし「最後まで まるごと 1.2倍で いい」なら last を **0.8にもどす**だけ。

  var list = pressList(st);

  if (seriesOf(st) === 3) return PRESS3.first + (PRESS3.last - PRESS3.first) * r;

function pressed(def, f) {
  var d = {};
  for (var k in def) d[k] = def[k];

  d.atk = Math.round(def.atk * f);
  return d;
}
/* ざこの波をまとめて出す（ふつうの波にも、できごとの山場にも使う） */
function sendWave(st, n) {
  var mn = pressed(mnDef(st), stagePress(st));   /* ★てきの型 → ステージの きつさ の順（§ENEMY_KATA） */
  for (var i = 0; i < n; i++) spawnEnemy(mn, "minion", i * (UNIT_W * 0.72));  /* 間かくは幅に合わせる */
  waveBanner(B.wave, n);
}
function waveBanner(wave, n) {
  B.lastCut = B.t;        /* 直後に技のカットインが重ならないように */
  cutIn('<span class="cut-wave">🌊 だい' + wave + 'は！ てきが ' + n + 'たい くるよ！</span>');
}

function nearestFoe(u) {
  var best = null, bd = 1e9;
  B.units.forEach(function (o) {
    if (!o.alive || o.side === u.side) return;
    var d = Math.abs(o.x - u.x);
    if (d < bd) { bd = d; best = o; }
  });
  return best ? { t: best, d: bd } : null;
}

function tick(now) {
  if (!B || B.over || cur !== "v-battle") return;
  /* dt は 0以上 0.05秒以下に必ずおさめる。上限はコマ落ち対策、下限は保険
     （時計が巻きもどると おかねや時間がマイナスに進んでしまうため） */
  var dt = Math.max(0, Math.min(0.05, (now - B.last) / 1000)) * SPEED;
  B.last = now;
  /* ★ひっさつのカットインのあいだは バトルを止める（B.freeze）。
     時間・おかね・敵の動き・矢を ぜんぶ止めて、見せ場だけを見せる。 */
  if (B.freeze > 0) {
    B.freeze -= dt;
    /* ★帯を消すのは setTimeout ではなく ここ。倍速（#st1f）のときに
       バトルだけ先に動き出して 帯が残る、というズレが起きないため。 */
    if (B.freeze <= 0) { $("hisfx").className = ""; renderHisBar(); }
    requestAnimationFrame(tick);
    return;
  }
  B.t += dt;
  var st = state.stage;

  /* おかね・ひっさつゲージがたまる */
  B.money = Math.min(moneyCap(), B.money + st.income * dt);
  var gBase = GAUGE_MAX / GAUGE_SEC * dt;
  var gExtra = Math.min(B.gaugeDmg, gBase * GAUGE_DEF_CAP);
  B.gaugeDmg -= gExtra;
  addGauge(gBase + gExtra);

  /* 城のちからの効きめ（あめ・ききん）を すすめる */
  tickPowers(dt);

  /* ★ボスの ふっかつ（「2」シリーズだけ・2026-08-08）。
     ★setTimeout ではなく ここで数えること。倍速（#st1f）や カットインの止め（B.freeze）の
       ときに、バトルだけ止まっているのに ボスが出てくる、というズレが起きないため
       （必殺技の帯で同じズレを一度やっている。§さわるときの注意）。 */
  if (B.bossBackT > 0) {
    B.bossBackT -= dt;
    if (B.bossBackT <= 0) {
      B.bossBackT = -1;
      B.bossNo++;
      /* ★★「3」の3回目だけ つよいボス（2026-08-10・ユーザー指示）。
         ★★★**st.boss を 書きかえないこと**。st.boss は ステージのデータそのもので、
           バトルをまたいで 使い回される＝1回 かけ算すると **次に遊ぶときも 強いまま**
           どんどん ふくらんでいく。かならず **コピーを作って** そこに かける。 */
      var bd = bsDef(st), big = (seriesOf(st) === 3 && B.bossNo === BOSS_LAST_NO);   /* ★型ぶん こみ */
      if (big) {
        var c = {}; for (var bk in bd) c[bk] = bd[bk];      /* ★bd＝型ぶんを かけたあとの ボス */
        c.hp  = Math.round(bd.hp  * BOSS_LAST_MULT);
        c.atk = Math.round(bd.atk * BOSS_LAST_MULT);
        bd = c;
      }
      /* ★つよいボスのときは 帯の文も 変える。同じ文だと「なぜ急に かたいのか」が分からない */
      cutIn('<span class="cut-wave">😤 ' + rubi(st.boss.name)
        + (big ? ' が さいごの力で あらわれた！ いままでより つよい！' : ' が もういちど あらわれた！') + '</span>');
      B.lastCut = B.t;                    /* 直後の波の帯と 重ならないように */
      var bu = spawnEnemy(bd, "boss");    /* ★ボスに stagePress はかけない（ざこだけ・§stagePress） */
      if (big) bu.el.classList.add("bosslast");   /* 見た目でも わかるように（赤いオーラ） */
    }
  }

  /* 💣 てきの てつはう（2026-08-10・ユーザー指示「レベル3は 相手も 20秒に1回」）。
     ★★**setTimeout ではなく ここで数えること**。倍速(#st1f)や カットインの止め(B.freeze)の
       ときに「バトルは止まっているのに 玉だけ とんでくる」ズレが起きる
       （ボスのふっかつ・ひっさつの帯で 同じズレを 一度ずつ やっている）。 */
  if (B.foeBombT > 0) {
    B.foeBombT -= dt;
    if (B.foeBombT <= 0) { B.foeBombT = E_TETSU_EVERY; foeThrowBomb(); }
  }

  /* ざこ敵は「波」で来る。つくる型は ボスも敵の城も無いぶん、波を大きく・はやくする */
  B.spawnT -= dt;
  if (B.spawnT <= 0) {
    B.wave++;
    var n = waveSize(st, B.wave);
    if (st.mode === "build") n = Math.round(n * BUILD_WAVE);
    sendWave(st, n);
    B.spawnT = mnDef(st).every * WAVE_REST * (st.mode === "build" ? BUILD_REST : 1);   /* ★型ぶん こみ */
  }

  /* 🤝 いま そろっているコンビを数える。そろった しゅんかんに 1回だけ カットインを出す。
     ★毎フレーム出すと 画面が うまるので、**新しくそろったコンビだけ**を見る（B.pairSeen）。 */
  var pairOn = {};
  livePairs().forEach(function (p) {
    pairOn[p.a] = 1; pairOn[p.b] = 1;
    var k = p.a + "+" + p.b;
    if (!B.pairSeen[k]) {
      B.pairSeen[k] = 1;
      cutIn('<span class="cut-pair">🤝 ' + rubi(p.name) + '</span>'
          + '<span class="cut-pair-sub">' + CHAR_BY_ID[p.a].name + " ＋ " + CHAR_BY_ID[p.b].name + '</span>');
      popupPair(p);
      sfx("pair");
    }

  /* ★かたっぽが たおれたら「そろっていない」に戻す。そうしないと 出しなおしても

  for (var pk in B.pairSeen) {

    if (!(onField(ab[0]) && onField(ab[1]))) delete B.pairSeen[pk];
  }

  var work = 0;

    if (!u.alive) return;
    if (u.kind === "ally") {

      u.el.classList.toggle("paired", u.pr > 1);
    }
    if (u.kind !== "base" && u.kind !== "ebase") {

         ★ここに1つ足すだけで すむように、あるく・こうげき の **手前**で 止めている。
           つくる型の しごと(work)は みかたの話なので さわらない。 */

          if (u.cdT <= 0) { u.cdT = u.cd * (wet ? AME_ATK : 1); u.poseT = ATK_POSE;

        } else {
          /* 敵が近くにいない みかたは まるまる はかどる。
             ⭐じだいボーナスの人は はやい＝「その時代の人をつれてくる」がここでも効く */
          if (st.mode === "build" && u.kind === "ally")
            work += WORK_PER_SEC * (u.eraB ? ERA_MULT : 1);
          u.moved = true;
          u.x += (u.side === "a" ? 1 : -1) * u.speed * (wet ? AME_SLOW : 1)
               * (u.mor > 1 ? HATA_SPD : 1) * dt;

          if (u.side === "a") u.x = Math.min(u.x, B.W - EDGE_PAD);

    if (u.sp) {

    if (u.side === "a" && (u.inv || 0) > 0) {

      if (u.inv <= 0) { u.inv = 0; u.el.classList.remove("inv"); }

    if (u.kind === "ally") {

      u.skillT -= dt;

           で **2段構え**にした。実測での弱さ（Lv50・新しい本ステージ）:
             前線が くらうのは 157ダメージ/秒＝HP2168の **7.3%／秒**。
             それに対して 卑弥呼 2.39%／秒・**鑑真 0.81%／秒**＝11分の1しか 戻せていなかった。

             ① 今までの 全員への小回復 … **そのまま据えおき**（誰も下がらない）

          B.units.forEach(function (a) {
            if (!a.alive || a.side !== "a" || a.hp >= a.maxHp) return;
            a.hp = Math.min(a.maxHp, a.hp + amt);
            popup(a.x, "+" + amt, "heal");
            if (a.hp < a.maxHp) hurt.push(a);   /* 小回復で 満タンになった人は もう いらない */
          });
          /* ★大回復＝**相手の最大HPの割合**（HEAL_BIG）。固定値にしないこと。
             固定値だと 硬い味方ほど 効かない＝いまの問題が そのまま のこる。
             ★けがの **重い順**（のこりHPの割合が 少ない順）。「重い人から 手当てする」＝
               子どもが見て 分かる 回復役の動き。 */
          hurt.sort(function (a, b) { return a.hp / a.maxHp - b.hp / b.maxHp; });
          hurt.slice(0, HEAL_N[u.rar] || 1).forEach(function (a) {
            var big = Math.round(a.maxHp * HEAL_BIG);
            a.hp = Math.min(a.maxHp, a.hp + big);
            popup(a.x, "+" + big, "healbig");

        }
      }
    }
    /* 見た目の更新 */
    u.el.style.left = unitLeft(u.x);
    u.el.querySelector(".hpfill").style.width = (u.hp / u.maxHp * 100) + "%";
  });

  /* つくるモード: かんせい度が100%になったら勝ち。
     ★★2026-08-09にユーザー指示で **時間切れで負けるのをやめた**
       （「圧倒的に攻めて勝っているのに敗北になった」＝金閣の80%で時間切れ）。
       ユーザーの言葉:「こういう文化のステージは **金閣が完成するまで 耐え凌げば勝ち**でいい。
       ただ その分 耐え忍ぶがポイントなので、1.1倍ぐらい敵を増やしてもいい」。
     ★かわりに **時間そのものでも かんせい度がすすむ**ようにした（下の base）。
       build.sec は「**何もしなくても そこで完成する時間**」という意味になった。
       みかたを出すと その上に 上乗せされて 早く終わる＝これまでの「みんなでつくる」も生きる。
     ★**時間が来たら勝ち、にはしない**こと。それをやると、敵を通したときの

    if (B.t > B.workUntil) B.workMult = 1;        /* できごとの効きめが切れた */
    buildEvents(st);
    var nin = 0;    /* いま 場にいる みかたの人物の数 */

  B.pwBtns.forEach(function (pb) {

    B.aimMode = id; B.aim = null;
    $("aimlayer").className = "on";

    B.aimMode = id;
    B.aim = null;

    drawAim();

  if (B.money < p.cost) return;

  B.powCds[id] = p.cd;

/* 黄色いジグザグの いなずまを3本、上から地面まで落とす（2026-08-06・ユーザー要望）。

   ★2026-08-07: えらんだ場所(cx)の まわりに落ちるようにした。まん中に1本・両わきに1本ずつ。 */
function drawBolts(cx) {
  var el = $("boltfx"), H = $("bfield").clientHeight;
  var r = UNIT_W * KAMI_R;
  var s = '<svg>';
  for (var i = 0; i < 3; i++) {
    var x = cx + (i - 1) * r * 0.55 + (Math.random() * 24 - 12);
    /* ★左右に かならず ふりわけること。ランダムに ずらすだけだと
       ゆるい波の線になって「いなずま」に見えない（1回目がそうだった） */
    var seg = 9, pts = "";
    for (var j = 0; j <= seg; j++) {
      var side = (j % 2 ? 1 : -1) * (j === 0 || j === seg ? 0 : 1);
      pts += Math.round(x + side * (20 + Math.random() * 26)) + ","
           + Math.round(H * j / seg) + " ";
    }
    s += '<polyline points="' + pts + '" fill="none" stroke="#ffd54f" stroke-width="10"'
       + ' stroke-linejoin="miter" opacity="0.95"/>'
       + '<polyline points="' + pts + '" fill="none" stroke="#fffde7" stroke-width="4"'
       + ' stroke-linejoin="miter"/>';
  }
  el.innerHTML = s + '</svg>';
  el.className = "";
  void el.offsetWidth;          /* いちど外して付けなおさないと 2回目からアニメが再生されない */
  el.className = "on";
}
