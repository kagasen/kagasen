     「ボスと たたかっている」手ごたえが 消えるため。
   ★敵の城・町(ebase)は 動かさない（建っている物なので 当たり前だが、
     ここを うっかり動かすと 城が 画面の外へ 出ていく）。
   ★みかたは 動かさない（ユーザーの言葉は「相手を後ろに下げる」）。 */
function blowKaze() {
  sfx("power");
  var back = B.W - EDGE_PAD;          /* 敵が わいてくる場所（＝盤の 右のはし） */
  var n = 0;
  B.units.forEach(function (u) {
    if (!u.alive || u.side !== "e" || u.kind === "ebase") return;
    /* ★★**わくの外で 順番まちしている敵は さわらない**（2026-08-10に 実測で見つけた）。
       波でまとめて出た敵は x が back より うしろ（画面の外）に ならんでいる。
       ここで うっかり `Math.min(back, …)` を かけると、まだ出ていない敵が
       **手前に ひっぱり出されて** かみかぜで 敵が増えたように見える（x=835の敵が 614に来た）。 */
    if (u.x > back) return;
    var d = UNIT_W * KAZE_PUSH * (u.kind === "boss" ? KAZE_BOSS : 1);
    /* ★★**back で 止めない**（ここも 実測で こうした）。止めると 何体いても
       ぜんぶが 同じ x に かさなって **10体が 1体に見える**。
       みんな 同じだけ ずらせば **ならびは そのまま**うしろへ さがる＝かさならない。
       画面の外へ 出るぶんは、そのまま 歩いて もどってくる（＝これが「時間を買う」中身）。 */
    u.x += d;
    u.stun = KAZE_STUN;
    u.el.style.left = unitLeft(u.x);   /* すぐ動かす（tick を待つと 1コマ ずれて見える） */
    n++;
  });
  drawKaze();
  /* ★何も いなかったときも はっきり見せる（てつはうの「はずれ！」と同じ流儀）。
     おかねは もう はらっているので、だまって終わると「お金だけ消えた」に見える。 */
  popup(B.W * 0.5, n ? "かみかぜ！ てきが 下がった！" : "てきが いない！", n ? "heal" : "");
}
/* 白いすじが 左から右へ ふきぬける。★向きは **敵がおされる向きと同じ**にすること
   （どっちへ おしたのかが、絵だけで 分かるようにするため） */
function drawKaze() {
  var el = $("kazefx"), H = $("bfield").clientHeight, s = "";
  for (var i = 0; i < 14; i++) {
    s += '<i style="top:' + Math.round(H * (0.10 + 0.06 * i)) + 'px;'
       + 'width:' + (70 + (i % 4) * 46) + 'px;'
       + 'animation-delay:' + ((i % 5) * 0.05).toFixed(2) + 's;"></i>';
  }
  for (var j = 0; j < 3; j++) {
    s += '<b style="top:' + Math.round(H * (0.22 + 0.24 * j)) + 'px;'
       + 'animation-delay:' + (0.06 + j * 0.09).toFixed(2) + 's;">🌀</b>';
  }
  el.innerHTML = s;
  el.className = "";
  void el.offsetWidth;               /* いちど外さないと 2回目からアニメが再生されない */
  el.className = "on";
  /* すじが とび終わったら 消す（出しっぱなしにすると 次のバトルに のこる） */
  setTimeout(function () { if ($("kazefx").className === "on") $("kazefx").className = ""; }, 1100);
}

/* ---------- 🍚 年貢（2026-08-10・ユーザー要望「年貢で誰かにあげれば回復」） ----------
   さわった所の いちばん近くにいる **みかたの人物 ひとり** の HPをもどす。
   ★「だれに あげるか」を えらばせるのが このちからの中身。画面ぜんぶを回復すると
     ただのボタンになり、指でやることが 増えない（§1-C のねらい）。
   ★★城(base)・さく(wall)には あげられない（NENGU_HEAL の所に 理由を書いた）。 */
/* ★★えらびかたは「いちばん近い人」ではなく「**はんいの中で いちばん けずられている人**」。
   ★理由（2026-08-10・実測で こうした）: 出したばかりの みかたは **みんな 同じ場所(x=84)に
     かさなって立っている**。いちばん近い人で えらぶと 同じ距離が ならんで
     **さいごに見た人**が えらばれ、その人が まんたんだと「もう げんきだよ！」で
     はじかれてしまう（けずられた人が すぐ となりにいるのに 直せない）。
   ★指で えらぶのは「**どのあたり**の みかたか」＝前線か・城の前か。
     かさなっている中の だれかは 子どもには えらべないので、そこは ゲームが
     いちばん たすけが要る人を えらぶ。 */
function nenguPick(x) {
  var best = null, bestS = 0, bestD = 0, r = UNIT_W * NENGU_PICK;
  B.units.forEach(function (u) {
    if (!u.alive || u.kind !== "ally") return;      /* ★城(base)・さく(wall)は 対象外 */
    var d = Math.abs(u.x - x);
    if (d > r) return;
    var s = u.hp / u.maxHp;
    if (!best || s < bestS - 0.001 || (s < bestS + 0.001 && d < bestD)) {
      best = u; bestS = s; bestD = d;
    }
  });
  return best;
}
/* あげられたら true、あげられなかったら false（aimEnd が モードを切るかどうかに使う） */
function giveNengu(x) {
  var p = POW_BY_ID.nengu;
  if ((B.powCds.nengu || 0) > 0) return false;
  var u = nenguPick(x);
  /* ★はらう前に ことわる。「はらったのに 何も起きなかった」を 作らないため */
  if (!u) { popup(x, "だれも いないよ！", ""); return false; }
  if (u.hp >= u.maxHp) { popup(u.x, "もう げんきだよ！", "heal"); return false; }
  /* ★ここも だまって 何も起きないのは だめ（ねらいモードが 切れないので、
     子どもは「押しても なにも おきない」としか 分からなくなる） */
  if (B.money < p.cost) { popup(u.x, "おかねが たりない！", ""); return false; }
  sfx("nengu");
  B.money -= p.cost;
  B.powCds.nengu = p.cd;
  var amt = Math.round(u.maxHp * NENGU_HEAL);
  u.hp = Math.min(u.maxHp, u.hp + amt);
  u.el.querySelector(".hpfill").style.width = (u.hp / u.maxHp * 100) + "%";
  popup(u.x, "🍚 +" + amt, "heal");
  /* 🛡 回復と 同時に むてき（2026-08-11・ユーザー要望）。
     ★年貢は もともと「HPを 4わり もどす」だけで、もらった しゅんかんに また なぐられて
       いた＝**弱すぎた**。むてきが つくことで「**いま たえてほしい 1人**に わたす」
       という 使いどころが 生まれる。 */
  makeInv(u, INV_NENGU);
  popup(u.x, "🛡 " + INV_NENGU + "びょう むてき！", "heal");
  return true;
}

/* ---------- ねらい（ゆみ・さく）。指の位置がそのまま ねらう場所 ----------
   ★スローにしない（ユーザー指示）。そのかわり ゆみは 🪙2 と とても安い。
   ★**画面を長おししているあいだ、矢が とびつづける**（2026-08-06・ユーザー指示）。
     指をずらせば ねらう場所も変わる。はなすと止まる。
   ★ねらいの線（点線の弧・とどく線）は **出さない**（ユーザー指示「線はなくていい」）。
     矢そのものが飛んでいくので、どこへ行くかは見ていれば分かる。
   ★ゆびの「よこ」＝落とす場所、「たて」＝矢が上がる高さ。
     ひくくすると まっすぐ とんで **前にいる敵** に当たり、
     高くすると 山なりに とんで **前の敵をこえて うしろ** に落ちる。
     これが「角度をちょっと調整できる」の中身。 */
/* ちからの絵（images/ui/pw/{id}.webp）が読めたかを 1回だけ調べて おぼえておく。
   ★盤に出す さく・てつはう・はた で使う（2026-08-09・ユーザー指示
     「ボタンと同じ絵を 盤の上でも使って」）。ボタンの絵と 盤に出る物が ちがうと、
     どのちからを使ったのか 分からなくなるため。
   ★読めなかったら これまでどおり 絵文字・図形のまま出す（設計合意7の流儀）。 */
var PW_IMG_OK = {};
function pwImgSrc(id) { return "images/ui/pw/" + id + ".webp?v=" + ASSET_V; }
POWERS.forEach(function (p) {
  if (!p.img) return;
  var im = new Image();
  im.onload = function () { PW_IMG_OK[p.id] = true; };
  im.src = pwImgSrc(p.img);
});

/* ★★城のちからが ねらえる いちばん右（2026-08-09・ユーザー指示
   「相手の城は 基本 キャラクターの こうげきしか 当たらないようにして」）。
   ★もともと **ダメージは 1も 入っていなかった**（fireKaminari 等が ebase を外している）。
     まずかったのは **ねらえてしまう見た目**のほう。かみなりは 城の真上に落とせて、
     しかも わの半径が 156pxあるので、**光の輪が 城をまるごと のみこんでいた**。
   ★rad ＝ そのちからの きく はんいの半径。**わのはしが 城の絵に かからない**ところまで
     下げるので、ここに その数字を わたすこと（わたし忘れると 見た目だけ 城にかかる）。
   ★つくる型でも同じ（B.ebaseU は無いが、右はしに つくっている物の絵がある）。
     金閣を建てているのに 金閣に かみなりを落とせたら おかしい。
   ★ここ1か所に まとめてあるので、ちからを足すときも この関数を通すだけでよい（CLAUDE.md §8）。 */
function powerFarX(rad) {
  var big = (B.ebaseU && B.ebaseU.el.classList.contains("has-sprite"))
         || $("buildsite").className === "on";
  var keep = (big ? YUMI_KEEP_IMG : YUMI_KEEP_W) * UNIT_W;
  return B.W - EDGE_PAD - keep - (rad || 0);
}
/* ★★🏹ゆみ だけ ねらえる いちばん右（2026-08-10・ユーザー指示「相手の一番奥まで」）。
   ほかの ちからは powerFarX（城の手前で止まる）を 通すが、**弓だけ そこを 通さない**。
   ★城が こわれない しくみは そのまま:
     ① 矢の当たり判定から ebase を 外してある（tickArrows の `u.kind !== "ebase"`）
     ② 地面に落ちたときの はじけ(YUMI_SPLASH)も 同じところで ebase を外している
     ＝ **城の足もとに 矢が ささっても 城のHPは 1も へらない**（ユーザー指示の
       「ただし弓で城を落とすことはできないように」は ここで まもっている）。
   ★はしまで（B.W - EDGE_PAD）＝ **敵が わいてくる場所**。それより先は 敵もいないので
     ねらえても 意味がない。
   ★★**つくる型（大仏づくり・金閣など）だけは 今までどおり 手前で止める**。
     つくる型の 右はしに あるのは 敵の城ではなく **みかたが 建てている 大仏や金閣**。
     そこへ みかたの矢が 降るのは どう見ても おかしい。ユーザーの指示は
     「**相手の**一番奥まで」なので、相手のいない つくる型は 対象外と読む。 */
function yumiFarX() {
  if ($("buildsite").className === "on") return powerFarX(YUMI_SPLASH);
  return Math.min(EDGE_PAD + 6 + B.W * YUMI_RANGE, B.W - EDGE_PAD);
}
function fieldPt(e) {
  var t = (e.touches && e.touches[0]) ? e.touches[0] : e;
  var r = $("bfield").getBoundingClientRect();
  return { x: t.clientX - r.left, y: t.clientY - r.top, H: r.height };
}
function aimMove(e) {
  if (!B || B.over || !B.aimMode) return;
  if (e.cancelable) e.preventDefault();
  var p = fieldPt(e), m = B.aimMode;
  if (m === "yumi") {
    var x0 = EDGE_PAD + 6;
    /* ★2026-08-10にユーザー指示で **城の手前で切るのを やめた**（「相手の一番奥まで」）。
       もとは powerFarX(YUMI_SPLASH) で 城の絵の手前で 止めていた。理由は yumiFarX を読むこと。 */
    var far = yumiFarX();
    var tx = Math.max(x0 + 50, Math.min(far, p.x));
    /* 指の高さ（地面の線から上に何px か）から、矢が上がる高さを決める */
    var up = (p.H - B.groundY) - p.y;
    var h = Math.max(ARROW_H_MIN, Math.min(ARROW_H_MAX, up - ARROW_Y0));
    B.aim = { tx: tx, h: h };
  } else if (m === "hi") {
    /* 🔥 火ぜめ: さわった所が はしっこ、そこから 指を すべらせた ぶんが 火の帯になる。
       ★はじめに さわった所(x1)を おぼえておくのが キモ。指を はなすまで x1 は動かさない。
       ★火の帯は なぞった所が そのまま はんいなので、半径は 0 でよい。 */
    var fx = Math.max(EDGE_PAD, Math.min(powerFarX(0), p.x));
    if (!B.aim) B.aim = { x1: fx, x2: fx };
    else B.aim.x2 = fx;
  } else if (m === "tetsuhau") {
    /* ★ばくはつの半径(TETSU_R)ぶんも 引く。center だけ見て止めると **わが城にかかる** */
    B.aim = { tx: Math.max(EDGE_PAD + UNIT_W * 0.6,
                           Math.min(EDGE_PAD + B.W * TETSU_RANGE,
                                    powerFarX(UNIT_W * TETSU_R), p.x)) };
  } else if (m === "kaminari") {
    /* ★★ここが 2026-08-09にユーザー指摘で いちばん変わった所。
       もとは `B.W - EDGE_PAD`＝**城の真上**まで落とせて、しかも わの半径が
       ユニット幅の1.5倍(156px)あるので、光の輪が 城をまるごと のみこんでいた。 */
    B.aim = { tx: Math.max(EDGE_PAD, Math.min(powerFarX(UNIT_W * KAMI_R), p.x)) };
  } else if (m === "nengu") {
    /* 🍚 年貢: **みかたを えらぶ**ので、城の手前で切る必要がない（敵がわには だれもいない）。
       ★えらんだ人が だれか 分かるように、その人の x に すいつかせる（drawAim が わを出す）。 */
    var who = nenguPick(p.x);
    B.aim = { tx: who ? who.x : p.x, who: who };
  } else {                                  /* さく・はた（ダメージは無いが 城には置かせない） */
    B.aim = { tx: Math.max(EDGE_PAD + UNIT_W,
                           Math.min(B.W * 0.75, powerFarX(0), p.x)) };
  }
  drawAim();
}
function aimEnd(e) {
  if (!B || B.over || !B.aimMode || !B.aim) return;
  if (e && e.cancelable) e.preventDefault();
  var m = B.aimMode;
  if (m === "yumi") {
    B.aim = null;      /* 指をはなしたら 矢は止まる。ゆみモードのままなので すぐまた うてる */
    drawAim();
    return;
  }
  if (m === "saku") placeWall(B.aim.tx);
  else if (m === "hata") placeFlag(B.aim.tx);
  else if (m === "tetsuhau") throwBomb(B.aim.tx);
  else if (m === "kaminari") dropKaminari(B.aim.tx);
  else if (m === "hi") lightFire(B.aim.x1, B.aim.x2);
  else if (m === "nengu") {
    /* 🍚 だれにも あげられなかったとき（近くに みかたが いない・もう まんたん）は
       **モードを 切らない**。切ってしまうと、ねらいを 外すたびに ボタンを
       押しなおすことになり、待ち時間に さっと使う ちからにならない。 */
    if (!giveNengu(B.aim.tx)) { B.aim = null; drawAim(); return; }
  }
  disarmPower();       /* ★ゆみ いがいは 1回つかったら モードを切る（高いので 事故うちを防ぐ） */
}
/* ⚡ おかねを はらって、えらんだ場所に かみなりを落とす */
function dropKaminari(x) {
  var p = POW_BY_ID.kaminari;
  if (B.money < p.cost || (B.powCds.kaminari || 0) > 0) return;
  B.money -= p.cost;
  B.powCds.kaminari = p.cd;
  fireKaminari(x);
}
/* 矢の道すじの計算。地面(y=0)の tx に落ちて、とちゅうで h だけ上がる山なりにする */
function arrowPath(tx, h) {
  var x0 = EDGE_PAD + 6;
  var vy = Math.sqrt(2 * ARROW_G * h);
  var T = vy / ARROW_G + Math.sqrt(2 * (ARROW_Y0 + h) / ARROW_G);
  return { x0: x0, y0: ARROW_Y0, vx: (tx - x0) / T, vy: vy, T: T };
}
/* ねらっているあいだの「ここに こうなるよ」の しるし。
   ★ゆみだけは何も描かない（ユーザー指示「線はなくていい」）。矢そのものが見えるので分かる。
   ★ほかの4つは **どこに どれだけの ひろさで きくのか** が分からないと えらべないので、
     地面に わ（だ円）や 帯を うすく出す。数字（ねだん）も 火ぜめだけ出す。 */
function drawAim() {
  var lay = $("aimlayer");
  if (!B || !B.aimMode || !B.aim || B.aimMode === "yumi") { lay.innerHTML = ""; return; }
  var H = $("bfield").clientHeight, gy = B.groundY, gyTop = H - gy;   /* 地面の線（上から） */
  var a = B.aim, s = "";
  if (B.aimMode === "saku") {
    s = '<rect x="' + (a.tx - 9) + '" y="' + (gyTop - 62) + '"'
      + ' width="18" height="62" fill="rgba(121,85,72,0.55)" stroke="#fff" stroke-width="3"/>';
  } else if (B.aimMode === "kaminari") {
    var kr = UNIT_W * KAMI_R;
    s = '<ellipse cx="' + a.tx + '" cy="' + gyTop + '" rx="' + kr + '" ry="26"'
      + ' fill="rgba(255,241,118,0.28)" stroke="#ffd54f" stroke-width="4"/>'
      + '<text x="' + a.tx + '" y="' + (gyTop - 40) + '" text-anchor="middle"'
      + ' font-size="34" fill="#fff">⚡</text>';
  } else if (B.aimMode === "tetsuhau") {
    var tr = UNIT_W * TETSU_R;
    s = '<ellipse cx="' + a.tx + '" cy="' + gyTop + '" rx="' + tr + '" ry="24"'
      + ' fill="rgba(255,112,67,0.26)" stroke="#ff7043" stroke-width="4"'
      + ' stroke-dasharray="10 7"/>'
      + '<text x="' + a.tx + '" y="' + (gyTop - 38) + '" text-anchor="middle"'
      + ' font-size="30" fill="#fff">💣</text>';
  } else if (B.aimMode === "hata") {
    var hr = UNIT_W * HATA_R;
    s = '<ellipse cx="' + a.tx + '" cy="' + gyTop + '" rx="' + hr + '" ry="24"'
      + ' fill="rgba(255,213,79,0.20)" stroke="#ffc107" stroke-width="4"'
      + ' stroke-dasharray="12 8"/>'
      + '<text x="' + a.tx + '" y="' + (gyTop - 34) + '" text-anchor="middle"'
      + ' font-size="30" fill="#fff">🚩</text>';
  } else if (B.aimMode === "nengu") {
    /* 🍚 年貢: **だれに あげるのか** が いちばん大事なので、その人を みどりの わで かこむ。
       ★近くに だれも いないときは わを 赤くして「あげる人が いない」と 先に見せる
         （さわってから「だれも いないよ！」だけだと 何がだめか 分かりにくい）。 */
    var ok = !!a.who, nr = UNIT_W * 0.62;
    s = '<ellipse cx="' + a.tx + '" cy="' + (gyTop - 6) + '" rx="' + nr + '" ry="' + (nr * 0.9) + '"'
      + ' fill="' + (ok ? "rgba(129,199,132,0.30)" : "rgba(229,115,115,0.22)") + '"'
      + ' stroke="' + (ok ? "#43a047" : "#e57373") + '" stroke-width="4" stroke-dasharray="10 7"/>'
      + '<text x="' + a.tx + '" y="' + (gyTop - nr - 14) + '" text-anchor="middle"'
      + ' font-size="30" fill="#fff">' + (ok ? "🍚" : "❌") + '</text>';
    /* ★**だれに あげるのか 名前で出す**。人が かさなって立っていると、わだけでは
       どの人に あげたのか 分からない（えらびかたも「いちばん けずられている人」なので、
       名前が 出ないと 子どもには 予想できない）。字は2回かさねて 黒いフチをつける。 */
    if (ok) {
      var nm = a.who.ch.name;
      s += '<text x="' + a.tx + '" y="' + (gyTop - nr - 44) + '" text-anchor="middle"'
         + ' font-size="19" font-weight="bold" fill="none"'
         + ' stroke="rgba(0,0,0,0.65)" stroke-width="5">' + nm + '</text>'
         + '<text x="' + a.tx + '" y="' + (gyTop - nr - 44) + '" text-anchor="middle"'
         + ' font-size="19" font-weight="bold" fill="#fff">' + nm + '</text>';
    }
  } else if (B.aimMode === "hi") {
    var f = hiSpan(a.x1, a.x2);
    /* ★ねだんは かならず出すこと。長さで変わるので、見えないと 何円はらうのか分からない */
    var col = (B.money >= f.cost) ? "#fff" : "#ffcdd2";
    s = '<rect x="' + f.x + '" y="' + (gyTop - 34) + '" width="' + f.w + '" height="34" rx="8"'
      + ' fill="rgba(255,87,34,0.42)" stroke="#ff9800" stroke-width="4"/>'
      /* ★字は2回かさねて書く（下に黒いフチ→上に本体）。paint-order は古い端末に無いため */
      + '<text x="' + (f.x + f.w / 2) + '" y="' + (gyTop - 46) + '" text-anchor="middle"'
      + ' font-size="22" font-weight="bold" fill="none"'
      + ' stroke="rgba(0,0,0,0.6)" stroke-width="5">🪙 ' + f.cost + '</text>'
      + '<text x="' + (f.x + f.w / 2) + '" y="' + (gyTop - 46) + '" text-anchor="middle"'
      + ' font-size="22" font-weight="bold" fill="' + col + '">🪙 ' + f.cost + '</text>';
  }
  lay.innerHTML = '<svg>' + s + '</svg>';
}
/* 🔥 なぞった2点から「火の帯の 左はし・はば・ねだん」を出す。
   ★ここ1か所で計算して、ねらい中の絵・ねだんの表示・じっさいに置くとき の3つで使いまわす
     （バラバラに計算すると「見えていたねだんと ちがう額を はらった」になる）。 */
function hiSpan(x1, x2) {
  var lo = Math.min(x1, x2), hi = Math.max(x1, x2);
  var w = Math.max(HI_MIN_W, Math.min(HI_MAX_W, hi - lo));
  var x = Math.max(EDGE_PAD, Math.min(B.W - EDGE_PAD - w, lo));
  return { x: x, w: w, cost: Math.round(POW_BY_ID.hi.cost + w / 100 * HI_COST100) };
}
function fireArrow(tx, h) {
  var p = POW_BY_ID.yumi;
  if (B.money < p.cost || (B.powCds.yumi || 0) > 0) return;
  B.money -= p.cost;
  B.powCds.yumi = p.cd;
  var pa = arrowPath(tx, h);
  var el = document.createElement("div");
  el.className = "arrow";
  $("bfield").appendChild(el);
  var a = { x: pa.x0, y: pa.y0, vx: pa.vx, vy: pa.vy, el: el };
  placeArrow(a);          /* ★すぐ置くこと。tick まで待つと1コマだけ左上のすみに見える */
  B.arrows.push(a);
}
function placeArrow(a) {
  a.el.style.left = a.x + "px";
  a.el.style.bottom = (B.groundY + a.y) + "px";
  a.el.style.transform = "rotate(" + (-Math.atan2(a.vy, a.vx) * 180 / Math.PI) + "deg)";
}
/* 矢を進める。当たったら消える。地面に落ちたら まわりに ちいさく ばくはつ */
function tickArrows(dt) {
  if (B.arrows.length === 0) return;
  var dmg = Math.round(minionRef().hp * YUMI_DMG);
  /* 当たり判定は人物の絵よりすこし せまく（0.32）。ひろいと、山なりに うっても
     すぐ前にいる敵の頭に かすって しまい、「こえて うしろに落とす」ができない */
  var halfW = UNIT_W * 0.32, bodyH = UNIT_W * 0.8;
  var steps = Math.max(2, Math.ceil(dt * 60));   /* 速い矢が敵をすりぬけないように細かく進める */
  for (var i = B.arrows.length - 1; i >= 0; i--) {
    var a = B.arrows[i], gone = false;
    for (var s = 0; s < steps && !gone; s++) {
      var ds = dt / steps;
      a.x += a.vx * ds;
      a.vy -= ARROW_G * ds;
      a.y += a.vy * ds;
      if (a.x > B.W) { gone = true; break; }
      if (a.y <= 0) {                       /* 地面に落ちた＝まわりの敵にダメージ */
        B.units.forEach(function (u) {
          if (u.alive && u.side === "e" && u.kind !== "ebase" && Math.abs(u.x - a.x) < YUMI_SPLASH)
            hit(u, dmg, false, "_pw");
        });
        gone = true;
        break;
      }
      for (var j = 0; j < B.units.length; j++) {
        var u2 = B.units[j];
        if (!u2.alive || u2.side !== "e" || u2.kind === "ebase") continue;
        if (Math.abs(u2.x - a.x) < halfW && a.y < bodyH) { hit(u2, dmg, false, "_pw"); gone = true; break; }
      }
    }
    if (gone) { a.el.parentNode.removeChild(a.el); B.arrows.splice(i, 1); continue; }
    placeArrow(a);
  }
}
/* 🪵 さく: 敵はこれを こわさないと 先へ進めない。みかたは すりぬける（じゃまにならない）。
   ★HPは「敵のこうげき何回ぶん」で決めるので、後半のステージでも同じ手ごたえになる。 */
function placeWall(x) {
  var p = POW_BY_ID.saku;
  /* ★音は **はらえたあと**に鳴らすこと。先に鳴らすと、おかねが足りず 何も起きていないのに
     音だけ鳴って「押せた」と かんちがいさせる（ちから4つとも同じ）。 */
  if (B.money < p.cost || (B.powCds.saku || 0) > 0) return;
  sfx("power");
  B.money -= p.cost;
  B.powCds.saku = p.cd;
  var hp = Math.round(minionRef().atk * WALL_HITS);
  var u = {
    side: "a", kind: "wall", alive: true, hp: hp, maxHp: hp,
    atk: 0, range: 0, speed: 0, cd: 1, cdT: 1, x: x
  };
  /* ★2026-08-09にユーザー指示で ボタンと同じ絵にした（読めなければ 🪵 のまま） */
  u.el = mkUnitEl(PW_IMG_OK.saku
      ? '<img class="wallimg" alt="" src="' + pwImgSrc("saku") + '">'
      : '<span class="emoji">🪵</span>', "さく");
  u.el.style.left = unitLeft(u.x);
  $("bfield").appendChild(u.el);
  B.units.push(u);
  popup(x, "さくを おいた！", "heal");
}

/* ---------- 💣 てつはう（2026-08-07・ユーザー要望） ----------
   矢とのちがいは「**落ちてから おくれて ばくはつする**」こと。だから
   いま敵がいる所ではなく、**敵が これから 歩いてくる所** に投げないと当たらない。
   ★みかたには当たらない（かみなりが「みかたにも当たる」役なので、そこは かぶらせない）。
   ★敵の町(ebase)には効かせない（§1の★。必殺技で一度やらかしている）。 */
function throwBomb(tx) {
  var p = POW_BY_ID.tetsuhau;
  if (B.money < p.cost || (B.powCds.tetsuhau || 0) > 0) return;
  sfx("power");
  B.money -= p.cost;
  B.powCds.tetsuhau = p.cd;
  var el = document.createElement("div");
  el.className = "bomb";
  /* ★2026-08-09にユーザー指示で ボタンと同じ絵にした（読めなければ 黒い玉のまま） */
  if (PW_IMG_OK.tetsuhau) {
    el.className = "bomb img";
    el.style.backgroundImage = 'url("' + pwImgSrc("tetsuhau") + '")';
  }
  $("bfield").appendChild(el);
  /* ★cls＝この玉の「もとのクラス」。地面に落ちたとき（下の tickBombs）に
     `"bomb fuse"` と 書きなおすと **img も foe も 消えてしまう**ので、かならず ここから 作りなおす。 */
  var b = { x0: EDGE_PAD + 6, tx: tx, t: 0, el: el, state: "fly", foe: false, cls: el.className };
  B.bombs.push(b);
  placeBomb(b);                 /* ★すぐ置くこと（矢と同じ。tickを待つと1コマだけ左上に見える） */
}

/* ---------- 💣 てきの てつはう（2026-08-10・ユーザー指示） ----------
   ユーザーの言葉:「**レベル3は 相手も てつはうを 20秒に1回 打ってくる**ようにして」。
   ★★**3シリーズだけ**（`seriesOf(st) === 3`）。1・2シリーズは 1バイトも 変わらない。
   ★みかたの てつはうと **左右が 逆**＝敵の城のほうから とんでくるので、
     どちらの玉かは 見ていれば わかる（そのうえで 赤いふちも 付けてある）。
   ★★★**みかたの城(base)には 当たらない**。これは みかたの てつはう・かみなりが
     敵の城に 当たらないのと **同じ線引き**（§1-C）。ここを ゆるめると
     「人が 1人も 来ていないのに 城が 落ちる」＝**手も足も出ない負けかた**ができてしまう。
   ★みかたが 1人も いないときは **投げない**（当たる相手がいないので、
     ただ おどかすだけの 玉が とんでくることになる）。
   ★落ちてから ばくはつまで TETSU_FUSE(0.85秒) あるのは みかたのと同じ＝
     **見てから 🌀かみかぜ・🍚年貢 で 手を打てる**。よけられない ものにはしない。 */
var E_TETSU_EVERY = 20;   /* 何秒に1回 投げてくるか（ユーザー指定の20秒） */
/* ★ダメージの ものさしは「そのステージの ざこ敵の **こうげき**」。
   みかたの てつはうが「ざこのHPの何ばい」で決まっているのと 同じ流儀（§1-C の minionRef）で、
   **相手をなぐる**ちからなので こちらは atk を ものさしにする。
   2.5＝ふつうの こうげき 2.5回ぶんを わの中の みかた ぜんいんに。★きつすぎたら ここを下げる。 */
var E_TETSU_MULT = 2.5;
function foeThrowBomb() {
  var al = B.units.filter(function (u) { return u.alive && u.kind === "ally"; });
  if (!al.length) return;                       /* みかたが いなければ 投げない */
  /* ねらいは みかたの まん中（いちばん たくさん 巻きこめる所） */
  var sum = 0;
  al.forEach(function (u) { sum += u.x; });
  var tx = Math.max(EDGE_PAD + UNIT_W * 0.6, Math.min(B.W - EDGE_PAD, sum / al.length));
  var el = document.createElement("div");
  el.className = "bomb foe";
  if (PW_IMG_OK.tetsuhau) {
    el.className = "bomb img foe";
    el.style.backgroundImage = 'url("' + pwImgSrc("tetsuhau") + '")';
  }
  $("bfield").appendChild(el);
  /* 起点は 敵の城がわ（右）。みかたのは 左からなので、**とぶ向きで 見分けがつく** */
  var b = { x0: B.W - EDGE_PAD, tx: tx, t: 0, el: el, state: "fly", foe: true, cls: el.className };
  B.bombs.push(b);
  placeBomb(b);
  sfx("power");
  /* ★1回目だけ 帯で 知らせる（何が起きたか 分からないまま 削られるのを ふせぐ）。
     2回目からは 玉が とんでくる絵で わかるので 出さない（画面が うるさくなる）。 */
  if (!B.foeBombSeen) {
    B.foeBombSeen = true;
    B.lastCut = B.t;
    cutIn(rubi("💣 てきも てつはうを 投《な》げてきた！ わの中《なか》の みかたが やられる！"));
  }
}
/* とんでいる とちゅうの 場所。山なりに見せるため 上がって下がる（0→1→0）計算をする。
   ★★★**落ちたあと（fuse）は k=1 で 止めること**（2026-08-10に見つけた 前からのバグ）。
     もとは `Math.min(1, b.t / TETSU_FLY)` だけだったが、地面に落ちるとき tickBombs が
     **b.t を 0 に もどす**ので k が 0 に なり、玉が **投げた場所（城の足もと）まで
     ワープして そこで ちかちかしていた**（ばくはつは ちゃんと tx で 起きるので、
     **光っている所と ばくはつする所が ちがう**という いちばん たちの悪い ズレだった）。
     💣てきの てつはうを 足して はじめて 目立った（右の城まで もどって 光っていた）。
     ★このバグのせいで「落ちてから 0.85秒 くすぶる＝見てから 手を打てる」という
       てつはう いちばんの キモ（§1-D）が、ずっと 効いていなかった。 */
function placeBomb(b) {
  var k = (b.state === "fly") ? Math.min(1, b.t / TETSU_FLY) : 1;
  var x = b.x0 + (b.tx - b.x0) * k;
  var y = (b.state === "fly") ? TETSU_TOP * 4 * k * (1 - k) : 4;
  b.el.style.left = x + "px";
  b.el.style.bottom = (B.groundY + y) + "px";
}
function tickBombs(dt) {
  if (B.bombs.length === 0) return;
  for (var i = B.bombs.length - 1; i >= 0; i--) {
    var b = B.bombs[i];
    b.t += dt;
    if (b.state === "fly") {
      placeBomb(b);
      if (b.t >= TETSU_FLY) {           /* 地面に落ちた。ここから 火が ちりちり もえる時間 */
        b.state = "fuse";
        b.t = 0;
        /* ★★★**`"bomb fuse"` と 書きなおさないこと**（2026-08-10に見つけた 前からのバグ）。
           そう書くと `img`（てつはうの絵）と `foe`（てきの玉の赤いわ）が **消える**。
           ・みかたの玉は 落ちたとたん **絵が 黒い玉に もどっていた**
             （`.bomb.img.fuse` の「大きさで ちかちか」も 効いていなかった）
           ・てきの玉は **止まっている あいだ こそ 見分けが要る**のに 赤いわが 消える
           かならず b.cls（作ったときのクラス）に fuse を 足す形にすること。 */
        b.el.className = b.cls + " fuse";
        placeBomb(b);
      }
    } else {
      if (b.t >= TETSU_FUSE) {
        bombBoom(b.tx, b.foe);
        b.el.parentNode.removeChild(b.el);
        B.bombs.splice(i, 1);
      }
    }
  }
}
/* foe=true …… **てきが 投げた玉**（2026-08-10）。当たる相手が みかたに 入れかわる。
   ★★城（base / ebase）は **どちらの玉でも 当たらない**。ここが この2つの ちからの 約束。 */
function bombBoom(cx, foe) {
  var ref = minionRef();
  var dmg = foe ? Math.round(ref.atk * E_TETSU_MULT) : Math.round(ref.hp * TETSU_DMG);
  var r = UNIT_W * TETSU_R;
  var got = 0;
  B.units.slice().forEach(function (u) {
    if (foe) { if (!u.alive || u.side !== "a" || u.kind === "base") return; }
    else     { if (!u.alive || u.side !== "e" || u.kind === "ebase") return; }
    if (Math.abs(u.x - cx) > r) return;
    /* ★てきの玉は `by` を わたさない＝🏅ふりかえりの MVPに 入らない（みかたの手がらではない）。
       ★quiet にはしない＝**ひっさつゲージは たまる**（押されているときほど 早くたまる。§6の逆転の芽）。 */
    if (foe) hit(u, dmg); else hit(u, dmg, false, "_pw");
    got++;
  });
  /* 空ぶりを 見せるのは **みかたが投げたとき だけ**（「次はもっと先へ」の学びのため）。
     てきの空ぶりに「はずれ！」と出すと、やられていないのに 責められたように 見える */
  if (got === 0 && !foe) popup(cx, "はずれ！", "");
  showBoom(cx, r);
  $("bfield").classList.remove("shake");
  void $("bfield").offsetWidth;
  $("bfield").classList.add("shake");
}
function showBoom(cx, r) {
  var d = document.createElement("div");
  d.className = "boom";
  d.style.width = (r * 2) + "px";
  d.style.height = (r * 1.1) + "px";
  d.style.left = (cx - r) + "px";
  d.style.bottom = (B.groundY - r * 0.25) + "px";
  $("bfield").appendChild(d);
  setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 600);
}

/* ---------- 🔥 火ぜめ（2026-08-07・ユーザー要望） ----------
   指で なぞった 区間が もえる。長くなぞるほど おかねが かかる＝
   「どこに・どれだけの はばで」を 自分で決める、が このちからの中身。
   ★みかたは やけない（子ども向け。理不尽をふやさない＝CLAUDE.md §6）。
   ★敵の町(ebase)にも効かない。 */
function lightFire(x1, x2) {
  var p = POW_BY_ID.hi, f = hiSpan(x1, x2);
  if (B.money < f.cost || (B.powCds.hi || 0) > 0) return;
  B.money -= f.cost;
  B.powCds.hi = p.cd;
  var el = document.createElement("div");
  el.className = "firezone";
  el.style.left = f.x + "px";
  el.style.width = f.w + "px";
  el.style.bottom = (B.groundY - 6) + "px";
  /* 炎の絵は 絵文字を 40pxおきに ならべる（画像を増やさない）。ゆらぎは CSS のアニメ */
  var s = "", n = Math.max(2, Math.round(f.w / 40));
  for (var i = 0; i < n; i++) {
    s += '<i style="left:' + Math.round(i * (f.w - 18) / (n - 1)) + 'px;'
       + 'animation-delay:-' + ((i * 0.17) % 0.5).toFixed(2) + 's;">🔥</i>';
  }
  el.innerHTML = s;
  $("bfield").appendChild(el);
  B.fires.push({ x: f.x, w: f.w, sec: HI_SEC, tickT: HI_EVERY, el: el });
  popup(f.x + f.w / 2, "火を はなった！", "");
}
function tickFires(dt) {
  if (B.fires.length === 0) return;
  var dmg = Math.round(minionRef().hp * HI_TICK);
  for (var i = B.fires.length - 1; i >= 0; i--) {
    var f = B.fires[i];
    f.sec -= dt;
    if (f.sec <= 2) f.el.className = "firezone out";     /* もうすぐ消える、を見せる */
    f.tickT -= dt;
    if (f.tickT <= 0) {
      f.tickT = HI_EVERY;
      B.units.forEach(function (u) {
        if (!u.alive || u.side !== "e" || u.kind === "ebase") return;
        if (u.x >= f.x && u.x <= f.x + f.w) hit(u, dmg, true, "_pw");   /* 数字は出さない（うるさくなる） */
      });
    }
    if (f.sec <= 0) {
      f.el.parentNode.removeChild(f.el);
      B.fires.splice(i, 1);
    }
  }
}

/* ---------- 🚩 はた（2026-08-07・ユーザー要望「置いたあとも指で動かせるもの」） ----------
   はんいの中の みかたが こうげき・足の速さ ともに つよくなる。
   ★はじめに立てるときだけ おかねが かかる。そのあとは タダで 何回でも 動かせる。
   ★はたは こわされない（敵は はたを ねらわない）。ユニットではなく ただの かざり＋はんいの計算。 */
function placeFlag(x) {
  if (!B.flag) {                                   /* はじめの1本＝おかねと クールタイムが かかる */
    var p = POW_BY_ID.hata;
    if (B.money < p.cost) return;
    sfx("power");
    B.money -= p.cost;
    /* ★クールタイムは つけない。はたは 1回のバトルに 1本だけで、
       そのあとは タダで動かすので、待たせる意味がないため */
    var ring = document.createElement("div");
    ring.className = "flagring";
    var el = document.createElement("div");
    el.className = "flag mv";
    el.textContent = "🚩";
    /* ★2026-08-09にユーザー指示で ボタンと同じ絵にした（読めなければ 🚩 のまま） */
    if (PW_IMG_OK.hata) {
      el.className = "flag mv img";
      el.innerHTML = '<img alt="" src="' + pwImgSrc("hata") + '">';
    }
    $("bfield").appendChild(ring);
    $("bfield").appendChild(el);
    B.flag = { x: x, el: el, ring: ring };
    popup(x, "はたを 立てた！", "heal");
  } else {
    sfx("tap");
    B.flag.x = x;
    popup(x, "はたを うごかした！", "heal");
  }
  drawFlag();
}
function drawFlag() {
  if (!B.flag) return;
  var r = UNIT_W * HATA_R;
  B.flag.el.style.left = B.flag.x + "px";
  B.flag.el.style.bottom = (B.groundY + 4) + "px";
  B.flag.ring.style.left = (B.flag.x - r) + "px";
  B.flag.ring.style.width = (r * 2) + "px";
  B.flag.ring.style.bottom = (B.groundY - 13) + "px";
}
/* その みかたが はたの はんいに入っているか（tick から毎フレーム見る） */
function inMorale(u) {
  return !!(B.flag && u.side === "a" && u.kind === "ally"
            && Math.abs(u.x - B.flag.x) <= UNIT_W * HATA_R);
}
/* 指（とマウス）の受けつけ。ねらいモードのときだけ はたらく。
   ★PointerEvent は古いiPadに無いので touch と mouse の両方を見る。
   ★addEventListener の第3引数にオブジェクト（{passive:false}）を渡さないこと。
     古いiPadでは「capture=true」と読まれてしまうため。 */
(function () {
  var bf = $("bfield");
  bf.addEventListener("touchstart", aimMove, false);
  bf.addEventListener("touchmove", aimMove, false);
  bf.addEventListener("touchend", aimEnd, false);
  bf.addEventListener("touchcancel", function () { if (B) { B.aim = null; drawAim(); } }, false);
  bf.addEventListener("mousedown", function (e) { if (B) B.mdown = true; aimMove(e); }, false);
  bf.addEventListener("mousemove", function (e) { if (B && B.mdown) aimMove(e); }, false);
  bf.addEventListener("mouseup", function (e) { if (B) B.mdown = false; aimEnd(e); }, false);
  /* マウスを押したまま わくの外に出たときの止め忘れ防止（PCでの確認用） */
  bf.addEventListener("mouseleave", function (e) { if (B && B.mdown) { B.mdown = false; aimEnd(e); } }, false);
})();

/* ちからの効きめを すすめる（tick から毎フレーム呼ぶ） */
function tickPowers(dt) {
  /* 🏹 長おししているあいだ、クールタイムが明けるたびに 矢が出つづける */
  if (B.aimMode === "yumi" && B.aim && (B.powCds.yumi || 0) <= 0) fireArrow(B.aim.tx, B.aim.h);
  tickArrows(dt);
  tickBombs(dt);
  tickFires(dt);
  if (B.eff.ame > 0) {
    B.eff.ame -= dt;
    if (B.eff.ame <= 0) { B.eff.ame = 0; $("rainfx").className = ""; }
  }
  if (B.eff.kikin > 0) {
    B.eff.kikin -= dt;
    var ref = minionRef();
    B.kikinT -= dt;
    if (B.kikinT <= 0) {                    /* じわじわ削る（数字は出さない＝画面がうるさくなるため） */
      B.kikinT = KIKIN_EVERY;
      var one = null;
      B.units.forEach(function (u) {
        if (!u.alive || u.side !== "e" || u.kind === "ebase") return;
        hit(u, Math.round(ref.hp * KIKIN_TICK), true, "_pw");
        if (!one) one = u;
      });
      if (one) popup(one.x, "🌾 兵糧攻め", "");
    }
    if (B.eff.kikin <= 0) {                 /* 終わりぎわに どっと くる（ユーザー案の「一定期間すぎると大幅に減る」） */
      B.eff.kikin = 0;
      $("bfield").classList.remove("kikin");
      B.units.forEach(function (u) {
        if (u.alive && u.side === "e" && u.kind !== "ebase") hit(u, Math.round(ref.hp * KIKIN_LAST), false, "_pw");
      });
      B.lastCut = B.t;
      cutIn(rubi("🌾 兵糧攻《ひょうろうぜ》めが きいて てきが よわっていく！"));
    }
  }
}

/* 業績の技（自動発動）。発動できたら true、意味がなくて見送ったら false */
function fireSkill(u) {
  if (!B || B.over) return false;
  var foes = B.units.filter(function (o) { return o.alive && o.side === "e"; });
  var did = false;
  /* 🚩 はた ＋ 🤝 コンビ の倍率。業績の技にも 同じだけ効く（ふつうの こうげきと そろえる） */
  var mor = atkMul(u);
  if (u.type === "bushi") {
    /* せっきん: 近くの敵に大ダメージ（攻撃×5・叩き台） */
    var near = foes.filter(function (f) { return Math.abs(f.x - u.x) <= u.range * 2.5; });
    if (near.length === 0) return false;
    near.forEach(function (f) { hit(f, u.atk * SKILL_MULT.bushi * mor, false, byOf(u)); });
    $("bfield").classList.remove("shake");
    void $("bfield").offsetWidth;
    $("bfield").classList.add("shake");
    did = true;
  } else if (u.type === "chie") {
    /* えんきょり: 見えるはんい（射程×1.5）の敵にダメージ（攻撃×3・叩き台。
       もとは敵全体だったが強すぎ＋かんたんすぎのフィードバックで制限） */
    var inR = foes.filter(function (f) { return Math.abs(f.x - u.x) <= u.range * 1.5; });
    if (inR.length === 0) return false;
    inR.forEach(function (f) { hit(f, u.atk * SKILL_MULT.chie * mor, false, byOf(u)); });
    did = true;
  } else {
    /* かいふく: みかたぜんいん（城もふくむ）を大回復（こうげき★に比例・叩き台） */
    var hurt = B.units.filter(function (a) { return a.alive && a.side === "a" && a.hp < a.maxHp; });
    if (hurt.length === 0) return false;
    var big = u.atk * SKILL_MULT.inori * mor;
    hurt.forEach(function (a) {
      a.hp = Math.min(a.maxHp, a.hp + big);
      popup(a.x, "+" + big, "heal");
    });
    did = true;
  }
  /* 使える技を順ぐりに出す。レア度が上がるほど technique が増えるので、
     出るたびに ちがう業績の名前が見られる＝そのぶん覚えられる（第3段・2026-07-28） */
  var list = skillList(u.ch, u.rar);
  var name = list[(u.skillIdx || 0) % list.length];
  u.skillIdx = ((u.skillIdx || 0) + 1) % list.length;
  /* 🏅 ふりかえり用に「だれの どの業績が 何回 出たか」を 数えておく（2026-08-10）。
     ★★★**かならず 人物ごとに 分けること**（`skillCnt[人のid][技名]`）。
       ユーザー指摘（2026-08-10）:「MVPの人物に対応した技が出るようにしてください。
       たまに **人物と技が 全くちがう**ことがあるので、**間違って覚えてしまいます**」。
       もとは 技名だけで 数えていたので、MVPが 東郷平八郎なのに
       いちばん出た技が 本居宣長の「古事記伝」、という表示が 出ていた。
       ＝**歴史を おぼえるアプリで いちばん やってはいけない まちがい**。ここを もどさないこと。 */
  if (!B.skillCnt[u.ch.id]) B.skillCnt[u.ch.id] = {};
  B.skillCnt[u.ch.id][name] = (B.skillCnt[u.ch.id][name] || 0) + 1;
  /* カットインは連発しない（2秒あける）。出せないときは頭上に技名だけ */
  if (B.t - B.lastCut > 2) {
    B.lastCut = B.t;
    cutIn("⚡ " + nameRuby(u.ch) + " の「" + rubi(name) + "」！");
  } else {
    popup(u.x, "⚡" + plain(name), "");
  }
  return did;
}

/* バトル中に人物情報が流れるティッカー（読めているとクイズがかんたんになる） */
var tkQueue = [];
function tickerStart() {
  tkQueue = [];
  state.stage.ticker.forEach(function (id) {

  });
  tkQueue = shuffle(tkQueue);
  tkNext(0);
}
function tkNext(i) {
  if (cur !== "v-battle") return;
  var el = $("tk-line");
  el.innerHTML = tkQueue[i % tkQueue.length];
  el.classList.remove("run");
  void el.offsetWidth;

  var w = $("ticker").clientWidth || 900;

  el.onanimationend = function () { tkNext(i + 1); };
}

function winBattle() {
  if (!B || B.over) return;
  B.over = true;
  disarmPower();                /* ねらいの弧を のこさない */
  $("rainfx").className = "";
  save.cleared[state.stage.id] = true;
  /* ★★レアアップの判定は **ここでしかできない**（B はバトルが終わると 用ずみになる）。
     ⭐が すでに付いているかは 見ない＝**この たたかい**で むずかしい かちかたを したか、で見る
     （2回目からは 上がらない、では もどってくる理由にならないため）。 */
  /* ★★`his`の面（合戦など）は ⏳が「ひっさつを **つかって** かつ」なので、
       🕊「ひっさつを **つかわずに** かつ」とは **同時に できない**。
       そのままだと その面だけ 🎁ボーナスが 一生とれなくなるので、
       `his`の面は **⏳だけで** ボーナスにする（⏳自体が じゅうぶん むずかしい）。
       ★★`use`の面（○○を ぜんいん 出して かつ）は **両立する**ので これまでどおり ⏳＋🕊。
         ここを ひとまとめに すると、`use`の面の ボーナスが かんたんに なりすぎる。
       ★へんせい画面の 🎁の文（renderHensei）も 同じ分けかたで 書いてある。 */
  var hardWin = eraChalOk() && (stageChalKind(state.stage) === "his" ? true : !B.usedHis);
  var got = giveStars();      /* ⭐チャレンジ。persist は giveStars の中でやっている */
  state.chalHard = hardWin;   /* ガチャ（rollCard / showGacha）が これを見る */
  persist();
  confettiBurst(40);
  sfx("win");
  var ov = $("b-overlay");
  /* ★新しく ついた ⭐だけ 名前を出す（ぜんぶ出すと 前からある ⭐も 今とったように見える） */
  var gotHtml = got.length
    ? '<div class="ov-star">' + got.map(function (k) {
        var c = null; CHALS.forEach(function (x) { if (x.id === k) c = x; });
        return c.icon + " " + rubi(chalName(c, state.stage));
      }).join("<br>") + '</div>'
    : "";
  /* ⏳＋🕊 でかった回は ここでも ほめる（クイズの前に 分かっていると がんばれる）
     ★合戦の面は ⏳ひとつが じょうけん（hardWin の★）なので、**2つ そろえた とは 言わない**。 */
  var hardHtml = hardWin
    ? '<div class="ov-star">' + rubi(stageChalKind(state.stage) === "his"
        ? "🎁 むずかしい めあてを やりきった ボーナス！ このあとの ガチャで レアが 出やすい！"
        : "🎁 めあてを 2つ そろえた ボーナス！ このあとの ガチャで レアが 出やすい！") + '</div>'
    : "";
  /* 🏅 たたかいの ふりかえり（2026-08-10）。★**winBattle でしか 出せない**
     （B はここを すぎると null になるので、あとの画面では 数えられない）。 */
  var look = battleLook();
  ov.innerHTML = '<div class="ov-big">🎉 しょうり！</div>' + gotHtml + hardHtml + look.html
    + '<div style="font-size:17px; font-weight:700;">つぎは クイズ！ ながれてきた じょうほうを 思い出そう</div>';
  ov.classList.add("show");
  /* ★ふりかえりを 読む時間ぶん のばす（1.8秒 → 3.4秒）。読ませたいものを足したのに
     時間を そのままにすると、出したことに 気づかれない。 */
  setTimeout(function () { if (cur === "v-battle") startQuiz(); }, 3400);
}
/* 🏅 だれが いちばん はたらいたか を まとめて、記録にも のこす。
   ★出すのは **MVP 1人と いちばん出た技 1つ**だけ。表にして ずらずら出すと
     小学生は 読まない（CLAUDE.md §5）。「名前 × 業績」が1組 のこれば ねらいは足りる。
   ★出撃0人（つくる型で 時間だけで勝った）ときは MVPを 出さない＝
     だれも はたらいていないのに 名前が出るのは おかしい。 */
function battleLook() {
  var best = null, bestD = 0, total = 0;
  for (var id in B.dmgBy) {
    total += B.dmgBy[id];
    if (B.dmgBy[id] > bestD) { bestD = B.dmgBy[id]; best = id; }
  }
  /* 記録: 出した人 ぜんいんに「いっしょに勝った」1回。MVPには さらに1回。
     ★セーブは 新しいキー(mvp/wins)なので、カード・⭐・クリア記録には ふれない（CLAUDE.md §3）。 */
  var out = [];
  B.units.forEach(function (u) {
    if (u.kind !== "ally" || !u.ch) return;
    if (out.indexOf(u.ch.id) < 0) out.push(u.ch.id);      /* 死んだ人も かぞえる（出したのは事実） */
  });
  out.forEach(function (id) { save.wins[id] = (save.wins[id] || 0) + 1; });
  if (best) save.mvp[best] = (save.mvp[best] || 0) + 1;
  persist();
  if (!best) return { html: "", mvp: null };
  var ch = CHAR_BY_ID[best];
  /* ★★★**わざは かならず MVPの人 のものを出す**（2026-08-10・ユーザー指摘）。
     もとは 場に出た人 ぜんいんの中から「いちばん出た技」を えらんでいたので、
     **MVPの名前の となりに 別人の業績**が ならんでいた（東郷平八郎＋「古事記伝」など）。
     このアプリは 人物と業績を むすびつけて おぼえるためのものなので、
     ここが ずれると **まちがって おぼえる**。ぜったいに 別人の技を出さないこと。
   ★MVPが 業績の技を 1回も出さなかったとき（ふつうの こうげきだけで MVPになった等）は、
     回数を 書かずに **その人の わざの名前**を出す（「いちばん出た」と うそをつかない）。
     ここを 空にしないのは、名前と業績を むすぶ ひとことが このアプリの ねらいそのものだから。 */
  var mine = B.skillCnt[best] || {};
  var sk = null, skN = 0;
  for (var nm in mine) { if (mine[nm] > skN) { skN = mine[nm]; sk = nm; } }
  var skLine = sk
    ? '<div class="ov-sub">⚡ いちばん 出たわざ　「' + rubi(sk) + '」（' + skN + '回）</div>'
    : '<div class="ov-sub">⚡ ' + ch.name + ' の わざ　「' + rubi(ch.skill) + '」</div>';
  var h = '<div class="ov-look">'
    + '<div class="ov-mvp">🏅 きょうの MVP　' + nameRuby(ch)
    + '<span class="ov-dmg">' + Math.round(bestD) + ' ダメージ</span></div>'
    + skLine
    /* 城のちからのぶんも 出す。ここが大きいと「自分が たおした」実感になる（§1-C のねらい） */
    + (B.dmgPw > 0 ? '<div class="ov-sub">🏹 しろの ちから　' + Math.round(B.dmgPw) + ' ダメージ</div>' : "")
    + '</div>';
  return { html: h, mvp: best };
}
function loseBattle(why) {

  B.over = true;
  sfx("lose");

  ov.innerHTML = '<div class="ov-big">' + (why ? "おしい！" : "まけちゃった…") + '</div>'
    + '<div style="font-size:18px; font-weight:700;">' + (why ? rubi(why) + "<br>" : "")
    + 'もういちど やってみよう！</div>'
    + '<button class="big-btn" onclick="startBattle()">⚔️ もういちど</button>'
    + '<button class="big-btn brown" onclick="goHome()">🏠 ホームへ</button>';

}

/* ---------- クイズ（3問・3たく。4つの型をまぜて出す） ----------
   型は4つ。①〜③は人物データから自動で作るので、人物を足せば問題も増える（§8）。
     ① whoQ   業績 → だれ？        （ティッカーに流れた文がそのまま出る＝核の仕掛け）
     ② deedQ  人物 → したことは？   （①の逆引き）
     ③ eraOfQ 人物 → 何時代？       （時代とセットで覚えるための問題）
     ④ eraQ   chars-data.js の REKISHI_QUIZ（先生が書いた その時代の問題）
   ★2026-07-28: ここは以前 ①と④だけで、しかも④が st1/st2/st3 にしか無かったため
     14ステージで2問しか作れず「3問目が出てこない」バグになっていた。
     いまは QUIZ_COUNT 問そろうまで型をまたいで埋めるので、データが薄くても止まらない。 */
var QUIZ_COUNT = 3;

/* ---------- 選択肢を「その時代のもの」でそろえる（2026-08-09・ユーザー指示） ----------
   ★もとは まちがいの選択肢を **42人ぜんぶ から でたらめに** えらんでいた。
     そのため 弥生時代の卑弥呼の問題に **野口英世** がならぶ、ということが ふつうに起きていた。
     ・時代がバラバラだと「知らない名前を消す」だけで解けてしまう＝**考えなくても当たる**
     ・その時代の顔ぶれを おぼえる きっかけにも ならない
   ★いまは **同じ時代 → となりの時代 → 遠い時代** の順にえらぶ。
     同じ時代の人がならぶので、**ティッカーを読んでいないと 当てられない**（設計合意の核）。
   ★CHARS は時代順にならんでいる（chars-data.js の「42人（時代順）」）。
     この ならび順を そのまま「年表の目もり」として使っている。ここを並べかえないこと。 */
var ALL_ERAS = (function () {
  var seen = {}, out = [];
  CHARS.forEach(function (c) { if (!seen[c.era]) { seen[c.era] = 1; out.push(c.era); } });
  return out;
})();
var ERA_NO = (function () { var m = {}; ALL_ERAS.forEach(function (e, i) { m[plain(e)] = i; }); return m; })();
function eraNo(era) { var n = ERA_NO[plain(era)]; return n === undefined ? 0 : n; }
/* 「平安時代」と「平安時代の末」のように、どちらも正しく見える組み合わせは選択肢に出さない。
   ★★**紛らわしい組み合わせは ここに1行足して 外す**。
   ★2026-08-09に ユーザー指示で **時代わけを 10個に整理した**（戦国時代・平安時代の末・
     江戸時代の末・江戸時代の末〜明治時代 を なくした）ので、いま この表は からっぽでよい。
     ★もとは ["戦国","安土桃山"] が入っていた。織田信長が「戦国時代」だったころ、
       となりの時代から選択肢を作ると **どちらを選んでも正しく見える問題**が出たため。
       いまは 信長が 安土桃山なので この心配は 消えた。
     ★時代を また増やすときは、**その時代と となりの時代で 迷う人がいないか**を見て、
       いれば ここに書くこと。 */
var ERA_PAIRS = [];
function eraClash(a, b) {
  var x = plain(a), y = plain(b);
  if (x === y || x.indexOf(y) >= 0 || y.indexOf(x) >= 0) return true;
  for (var i = 0; i < ERA_PAIRS.length; i++) {
    var p = ERA_PAIRS[i];
    if ((x.indexOf(p[0]) >= 0 && y.indexOf(p[1]) >= 0)
     || (x.indexOf(p[1]) >= 0 && y.indexOf(p[0]) >= 0)) return true;
  }
  return false;
}
/* まちがいの時代。★**となりの時代から**えらぶ（遠い時代だと ひと目で分かってしまう）。
   近い順に4つ集めてから まぜるので、毎回おなじ2つには ならない。 */
function otherEras(era, n) {
  var me = eraNo(era);
  var cand = ALL_ERAS.filter(function (e) { return !eraClash(e, era); });
  cand.sort(function (a, b) { return Math.abs(eraNo(a) - me) - Math.abs(eraNo(b) - me); });
  return shuffle(cand.slice(0, Math.max(n + 2, 4))).slice(0, n);
}
/* まちがいの人物。同じ時代 → となりの時代 → それ以外 の順で n人。
   ★同じ時代の人が いないステージ（弥生の卑弥呼など）でも、となりの時代でうまる。 */
function nearChars(id, n) {
  var me = CHAR_BY_ID[id], mine = eraNo(me.era);
  var band = [[], [], []];
  CHARS.forEach(function (c) {
    if (c.id === id) return;
    var d = Math.abs(eraNo(c.era) - mine);
    band[d === 0 ? 0 : (d <= 2 ? 1 : 2)].push(c);
  });
  return shuffle(band[0]).concat(shuffle(band[1]), shuffle(band[2])).slice(0, n);
}
/* 時代が ちがう人を n人（「いちばん むかしは？」「ひとりだけ時代がちがう」用） */
function farChars(id, n) {
  var me = CHAR_BY_ID[id], seen = {};
  seen[plain(me.era)] = 1;
  var out = [];
  shuffle(CHARS).forEach(function (c) {
    if (out.length >= n || c.id === id) return;
    if (eraClash(c.era, me.era) || seen[plain(c.era)]) return;
    seen[plain(c.era)] = 1; out.push(c);
  });
  return out;
}

/* ① 業績 → だれ？ ★まちがいの選択肢は **同じ時代の人**から（2026-08-09） */
function whoQ(id, line) {
  return {
    key: "who:" + id + ":" + line,
    ask: "これは だれの こと？", q: rubi(line),
    make: function () {
      return shuffle([{ html: nameRuby(CHAR_BY_ID[id]), ok: true }].concat(
        nearChars(id, 2).map(function (c) { return { html: nameRuby(c), ok: false }; })));
    }
  };
}
/* ★★info の1行が「したこと（行動）」か「どんな人（説明）」かを 見わける
     （2026-08-11・ユーザー指摘「この問題の内容が変です」）
   ---------------------------------------------------------------
   もとは info の **ぜんぶの行**を ②の「〜が したことは どれ？」に つかっていた。
   ところが info には 「源頼朝の弟」「邪馬台国の女王」「医者」のような **体言止めの説明**が
   まざっていて、**「源義経が したことは どれ？」→ こたえ「源頼朝の弟」** という
   日本語にならない問題が 出ていた（先生が 実機で見つけた）。

/* ---------- ここから3つは 2026-08-09に足した型（ユーザー「クイズが単調」） ----------

/* ⑦ ひとりだけ 時代が ちがうのは だれ？

    pair.push(pairQ(pr, true)); pair.push(pairQ(pr, false));

  var no = 4 - save.starterQ.length;                    /* 1／3 → 2／3 → 3／3 */
  $("gc-msg").innerHTML = rubi("はじめまして！ ガチャを 3回 まわして<br>さいしょの なかま 3人を むかえよう！")
    + '<br><b>' + no + '／3回め</b>';
  $("gc-tip").textContent = "ボタンを おして カードを もらおう！";
  var mc = $("gc-machine");
  mc.className = "";
  mc.querySelector("img").src = "images/ui/gacha.webp?v=" + ASSET_V;
  var v = $("v-gacha");
  v.classList.remove("hint1");
  v.classList.remove("hint2");
  var b = $("btn-spin");
  b.disabled = false;
  b.textContent = "🎁 まわす！";
  showView("v-gacha", "はじめての ガチャ", false);
}
/* ★**抽選しない**。先に決めた ならびから 1人ずつ 出すだけ＝かならず Lv1・かならず3人ちがう。
   かえす形は rollCard() と そろえてある（showReward が 同じものを 受けとる）。 */
function rollStarterCard() {
  var id = save.starterQ.shift(), ch = CHAR_BY_ID[id];
  addCard(id, "n");                                     /* ノーマル1枚＝Lv1 */
  if (save.deck.indexOf(id) < 0 && save.deck.length < DECK_MAX) save.deck.push(id);
  persist();
  return { ch: ch, rar: "n", isNew: true, after: "n", lv: charLevel(id), evolved: false, correct: null };
}
/* 「つぎのガチャ！」／3回めのあとは ホームへ */
function starterNext() {
  if (save.starterQ && save.starterQ.length) { showStarterGacha(); return; }
  state.starter = false;
  delete save.starterQ;                                 /* もう はじめての人ではない */
  persist();
  goHome();
}

$("btn-spin").onclick = function () {
  var b = $("btn-spin");
  if (b.disabled) return;            /* 連打よけ（二重にカードが出ないように） */
  b.disabled = true;
  b.textContent = "まわしています…";
  $("gc-tip").textContent = "ゴロゴロ…";
  /* ★ここでカードを決める。光の色とまわる長さをレア度に合わせるため、
     演出のまえに ひいておく必要がある（確率は今までとまったく同じ）。 */
  /* ★**ならびが のこっているか**まで見る（しるしだけ 見ない）。上の showGacha の★と対。 */
  var useStarter = state.starter && save.starterQ && save.starterQ.length > 0;
  var g = state.gacha = useStarter ? rollStarterCard() : rollCard();
  var tier = gachaTier(g);          /* はじめてのガチャは ぜんぶ ノーマル＝0（白い光・みじかい） */
  var ms = SPIN_MS[tier];
  var mc = $("gc-machine"), v = $("v-gacha");
  mc.className = "spin";
  sfx("spin");
  /* とちゅうで だんだん もりあがる。レアなら青銀、スーパーレアはさらに金へ */
  if (tier >= 1) setTimeout(function () {
    v.classList.add("hint1");
    $("gc-tip").textContent = "…あれ？ ひかってきた！";
  }, Math.round(ms * 0.40));
  if (tier >= 2) setTimeout(function () {
    v.classList.add("hint2");
    $("gc-tip").textContent = "うわぁ！ きんいろに ひかってる！！";
  }, Math.round(ms * 0.72));
  setTimeout(function () {
    mc.className = "pop";            /* 出てくる瞬間に ひとつ大きく はずむ */
    $("gc-tip").textContent = tier === 2 ? "✨✨ でた〜！！ ✨✨" : "✨ でた！";
    gachaFlash(tier);
    confettiBurst(tier === 2 ? 70 : (tier === 1 ? 40 : 24));
    setTimeout(showReward, tier ? 700 : 420);   /* レアほど 少し ためてから見せる */
  }, ms);
};
/* 出た瞬間の ぴかっ。レア度で色を変える（ふつう＝白 / レア＝水色 / SR＝金） */
function gachaFlash(tier) {
  var f = $("gc-flash");
  f.style.background = tier === 2 ? "#fff8e1" : (tier === 1 ? "#e1f5fe" : "#fff");
  f.className = "";
  void f.offsetWidth;                /* いちど止めて、もういちど鳴らすためのおまじない */
  f.className = "on";
}

/* ---------- カードゲット ----------
   ★★★**全問せいかい（3問／3問）でないと、ノーマルしか出ない**
     （2026-08-09・ユーザー指示「クイズに2問しか正解していないのに SRが出てきた。
       基本 クイズに正解しないと ノーマルしか出ないように」）。
     ＝ せいかい数 0・1・**2** は **ぜんぶ 0%**、3問だけ 数字が入る。
   ★これが このゲームの いちばん だいじな しかけ。バトル中に ながれる ティッカーを
     読んでいないと 3問そろわない＝**読む理由**を ここで作っている。
     2問でも レアが出ていたころは「なんとなく2問あてる」で 育ってしまい、
     ティッカーを 読まなくても 進めた。**ここを ゆるめないこと**。
   ★0問でも ノーマルは かならず1枚もらえる（手ぶらで帰さない。CLAUDE.md §5）。
   （履歴: 2026-07-28に 2問30%→12%・3問60%→25% に下げ、2026-08-09に 2問を 0 にした） */
var R_CHANCE = [0, 0, 0, 0.25];      /* せいかい数 0,1,2,3 に対応 */
/* ★「2」シリーズのガチャ確率（2026-08-08・ユーザー指定）。
     3問せいかいで **レア45% / スーパーレア10%**（のこり45%がノーマル）。
     2シリーズを もういちど遊ぶ ごほうびであり、Lv30必要だった
     スーパーレアが **ガチャから直接出る**ようになる のは ここが初めて。 */
var R_CHANCE2  = [0, 0, 0, 0.45];
var SR_CHANCE2 = [0, 0, 0, 0.10];
/* ★★「3」＝激ムズ のガチャ（2026-08-09）。3問せいかいで **レア50% / スーパーレア30%**。
   ★ここを 2より うんと よくしてある理由: 3に入るには **スーパーレアが3体**いる。
     そこまでは 2をくり返して SR10%を引くしかない＝とても遠い。3に入れた子には
     「ここから先は SRが たまっていく」場所を用意しないと、**入り口で止まってしまう**。 */
var R_CHANCE3  = [0, 0, 0, 0.50];
var SR_CHANCE3 = [0, 0, 0, 0.30];
/* せいかい数と シリーズから ひく確率を出す（1か所にまとめる。§8） */
function gachaOdds(st, i) {
  var s = seriesOf(st);
  if (s === 3) return { r: R_CHANCE3[i], sr: SR_CHANCE3[i] };
  if (s === 2) return { r: R_CHANCE2[i], sr: SR_CHANCE2[i] };
  return { r: R_CHANCE[i], sr: 0 };   /* 1シリーズでは SRは出ない（Lv30の進化だけ） */
}

/* ★★⏳＋🕊 で かった回は レアが +15%（2026-08-09・ユーザー指示
     「その時代のみ・必殺技なしであれば、難しいことにチャレンジしているので」）。
   ★上げるのは **レアだけ**（スーパーレアは 2シリーズの ごほうびのままにしておく）。
   ★★**全問せいかいでないときは 上げない**（上の R_CHANCE の★★★の続き）。
     ここに +15% を足すと クイズを あてなくても レアが出るようになり、
     「ティッカーを読む → クイズ」という このゲームの核が こわれる。
     ＝ **もとの確率が 0 より大きいときだけ** 足す＝いまは **3問せいかいのときだけ**。
   実際の値（3問せいかい時）: 1シリーズ 25→40% ／ 2シリーズ 45→60%（＋SR10%）
                              ／ 3シリーズ 50→65%（＋SR30%）。 */
var CHAL_R_BONUS = 0.15;
function chalRareBonus() {
  if (!state.chalHard) return 0;
  var i = Math.min(state.quiz ? state.quiz.correct : 0, 3);
  var base = gachaOdds(state.stage, i).r;
  return base > 0 ? CHAL_R_BONUS : 0;
}

/* 排出プール: そのステージの時代の人物を中心にする（2026-07-28にユーザー要望で変更）。
   ねらいは「いま勉強している時代の人物が手に入り、⭐じだいボーナスで使える」こと。
   ★もとの設計合意は「全42人からいきなりランダム」だった。ユーザーが明示的に
     変更を指示したので、たまに他の時代も出る（ERA_DROP のこり）形にしてある。 */
var ERA_DROP = 0.85;                 /* この確率で「その時代の人物」から出す */
function eraPoolFor(st) {
  var inPool = {}, pool = [];
  function add(ch) { if (ch && !inPool[ch.id]) { inPool[ch.id] = 1; pool.push(ch); } }
  /* ★「その時代の人物」の判定は eraChars 1か所に集めてある（⭐チャレンジ ⏳と 同じもの。§8） */
  eraChars(st).forEach(add);
  if (st && st.ticker) st.ticker.forEach(function (id) { add(CHAR_BY_ID[id]); });
  if (!pool.length) return CHARS;
  /* 弥生（卑弥呼ひとり）のように人数が少ない時代は、同じ人ばかりになってしまう。
     CHARS は時代順に並んでいるので、となりの時代へ広げて最低3人にする。
     ★3人にとどめているのは、広げすぎると「その時代のカードが出る」ねらいがぼやけるため。
       奈良(3人)・室町(3人)のように3人いる時代は広げない＝その時代の人だけが出る。 */
  var idx = pool.map(function (ch) { return CHARS.indexOf(ch); });
  var lo = Math.min.apply(null, idx), hi = Math.max.apply(null, idx);
  while (pool.length < 3 && (lo > 0 || hi < CHARS.length - 1)) {
    if (hi < CHARS.length - 1) { hi++; add(CHARS[hi]); }
    if (pool.length < 3 && lo > 0) { lo--; add(CHARS[lo]); }
  }
  return pool;
}
/* カードを1枚ひいて、セーブに入れて、結果を返す。
   ★ガチャの演出（光の色・まわる長さ）をレア度で変えるために、
     「まわす」を おした時点でひいておく必要がある。中身と確率は今までと同じ。 */
function rollCard() {
  var c = state.quiz.correct, i = Math.min(c, 3);
  var od = gachaOdds(state.stage, i);
  var srChance = od.sr;
  var rChance  = od.r + chalRareBonus();        /* ⏳＋🕊 で +15% */
  /* さいころは1回だけ振って、下から順に切りとる（SR → R → N）。
     ★2回振ると 指定した確率（SR10% / R45%）とズレるので かならず1回。 */
  var x = Math.random();
  var rar = x < srChance ? "sr" : (x < srChance + rChance ? "r" : "n");
  var ch = pick(Math.random() < ERA_DROP ? eraPoolFor(state.stage) : CHARS);
  var before = bestRarity(ch.id);             /* 進化判定用（レベルはカードが自動で重なって上がる） */
  var isNew = addCard(ch.id, rar);
  persist();
  var after = bestRarity(ch.id);
  return { ch: ch, rar: rar, isNew: isNew, after: after, lv: charLevel(ch.id),
           evolved: !isNew && before !== after, correct: c };
}
/* 演出の強さ。0=ふつう / 1=レア（銀色） / 2=スーパーレア（金色）
   ★カードのわくの色は この関数の答えから作ること（下の showReward）。
     条件を2か所に書くと かならずズレて「光ったのに ふつうのカード」になる。
   ★2026-08-07にユーザー指摘で直したバグ:
     もとは `g.after`（＝その人物の **いまの** レア度。レベルから決まる）を見ていた。
     after は Lv5 をこえていれば ずっと "r" なので、**育った人物の
     ノーマルカードを引いただけで レアの演出**になっていた（暗くなって光ったのにノーマル）。
     プレイが進むほど レベル5以上の人物が増えるので、遊ぶほど ひんぱんに起きる。
   ★演出は「**このガチャで 何が起きたか**」だけで決める:
       引いたカードが レア  → 1（銀）
       このガチャで レアに進化 → 1（銀）
       このガチャで スーパーレアに進化 → 2（金）
       それ以外（もう育っている人物の ノーマル）→ 0
     ★`g.after === "sr"` のように「持っている状態」だけで見ないこと。同じバグが戻る。
   ★2026-08-08「2」シリーズで **スーパーレアのカードそのもの**が出るようになったので、
     `g.rar === "sr"` を 2（金）に足した。ここを忘れると 金のカードが出たのに
     光が白のまま＝いちばん もったいないバグになる。 */
function gachaTier(g) {
  if (g.rar === "sr" || (g.evolved && g.after === "sr")) return 2;
  if (g.rar === "r" || (g.evolved && g.after === "r")) return 1;
  return 0;
}
/* 演出の強さ(0/1/2) → 見せるレア度。★カードの文字も わくも 光も ぜんぶ これで そろえる */
var TIER_RAR = ["n", "r", "sr"];

function showReward() {
  var g = state.gacha;
  var ch = g.ch, rar = g.rar, after = g.after;
  /* ★はじめてのガチャ（g.correct === null）は クイズを していないので、
     クイズの文を 出さない。**state.quiz を 見にいかない**こと（null で こわれる）。 */
  var st = state.starter;
  $("rw-result").textContent = st
    ? "なかまに なってくれた！（" + (3 - (save.starterQ ? save.starterQ.length : 0)) + "／3人め）"
    : "クイズ せいかい " + g.correct + "／" + state.quiz.qs.length + "！ カードを 1まい ゲット！";
  var card = $("rw-card");
  /* ★わくの色**も 文字も** かならず gachaTier() から作ること（条件を書き写さない）。
     書き写すと ガチャの光の色と ここがズレて、いちばん がっかりさせるバグになる。
   ★★2026-08-08にユーザー指摘で直したバグ（2回目の同じズレ）:
     わくの色は tier から作っていたのに、**レア度の文字(rw-rar)だけ ひいたカードの生の
     レア度(g.rar)を見ていた**。ノーマルのカードで Lv5にとどいて「レアに しんか」した回は
     tier=1（青く光る）なのに 文字は「ノーマル」と出て、いちばん うれしい回に
     「え、ノーマル？」と がっかりさせていた。
     ★tier から作れば、絵(after)・わく・光・文字 が ぜんぶ そろう。
       ここに `g.rar` や `g.after` を書き写さないこと。3回目をやる。 */
  var tier = gachaTier(g);
  var tierRar = TIER_RAR[tier];
  /* ★音も tier から出す（レアより上なら はなやかに）。ここも g.rar を見ないこと（上の★） */
  sfx(tier > 0 ? "levelup" : "reward");
  card.className = tier === 2 ? "rar-sr" : (tier === 1 ? "rar-r" : "");
  card.innerHTML = '<div class="rw-rar rar-tag r' + tierRar + '">' + RAR_LABEL[tierRar] + '</div>'
    + '<div style="margin-top:6px;">' + standHTML(ch, after, 132) + '</div>'
    + '<div class="rw-name">' + nameRuby(ch) + '</div>'
    + '<div class="rw-era">' + rubi(ch.era) + '</div>'
    + '<div class="rw-skill">⚡ ' + rubi(ch.skill) + '</div>';
  /* ★スーパーレアのカードを直接ひいたときは isNew/evolved より そっちを先に出す
     （新しい人物の SR は evolved が false なので、書かないと ふつうの「あたらしい 人物！」になる）。 */
  $("rw-new").textContent = rar === "sr"
    ? "🌟 スーパーレアカード！！"
    : (g.evolved
      ? (after === "sr" ? "🌟 スーパーレアに しんか！！" : "🎉 レアに しんか！！")
      : (g.isNew ? "✨ あたらしい 人物！" : ""));
  $("rw-count").innerHTML = ch.name + " は <b>Lv." + g.lv + "</b> になった！（" + nextGoal(ch.id) + "）";
  /* 🎓 まめちしき（2026-08-10）。★**しるしを つけてから 出す**こと。
     先に出して あとから つけると、画面の「○／200」が 1つ 古い数のままになる。 */
  var ti = pickTrivia(ch);
  tSeenPush(ti);
  $("rw-trivia").innerHTML = triviaHTML(ti);
  if (g.evolved || rar === "sr") confettiBurst(90);
  else if (rar === "r" || g.isNew) confettiBurst(50);
  /* はじめてのガチャは 下のボタンを **1つだけ**にする（「もういちど このステージ」は
     まだ ステージに 入っていないので 押せると こわれる） */
  var left = st && save.starterQ ? save.starterQ.length : 0;
  $("btn-retry").style.display = st ? "none" : "";
  $("btn-rhome").textContent = st
    ? (left ? "🎁 つぎの ガチャ！" : "🏠 ぼうけんを はじめる！")
    : "🏠 ホームへ";
  showView("v-reward", st ? "なかまが ふえた！" : "カードゲット！", false);
}
$("btn-retry").onclick = function () { renderHensei(); };
$("btn-rhome").onclick = function () {
  if (state.starter) { starterNext(); return; }   /* はじめてのガチャの つづき */
  goHome();
};

/* ---------- コンフェッティ（自前・外部ライブラリなし） ---------- */
function confettiBurst(n) {
  var colors = ["#ef5350", "#ffb300", "#66bb6a", "#42a5f5", "#ab47bc"];
  for (var i = 0; i < n; i++) {
    var d = document.createElement("div");
    d.className = "confetti";
    d.style.left = Math.random() * 100 + "vw";
    d.style.background = pick(colors);
    d.style.animationDuration = (1.6 + Math.random() * 1.6) + "s";
    d.style.animationDelay = Math.random() * 0.5 + "s";
    document.body.appendChild(d);
    (function (el) { setTimeout(function () { el.remove(); }, 4000); })(d);
  }
}

/* ---------- 起動（動作確認ハッシュ: #st1 / #st2f / #st5b など） ----------
   ★2026-08-08: 「2」シリーズ（st1b…）も直接ひらけるように どのステージidでも通るようにした。
     f を付けると 6ばい速で回る（動作確認用。ふつうに遊ぶ人は ハッシュを付けない）。 */
(function boot() {
  var m = location.hash.match(/^#(st\d+b?)(f?)$/);
  if (m) {
    var st = null;
    STAGES.forEach(function (s) { if (s.id === m[1]) st = s; });
    if (st) {
      SPEED = m[2] ? 6 : 1;
      openStage(st);
      if (save.deck.length === 3) startBattle();
      return;
    }
  }
  /* ★はじめての人は **ホームより先に ガチャ3回**（2026-08-11・ユーザー指示）。
     とちゅうで 閉じても save.starterQ が のこっているので つづきから 出る。 */
  if (save.starterQ && save.starterQ.length) { showStarterGacha(); return; }
  goHome();
})();

/* PWA（2026-08-11）。★file:// で ひらいたときは 登録しない（エラーになるだけ）。
   ★sw.js の あたまに「更新したら CACHE の版を あげる」きまりを 書いてある。 */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
</script>
