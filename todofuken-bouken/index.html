<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4fc3f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>都道府県の冒険</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; height: 100%; }
  /* スクロールなし前提: アプリ全体を画面の高さに固定し、各画面は flex で中に収める */
  body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #90caf9 0%, #bbdefb 40%, #e1f5fe 100%);
    color: #37474f;
  }
  ruby rt { font-size: 0.45em; color: #78909c; }

  /* ---------- トップバー ---------- */
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px; gap: 8px;
    flex: none; z-index: 20;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(4px);
    box-shadow: 0 2px 8px rgba(33,150,243,0.15);
  }
  #tb-title { font-weight: 800; font-size: 18px; color: #1565c0; text-align: center; flex: 1; min-width: 0; }
  .tb-btn {
    min-height: 48px; padding: 8px 14px; border: none; border-radius: 14px;
    background: #e3f2fd; color: #1565c0; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .tb-btn:active { transform: scale(0.96); }
  .tb-hidden { visibility: hidden; }

  main {
    flex: 1; min-height: 0; width: 100%; max-width: 1100px;
    margin: 0 auto; padding: 10px 12px; display: flex;
  }
  .view { display: none; }
  .view.on { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  .panel {
    background: #fff; border-radius: 18px; padding: 12px;
    box-shadow: 0 4px 14px rgba(33,150,243,0.18);
    display: flex; flex-direction: column; min-height: 0;
  }
  h2.vh { font-size: 20px; color: #1565c0; margin-bottom: 6px; text-align: center; flex: none; }

  /* 2カラム分割（iPad横/縦=左右、せまいスマホ=上下） */
  .split { display: flex; gap: 12px; flex: 1; min-height: 0; }
  .split > * { min-height: 0; min-width: 0; }
  .split .main-col { flex: 1.35; }
  .split .side-col { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .side-scroll { overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
  @media (max-width: 620px) {
    .split { flex-direction: column; }
    .split .main-col { flex: 1.1; }
  }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; flex: none; }
  .btn-row .big-btn { flex: 1 1 200px; }

  /* ---------- 地図 ---------- */
  .mapbox {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .mapbox svg { width: 100%; height: 100%; display: block; }
  /* 注意: vector-effect: non-scaling-stroke は Safari で図形位置がズレる既知バグがあるため使わない */
  .prefecture { fill: #fffdf7; stroke: #8d6e63; stroke-width: 1; transition: fill 0.2s; }
  .boundary-line { stroke: #64b5f6; stroke-width: 2; stroke-dasharray: 5 5; fill: none; }
  .p-hide { display: none; }
  .p-dim { fill: #eceff1; stroke: #cfd8dc; pointer-events: none; }
  .p-tap { cursor: pointer; }
  .p-mark { animation: markPulse 1.1s ease-in-out infinite; }
  @keyframes markPulse { 0%,100% { fill-opacity: 1; } 50% { fill-opacity: 0.45; } }
  .p-good { fill: #66bb6a !important; animation: goodPulse 0.9s ease-in-out infinite; }
  .p-bad  { fill: #ef9a9a !important; }
  @keyframes goodPulse { 0%,100% { fill-opacity: 1; } 50% { fill-opacity: 0.55; } }
  .sil .prefecture { fill: #607d8b; stroke: none; }
  text.flag, text.balloon, text.pin { pointer-events: none; }

  /* ---------- ボタン ---------- */
  .big-btn {
    display: block; width: 100%; min-height: 52px; padding: 10px;
    border: none; border-radius: 16px; cursor: pointer;
    background: linear-gradient(180deg, #ffb74d, #ff9800); color: #fff;
    font-size: 18px; font-weight: 800; box-shadow: 0 4px 0 #ef6c00;
    margin-top: 10px; flex: none;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #ef6c00; }
  .big-btn.blue { background: linear-gradient(180deg, #4fc3f7, #29b6f6); box-shadow: 0 4px 0 #0288d1; }
  .big-btn.blue:active { box-shadow: 0 1px 0 #0288d1; }
  .big-btn.gray { background: #b0bec5; box-shadow: 0 4px 0 #78909c; }

  .region-btn {
    display: flex; align-items: center; gap: 10px; width: 100%;
    min-height: 52px; padding: 8px 14px; margin-top: 8px;
    border: none; border-radius: 16px; cursor: pointer; text-align: left;
    background: #fff; box-shadow: 0 3px 8px rgba(33,150,243,0.15);
    font-size: 17px; font-weight: 700; color: #37474f;
  }
  .region-btn:active { transform: scale(0.98); }
  .region-btn .rb-dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
  .region-btn .rb-name { flex: 1; }
  .region-btn .rb-state { font-size: 14px; color: #78909c; font-weight: 700; }
  .region-btn[disabled] { opacity: 0.55; cursor: default; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip {
    min-height: 48px; padding: 8px 12px; border: none; border-radius: 14px; cursor: pointer;
    background: #e3f2fd; color: #1565c0; font-size: 16px; font-weight: 700;
  }
  .chip:active { transform: scale(0.96); }
  .chip .st { margin-left: 4px; }

  /* ---------- ホーム ---------- */
  #home-head { text-align: center; padding: 2px 0 6px; flex: none; }
  #home-head h1 { font-size: 22px; color: #0d47a1; text-shadow: 0 2px 0 rgba(255,255,255,0.7); }
  #home-head .sub { font-size: 13px; color: #546e7a; margin-top: 2px; font-weight: 700; }
  .balloon-fly { font-size: 28px; display: inline-block; animation: fly 3s ease-in-out infinite; vertical-align: middle; }
  @keyframes fly { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .progress-line { text-align: center; font-size: 15px; font-weight: 800; color: #37474f; margin: 4px 0; flex: none; }
  .progress-line .gold { color: #f57f17; }

  /* ---------- たんけん ---------- */
  .tk-name { text-align: center; font-size: 26px; font-weight: 900; color: #0d47a1; margin: 2px 0 6px; flex: none; }
  .tk-shape { height: 90px; flex: none; display: flex; justify-content: center; }
  .tk-shape .mapbox { flex: none; height: 100%; width: 120px; }
  .tk-cap { font-size: 17px; font-weight: 800; text-align: center; margin: 6px 0; flex: none; }
  .tk-label { font-size: 13px; font-weight: 800; color: #ff8f00; margin: 8px 0 4px; flex: none; }
  .mei-row { display: flex; gap: 8px; flex-wrap: wrap; flex: none; }
  .mei-item {
    flex: 1; min-width: 96px; background: #fff8e1; border-radius: 14px;
    padding: 8px 6px; text-align: center; font-weight: 700; font-size: 13px;
  }
  .mei-item .me { font-size: 28px; display: block; margin-bottom: 2px; }
  .mame { background: #e8f5e9; border-radius: 14px; padding: 10px; font-size: 14px; line-height: 1.6; font-weight: 600; flex: none; }

  /* ---------- クイズ ---------- */
  .q-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #view-quiz .panel, #view-ta .panel, #view-result .panel, #view-zukan .panel { flex: 1; }
  #view-result .panel { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .q-dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 6px; flex: none; }
  .q-dot { width: 16px; height: 16px; border-radius: 50%; background: #cfd8dc; font-size: 0; }
  .q-dot.now { background: #29b6f6; transform: scale(1.25); }
  .q-dot.ok { background: #66bb6a; }
  .q-dot.ng { background: #ef9a9a; }
  .q-prompt { text-align: center; font-size: 18px; font-weight: 800; margin-bottom: 8px; line-height: 1.5; flex: none; }
  .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: none; }
  .choice-btn {
    min-height: 56px; border: 3px solid #b3e5fc; border-radius: 16px; cursor: pointer;
    background: #fff; font-size: 18px; font-weight: 800; color: #37474f; padding: 6px;
  }
  .choice-btn:active { transform: scale(0.97); }
  .choice-btn .ce { font-size: 26px; display: block; }
  .choice-btn .mapbox { height: 88px; }
  .choice-btn.good { background: #c8e6c9; border-color: #66bb6a; }
  .choice-btn.bad { background: #ffcdd2; border-color: #e57373; }
  .choice-btn[disabled] { cursor: default; }
  #q-feedback { text-align: center; margin-top: 8px; min-height: 24px; font-size: 18px; font-weight: 900; flex: none; }
  #q-feedback .big-btn { max-width: 340px; margin: 8px auto 0; }
  #q-feedback .fb-ok { color: #2e7d32; }
  #q-feedback .fb-ng { color: #c62828; }

  /* ---------- けっか・カード ---------- */
  .res-score { text-align: center; font-size: 26px; margin: 4px 0; letter-spacing: 3px; flex: none; }
  .res-msg { text-align: center; font-size: 19px; font-weight: 900; color: #1565c0; margin-bottom: 6px; flex: none; }
  .gcard {
    width: 230px; margin: 8px auto; background: linear-gradient(160deg, #e3f2fd, #fff);
    border: 4px solid #64b5f6; border-radius: 18px; padding: 10px; text-align: center;
    animation: cardPop 0.5s ease-out; flex: none;
  }
  .gcard.gold {
    border-color: #f9a825; background: linear-gradient(160deg, #fff8e1, #fffde7);
    box-shadow: 0 0 18px rgba(249,168,37,0.6);
  }
  @keyframes cardPop { 0% { transform: scale(0.3) rotate(-8deg); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  .gc-emoji { font-size: 36px; }
  .gc-name { font-size: 20px; font-weight: 900; color: #0d47a1; margin: 2px 0 4px; }
  .gc-shape { width: 110px; height: 84px; margin: 0 auto; display: flex; }
  .gc-shape .mapbox { height: 100%; }
  .gc-cap { font-size: 13px; font-weight: 700; margin-top: 4px; }
  .gc-mei { font-size: 13px; font-weight: 600; color: #546e7a; margin-top: 4px; line-height: 1.5; }
  .gc-goldtag { font-size: 13px; font-weight: 900; color: #f57f17; margin-top: 4px; }

  /* ---------- ずかん ---------- */
  #view-zukan .panel { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .zk-region-h { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 800; margin: 12px 0 6px; flex: none; }
  .zk-region-h .rb-dot { width: 14px; height: 14px; border-radius: 50%; }
  .zk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .zk-slot {
    background: #fff; border: 3px solid #b3e5fc; border-radius: 14px; padding: 8px 4px;
    text-align: center; cursor: pointer; min-height: 92px; font-weight: 700;
  }
  .zk-slot .ze { font-size: 30px; display: block; }
  .zk-slot .zn { font-size: 13px; display: block; margin-top: 2px; }
  .zk-slot.none { background: #eceff1; border-color: #cfd8dc; color: #90a4ae; cursor: default; }
  .zk-slot.gold { border-color: #f9a825; background: #fffde7; }
  .zk-slot:active { transform: scale(0.96); }
  .zk-slot.none:active { transform: none; }

  /* カードのかくだいオーバーレイ */
  #card-overlay {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(38,50,56,0.6); padding: 20px;
    align-items: center; justify-content: center; flex-direction: column;
  }
  #card-overlay.on { display: flex; }
  #card-overlay .big-btn { max-width: 280px; }

  /* ---------- コンフェッティ ---------- */
  .confetti {
    position: fixed; top: -14px; width: 10px; height: 14px; z-index: 90;
    pointer-events: none; animation: confFall 2.2s linear forwards; border-radius: 2px;
  }
  @keyframes confFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(540deg); opacity: 0.6; }
  }

  /* ---------- タイムアタック ---------- */
  #ta-timer {
    text-align: center; font-size: 46px; font-weight: 900; color: #1565c0;
    font-variant-numeric: tabular-nums; margin-bottom: 4px;
  }
  #ta-timer.pen { color: #c62828; animation: shake 0.3s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  .ta-result { text-align: center; font-size: 64px; margin: 4px 0; }
  .name-input {
    display: block; width: 100%; max-width: 340px; margin: 6px auto 0;
    min-height: 48px; font-size: 18px; font-weight: 700; padding: 8px 12px;
    border: 3px solid #b3e5fc; border-radius: 12px; text-align: center;
  }
  .rank-row {
    display: flex; justify-content: space-between; max-width: 340px; margin: 6px auto 0;
    width: 100%; font-size: 16px; font-weight: 700; padding: 8px 12px;
    background: #f0f9ff; border-radius: 10px;
  }
  .choice-btn .mapbox { max-width: 110px; margin: 0 auto; }

  /* ---------- ふたりでたいけつ（上下2分割・むかいあって同時タップ） ---------- */
  #view-vs .vs-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 6px; }
  .vs-half {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    background: #fff; border-radius: 16px; padding: 6px 10px;
  }
  .vs-half.p1 { border: 3px solid #64b5f6; }
  .vs-half.p2 { border: 3px solid #e57373; transform: rotate(180deg); }
  .vs-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; }
  .vs-name { font-weight: 900; font-size: 15px; }
  .vs-half.p1 .vs-name { color: #1565c0; }
  .vs-half.p2 .vs-name { color: #c62828; }
  .vs-score { font-size: 15px; letter-spacing: 2px; font-weight: 800; }
  .vs-prompt { text-align: center; font-weight: 900; font-size: 18px; min-height: 26px; flex: none; }
  .vs-msg { text-align: center; font-weight: 800; font-size: 14px; color: #e65100; min-height: 20px; flex: none; }
  .vs-mid { flex: none; text-align: center; font-size: 13px; font-weight: 800; color: #546e7a; }
  .vs-mid .btn-row { max-width: 480px; margin: 0 auto; }
  .vs-frozen .mapbox { opacity: 0.35; pointer-events: none; }
  .vs-big { text-align: center; font-size: 30px; font-weight: 900; color: #1565c0; margin: 4px 0; flex: none; }
  /* れんぞくタップでSafariのダブルタップズームが起きないように */
  button, .mapbox svg, .chip { touch-action: manipulation; }

  #credit {
    flex: none; text-align: center; font-size: 10px; color: #78909c;
    padding: 2px 10px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body>
<header id="topbar">
  <button id="btn-back" class="tb-btn" onclick="goBack()">← もどる</button>
  <div id="tb-title"></div>
  <button id="btn-zukan" class="tb-btn" onclick="openZukan()">📖 ずかん</button>
</header>
<main>
  <section id="view-home" class="view"></section>
  <section id="view-region" class="view"></section>
  <section id="view-tanken" class="view"></section>
  <section id="view-quiz" class="view"></section>
  <section id="view-result" class="view"></section>
  <section id="view-ta" class="view"></section>
  <section id="view-vs" class="view"></section>
  <section id="view-zukan" class="view"></section>
</main>
<div id="card-overlay" onclick="closeCardOverlay()"></div>
<footer id="credit">
  ちずデータ: 「日本地図.svg」© Lincun（CC BY-SA 3.0）をもとにした
  geolonia/japanese-prefectures の改変版を使用しています。
</footer>

<script src="map-data.js?v=2"></script>
<script src="pref-data.js?v=3"></script>
<script>
/* =============== セーブ =============== */
// 単一セーブだがキーは名前空間つき（将来プロフィール化するとき default→id に拡張する）
var SAVE_KEY = 'todofuken_save_default';
function loadSave() {
  // survival=れんぞく正解の最高記録 / taRank=タイムアタックの端末内ランキング {key:[{n:名前,ms:タイム}]}
  var def = { v: 1, cleared: {}, regionMaster: {}, balloon: 0, zenkoku: null, taBest: {}, survival: 0, taRank: {} };
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return def;
    var s = JSON.parse(raw);
    if (typeof s !== 'object' || !s) return def;
    // スキーマ変更時はここで旧データを補完移行する（黙って捨てない）
    for (var k in def) { if (!(k in s)) s[k] = def[k]; }
    return s;
  } catch (e) { return def; }
}
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}
var save = loadSave();

/* =============== 共通ヘルパー =============== */
function $(id) { return document.getElementById(id); }
function ruby(a, b) { return '<ruby>' + a + '<rt>' + b + '</rt></ruby>'; }
function prefRuby(code) { return ruby(PREFS[code].n, PREFS[code].k); }
function shuffle(a) {
  var arr = a.slice();
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
var ALL_CODES = Object.keys(PREFS).map(Number);
var REGION_OF = {};   // code -> REGIONS の index
REGIONS.forEach(function (r, i) { r.prefs.forEach(function (c) { REGION_OF[c] = i; }); });

function isCleared(c) { return (save.cleared[c] || 0) >= 4; }
function isGold(c) { return (save.cleared[c] || 0) >= 5; }
function regionComplete(i) { return REGIONS[i].prefs.every(isCleared); }
function regionHasData(i) { return REGIONS[i].prefs.every(function (c) { return !!CARDS[c]; }); }
function masterPassed(i) { return (save.regionMaster[REGIONS[i].id] || 0) >= 8; }
// 次の地方は「前の地方のマスターテスト合格」で解放（設計合意5）
function regionUnlocked(i) { return i === 0 || masterPassed(i - 1); }
function completeRegionCount() {
  var n = 0;
  for (var i = 0; i < REGIONS.length; i++) { if (regionComplete(i)) n++; }
  return n;
}
function clearedCount() {
  var n = 0;
  ALL_CODES.forEach(function (c) { if (isCleared(c)) n++; });
  return n;
}
function goldCount() {
  var n = 0;
  ALL_CODES.forEach(function (c) { if (isGold(c)) n++; });
  return n;
}

/* =============== 地図ユーティリティ =============== */
var PBOX = {};  // code -> {x,y,w,h,cx,cy}（離島も含む全体のbbox。viewBox座標・起動時に実測）
var CBOX = {};  // code -> 本体（いちばん大きい島）だけのbbox。東京の小笠原・鹿児島の離島などで
                // ズームやシルエットが間延びしないように、表示範囲・旗の位置はこちらを使う
function buildSvg(vbStr) {
  var d = document.createElement('div');
  d.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vbStr + '">' + MAP_INNER + '</svg>';
  return d.firstElementChild;
}
function measureBoxes() {
  // viewBox 0 0 1000 1000 のSVGを1000pxで不可視レンダリングすると px==viewBox座標 になる
  var host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-2200px;top:0;width:1000px;height:1000px;visibility:hidden;';
  var svg = buildSvg(MAP_VIEWBOX);
  svg.setAttribute('width', '1000');
  svg.setAttribute('height', '1000');
  host.appendChild(svg);
  document.body.appendChild(host);
  var base = svg.getBoundingClientRect();
  var gs = svg.querySelectorAll('.prefecture[data-code]');
  for (var i = 0; i < gs.length; i++) {
    var r = gs[i].getBoundingClientRect();
    var code = Number(gs[i].getAttribute('data-code'));
    var x = r.left - base.left, y = r.top - base.top;
    PBOX[code] = { x: x, y: y, w: r.width, h: r.height, cx: x + r.width / 2, cy: y + r.height / 2 };
    // 本体（面積最大の島）のbbox
    var shapes = gs[i].querySelectorAll('polygon, path');
    var best = null;
    for (var j = 0; j < shapes.length; j++) {
      var sr = shapes[j].getBoundingClientRect();
      if (!best || sr.width * sr.height > best.width * best.height) best = sr;
    }
    if (best) {
      var bx = best.left - base.left, by = best.top - base.top;
      CBOX[code] = { x: bx, y: by, w: best.width, h: best.height, cx: bx + best.width / 2, cy: by + best.height / 2 };
    } else {
      CBOX[code] = PBOX[code];
    }
  }
  document.body.removeChild(host);
}
function unionBox(codes, padRatio) {
  var x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  codes.forEach(function (c) {
    var b = CBOX[c];
    if (b.x < x1) x1 = b.x;
    if (b.y < y1) y1 = b.y;
    if (b.x + b.w > x2) x2 = b.x + b.w;
    if (b.y + b.h > y2) y2 = b.y + b.h;
  });
  var pad = Math.max(x2 - x1, y2 - y1) * (padRatio || 0.08) + 6;
  return { x: x1 - pad, y: y1 - pad, w: (x2 - x1) + pad * 2, h: (y2 - y1) + pad * 2 };
}
// makeMap(o): 地図SVG生成の共通関数
//   o.view=[codes] ズーム範囲 / o.active=[codes] ふつう表示（省略=全県）
//   o.others='dim'|'hide' activeでない県の扱い / o.fill(code)=色 / o.mark(code)=強調
//   o.onTap(code,g,svg)=タップ / o.flag(code)=🚩 / o.boundary=区切り線 / o.silhouette=シルエット
function makeMap(o) {
  var svg = buildSvg(MAP_VIEWBOX);
  var vb = { x: 0, y: 0, w: 1000, h: 1000 };
  if (o.view) {
    vb = unionBox(o.view, o.pad);
    svg.setAttribute('viewBox', vb.x + ' ' + vb.y + ' ' + vb.w + ' ' + vb.h);
  }
  if (!o.boundary) {
    var bl = svg.querySelector('.boundary-line');
    if (bl) bl.classList.add('p-hide');
  }
  if (o.silhouette) svg.classList.add('sil');
  var act = {};
  (o.active || ALL_CODES).forEach(function (c) { act[c] = 1; });
  var gs = svg.querySelectorAll('.prefecture[data-code]');
  for (var i = 0; i < gs.length; i++) {
    (function (g) {
      var code = Number(g.getAttribute('data-code'));
      if (!act[code]) {
        g.classList.add(o.others === 'hide' ? 'p-hide' : 'p-dim');
        return;
      }
      if (o.fill) {
        var col = o.fill(code);
        if (col) g.style.fill = col;
      }
      if (o.mark && o.mark(code)) g.classList.add('p-mark');
      if (o.onTap) {
        g.classList.add('p-tap');
        g.addEventListener('click', function () { o.onTap(code, g, svg); });
      }
    })(gs[i]);
  }
  if (o.flag) {
    var fs = Math.max(Math.min(vb.h * 0.075, 46), 18);
    (o.active || ALL_CODES).forEach(function (c) {
      if (!o.flag(c)) return;
      svg.appendChild(svgText(CBOX[c].cx, CBOX[c].cy, fs, 'flag', '🚩'));
    });
  }
  if (o.balloonAt) {
    var bs = Math.max(Math.min(vb.h * 0.1, 60), 24);
    svg.appendChild(svgText(o.balloonAt.x, o.balloonAt.y, bs, 'balloon', '🎈'));
  }
  return svg;
}
function svgText(x, y, fs, cls, str) {
  var t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', x); t.setAttribute('y', y);
  t.setAttribute('font-size', fs);
  t.setAttribute('text-anchor', 'middle');
  t.setAttribute('class', cls);
  t.textContent = str;
  return t;
}
function svgPref(svg, code) { return svg.querySelector('.prefecture[data-code="' + code + '"]'); }
// 位置問題の正解発表用: 正解の県に📍ピンを立てる（Safariでも確実に場所が伝わるように）
function addPin(svg, code) {

var quiz = null;
function pickDistract(primary, fallback, n, excludeSet) {
  var out = [];
  var used = {};
  function take(pool) {
    var sh = shuffle(pool);
    for (var i = 0; i < sh.length && out.length < n; i++) {
      var key = String(sh[i]);
      if (excludeSet[key] || used[key]) continue;
      used[key] = 1;
      out.push(sh[i]);
    }
  }
  take(primary);
  if (out.length < n) take(fallback);
  return out;
}
function buildQuestions(code) {
  var r = REGIONS[REGION_OF[code]];
  var sameRegion = r.prefs.filter(function (c) { return c !== code; });
  var others = ALL_CODES.filter(function (c) { return c !== code; });
  var ex = {}; ex[code] = 1;

  // 位置タップは地方の県が3つ以下なら となりの地方も出す（まぎれを確保）
  var posCodes = r.prefs.slice();
  if (posCodes.length < 4) {
    var ri = REGION_OF[code];
    var next = REGIONS[ri + 1] || REGIONS[ri - 1];
    if (next) posCodes = posCodes.concat(next.prefs);
  }

  var silChoices = shuffle([code].concat(pickDistract(sameRegion, others, 3, ex)));
  var yomiChoices = shuffle([code].concat(pickDistract(sameRegion, others, 3, ex)));
  var capChoices = shuffle([code].concat(pickDistract(sameRegion, others, 3, ex)));

function choiceGrid(items, labelFn, okFn, revealHTML) {

  grid.className = 'choice-grid';
  items.forEach(function (item) {
    var b = document.createElement('button');
    b.className = 'choice-btn';
    var label = labelFn(item);

      b.classList.add(ok ? 'good' : 'bad');
      // せいかいをかならず見せる
      var btns = grid.querySelectorAll('.choice-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].disabled = true;
        if (!ok && okFn(items[i])) btns[i].classList.add('good');
      }

    });

/* =============== タイムアタック =============== */
// 数値はぜんぶ叩き台（実機調整前提）: おてつき+3秒 / 金=1県3秒 / 銀=1県5秒 / 完走で銅
var ta = null;
var taTimerId = null;
var TA_PENALTY = 3000;
var TA_GOLD_PER = 3000, TA_SILVER_PER = 5000;
// ri は地方index または 'all'（全国47県タイムアタック）
function taPrefs(ri) { return ri === 'all' ? ALL_CODES.slice() : REGIONS[ri].prefs; }
function taKey(ri) { return ri === 'all' ? 'all' : REGIONS[ri].id; }
function fmtSec(ms) { return (ms / 1000).toFixed(1) + ' びょう'; }
function taMedal(ri, ms) {
  var n = taPrefs(ri).length;
  if (ms <= n * TA_GOLD_PER) return ['🥇', '金メダル'];
  if (ms <= n * TA_SILVER_PER) return ['🥈', '銀メダル'];
  return ['🥉', '銅メダル'];
}
function stopTATimer() {
  if (taTimerId) { clearInterval(taTimerId); taTimerId = null; }
}
function startTA(ri) {
  var prefs = taPrefs(ri);
  ta = { ri: ri, order: shuffle(prefs), idx: 0, penalty: 0, start: 0, done: false };
  var el = $('view-ta');
  el.innerHTML = '';
  var panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = '<div id="ta-timer">0.0</div><div id="ta-prompt" class="q-prompt"></div>';
  panel.appendChild(wrapMap(ri === 'all'
    ? makeMap({ boundary: true, onTap: tapTA })
    : makeMap({ view: prefs, active: prefs, others: 'dim', onTap: tapTA })));
  var note = document.createElement('div');
  note.className = 'progress-line';
  note.innerHTML = 'おてつきは ＋3びょう。さいごまで がんばろう！';
  panel.appendChild(note);
  el.appendChild(panel);
  show('view-ta', ri === 'all' ? '⏱ 全国（ぜんこく）タイムアタック' : '⏱ タイムアタック');
  updateTAPrompt();
  ta.start = performance.now();
  stopTATimer();
  taTimerId = setInterval(function () {
    if (!ta || ta.done) return;
    $('ta-timer').textContent = ((performance.now() - ta.start + ta.penalty) / 1000).toFixed(1);
  }, 100);
}
function updateTAPrompt() {
  $('ta-prompt').innerHTML = 'つぎは… ' + prefRuby(ta.order[ta.idx]) + '！（' + (ta.idx + 1) + '/' + ta.order.length + '）';
}
function tapTA(code, g) {
  if (!ta || ta.done) return;
  if (code === ta.order[ta.idx]) {
    g.classList.add('p-good');
    setTimeout(function () { g.classList.remove('p-good'); }, 350);
    ta.idx++;
    if (ta.idx >= ta.order.length) finishTA();
    else updateTAPrompt();
  } else {
    ta.penalty += TA_PENALTY;
    g.classList.add('p-bad');
    setTimeout(function () { g.classList.remove('p-bad'); }, 350);
    var t = $('ta-timer');
    t.classList.add('pen');
    setTimeout(function () { t.classList.remove('pen'); }, 350);
  }
}
function finishTA() {
  ta.done = true;
  stopTATimer();
  var ms = Math.round(performance.now() - ta.start + ta.penalty);
  var key = taKey(ta.ri);
  // 0ミリ秒も正当な記録として扱う（|| 0 だと「記録なし」と区別できない）
  var prev = (key in save.taBest) ? save.taBest[key] : null;
  var isNew = prev === null || ms < prev;
  if (isNew) {
    save.taBest[key] = ms;  // はやい記録だけ上書き
    persist();
  }
  var medal = taMedal(ta.ri, ms);
  var el = $('view-ta');
  el.innerHTML = '';
  var panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML =
    '<div class="res-msg">🏁 ゴール！</div>' +
    '<div class="ta-result">' + medal[0] + '</div>' +
    '<div class="res-msg">' + fmtSec(ms) + '　' + medal[1] + '！</div>' +
    (isNew
      ? '<div class="res-msg" style="color:#f57f17">✨ しんきろく！</div>'
      : '<div class="progress-line">ベスト: ' + fmtSec(prev) + ' ' + taMedal(ta.ri, prev)[0] + ' には とどかなかった…もういちど！</div>');
  // 端末内ランキング（名前つき。教室の1台でつかえば クラスのランキングになる）
  var rankArea = document.createElement('div');
  panel.appendChild(rankArea);
  renderTARank(rankArea, key, ms);
  var row = document.createElement('div');
  row.className = 'btn-row';
  var re = document.createElement('button');
  re.className = 'big-btn';
  re.innerHTML = '⏱ もういちど はしる！';
  re.addEventListener('click', function () { startTA(ta.ri); });
  row.appendChild(re);
  var back = document.createElement('button');
  back.className = 'big-btn blue';
  back.innerHTML = ta.ri === 'all' ? '🏠 ホームへ もどる' : '🗾 ちほうマップへ もどる';
  back.addEventListener('click', function () {
    if (ta.ri === 'all') renderHome(); else openRegion(ta.ri);
  });
  row.appendChild(back);
  panel.appendChild(row);
  el.appendChild(panel);
  if (isNew) confettiBurst();
}

/* =============== タイムアタックの端末内ランキング =============== */
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
// ms を渡すと「5位以内なら名前とうろくフォーム」も出す（とうろく後は ms=null で再描画）
function renderTARank(area, key, ms) {
  var rank = save.taRank[key] || [];
  var qualifies = typeof ms === 'number' && (rank.length < 5 || ms < rank[rank.length - 1].ms);
  area.innerHTML = '';
  if (qualifies) {
    var lb = document.createElement('div');
    lb.className = 'tk-label';
    lb.style.textAlign = 'center';
    lb.innerHTML = '🏆 ランキングに とうじょう！ なまえを いれてね';
    area.appendChild(lb);
    var input = document.createElement('input');
    input.className = 'name-input';
    input.maxLength = 8;
    input.placeholder = 'なまえ（8もじまで）';
    area.appendChild(input);
    var reg = document.createElement('button');
    reg.className = 'big-btn blue';
    reg.style.maxWidth = '340px';
    reg.style.margin = '10px auto 0';
    reg.innerHTML = '✍ とうろくする';
    reg.addEventListener('click', function () {
      var name = (input.value || 'ななしさん').slice(0, 8);
      rank.push({ n: name, ms: ms });
      rank.sort(function (a, b) { return a.ms - b.ms; });
      save.taRank[key] = rank.slice(0, 5);
      persist();
      renderTARank(area, key, null);
    });
    area.appendChild(reg);
  }
  var list = save.taRank[key] || [];
  if (list.length) {
    var h = document.createElement('div');
    h.className = 'tk-label';
    h.style.textAlign = 'center';
    h.innerHTML = '🏆 ランキング（この iPadの きろく）';
    area.appendChild(h);
    var medals = ['🥇', '🥈', '🥉', '4い', '5い'];
    list.forEach(function (r, i) {
      var row = document.createElement('div');
      row.className = 'rank-row';
      row.innerHTML = '<span>' + medals[i] + ' ' + escapeHTML(r.n) + '</span><span>' + fmtSec(r.ms) + '</span>';
      area.appendChild(row);
    });
  }
}

/* =============== ふたりでたいけつ（上下2分割・むかいあって同時タップ早押し） =============== */
// 1台のiPadを机に置き、ふたりが向かい合う。上half(P2)は180度回転。
// 同じ「〇〇県をさがせ！」に先に正しくタップした方が1ポイント。おてつきは1.5秒おやすみ。
var vs = null;
var VS_WIN = 5;         // さきに5ポイントで かち（叩き台）
var VS_FREEZE = 1500;   // おてつきペナルティms（叩き台）
function openVSSetup() {
  vs = null;
  var el = $('view-vs');
  el.innerHTML = '';
  var panel = document.createElement('div');
  panel.className = 'panel';
  panel.style.flex = '1';
  panel.style.overflowY = 'auto';
  panel.innerHTML =
    '<div class="vs-big">⚔️ ふたりで たいけつ！</div>' +
    '<div class="progress-line">iPadを あいだに おいて、むかいあって すわろう。<br>' +
    'おなじ もんだいが 出るよ。さきに 正（ただ）しい けんを タップした ほうが 1ポイント！<br>' +
    'おてつきは 1.5びょう おやすみ。さきに ' + VS_WIN + 'ポイントで かち！</div>' +
    '<div class="tk-label" style="text-align:center">たたかう ばしょを えらんでね</div>';
  var list = document.createElement('div');
  list.className = 'side-scroll';
  var allBtn = document.createElement('button');
  allBtn.className = 'region-btn';
  allBtn.innerHTML = '<span class="rb-dot" style="background:#37474f"></span>' +
    '<span class="rb-name">🗾 ぜんこく（47けん）</span><span class="rb-state">▶ たたかう</span>';
  allBtn.addEventListener('click', function () { startVS('all'); });
  list.appendChild(allBtn);
  REGIONS.forEach(function (r, i) {
    var b = document.createElement('button');
    b.className = 'region-btn';
    b.innerHTML = '<span class="rb-dot" style="background:' + r.color + '"></span>' +
      '<span class="rb-name">' + ruby(r.name, r.kana) + '</span><span class="rb-state">▶ たたかう</span>';
    b.addEventListener('click', function () { startVS(i); });
    list.appendChild(b);
  });
  panel.appendChild(list);
  el.appendChild(panel);
  show('view-vs', '⚔️ ふたりで たいけつ');
}
function vsBuildHalf(player, prefs, scope) {
  var half = document.createElement('div');
  half.className = 'vs-half ' + (player === 0 ? 'p1' : 'p2');
  var head = document.createElement('div');
  head.className = 'vs-head';
  head.innerHTML = '<span class="vs-name">' + (player === 0 ? '🔵 あお' : '🔴 あか') + '</span>' +
    '<span class="vs-score"></span>';
  half.appendChild(head);
  var prompt = document.createElement('div');
  prompt.className = 'vs-prompt';
  half.appendChild(prompt);
  var msg = document.createElement('div');
  msg.className = 'vs-msg';
  half.appendChild(msg);
  var map = makeMap({
    view: scope === 'all' ? null : prefs, active: prefs, others: 'dim',
    boundary: scope === 'all',
    onTap: function (code, g) { vsTap(player, code, g); }
  });
  half.appendChild(wrapMap(map));
  return { root: half, head: head, prompt: prompt, msg: msg, svg: map };
}
function startVS(scope) {
  var prefs = scope === 'all' ? ALL_CODES.slice() : REGIONS[scope].prefs.slice();
  vs = { scope: scope, prefs: prefs, score: [0, 0], target: 0, locked: true, frozenUntil: [0, 0], halves: [] };
  var el = $('view-vs');
  el.innerHTML = '';
  var wrap = document.createElement('div');
  wrap.className = 'vs-wrap';
  var h2 = vsBuildHalf(1, prefs, scope);
  var h1 = vsBuildHalf(0, prefs, scope);
  vs.halves = [h1, h2];
  var mid = document.createElement('div');
  mid.className = 'vs-mid';
  mid.id = 'vs-mid';
  wrap.appendChild(h2.root);   // 上＝あか（回転）
  wrap.appendChild(mid);
  wrap.appendChild(h1.root);   // 下＝あお
  el.appendChild(wrap);
  show('view-vs', '⚔️ ふたりで たいけつ');
  updateVSScores();
  nextVSRound();
}
function updateVSScores() {
  for (var p = 0; p < 2; p++) {
    var s = '';
    for (var i = 0; i < VS_WIN; i++) s += i < vs.score[p] ? '●' : '○';
    vs.halves[p].head.querySelector('.vs-score').textContent = s;
  }
  $('vs-mid').textContent = '🔵 ' + vs.score[0] + ' ― ' + vs.score[1] + ' 🔴　さきに ' + VS_WIN + 'ポイントで かち！';
}
function resetVSMaps() {
  vs.halves.forEach(function (h) {
    var marked = h.svg.querySelectorAll('.p-good, .p-bad');
    for (var i = 0; i < marked.length; i++) { marked[i].classList.remove('p-good'); marked[i].classList.remove('p-bad'); }
    var pins = h.svg.querySelectorAll('text.pin');
    for (var j = 0; j < pins.length; j++) pins[j].parentNode.removeChild(pins[j]);
    h.root.classList.remove('vs-frozen');
    h.msg.textContent = '';
  });
}
function nextVSRound() {
  if (!vs || curView !== 'view-vs') return;
  resetVSMaps();
  var next = vs.target;
  while (next === vs.target) next = vs.prefs[Math.floor(Math.random() * vs.prefs.length)];
  vs.target = next;
  vs.frozenUntil = [0, 0];
  vs.locked = false;
  vs.halves.forEach(function (h) {
    h.prompt.innerHTML = '⚔️ ' + prefRuby(vs.target) + ' を さがせ！';
  });
}
function vsTap(player, code, g) {
  if (!vs || vs.locked) return;
  var now = performance.now();
  if (vs.frozenUntil[player] > now) return;
  var me = vs.halves[player], foe = vs.halves[1 - player];
  if (code === vs.target) {
    vs.locked = true;
    vs.score[player]++;
    g.classList.add('p-good');
    addPin(me.svg, code);
    var foeG = svgPref(foe.svg, code);
    if (foeG) { foeG.classList.add('p-good'); addPin(foe.svg, code); }
    me.msg.textContent = '⭕ はやい！ ポイント ゲット！';
    foe.msg.textContent = 'ここだったよ！';
    updateVSScores();
    if (vs.score[player] >= VS_WIN) setTimeout(showVSResult, 1000);
    else setTimeout(nextVSRound, 1500);
  } else {
    vs.frozenUntil[player] = now + VS_FREEZE;
    g.classList.add('p-bad');
    me.root.classList.add('vs-frozen');
    me.msg.textContent = '❌ おてつき！ ちょっと おやすみ…';
    (function (h, el2) {
      setTimeout(function () {
        el2.classList.remove('p-bad');
        if (vs && !vs.locked) { h.root.classList.remove('vs-frozen'); h.msg.textContent = ''; }
      }, VS_FREEZE);
    })(me, g);
  }
}
function showVSResult() {
  if (!vs || curView !== 'view-vs') return;
  var winner = vs.score[0] >= VS_WIN ? 0 : 1;
  vs.locked = true;
  vs.halves.forEach(function (h, p) {
    h.prompt.innerHTML = p === winner ? '🏆 かち！ おめでとう！' : '💪 おしい！ つぎは かてる！';
    h.msg.textContent = '';
  });
  confettiBurst();
  var mid = $('vs-mid');
  mid.innerHTML = '';
  var row = document.createElement('div');
  row.className = 'btn-row';
  var re = document.createElement('button');
  re.className = 'big-btn';
  re.innerHTML = '⚔️ もういちど！';
  re.addEventListener('click', function () { startVS(vs.scope); });
  row.appendChild(re);
  var back = document.createElement('button');
  back.className = 'big-btn blue';
  back.innerHTML = '🏠 ホームへ';
  back.addEventListener('click', function () { renderHome(); });
  row.appendChild(back);
  mid.appendChild(row);
}

/* =============== ご当地カード =============== */
function makeCard(code) {
  var card = CARDS[code];
  var gold = isGold(code);
  var d = document.createElement('div');
  d.className = 'gcard' + (gold ? ' gold' : '');
  d.innerHTML =
    '<div class="gc-emoji">' + card.e + '</div>' +
    '<div class="gc-name">' + prefRuby(code) + '</div>' +
    '<div class="gc-shape"></div>' +
    '<div class="gc-cap">🏢 ' + ruby(PREFS[code].cap, PREFS[code].capK) + '</div>' +
    '<div class="gc-mei">' + card.mei.map(function (m) { return m[1] + m[0]; }).join('　') + '</div>' +
    (gold ? '<div class="gc-goldtag">✨ 金カード ✨</div>' : '');
  d.querySelector('.gc-shape').appendChild(wrapMap(makeMap({
    view: [code], active: [code], others: 'hide', silhouette: true, pad: 0.12
  })));
  return d;
}
function openCardOverlay(code) {
  var ov = $('card-overlay');
  ov.innerHTML = '';
  ov.appendChild(makeCard(code));
  var b = document.createElement('button');
  b.className = 'big-btn blue';
  b.innerHTML = 'とじる';
  ov.appendChild(b);
  ov.classList.add('on');
}
function closeCardOverlay() { $('card-overlay').classList.remove('on'); }

/* =============== ずかん =============== */
function openZukan() {
  zukanFrom = (curView === 'view-region' || curView === 'view-tanken') ? 'region' : 'home';
  var el = $('view-zukan');
  el.innerHTML = '';
  var panel = document.createElement('div');
  panel.className = 'panel';
  var pg = document.createElement('div');
  pg.className = 'progress-line';
  pg.innerHTML = 'あつめた カード: ' + clearedCount() + ' / 47' +
    (goldCount() > 0 ? '（<span class="gold">✨金 ' + goldCount() + 'まい</span>）' : '');
  panel.appendChild(pg);

  REGIONS.forEach(function (r) {
    var h = document.createElement('div');
    h.className = 'zk-region-h';
    h.innerHTML = '<span class="rb-dot" style="background:' + r.color + '"></span>' +
      ruby(r.name, r.kana) + (regionHasData(REGIONS.indexOf(r)) ? '' : '<span style="font-size:12px;color:#90a4ae">🚧 じゅんびちゅう</span>');
    panel.appendChild(h);
    var grid = document.createElement('div');
    grid.className = 'zk-grid';
    r.prefs.forEach(function (c) {
      var s = document.createElement('div');
      if (isCleared(c)) {
        s.className = 'zk-slot' + (isGold(c) ? ' gold' : '');
        s.innerHTML = '<span class="ze">' + CARDS[c].e + '</span><span class="zn">' + prefRuby(c) + (isGold(c) ? ' ✨' : '') + '</span>';
        s.addEventListener('click', function () { openCardOverlay(c); });
      } else {
        s.className = 'zk-slot none';
        s.innerHTML = '<span class="ze">❓</span><span class="zn">みかくにん</span>';
      }
      grid.appendChild(s);
    });
    panel.appendChild(grid);
  });
  el.appendChild(panel);
  show('view-zukan', '📖 ご当地（とうち）カードずかん');
}

/* =============== コンフェッティ（自前・軽量） =============== */
function confettiBurst() {
  var colors = ['#f44336', '#ff9800', '#ffee58', '#66bb6a', '#42a5f5', '#ab47bc'];
  for (var i = 0; i < 60; i++) {
    var d = document.createElement('div');
    d.className = 'confetti';
    d.style.left = (Math.random() * 100) + 'vw';
    d.style.background = colors[i % colors.length];
    d.style.animationDelay = (Math.random() * 0.7) + 's';
    document.body.appendChild(d);
    setTimeout((function (el2) { return function () { if (el2.parentNode) el2.parentNode.removeChild(el2); }; })(d), 3200);
  }
}

/* =============== 起動 =============== */
// URLハッシュで画面を直接開ける（動作確認用。例: #r0=地方 / #t2=たんけん / #q2=クイズ / #m0=マスター / #ta0=タイムアタック / #zukan）
measureBoxes();
var bootHash = location.hash;
if (/^#r\d+$/.test(bootHash)) openRegion(Number(bootHash.slice(2)));
else if (/^#t\d+$/.test(bootHash)) openTanken(Number(bootHash.slice(2)));
else if (/^#q\d+$/.test(bootHash)) startQuiz(Number(bootHash.slice(2)));
else if (/^#m\d+$/.test(bootHash)) startMaster(Number(bootHash.slice(2)));
else if (bootHash === '#taall') startTA('all');
else if (/^#ta\d+$/.test(bootHash)) startTA(Number(bootHash.slice(3)));
else if (bootHash === '#zen') startZenkoku();
else if (bootHash === '#sv') startSurvival();
else if (bootHash === '#vs') openVSSetup();
else if (/^#vsg(\d+|all)$/.test(bootHash)) startVS(bootHash.slice(4) === 'all' ? 'all' : Number(bootHash.slice(4)));
else if (bootHash === '#free') openFreePick();
else if (bootHash === '#zukan') openZukan();
else renderHome();

// PWA: Service Worker 登録（オフライン起動用）
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
