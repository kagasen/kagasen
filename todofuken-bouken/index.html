<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; height: 100%; }
  /* スクロールなし前提: アプリ全体を画面の高さに固定し、各画面は flex で中に収める */
  body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #90caf9 0%, #bbdefb 40%, #e1f5fe 100%);
    color: #37474f;
  }
  ruby rt { font-size: 0.45em; color: #78909c; }

  /* ---------- トップバー ---------- */
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px; gap: 8px;
    flex: none; z-index: 20;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(4px);
    box-shadow: 0 2px 8px rgba(33,150,243,0.15);
  }
  #tb-title { font-weight: 800; font-size: 18px; color: #1565c0; text-align: center; flex: 1; min-width: 0; }
  .tb-btn {
    min-height: 48px; padding: 8px 14px; border: none; border-radius: 14px;
    background: #e3f2fd; color: #1565c0; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .tb-btn:active { transform: scale(0.96); }
  .tb-hidden { visibility: hidden; }

  main {
    flex: 1; min-height: 0; width: 100%; max-width: 1100px;
    margin: 0 auto; padding: 10px 12px; display: flex;
  }
  .view { display: none; }
  .view.on { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  .panel {
    background: #fff; border-radius: 18px; padding: 12px;
    box-shadow: 0 4px 14px rgba(33,150,243,0.18);
    display: flex; flex-direction: column; min-height: 0;
  }
  h2.vh { font-size: 20px; color: #1565c0; margin-bottom: 6px; text-align: center; flex: none; }

  /* 2カラム分割（iPad横/縦=左右、せまいスマホ=上下） */
  .split { display: flex; gap: 12px; flex: 1; min-height: 0; }
  .split > * { min-height: 0; min-width: 0; }
  .split .main-col { flex: 1.35; }
  .split .side-col { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .side-scroll { overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
  @media (max-width: 620px) {
    .split { flex-direction: column; }
    .split .main-col { flex: 1.1; }
  }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; flex: none; }
  .btn-row .big-btn { flex: 1 1 200px; }

  /* ---------- 地図 ---------- */
  .mapbox {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .mapbox svg { width: 100%; height: 100%; display: block; }
  /* 注意: vector-effect: non-scaling-stroke は Safari で図形位置がズレる既知バグがあるため使わない。
     同様に、県(.prefecture=transform付き<g>)に CSSアニメーション/トランジションを掛けると
     Safari(WebKit)がその要素を別レイヤーに切り出し「元の位置からズレて」描画する既知バグがある。
     そのため県の塗りは点滅させず、色を変えるだけ（静的）にする。 */
  .prefecture { fill: #fffdf7; stroke: #8d6e63; stroke-width: 1; }
  .boundary-line { stroke: #64b5f6; stroke-width: 2; stroke-dasharray: 5 5; fill: none; }
  .p-hide { display: none; }
  .p-dim { fill: #eceff1; stroke: #cfd8dc; pointer-events: none; }
  .p-tap { cursor: pointer; }
  /* たんけんの「ここ」ヒント: 点滅せず、濃いふちで示す。
     これは makeMap 内（最初の描画前）にクラス付与されるので CSS で色が出る。 */
  .p-mark { stroke: #f9a825; stroke-width: 2; }
  /* せいかい=緑の枠取り / 正解タップ=緑 / 誤タップ=ピンク の色は、
     JS(markAnswer/markGood/markWrong)が要素の style で直接入れる。
     ★重要: 描画後に動的にCSSクラスを付けても Safari(WebKit) は SVGの塗り/線を再描画しない
     （＝色が出ない）既知バグがあるため、色はCSSクラスに書かず style で入れること。
     クラス(.p-good/.p-bad/.p-answer)は選択(querySelectorAll)用のマーカーとしてのみ使う。 */
  .sil .prefecture { fill: #607d8b; stroke: none; }
  text.flag, text.balloon { pointer-events: none; }

  /* ---------- ボタン ---------- */
  .big-btn {
    display: block; width: 100%; min-height: 52px; padding: 10px;
    border: none; border-radius: 16px; cursor: pointer;
    background: linear-gradient(180deg, #ffb74d, #ff9800); color: #fff;
    font-size: 18px; font-weight: 800; box-shadow: 0 4px 0 #ef6c00;
    margin-top: 10px; flex: none;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #ef6c00; }
  .big-btn.blue { background: linear-gradient(180deg, #4fc3f7, #29b6f6); box-shadow: 0 4px 0 #0288d1; }
  .big-btn.blue:active { box-shadow: 0 1px 0 #0288d1; }
  .big-btn.gray { background: #b0bec5; box-shadow: 0 4px 0 #78909c; }
  /* ボタンの下につける「何をするか」の説明（本文より小さく・読みやすく） */
  .btn-sub { font-size: 13px; font-weight: 700; line-height: 1.4; display: block; margin-top: 2px; }

  .region-btn {
    display: flex; align-items: center; gap: 10px; width: 100%;
    min-height: 52px; padding: 8px 14px; margin-top: 8px;
    border: none; border-radius: 16px; cursor: pointer; text-align: left;
    background: #fff; box-shadow: 0 3px 8px rgba(33,150,243,0.15);
    font-size: 17px; font-weight: 700; color: #37474f;
  }
  .region-btn:active { transform: scale(0.98); }
  .region-btn .rb-dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
  .region-btn .rb-name { flex: 1; }
  .region-btn .rb-state { font-size: 14px; color: #78909c; font-weight: 700; }
  .region-btn[disabled] { opacity: 0.55; cursor: default; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip {
    min-height: 48px; padding: 8px 12px; border: none; border-radius: 14px; cursor: pointer;
    background: #e3f2fd; color: #1565c0; font-size: 16px; font-weight: 700;
  }
  .chip:active { transform: scale(0.96); }
  .chip .st { margin-left: 4px; }

  /* ---------- ホーム ---------- */
  #home-head { text-align: center; padding: 2px 0 6px; flex: none; }
  #home-head h1 { font-size: 22px; color: #0d47a1; text-shadow: 0 2px 0 rgba(255,255,255,0.7); }
  #home-head .sub { font-size: 13px; color: #546e7a; margin-top: 2px; font-weight: 700; }
  .balloon-fly { font-size: 28px; display: inline-block; animation: fly 3s ease-in-out infinite; vertical-align: middle; }
  @keyframes fly { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .progress-line { text-align: center; font-size: 15px; font-weight: 800; color: #37474f; margin: 4px 0; flex: none; }
  .progress-line .gold { color: #f57f17; }

  /* ---------- たんけん ---------- */
  .tk-name { text-align: center; font-size: 26px; font-weight: 900; color: #0d47a1; margin: 2px 0 6px; flex: none; }
  .tk-shape { height: 90px; flex: none; display: flex; justify-content: center; }
  .tk-shape .mapbox { flex: none; height: 100%; width: 120px; }
  .tk-cap { font-size: 17px; font-weight: 800; text-align: center; margin: 6px 0; flex: none; }
  .tk-label { font-size: 13px; font-weight: 800; color: #ff8f00; margin: 8px 0 4px; flex: none; }
  .mei-row { display: flex; gap: 8px; flex-wrap: wrap; flex: none; }
  .mei-item {
    flex: 1; min-width: 96px; background: #fff8e1; border-radius: 14px;
    padding: 8px 6px; text-align: center; font-weight: 700; font-size: 13px;
  }
  .mei-item .me { font-size: 28px; display: block; margin-bottom: 2px; }
  .mame { background: #e8f5e9; border-radius: 14px; padding: 10px; font-size: 14px; line-height: 1.6; font-weight: 600; flex: none; }

  /* ---------- クイズ ---------- */
  .q-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #view-quiz .panel, #view-ta .panel, #view-result .panel, #view-zukan .panel { flex: 1; }
  #view-result .panel { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .q-dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 6px; flex: none; }
  .q-dot { width: 16px; height: 16px; border-radius: 50%; background: #cfd8dc; font-size: 0; }
  .q-dot.now { background: #29b6f6; transform: scale(1.25); }
  .q-dot.ok { background: #66bb6a; }
  .q-dot.ng { background: #ef9a9a; }
  .q-prompt { text-align: center; font-size: 18px; font-weight: 800; margin-bottom: 8px; line-height: 1.5; flex: none; }
  /* ずかん連動クイズの「どんな場所か」のヒント文（本文より小さく・やわらかい色） */
  .q-note { font-size: 14px; font-weight: 700; color: #607d8b; }
  .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: none; }
  .choice-btn {
    min-height: 56px; border: 3px solid #b3e5fc; border-radius: 16px; cursor: pointer;
    background: #fff; font-size: 18px; font-weight: 800; color: #37474f; padding: 6px;
  }
  .choice-btn:active { transform: scale(0.97); }
  .choice-btn .ce { font-size: 26px; display: block; }
  .choice-btn .mapbox { height: 88px; }
  .choice-btn.good { background: #c8e6c9; border-color: #66bb6a; }
  .choice-btn.bad { background: #ffcdd2; border-color: #e57373; }
  .choice-btn[disabled] { cursor: default; }
  #q-feedback { text-align: center; margin-top: 8px; min-height: 24px; font-size: 18px; font-weight: 900; flex: none; }
  #q-feedback .big-btn { max-width: 340px; margin: 8px auto 0; }
  #q-feedback .fb-ok { color: #2e7d32; }
  #q-feedback .fb-ng { color: #c62828; }

  /* ---------- けっか・カード ---------- */
  .res-score { text-align: center; font-size: 26px; margin: 4px 0; letter-spacing: 3px; flex: none; }
  .res-msg { text-align: center; font-size: 19px; font-weight: 900; color: #1565c0; margin-bottom: 6px; flex: none; }
  .gcard {
    width: 230px; margin: 8px auto; background: linear-gradient(160deg, #e3f2fd, #fff);
    border: 4px solid #64b5f6; border-radius: 18px; padding: 10px; text-align: center;
    animation: cardPop 0.5s ease-out; flex: none;
  }
  .gcard.gold {
    border-color: #f9a825; background: linear-gradient(160deg, #fff8e1, #fffde7);
    box-shadow: 0 0 18px rgba(249,168,37,0.6);
  }
  @keyframes cardPop { 0% { transform: scale(0.3) rotate(-8deg); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  .gc-emoji { font-size: 36px; }
  .gc-name { font-size: 20px; font-weight: 900; color: #0d47a1; margin: 2px 0 4px; }
  .gc-shape { width: 110px; height: 84px; margin: 0 auto; display: flex; }
  .gc-shape .mapbox { height: 100%; }
  .gc-cap { font-size: 13px; font-weight: 700; margin-top: 4px; }
  .gc-mei { font-size: 13px; font-weight: 600; color: #546e7a; margin-top: 4px; line-height: 1.5; }
  .gc-goldtag { font-size: 13px; font-weight: 900; color: #f57f17; margin-top: 4px; }

  /* ---------- ずかん ---------- */
  #view-zukan .panel { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .zk-region-h { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 800; margin: 12px 0 6px; flex: none; }
  .zk-region-h .rb-dot { width: 14px; height: 14px; border-radius: 50%; }
  .zk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .zk-slot {
    background: #fff; border: 3px solid #b3e5fc; border-radius: 14px; padding: 8px 4px;
    text-align: center; cursor: pointer; min-height: 92px; font-weight: 700;
  }
  .zk-slot .ze { font-size: 30px; display: block; }
  .zk-slot .zn { font-size: 13px; display: block; margin-top: 2px; }
  .zk-slot.none { background: #eceff1; border-color: #cfd8dc; color: #90a4ae; cursor: default; }
  .zk-slot.gold { border-color: #f9a825; background: #fffde7; }
  .zk-slot:active { transform: scale(0.96); }
  .zk-slot.none:active { transform: none; }
  .zk-lead { font-size: 13px; font-weight: 700; color: #546e7a; margin-bottom: 4px; flex: none; }
  /* ずかんの けんさく（けんめい・よみ・めいさんひん・ばしょ・おまつり で さがせる） */
  .zk-search { display: flex; gap: 8px; align-items: center; margin: 6px 0 4px; flex: none; }
  .zk-input {
    flex: 1; min-height: 48px; padding: 8px 14px; font-size: 17px; font-weight: 700;
    border: 3px solid #4fc3f7; border-radius: 14px; background: #fff; color: #263238;
    font-family: inherit; -webkit-appearance: none; appearance: none; min-width: 0;
  }
  .zk-input:focus { outline: none; border-color: #0288d1; }
  .zk-clear {
    min-width: 48px; min-height: 48px; border: none; border-radius: 14px; cursor: pointer;
    background: #b0bec5; color: #fff; font-size: 20px; font-weight: 900; flex: none;
  }
  .zk-clear:active { transform: scale(0.96); }
  .zk-hit { display: block; font-size: 11px; font-weight: 700; color: #00838f; margin-top: 3px; line-height: 1.3; }
  .zk-none { font-size: 14px; font-weight: 700; color: #607d8b; line-height: 1.8; padding: 8px 2px; }
  /* 🔖 まちがえた県（ふくしゅう） */
  .zk-slot { position: relative; }
  .zk-slot.miss { border-color: #ffb74d; background: #fff8e1; }
  .zk-miss { position: absolute; top: -8px; right: -6px; font-size: 13px; font-weight: 900;
    background: #ff9800; color: #fff; border-radius: 10px; padding: 1px 6px; }
  .zk-missnote { font-size: 12px; font-weight: 700; color: #ef6c00; }
  .zk-filter {
    width: 100%; min-height: 48px; margin: 2px 0 6px; padding: 8px 12px; flex: none;
    border: 3px solid #ffb74d; border-radius: 14px; background: #fff8e1; color: #e65100;
    font-size: 14px; font-weight: 800; font-family: inherit; cursor: pointer; line-height: 1.4;
  }
  .zk-filter.on { background: #ff9800; color: #fff; border-color: #ef6c00; }
  .zk-filter:active { transform: scale(0.98); }
  /* 🔖 ずかんから そのまま「にがて こくふく」へ いくボタン */
  .zk-nigate {
    width: 100%; min-height: 48px; margin: 0 0 8px; padding: 8px 12px; flex: none;
    border: none; border-radius: 14px; box-shadow: 0 4px 0 #e65100;
    background: linear-gradient(180deg, #ffb74d, #fb8c00); color: #fff;
    font-size: 15px; font-weight: 900; font-family: inherit; cursor: pointer; line-height: 1.4;
  }
  .zk-nigate:active { transform: translateY(2px); box-shadow: 0 2px 0 #e65100; }
  .zp-miss { background: #fff8e1; border: 3px solid #ffb74d; border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
  .zp-missh { font-size: 15px; font-weight: 900; color: #e65100; margin-bottom: 4px; }
  .zp-missbtn {
    width: 100%; min-height: 48px; margin-top: 8px; border: none; border-radius: 12px;
    background: linear-gradient(180deg, #81c784, #66bb6a); box-shadow: 0 3px 0 #388e3c;
    color: #fff; font-size: 15px; font-weight: 800; font-family: inherit; cursor: pointer;
  }
  .zp-missbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #388e3c; }

  /* ---------- ずかん: 県ごとの くわしいページ ---------- */
  #view-zpref .main-col { display: flex; flex-direction: column; }
  .zp-pos { font-size: 14px; font-weight: 700; line-height: 1.7; color: #37474f; margin-top: 6px; flex: none; }
  .zp-sec { background: #f7fbff; border: 2px solid #e1f0fb; border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
  .zp-h { font-size: 15px; font-weight: 900; color: #0277bd; margin-bottom: 6px; }
  .zp-sum { font-size: 17px; font-weight: 900; color: #e65100; line-height: 1.6; }
  .zp-cap { font-size: 17px; font-weight: 900; color: #263238; }
  .zp-item { margin-bottom: 8px; }
  .zp-item:last-child { margin-bottom: 0; }
  .zp-n { font-size: 15px; font-weight: 900; color: #263238; }
  .zp-d { font-size: 13px; font-weight: 600; color: #455a64; line-height: 1.7; }

  /* カードのかくだいオーバーレイ */
  #card-overlay {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(38,50,56,0.6); padding: 20px;
    align-items: center; justify-content: center; flex-direction: column;
  }
  #card-overlay.on { display: flex; }
  #card-overlay .big-btn { max-width: 280px; }

  /* ---------- コンフェッティ ---------- */
  .confetti {
    position: fixed; top: -14px; width: 10px; height: 14px; z-index: 90;
    pointer-events: none; animation: confFall 2.2s linear forwards; border-radius: 2px;
  }
  @keyframes confFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(540deg); opacity: 0.6; }
  }

  /* ---------- タイムアタック ---------- */
  #ta-timer {
    text-align: center; font-size: 46px; font-weight: 900; color: #1565c0;
    font-variant-numeric: tabular-nums; margin-bottom: 4px;
  }
  #ta-timer.pen { color: #c62828; animation: shake 0.3s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  .ta-result { text-align: center; font-size: 64px; margin: 4px 0; }
  .name-input {
    display: block; width: 100%; max-width: 340px; margin: 6px auto 0;
    min-height: 48px; font-size: 18px; font-weight: 700; padding: 8px 12px;
    border: 3px solid #b3e5fc; border-radius: 12px; text-align: center;
  }
  .rank-row {
    display: flex; justify-content: space-between; max-width: 340px; margin: 6px auto 0;
    width: 100%; font-size: 16px; font-weight: 700; padding: 8px 12px;
    background: #f0f9ff; border-radius: 10px;
  }
  .choice-btn .mapbox { max-width: 110px; margin: 0 auto; }

  /* ---------- ふたりでたいけつ（上下2分割・むかいあって同時タップ） ---------- */
  #view-vs .vs-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 6px; }
  .vs-half {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    background: #fff; border-radius: 16px; padding: 6px 10px;
  }
  .vs-half.p1 { border: 3px solid #64b5f6; }
  .vs-half.p2 { border: 3px solid #e57373; transform: rotate(180deg); }
  .vs-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; }
  .vs-name { font-weight: 900; font-size: 15px; }
  .vs-half.p1 .vs-name { color: #1565c0; }
  .vs-half.p2 .vs-name { color: #c62828; }
  .vs-score { font-size: 15px; letter-spacing: 2px; font-weight: 800; }
  .vs-prompt { text-align: center; font-weight: 900; font-size: 18px; min-height: 26px; flex: none; }
  .vs-msg { text-align: center; font-weight: 800; font-size: 14px; color: #e65100; min-height: 20px; flex: none; }
  .vs-mid { flex: none; text-align: center; font-size: 13px; font-weight: 800; color: #546e7a; }
  .vs-mid .btn-row { max-width: 480px; margin: 0 auto; }
  .vs-frozen .mapbox { opacity: 0.35; pointer-events: none; }
  .vs-big { text-align: center; font-size: 30px; font-weight: 900; color: #1565c0; margin: 4px 0; flex: none; }
  /* れんぞくタップでSafariのダブルタップズームが起きないように */
  button, .mapbox svg, .chip { touch-action: manipulation; }

  #credit {
    flex: none; text-align: center; font-size: 10px; color: #78909c;
    padding: 2px 10px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body>
<header id="topbar">
  <button id="btn-back" class="tb-btn" onclick="goBack()">← もどる</button>
  <div id="tb-title"></div>
  <button id="btn-sound" class="tb-btn" onclick="toggleMute()" title="おと">🔊</button>
  <button id="btn-zukan" class="tb-btn" onclick="openZukan()">📖 ずかん</button>
</header>
<main>
  <section id="view-home" class="view"></section>
  <section id="view-region" class="view"></section>
  <section id="view-tanken" class="view"></section>
  <section id="view-quiz" class="view"></section>
  <section id="view-result" class="view"></section>
  <section id="view-ta" class="view"></section>
  <section id="view-vs" class="view"></section>
  <section id="view-zukan" class="view"></section>
  <section id="view-zpref" class="view"></section>
</main>
<div id="card-overlay" onclick="closeCardOverlay()"></div>
<footer id="credit">
  ちずデータ: 「日本地図.svg」© Lincun（CC BY-SA 3.0）をもとにした
  geolonia/japanese-prefectures の改変版を使用しています。
</footer>

<script src="map-data.js?v=2"></script>
<script src="pref-data.js?v=3"></script>
<script src="zukan-data.js?v=1"></script>
<script>
/* =============== セーブ =============== */
// 単一セーブだがキーは名前空間つき（将来プロフィール化するとき default→id に拡張する）
var SAVE_KEY = 'todofuken_save_default';
function loadSave() {
  // survival=れんぞく正解の最高記録 / taRank=タイムアタックの端末内ランキング {key:[{n:名前,ms:タイム}]}
  // miss=まちがえた回数 {県コード: かず}。ずかんに 🔖 を出して 復習に つなげるための「べんきょうメモ」。
  //   ★クリア記録ではないので、れんしゅうモードでも たまる（正解すると へって、0で 消える）。
  var def = { v: 1, cleared: {}, regionMaster: {}, balloon: 0, zenkoku: null, taBest: {}, survival: 0, taRank: {}, miss: {} };
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return def;
    var s = JSON.parse(raw);
    if (typeof s !== 'object' || !s) return def;
    // スキーマ変更時はここで旧データを補完移行する（黙って捨てない）
    for (var k in def) { if (!(k in s)) s[k] = def[k]; }
    return s;
  } catch (e) { return def; }
}
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}
var save = loadSave();

/* =============== 共通ヘルパー =============== */
function $(id) { return document.getElementById(id); }
function ruby(a, b) { return '<ruby>' + a + '<rt>' + b + '</rt></ruby>'; }
function prefRuby(code) { return ruby(PREFS[code].n, PREFS[code].k); }
function shuffle(a) {
  var arr = a.slice();
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
var ALL_CODES = Object.keys(PREFS).map(Number);
var REGION_OF = {};   // code -> REGIONS の index
REGIONS.forEach(function (r, i) { r.prefs.forEach(function (c) { REGION_OF[c] = i; }); });

function isCleared(c) { return (save.cleared[c] || 0) >= 4; }
function isGold(c) { return (save.cleared[c] || 0) >= 5; }
function regionComplete(i) { return REGIONS[i].prefs.every(isCleared); }
function regionHasData(i) { return REGIONS[i].prefs.every(function (c) { return !!CARDS[c]; }); }
function masterPassed(i) { return (save.regionMaster[REGIONS[i].id] || 0) >= 8; }
// 次の地方は「前の地方のマスターテスト合格」で解放（設計合意5）
function regionUnlocked(i) { return i === 0 || masterPassed(i - 1); }
function completeRegionCount() {
  var n = 0;
  for (var i = 0; i < REGIONS.length; i++) { if (regionComplete(i)) n++; }
  return n;
}
function clearedCount() {
  var n = 0;
  ALL_CODES.forEach(function (c) { if (isCleared(c)) n++; });
  return n;
}
function goldCount() {
  var n = 0;
  ALL_CODES.forEach(function (c) { if (isGold(c)) n++; });
  return n;
}
/* --- 🔖 まちがえた県のメモ（復習用） ---
   クイズ・タイムアタック・たいけつで まちがえたら たまり、正解すると へる（0で 消える）。
   付けると 消すを 対称にしてあるので、行ったり来たりで へんに たまらない（CLAUDE.md §3）。
   ★これは「クリア記録」ではなく べんきょうメモなので、れんしゅうモードでも たまる。 */
function missCount(c) { return save.miss[c] || 0; }
function isMissed(c) { return missCount(c) > 0; }
function missedCodes() { return ALL_CODES.filter(isMissed); }
function addMiss(c) {
  if (!c) return;
  save.miss[c] = Math.min(missCount(c) + 1, 9);  // 9かいで 打ち止め（数字が のびすぎないように）
  persist();
}
function easeMiss(c) {   // 正解したら 1つ へらす
  if (!c || !missCount(c)) return;
  var n = missCount(c) - 1;
  if (n > 0) save.miss[c] = n; else delete save.miss[c];
  persist();
}
function clearMiss(c) { if (missCount(c)) { delete save.miss[c]; persist(); } }

/* =============== 地図ユーティリティ =============== */
var PBOX = {};  // code -> {x,y,w,h,cx,cy}（離島も含む全体のbbox。viewBox座標・起動時に実測）
var CBOX = {};  // code -> 本体（いちばん大きい島）だけのbbox。東京の小笠原・鹿児島の離島などで
                // ズームやシルエットが間延びしないように、表示範囲・旗の位置はこちらを使う
function buildSvg(vbStr) {
  var d = document.createElement('div');
  d.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vbStr + '">' + MAP_INNER + '</svg>';
  return d.firstElementChild;
}
function measureBoxes() {
  // viewBox 0 0 1000 1000 のSVGを1000pxで不可視レンダリングすると px==viewBox座標 になる
  var host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-2200px;top:0;width:1000px;height:1000px;visibility:hidden;';
  var svg = buildSvg(MAP_VIEWBOX);
  svg.setAttribute('width', '1000');
  svg.setAttribute('height', '1000');
  host.appendChild(svg);
  document.body.appendChild(host);
  var base = svg.getBoundingClientRect();
  var gs = svg.querySelectorAll('.prefecture[data-code]');
  for (var i = 0; i < gs.length; i++) {
    var r = gs[i].getBoundingClientRect();
    var code = Number(gs[i].getAttribute('data-code'));
    var x = r.left - base.left, y = r.top - base.top;
    PBOX[code] = { x: x, y: y, w: r.width, h: r.height, cx: x + r.width / 2, cy: y + r.height / 2 };
    // 本体（面積最大の島）のbbox
    var shapes = gs[i].querySelectorAll('polygon, path');
    var best = null;
    for (var j = 0; j < shapes.length; j++) {
      var sr = shapes[j].getBoundingClientRect();
      if (!best || sr.width * sr.height > best.width * best.height) best = sr;
    }
    if (best) {
      var bx = best.left - base.left, by = best.top - base.top;
      CBOX[code] = { x: bx, y: by, w: best.width, h: best.height, cx: bx + best.width / 2, cy: by + best.height / 2 };
    } else {
      CBOX[code] = PBOX[code];
    }
  }
  document.body.removeChild(host);
}
function unionBox(codes, padRatio) {
  var x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  codes.forEach(function (c) {
    var b = CBOX[c];
    if (b.x < x1) x1 = b.x;
    if (b.y < y1) y1 = b.y;
    if (b.x + b.w > x2) x2 = b.x + b.w;
    if (b.y + b.h > y2) y2 = b.y + b.h;
  });
  var pad = Math.max(x2 - x1, y2 - y1) * (padRatio || 0.08) + 6;
  return { x: x1 - pad, y: y1 - pad, w: (x2 - x1) + pad * 2, h: (y2 - y1) + pad * 2 };
}
// makeMap(o): 地図SVG生成の共通関数
//   o.view=[codes] ズーム範囲 / o.active=[codes] ふつう表示（省略=全県）
//   o.others='dim'|'hide' activeでない県の扱い / o.fill(code)=色 / o.mark(code)=強調
//   o.onTap(code,g,svg)=タップ / o.flag(code)=🚩 / o.boundary=区切り線 / o.silhouette=シルエット
function makeMap(o) {
  var svg = buildSvg(MAP_VIEWBOX);
  var vb = { x: 0, y: 0, w: 1000, h: 1000 };
  if (o.view) {
    vb = unionBox(o.view, o.pad);
    svg.setAttribute('viewBox', vb.x + ' ' + vb.y + ' ' + vb.w + ' ' + vb.h);
  }
  if (!o.boundary) {
    var bl = svg.querySelector('.boundary-line');
    if (bl) bl.classList.add('p-hide');
  }
  if (o.silhouette) svg.classList.add('sil');
  var act = {};
  (o.active || ALL_CODES).forEach(function (c) { act[c] = 1; });
  var gs = svg.querySelectorAll('.prefecture[data-code]');
  for (var i = 0; i < gs.length; i++) {
    (function (g) {
      var code = Number(g.getAttribute('data-code'));
      if (!act[code]) {
        g.classList.add(o.others === 'hide' ? 'p-hide' : 'p-dim');
        return;
      }
      if (o.fill) {
        var col = o.fill(code);
        if (col) g.style.fill = col;
      }
      if (o.mark && o.mark(code)) g.classList.add('p-mark');
      if (o.onTap) {
        g.classList.add('p-tap');
        g.addEventListener('click', function () { o.onTap(code, g, svg); });
      }
    })(gs[i]);
  }
  if (o.flag) {
    var fs = Math.max(Math.min(vb.h * 0.075, 46), 18);
    var fchar = o.flagChar || '🚩';   // ずかんでは 🔖（まちがえた県）に つかう
    (o.active || ALL_CODES).forEach(function (c) {
      if (!o.flag(c)) return;
      svg.appendChild(svgText(CBOX[c].cx, CBOX[c].cy, fs, 'flag', fchar));
    });
  }
  if (o.balloonAt) {
    var bs = Math.max(Math.min(vb.h * 0.1, 60), 24);
    svg.appendChild(svgText(o.balloonAt.x, o.balloonAt.y, bs, 'balloon', '🎈'));
  }
  return svg;
}
var SVGNS = 'http://www.w3.org/2000/svg';
function svgText(x, y, fs, cls, str) {
  var t = document.createElementNS(SVGNS, 'text');
  t.setAttribute('x', x); t.setAttribute('y', y);
  t.setAttribute('font-size', fs);
  t.setAttribute('text-anchor', 'middle');
  // 中心（縦）を y に合わせる。絵文字がベースライン基準で上にずれるのを防ぐ
  t.setAttribute('dominant-baseline', 'central');
  t.setAttribute('class', cls);
  t.textContent = str;
  return t;
}
function svgPref(svg, code) { return svg.querySelector('.prefecture[data-code="' + code + '"]'); }
/* --- 県に色をつける共通処理（Safariで「白いまま出ない」問題への対策つき） ---
   Safari(WebKit)は、描画ずみのSVGの <g>（=県のまとまり）にあとから色を指定しても
   すぐに塗り直してくれないことがある（画面をさわるか時間がたつと やっと出る）。
   そこで
     ① 色は <g> ではなく、実際に描かれている polygon/path 1つ1つに属性で入れる
     ② そのうえで forceRepaint() で「いま描き直して」と強制する
   の2段構えにする。これで一発で出る。
   ※ 点滅アニメは使わない（transform付きSVGにCSSアニメを掛けると Safari が別レイヤーに
     切り出して位置がズレるため）。 */
function paintPref(g, fill, stroke, sw) {
  applyPaint(g, fill, stroke, sw);
  forceRepaint(g);
}
function applyPaint(g, fill, stroke, sw) {
  var shapes = g.querySelectorAll('polygon, path');
  for (var i = 0; i < shapes.length; i++) {
    var s = shapes[i];
    if (fill) s.setAttribute('fill', fill); else s.removeAttribute('fill');
    if (stroke) { s.setAttribute('stroke', stroke); s.setAttribute('stroke-width', sw); }
    else { s.removeAttribute('stroke'); s.removeAttribute('stroke-width'); }
  }
}
// Safariに確実に「いま描き直して」と伝える（2重の保険）。
// display の付け外しや位置の読み取りでは Safari は描き直してくれなかった
// （押した県はマウスのせいで描き直されるが、はなれた正解の県は白いままだった）。
function forceRepaint(el) {
  // ① その県をいったんDOMから外して、同じ場所に戻す。
  //    描画のしくみが作り直されるので、Safariでもその場で色がつく。
  //    ・戻す位置は元どおり（nextSibling の前）なので、県の重なり順は変わらない
  //    ・addEventListener で付けたタップ処理は要素を動かしても消えない
  var p = el.parentNode;
  if (p) {
    var next = el.nextSibling;
    p.removeChild(el);
    p.insertBefore(el, next);
  }
  // ② 念のため地図全体にも合図を送る。viewBox の はば を ほんの少しだけ変える。
  //    値が毎回かならず変わるので Safari は地図を描き直す。
  //    ずれは最大でも 0.015／1000 ＝ 画面上 0.01px未満なので、目には見えない。
  nudgeViewBox(el.ownerSVGElement);
}
var vbTick = 0;
function nudgeViewBox(svg) {
  if (!svg) return;
  var base = svg.getAttribute('data-vb-base');
  if (!base) { base = svg.getAttribute('viewBox') || ''; svg.setAttribute('data-vb-base', base); }
  var p = base.split(/[\s,]+/);
  if (p.length !== 4) return;
  // 1回ごとに 0.001 ずつ増やして 16回で一周（同じコマ内で2回呼ばれても値が元に戻らない＝
  // 打ち消し合わないようにするため。交互(0↔0.001)だと2回で元に戻ってしまう）。
  vbTick = (vbTick + 1) % 16;
  svg.setAttribute('viewBox', p[0] + ' ' + p[1] + ' ' + (Number(p[2]) + vbTick * 0.001) + ' ' + p[3]);
}
// せいかいの県を「うすい緑の塗り＋こい緑のふちどり」で枠取りして「ここだよ」と知らせる。
function markAnswer(svg, code) {
  var g = svgPref(svg, code);
  if (!g) return null;
  g.classList.add('p-answer');
  paintPref(g, '#a5d6a7', '#2e7d32', 2.5);  // うすい緑＋こい緑の太めの枠
  return g;
}
function clearAnswer(svg) {
  var gs = svg.querySelectorAll('.p-answer');
  for (var i = 0; i < gs.length; i++) { gs[i].classList.remove('p-answer'); paintPref(gs[i], null, null); }
}
// 正解タップ=緑 / 誤タップ=ピンク
function markGood(g)  { g.classList.add('p-good'); paintPref(g, '#66bb6a', null); }
function markWrong(g) { g.classList.add('p-bad');  paintPref(g, '#ef9a9a', null); }
function unmark(g)    { g.classList.remove('p-good'); g.classList.remove('p-bad'); paintPref(g, null, null); }
function regionFill(code) { return isCleared(code) ? REGIONS[REGION_OF[code]].color : null; }

/* =============== 画面切り替え =============== */
var curRegion = 0;   // いまの地方 index
var curPref = 0;     // いまの県コード
var freeMode = false; // れんしゅうモード（ロック無視で遊べる・きろくは のこらない）。ホームに戻ると解除
var quizFrom = '';    // 'zpref' = ずかんの県ページから始めたクイズ（おわったら ずかんへ もどす）
var zukanFrom = 'home';
var BACK_TO = { 'view-region': 'home', 'view-tanken': 'region', 'view-quiz': 'tanken', 'view-result': 'region', 'view-ta': 'region', 'view-vs': '', 'view-zukan': '' };
var curView = 'view-home';
function show(id, title) {
  ['view-home', 'view-region', 'view-tanken', 'view-quiz', 'view-result', 'view-ta', 'view-vs', 'view-zukan', 'view-zpref'].forEach(function (v) {
    $(v).classList.toggle('on', v === id);
  });
  curView = id;
  $('tb-title').innerHTML = title || '';
  $('btn-back').classList.toggle('tb-hidden', id === 'view-home');
  $('btn-zukan').classList.toggle('tb-hidden', id === 'view-zukan' || id === 'view-zpref' ||
    id === 'view-quiz' || id === 'view-ta' || id === 'view-vs');
  window.scrollTo(0, 0);
}
function goBack() {
  stopTATimer();
  vs = null;  // たいけつ中にもどったら試合は破棄（保存するものはない）
  if (curView === 'view-ta' && ta && ta.ri === 'all') { renderHome(); return; }
  if (curView === 'view-quiz' && quiz && (quiz.mode === 'zenkoku' || quiz.mode === 'survival' || quiz.mode === 'nigate')) { renderHome(); return; }
  if (curView === 'view-zpref') { openZukan(true); return; }  // 県の詳細 → ずかん一覧（さっきの けんさくのまま）
  // ずかんから始めたクイズ・その結果は ずかんの県ページへ もどす
  if (quizFrom === 'zpref' && (curView === 'view-quiz' || curView === 'view-result')) { openZPref(curPref); return; }
  if (curView === 'view-zukan') {
    if (zukanFrom === 'region') { openRegion(curRegion); } else { renderHome(); }
    return;
  }
  // マスターテスト中の「もどる」は地方マップへ（たんけん画面は経由しない）
  if (curView === 'view-quiz' && quiz && quiz.mode === 'master') { openRegion(quiz.regionIdx); return; }
  // にがて こくふくの けっかは ホームへ（地方マップは 通らない）
  if (curView === 'view-result' && quiz && quiz.mode === 'nigate') { renderHome(); return; }
  var to = BACK_TO[curView];
  if (to === 'region') openRegion(curRegion);
  else if (to === 'tanken') openTanken(curPref);
  else renderHome();
}

/* =============== 気球（レベル＝クリアした地方の数。単調増加） =============== */
var BALLOON_COLORS = ['#ef5350', '#ff9800', '#fdd835', '#66bb6a', '#29b6f6', '#5c6bc0', '#ab47bc', '#f06292'];
function balloonLevel() { return Math.min(save.balloon, REGIONS.length); }
function isNihonMaster() { return (save.zenkoku || 0) >= ZENKOKU_PASS; }
function balloonSVG(px) {
  var lv = balloonLevel();
  var col = BALLOON_COLORS[Math.min(lv, BALLOON_COLORS.length - 1)];
  var starPos = [[30, 14], [17, 23], [43, 23], [11, 36], [49, 36], [22, 48], [38, 48]];
  var stars = '';
  for (var i = 0; i < lv && i < starPos.length; i++) {
    stars += '<text x="' + starPos[i][0] + '" y="' + starPos[i][1] + '" font-size="9" text-anchor="middle">⭐</text>';
  }
  // にっぽんマスター（全国マスターテスト合格）で気球のてっぺんに王冠
  if (isNihonMaster()) stars += '<text x="30" y="4" font-size="13" text-anchor="middle">👑</text>';
  return '<svg viewBox="0 -12 60 94" width="' + px + '" height="' + Math.round(px * 94 / 60) + '" style="vertical-align:middle">' +
    '<path d="M30 3 C13 3 5 18 5 30 C5 44 19 53 25 60 L35 60 C41 53 55 44 55 30 C55 18 47 3 30 3 Z" fill="' + col + '" stroke="rgba(0,0,0,0.15)"/>' +
    '<path d="M30 3 C24 14 24 46 27 60 L33 60 C36 46 36 14 30 3 Z" fill="rgba(255,255,255,0.45)"/>' +
    '<line x1="25" y1="60" x2="23" y2="70" stroke="#8d6e63" stroke-width="2"/>' +
    '<line x1="35" y1="60" x2="37" y2="70" stroke="#8d6e63" stroke-width="2"/>' +
    '<rect x="21" y="70" width="18" height="10" rx="3" fill="#a1887f" stroke="#6d4c41"/>' +
    stars + '</svg>';
}

/* =============== ホーム =============== */
function renderHome() {
  freeMode = false;
  quizFrom = '';
  var el = $('view-home');
  el.innerHTML = '';
  var split = document.createElement('div');
  split.className = 'split';

  // 左: 制覇マップ
  var mapPanel = document.createElement('div');
  mapPanel.className = 'panel main-col';
  var pg = document.createElement('div');
  pg.className = 'progress-line';
  pg.innerHTML = 'あつめた ご当地（とうち）カード: ' + clearedCount() + ' / 47' +
    (goldCount() > 0 ? '（<span class="gold">✨金カード ' + goldCount() + 'まい</span>）' : '');
  mapPanel.appendChild(pg);
  // 気球は「いま ちょうせんちゅうの 地方」の上に浮かぶ
  var target = null;
  for (var i = 0; i < REGIONS.length; i++) {
    if (regionUnlocked(i) && !regionComplete(i)) { target = REGIONS[i]; break; }
  }
  var balloonAt = null;
  if (target) {
    var tb = unionBox(target.prefs, 0);
    balloonAt = { x: tb.x + tb.w / 2, y: tb.y + tb.h * 0.3 };
  }
  mapPanel.appendChild(wrapMap(makeMap({
    fill: regionFill, flag: isCleared, boundary: true, balloonAt: balloonAt
  })));

var quiz = null;
function pickDistract(primary, fallback, n, excludeSet) {
  var out = [];
  var used = {};
  function take(pool) {
    var sh = shuffle(pool);
    for (var i = 0; i < sh.length && out.length < n; i++) {
      var key = String(sh[i]);
      if (excludeSet[key] || used[key]) continue;
      used[key] = 1;
      out.push(sh[i]);
    }
  }
  take(primary);
  if (out.length < n) take(fallback);
  return out;
}
function buildQuestions(code) {
  var r = REGIONS[REGION_OF[code]];
  var sameRegion = r.prefs.filter(function (c) { return c !== code; });
  var others = ALL_CODES.filter(function (c) { return c !== code; });
  var ex = {}; ex[code] = 1;

  // 位置タップは地方の県が3つ以下なら となりの地方も出す（まぎれを確保）
  var posCodes = r.prefs.slice();
  if (posCodes.length < 4) {
    var ri = REGION_OF[code];
    var next = REGIONS[ri + 1] || REGIONS[ri - 1];
    if (next) posCodes = posCodes.concat(next.prefs);
  }

  var silChoices = shuffle([code].concat(pickDistract(sameRegion, others, 3, ex)));
  var yomiChoices = shuffle([code].concat(pickDistract(sameRegion, others, 3, ex)));
  var capChoices = shuffle([code].concat(pickDistract(sameRegion, others, 3, ex)));

  // 名物: ほかの県のカードから3つ（名前かぶりは除外）
  var meiAnswer = CARDS[code].mei[Math.floor(Math.random() * CARDS[code].mei.length)];
  var meiPool = [];
  for (var c in CARDS) {
    if (Number(c) === code) continue;
    CARDS[c].mei.forEach(function (m) { meiPool.push(m); });
  }
  var exMei = {}; exMei[String(meiAnswer)] = 1;
  var meiChoices = shuffle([meiAnswer].concat(pickDistract(meiPool, [], 3, exMei)));

  // 5問目は「名物 / 有名な場所 / 行事」から日がわりで1つ（ずかんの内容と連動）。
  // ★問題数は5問のまま。合格4問・金5問の記録の意味を変えないため（CLAUDE.md §3）。
  var last = { t: 'mei', answer: meiAnswer, choices: meiChoices };
  var extra = shuffle(['mei', 'spot', 'fes'])[0];
  if (extra === 'spot') last = makeZQ(code, 'spot');
  else if (extra === 'fes') last = makeZQ(code, 'fes');

  var qs = [
    { t: 'pos', posCodes: posCodes },
    { t: 'sil', choices: silChoices },
    { t: 'yomi', choices: yomiChoices },
    { t: 'cap', choices: capChoices },
    last
  ];
  qs.forEach(function (q) { q.code = code; });
  return qs;
}
// ずかん連動の問題を作る。
//   spot = 「○○県の 有名な場所は どれ？」 / fes = 「○○県の おまつりは どれ？」
//   （むずかしい版 hspot/hfes は 逆に「この場所・おまつりは どの県？」）
// 選択肢の まちがいは ほかの県の 場所・行事から とる（同じ名前は 出さない）。
function makeZQ(code, t) {
  var key = (t === 'spot' || t === 'hspot') ? 'spots' : 'fes';
  var mine = ZUKAN[code][key];
  var answer = mine[Math.floor(Math.random() * mine.length)];
  var pool = [];
  for (var c in ZUKAN) {
    if (Number(c) === code) continue;
    ZUKAN[c][key].forEach(function (it) { pool.push(it); });
  }
  var ex = {}; ex[String(answer)] = 1;
  return { t: t, item: answer, choices: shuffle([answer].concat(pickDistract(pool, [], 3, ex))) };
}
// マスターテスト用のむずかしい問題（逆方向の問題＋全国地図の位置あて）
// hspot/hfes はずかん連動（2026-07-27追加）: 観光スポット・行事から「どの県？」を当てる
var HARD_TYPES = ['hpos', 'hsil', 'hyomi', 'hcap', 'hmei', 'hspot', 'hfes'];
function makeHardQ(code, t) {
  var r = REGIONS[REGION_OF[code]];
  var sameRegion = r.prefs.filter(function (c) { return c !== code; });
  var others = ALL_CODES.filter(function (c) { return c !== code; });
  var ex = {}; ex[code] = 1;
  var q = { t: t, code: code };
  if (t !== 'hpos') q.choices = shuffle([code].concat(pickDistract(sameRegion, others, 3, ex)));
  if (t === 'hmei') q.item = CARDS[code].mei[Math.floor(Math.random() * CARDS[code].mei.length)];
  if (t === 'hspot') q.item = ZUKAN[code].spots[Math.floor(Math.random() * ZUKAN[code].spots.length)];
  if (t === 'hfes') q.item = ZUKAN[code].fes[Math.floor(Math.random() * ZUKAN[code].fes.length)];
  return q;
}
function buildHardQuestions(ri) {
  var types = shuffle(HARD_TYPES).concat(shuffle(HARD_TYPES));
  var codes = shuffle(REGIONS[ri].prefs).concat(shuffle(REGIONS[ri].prefs));
  var qs = [];
  for (var i = 0; i < 10; i++) qs.push(makeHardQ(codes[i % codes.length], types[i]));
  return qs;

function buildZenkokuQuestions() {

/* --- 🔖 にがて こくふく（2026-07-27ユーザー決定） ---
   save.miss に たまった県だけから 5問。問題タイプは むずかしい版ミックス（HARD_TYPES）で、
   まちがえた県を いろんな角度から 聞く。まちがえた回数が 多い県ほど 出やすい（重みつき抽選）。
   ★きろく（cleared/regionMaster/zenkoku/survival）は 一切さわらない＝れんしゅう扱い。
     ただし 🔖メモは answer() が いつもどおり ふやす/へらすので、正解すると 🔖が へっていく。 */
var NIGATE_Q = 5;
function missTotal() {   // 🔖 の のべ かず（けん数ではなく 回数の合計）
  var n = 0;
  ALL_CODES.forEach(function (c) { n += missCount(c); });

}
// まちがえた回数を 重みにした 抽選（同じ県が 1回の中で かぶらないように 引いたら 取りのぞく）
function pickNigateCodes(n) {
  var pool = missedCodes();
  var picks = [], rest = [];
  while (picks.length < n) {
    if (!rest.length) rest = pool.slice();   // にがて県が n けんより 少ないときは 2周目に入る
    if (!rest.length) break;                 // 0けん（ボタンを出していないので ふつうは 来ない）
    var total = 0, i;
    for (i = 0; i < rest.length; i++) total += missCount(rest[i]);
    var r = Math.random() * total, idx = rest.length - 1;
    for (i = 0; i < rest.length; i++) {
      r -= missCount(rest[i]);
      if (r <= 0) { idx = i; break; }

function choiceGrid(items, labelFn, okFn, revealHTML) {
  var grid = document.createElement('div');
  grid.className = 'choice-grid';
  items.forEach(function (item) {
    var b = document.createElement('button');
    b.className = 'choice-btn';
    var label = labelFn(item);
    if (typeof label === 'string') { b.innerHTML = label; } else { b.appendChild(label); }
    b.addEventListener('click', function () {
      if (quiz.locked) return;
      var ok = okFn(item);
      b.classList.add(ok ? 'good' : 'bad');
      // せいかいをかならず見せる
      var btns = grid.querySelectorAll('.choice-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].disabled = true;
        if (!ok && okFn(items[i])) btns[i].classList.add('good');
      }
      answer(ok, revealHTML);
    });
    grid.appendChild(b);
  });
  return grid;
}
function answer(ok, revealHTML) {
  quiz.locked = true;
  quiz.marks.push(ok);
  if (ok) quiz.score++;
  if (ok) sfxOk(); else sfxNg();
  // 🔖 まちがえた県メモ: まちがえたら たまり、正解したら へる（どのモードでも）
  var qCode = quiz.qs[quiz.idx] ? quiz.qs[quiz.idx].code : 0;
  if (ok) easeMiss(qCode); else addMiss(qCode);
  var fb = $('q-feedback');
  fb.innerHTML = ok
    ? '<span class="fb-ok">⭕ せいかい！</span>'
    : '<span class="fb-ng">❌ おしい！ ' + revealHTML + '</span>';
  // サバイバル: 5れんぞくごとに ほめる
  if (quiz.mode === 'survival' && ok && quiz.score > 0 && quiz.score % 5 === 0) {
    fb.innerHTML += '<div class="fb-ok" style="font-size:16px">⭐ ' + quiz.score + ' れんぞく たっせい！ すごい！</div>';
  }
  var next = document.createElement('button');
  next.className = 'big-btn blue';
  if (quiz.mode === 'survival') {
    if (ok) quiz.qs.push(randomSurvivalQ());  // 正解したら つぎの問題を追加（エンドレス）
    next.innerHTML = ok ? 'つぎへ ▶' : 'けっかを 見（み）る 🔥';
    next.addEventListener('click', function () {
      if (ok) { quiz.idx++; renderQuestion(); }
      else showSurvivalResult();
    });
  } else {
    next.innerHTML = (quiz.idx + 1 < quiz.qs.length) ? 'つぎへ ▶' : 'けっかを 見（み）る 🎉';
    next.addEventListener('click', function () {
      quiz.idx++;
      if (quiz.idx < quiz.qs.length) renderQuestion();
      else showResult();
    });
  }
  fb.appendChild(next);
}

/* =============== タイムアタック =============== */
// 数値はぜんぶ叩き台（実機調整前提）: おてつき+3秒 / 金=1県3秒 / 銀=1県5秒 / 完走で銅
var ta = null;
var taTimerId = null;
var TA_PENALTY = 3000;
var TA_GOLD_PER = 3000, TA_SILVER_PER = 5000;
// ri は地方index または 'all'（全国47県タイムアタック）
function taPrefs(ri) { return ri === 'all' ? ALL_CODES.slice() : REGIONS[ri].prefs; }
function taKey(ri) { return ri === 'all' ? 'all' : REGIONS[ri].id; }
function fmtSec(ms) { return (ms / 1000).toFixed(1) + ' びょう'; }
function taMedal(ri, ms) {
  var n = taPrefs(ri).length;
  if (ms <= n * TA_GOLD_PER) return ['🥇', '金メダル'];
  if (ms <= n * TA_SILVER_PER) return ['🥈', '銀メダル'];
  return ['🥉', '銅メダル'];
}
function stopTATimer() {
  if (taTimerId) { clearInterval(taTimerId); taTimerId = null; }
}
function startTA(ri) {
  var prefs = taPrefs(ri);
  ta = { ri: ri, order: shuffle(prefs), idx: 0, penalty: 0, start: 0, done: false };
  var el = $('view-ta');
  el.innerHTML = '';
  var panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = '<div id="ta-timer">0.0</div><div id="ta-prompt" class="q-prompt"></div>';
  panel.appendChild(wrapMap(ri === 'all'
    ? makeMap({ boundary: true, onTap: tapTA })
    : makeMap({ view: prefs, active: prefs, others: 'dim', onTap: tapTA })));
  var note = document.createElement('div');
  note.className = 'progress-line';
  note.innerHTML = 'おてつきは ＋3びょう。さいごまで がんばろう！';
  panel.appendChild(note);
  el.appendChild(panel);
  show('view-ta', ri === 'all' ? '⏱ 全国（ぜんこく）タイムアタック' : '⏱ タイムアタック');
  updateTAPrompt();
  ta.start = performance.now();
  stopTATimer();
  taTimerId = setInterval(function () {
    if (!ta || ta.done) return;
    $('ta-timer').textContent = ((performance.now() - ta.start + ta.penalty) / 1000).toFixed(1);
  }, 100);
}
function updateTAPrompt() {
  $('ta-prompt').innerHTML = 'つぎは… ' + prefRuby(ta.order[ta.idx]) + '！（' + (ta.idx + 1) + '/' + ta.order.length + '）';
}
function tapTA(code, g) {
  if (!ta || ta.done) return;
  if (code === ta.order[ta.idx]) {
    markGood(g);
    setTimeout(function () { unmark(g); }, 350);
    easeMiss(code);   // 🔖 さがせたら メモを へらす
    ta.idx++;
    if (ta.idx >= ta.order.length) finishTA();
    else updateTAPrompt();
  } else {
    ta.penalty += TA_PENALTY;
    addMiss(ta.order[ta.idx]);  // 🔖 さがせなかった県を メモ（押した県ではなく お題の県）
    markWrong(g);
    setTimeout(function () { unmark(g); }, 350);
    var t = $('ta-timer');
    t.classList.add('pen');
    setTimeout(function () { t.classList.remove('pen'); }, 350);
  }
}
function finishTA() {
  ta.done = true;
  stopTATimer();
  var ms = Math.round(performance.now() - ta.start + ta.penalty);
  var key = taKey(ta.ri);
  // 0ミリ秒も正当な記録として扱う（|| 0 だと「記録なし」と区別できない）
  var prev = (key in save.taBest) ? save.taBest[key] : null;
  var isNew = prev === null || ms < prev;
  if (isNew) {
    save.taBest[key] = ms;  // はやい記録だけ上書き
    persist();
  }
  var medal = taMedal(ta.ri, ms);
  var el = $('view-ta');
  el.innerHTML = '';
  var panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML =
    '<div class="res-msg">🏁 ゴール！</div>' +
    '<div class="ta-result">' + medal[0] + '</div>' +
    '<div class="res-msg">' + fmtSec(ms) + '　' + medal[1] + '！</div>' +
    (isNew
      ? '<div class="res-msg" style="color:#f57f17">✨ しんきろく！</div>'
      : '<div class="progress-line">ベスト: ' + fmtSec(prev) + ' ' + taMedal(ta.ri, prev)[0] + ' には とどかなかった…もういちど！</div>');
  // 端末内ランキング（名前つき。教室の1台でつかえば クラスのランキングになる）
  var rankArea = document.createElement('div');
  panel.appendChild(rankArea);
  renderTARank(rankArea, key, ms);
  var row = document.createElement('div');
  row.className = 'btn-row';
  var re = document.createElement('button');
  re.className = 'big-btn';
  re.innerHTML = '⏱ もういちど はしる！';
  re.addEventListener('click', function () { startTA(ta.ri); });
  row.appendChild(re);
  var back = document.createElement('button');
  back.className = 'big-btn blue';
  back.innerHTML = ta.ri === 'all' ? '🏠 ホームへ もどる' : '🗾 ちほうマップへ もどる';
  back.addEventListener('click', function () {
    if (ta.ri === 'all') renderHome(); else openRegion(ta.ri);
  });
  row.appendChild(back);
  panel.appendChild(row);
  el.appendChild(panel);
  if (isNew) confettiBurst();
}

/* =============== タイムアタックの端末内ランキング =============== */
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
// ms を渡すと「5位以内なら名前とうろくフォーム」も出す（とうろく後は ms=null で再描画）
function renderTARank(area, key, ms) {
  var rank = save.taRank[key] || [];
  var qualifies = typeof ms === 'number' && (rank.length < 5 || ms < rank[rank.length - 1].ms);
  area.innerHTML = '';
  if (qualifies) {
    var lb = document.createElement('div');
    lb.className = 'tk-label';
    lb.style.textAlign = 'center';
    lb.innerHTML = '🏆 ランキングに とうじょう！ なまえを いれてね';
    area.appendChild(lb);
    var input = document.createElement('input');
    input.className = 'name-input';
    input.maxLength = 8;
    input.placeholder = 'なまえ（8もじまで）';
    area.appendChild(input);
    var reg = document.createElement('button');
    reg.className = 'big-btn blue';
    reg.style.maxWidth = '340px';
    reg.style.margin = '10px auto 0';
    reg.innerHTML = '✍ とうろくする';
    reg.addEventListener('click', function () {
      var name = (input.value || 'ななしさん').slice(0, 8);
      rank.push({ n: name, ms: ms });
      rank.sort(function (a, b) { return a.ms - b.ms; });
      save.taRank[key] = rank.slice(0, 5);
      persist();
      renderTARank(area, key, null);
    });
    area.appendChild(reg);
  }
  var list = save.taRank[key] || [];
  if (list.length) {
    var h = document.createElement('div');
    h.className = 'tk-label';
    h.style.textAlign = 'center';
    h.innerHTML = '🏆 ランキング（この iPadの きろく）';
    area.appendChild(h);
    var medals = ['🥇', '🥈', '🥉', '4い', '5い'];
    list.forEach(function (r, i) {
      var row = document.createElement('div');
      row.className = 'rank-row';
      row.innerHTML = '<span>' + medals[i] + ' ' + escapeHTML(r.n) + '</span><span>' + fmtSec(r.ms) + '</span>';
      area.appendChild(row);
    });
  }
}

/* =============== ふたりでたいけつ（上下2分割・むかいあって同時タップ早押し） =============== */
// 1台のiPadを机に置き、ふたりが向かい合う。上half(P2)は180度回転。
// 同じ「〇〇県をさがせ！」に先に正しくタップした方が1ポイント。おてつきは1.5秒おやすみ。
var vs = null;
var VS_WIN = 5;         // さきに5ポイントで かち（叩き台）
var VS_FREEZE = 1500;   // おてつきペナルティms（叩き台）
function openVSSetup() {
  vs = null;
  var el = $('view-vs');
  el.innerHTML = '';
  var panel = document.createElement('div');

    'おてつきは 1.5びょう おやすみ。さきに ' + VS_WIN + 'ポイントで かち！</div>' +
    '<div class="tk-label" style="text-align:center">たたかう ばしょを えらんでね</div>';

  allBtn.innerHTML = '<span class="rb-dot" style="background:#37474f"></span>' +

  allBtn.addEventListener('click', function () { startVS('all'); });

      '<span class="rb-name">' + ruby(r.name, r.kana) + '</span><span class="rb-state">▶ たたかう</span>';
    b.addEventListener('click', function () { startVS(i); });
    list.appendChild(b);
  });
  panel.appendChild(list);
  el.appendChild(panel);
  show('view-vs', '⚔️ ふたりで たいけつ');
}
function vsBuildHalf(player, prefs, scope) {
  var half = document.createElement('div');
  half.className = 'vs-half ' + (player === 0 ? 'p1' : 'p2');
  var head = document.createElement('div');
  head.className = 'vs-head';
  head.innerHTML = '<span class="vs-name">' + (player === 0 ? '🔵 あお' : '🔴 あか') + '</span>' +
    '<span class="vs-score"></span>';
  half.appendChild(head);
  var prompt = document.createElement('div');
  prompt.className = 'vs-prompt';
  half.appendChild(prompt);
  var msg = document.createElement('div');
  msg.className = 'vs-msg';
  half.appendChild(msg);
  var map = makeMap({
    view: scope === 'all' ? null : prefs, active: prefs, others: 'dim',
    boundary: scope === 'all',
    onTap: function (code, g) { vsTap(player, code, g); }
  });
  half.appendChild(wrapMap(map));
  return { root: half, head: head, prompt: prompt, msg: msg, svg: map };
}
function startVS(scope) {
  var prefs = scope === 'all' ? ALL_CODES.slice() : REGIONS[scope].prefs.slice();
  vs = { scope: scope, prefs: prefs, score: [0, 0], target: 0, locked: true, frozenUntil: [0, 0], halves: [] };
  var el = $('view-vs');
  el.innerHTML = '';
  var wrap = document.createElement('div');
  wrap.className = 'vs-wrap';
  var h2 = vsBuildHalf(1, prefs, scope);
  var h1 = vsBuildHalf(0, prefs, scope);
  vs.halves = [h1, h2];
  var mid = document.createElement('div');
  mid.className = 'vs-mid';
  mid.id = 'vs-mid';
  wrap.appendChild(h2.root);   // 上＝あか（回転）
  wrap.appendChild(mid);
  wrap.appendChild(h1.root);   // 下＝あお
  el.appendChild(wrap);
  show('view-vs', '⚔️ ふたりで たいけつ');
  updateVSScores();
  nextVSRound();
}
function updateVSScores() {
  for (var p = 0; p < 2; p++) {
    var s = '';
    for (var i = 0; i < VS_WIN; i++) s += i < vs.score[p] ? '●' : '○';
    vs.halves[p].head.querySelector('.vs-score').textContent = s;
  }
  $('vs-mid').textContent = '🔵 ' + vs.score[0] + ' ― ' + vs.score[1] + ' 🔴　さきに ' + VS_WIN + 'ポイントで かち！';
}
function resetVSMaps() {
  vs.halves.forEach(function (h) {
    var marked = h.svg.querySelectorAll('.p-good, .p-bad');
    for (var i = 0; i < marked.length; i++) unmark(marked[i]);
    clearAnswer(h.svg);  // 前ラウンドの正解の枠取りも消す
    h.root.classList.remove('vs-frozen');
    h.msg.textContent = '';
  });
}
function nextVSRound() {
  if (!vs || curView !== 'view-vs') return;
  resetVSMaps();
  var next = vs.target;
  while (next === vs.target) next = vs.prefs[Math.floor(Math.random() * vs.prefs.length)];
  vs.target = next;
  vs.frozenUntil = [0, 0];
  vs.locked = false;
  vs.halves.forEach(function (h) {
    h.prompt.innerHTML = '⚔️ ' + prefRuby(vs.target) + ' を さがせ！';
  });
}
function vsTap(player, code, g) {
  if (!vs || vs.locked) return;
  var now = performance.now();
  if (vs.frozenUntil[player] > now) return;
  var me = vs.halves[player], foe = vs.halves[1 - player];
  if (code === vs.target) {
    vs.locked = true;
    vs.score[player]++;
    sfxOk();
    markGood(g);
    markAnswer(foe.svg, code);  // 相手の地図でも正解の県を枠取りして知らせる
    me.msg.textContent = '⭕ はやい！ ポイント ゲット！';
    foe.msg.textContent = 'ここだったよ！';
    updateVSScores();
    if (vs.score[player] >= VS_WIN) setTimeout(showVSResult, 1000);
    else setTimeout(nextVSRound, 1500);
  } else {
    vs.frozenUntil[player] = now + VS_FREEZE;
    sfxNg();
    markWrong(g);
    me.root.classList.add('vs-frozen');
    me.msg.textContent = '❌ おてつき！ ちょっと おやすみ…';
    (function (h, el2) {
      setTimeout(function () {
        unmark(el2);
        if (vs && !vs.locked) { h.root.classList.remove('vs-frozen'); h.msg.textContent = ''; }
      }, VS_FREEZE);
    })(me, g);
  }
}
function showVSResult() {
  if (!vs || curView !== 'view-vs') return;
  var winner = vs.score[0] >= VS_WIN ? 0 : 1;
  vs.locked = true;
  vs.halves.forEach(function (h, p) {
    h.prompt.innerHTML = p === winner ? '🏆 かち！ おめでとう！' : '💪 おしい！ つぎは かてる！';
    h.msg.textContent = '';
  });
  confettiBurst();
  var mid = $('vs-mid');
  mid.innerHTML = '';
  var row = document.createElement('div');
  row.className = 'btn-row';
  var re = document.createElement('button');
  re.className = 'big-btn';
  re.innerHTML = '⚔️ もういちど！';
  re.addEventListener('click', function () { startVS(vs.scope); });
  row.appendChild(re);
  var back = document.createElement('button');
  back.className = 'big-btn blue';
  back.innerHTML = '🏠 ホームへ';
  back.addEventListener('click', function () { renderHome(); });
  row.appendChild(back);
  mid.appendChild(row);
}

  var clr = document.createElement('button');
  clr.className = 'zk-clear';
  clr.innerHTML = '✕';
  clr.setAttribute('title', 'けす');
  sbox.appendChild(clr);
  panel.appendChild(sbox);

  // 🔖 まちがえた県だけを 出す ボタン（復習の入口）
  var missBtn = document.createElement('button');
  missBtn.className = 'zk-filter';
  panel.appendChild(missBtn);
  // 🔖 そのまま クイズに いける ボタン（0けんのときは refresh() で かくれる）
  var nigateBtn = document.createElement('button');
  nigateBtn.className = 'zk-nigate';
  nigateBtn.addEventListener('click', function () { startNigate(); });
  panel.appendChild(nigateBtn);

  var scroll = document.createElement('div');
  scroll.className = 'side-scroll';
  var results = document.createElement('div');
  results.className = 'zk-results';
  scroll.appendChild(results);
  panel.appendChild(scroll);

  // 入力のたびに 結果だけ 書きかえる（パネルごと作り直すと 文字を打つ場所が とじてしまうため）
  function refresh() {
    zukanQuery = inp.value;
    var miss = missedCodes();
    missBtn.style.display = miss.length ? '' : 'none';
    nigateBtn.style.display = miss.length ? '' : 'none';
    nigateBtn.innerHTML = '🔖 にがて こくふく（' + NIGATE_Q + 'もん）に ちょうせん！';
    missBtn.className = 'zk-filter' + (zukanOnlyMiss ? ' on' : '');
    missBtn.innerHTML = (zukanOnlyMiss ? '🔖 まちがえた けんだけ 出（だ）しています（' + miss.length + 'けん）　タップで もどす'
      : '🔖 まちがえた けんだけ 見（み）る（' + miss.length + 'けん）');
    renderZukanList(results, inp.value);
  }
  inp.addEventListener('input', refresh);
  clr.addEventListener('click', function () { inp.value = ''; refresh(); inp.focus(); });
  missBtn.addEventListener('click', function () { zukanOnlyMiss = !zukanOnlyMiss; refresh(); });
  inp.value = zukanQuery;  // 県のページから もどってきたら さっきの けんさくを そのまま出す
  refresh();

  split.appendChild(panel);
  el.appendChild(split);
  show('view-zukan', '📖 都道府県（とどうふけん）ずかん');
}
// ずかんの一覧を（けんさく語で しぼって）書き出す。q が空なら 地方ごとに 全県。
function renderZukanList(box, q) {
  box.innerHTML = '';
  var query = kanaNorm(q || '');
  // 🔖 しぼりこみ中: まちがえた県だけを まとめて出す（復習しやすいように 地方でわけない）
  if (zukanOnlyMiss) {
    var miss = missedCodes().filter(function (c) { return !query || zukanIndex(c).all.indexOf(query) !== -1; });
    var mh = document.createElement('div');
    mh.className = 'zk-region-h';
    mh.innerHTML = '🔖 まちがえた ' + ruby('県', 'けん') + ': ' + miss.length + 'けん';
    box.appendChild(mh);
    if (!miss.length) {
      var mn = document.createElement('div');
      mn.className = 'zk-none';
      mn.innerHTML = 'まちがえた ' + ruby('県', 'けん') + 'は ないよ。すごい！';
      box.appendChild(mn);
      return;
    }
    box.appendChild(zukanGrid(miss, query));
    return;
  }
  if (!query) {
    REGIONS.forEach(function (r) {
      var h = document.createElement('div');
      h.className = 'zk-region-h';
      h.innerHTML = '<span class="rb-dot" style="background:' + r.color + '"></span>' + ruby(r.name, r.kana);
      box.appendChild(h);
      box.appendChild(zukanGrid(r.prefs, ''));
    });
    return;
  }
  var hits = ALL_CODES.filter(function (c) { return zukanIndex(c).all.indexOf(query) !== -1; });
  var head = document.createElement('div');
  head.className = 'zk-region-h';
  head.innerHTML = hits.length
    ? '🔍 「' + escapeHTML(q) + '」の けっか: ' + hits.length + 'けん'
    : '🔍 「' + escapeHTML(q) + '」は 見（み）つからなかったよ';
  box.appendChild(head);
  if (!hits.length) {
    var none = document.createElement('div');
    none.className = 'zk-none';
    none.innerHTML = 'ひらがなでも さがせるよ。<br>けんめい・よみ・めいさんひん・ゆうめいな ばしょ・おまつり で さがせます。';
    box.appendChild(none);
    return;
  }
  box.appendChild(zukanGrid(hits, query));
}
function zukanGrid(codes, query) {
  var grid = document.createElement('div');
  grid.className = 'zk-grid';
  codes.forEach(function (c) {
    // 2026-07-27ユーザー決定: ずかんは全県いつでも読める（調べる事典）。
    // クリア済みは ✨＋金わく で「あつめた」達成感を残す。
    var s = document.createElement('div');
    s.className = 'zk-slot' + (isGold(c) ? ' gold' : '') + (isMissed(c) ? ' miss' : '');
    var why = query ? matchReason(c, query) : '';
    s.innerHTML = (isMissed(c) ? '<span class="zk-miss">🔖' + (missCount(c) > 1 ? missCount(c) : '') + '</span>' : '') +
      '<span class="ze">' + CARDS[c].e + '</span>' +
      '<span class="zn">' + prefRuby(c) + (isCleared(c) ? ' ✨' : '') + '</span>' +
      (why ? '<span class="zk-hit">' + why + '</span>' : '');
    s.addEventListener('click', function () { openZPref(c); });
    grid.appendChild(s);
  });
  return grid;
}
// カタカナ→ひらがな、空白を消す。「サクランボ」でも「さくらんぼ」でも 見つかるようにする。
function kanaNorm(s) {
  return String(s)
    .replace(/[ァ-ヶ]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 0x60); })
    .replace(/[\s　]/g, '')
    .toLowerCase();
}
function escapeHTML(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
// 県ごとの けんさく用テキストを 1度だけ 作って とっておく（毎回 作ると おそいため）
var ZK_INDEX = {};
function zukanIndex(code) {
  if (ZK_INDEX[code]) return ZK_INDEX[code];
  var p = PREFS[code], card = CARDS[code], z = ZUKAN[code];
  function join(list, i) { return list.map(function (it) { return it[i]; }).join('|'); }
  var f = {
    name: p.n + '|' + p.k + '|' + p.n.replace(/[都道府県]$/, '') + '|' + p.k.replace(/(と|どう|ふ|けん)$/, ''),
    cap: p.cap + '|' + p.capK,
    mei: join(card.mei, 0),
    spot: join(z.spots, 0),
    fes: join(z.fes, 0)
  };
  // 説明文も さがせるように 全部つなげる（「おんせん」「せかいいさん」などで ひける）
  var all = [f.name, f.cap, f.mei, f.spot, f.fes,
    join(z.spots, 1), join(z.fes, 1), z.pos, z.sum, card.mame].join('|');
  ZK_INDEX[code] = {
    name: kanaNorm(f.name), cap: kanaNorm(f.cap), mei: kanaNorm(f.mei),
    spot: kanaNorm(f.spot), fes: kanaNorm(f.fes), all: kanaNorm(all)
  };
  return ZK_INDEX[code];
}
// なぜ 見つかったかを 小さく 見せる（けん名で 当たったときは 出さない）
function matchReason(code, query) {
  var ix = zukanIndex(code), z = ZUKAN[code], card = CARDS[code];
  if (ix.name.indexOf(query) !== -1) return '';
  if (ix.cap.indexOf(query) !== -1) return '🏢 ' + PREFS[code].cap;
  var hit = findHit(card.mei, query, 0);
  if (hit) return '🍚 ' + hit;
  hit = findHit(z.spots, query, 0);
  if (hit) return '🗺 ' + hit;
  hit = findHit(z.fes, query, 0);
  if (hit) return '🎊 ' + hit;
  hit = findHit(z.spots, query, 1) || findHit(z.fes, query, 1);
  if (hit) return '🗺 ' + hit;
  return '💡 せつめいの 中（なか）';
}
function findHit(list, query, i) {
  for (var n = 0; n < list.length; n++) {
    if (kanaNorm(list[n][i]).indexOf(query) !== -1) return list[n][0];
  }
  return '';
}
/* --- ずかん: 県ごとの くわしいページ --- */
// 場所／県庁所在地／名産品／有名な場所／行事／一言 を 1ページにまとめる。
// 名産品は CARDS[code].mei、県庁所在地は PREFS[code].cap を そのまま使う（データは1か所）。
function openZPref(code) {
  curPref = code;
  var z = ZUKAN[code], card = CARDS[code];
  var el = $('view-zpref');
  el.innerHTML = '';
  var split = document.createElement('div');
  split.className = 'split';

  // 左: どこにあるか（日本地図の中で光らせる）＋県の形
  var left = document.createElement('div');
  left.className = 'panel main-col';
  var lb = document.createElement('div');
  lb.className = 'tk-label';
  lb.innerHTML = '📍 ' + ruby('場所', 'ばしょ') + '（ひかっている ところ）';
  left.appendChild(lb);
  left.appendChild(wrapMap(makeMap({
    boundary: true, mark: function (c) { return c === code; },
    fill: function (c) { return c === code ? '#fff176' : null; }
  })));
  left.appendChild(document.createElement('div')).className = 'zp-pos';
  left.lastChild.innerHTML = z.pos;
  split.appendChild(left);

  // 右: くわしい情報
  var right = document.createElement('div');
  right.className = 'panel side-col';
  var name = document.createElement('div');
  name.className = 'tk-name';
  name.innerHTML = card.e + ' ' + prefRuby(code) + (isGold(code) ? ' ✨' : (isCleared(code) ? ' 🚩' : ''));
  right.appendChild(name);

  var scroll = document.createElement('div');
  scroll.className = 'side-scroll';

  // 🔖 まちがえた県には 復習の合図を いちばん上に（責めない言い方にする）
  if (isMissed(code)) {
    var mb = document.createElement('div');
    mb.className = 'zp-miss';
    mb.innerHTML = '<div class="zp-missh">🔖 まえに まちがえた ところ' +
      (missCount(code) > 1 ? '（' + missCount(code) + 'かい）' : '') + '</div>' +
      '<div class="zp-d">ここを 読（よ）んで、もういちど クイズで ためしてみよう！</div>';
    var ok = document.createElement('button');
    ok.className = 'zp-missbtn';
    ok.innerHTML = '✅ おぼえた！ しるしを けす';
    ok.addEventListener('click', function () { clearMiss(code); openZPref(code); });
    mb.appendChild(ok);
    scroll.appendChild(mb);
  }

  // 一言でまとめると（いちばん上に大きく＝ここだけ読めば分かる）
  scroll.appendChild(zSection('🌟', 'ひとことで いうと', '<div class="zp-sum">' + z.sum + '</div>'));

  // 県庁所在地
  scroll.appendChild(zSection('🏢', ruby('県庁所在地', 'けんちょうしょざいち'),
    '<div class="zp-cap">' + ruby(PREFS[code].cap, PREFS[code].capK) + '</div>'));

  // 名産品（絵文字つき・既存カードのデータを再利用）
  var meiHTML = '<div class="mei-row">';
  card.mei.forEach(function (m) {
    meiHTML += '<div class="mei-item"><span class="me">' + m[1] + '</span>' + m[0] + '</div>';
  });
  meiHTML += '</div>';
  scroll.appendChild(zSection('🍚', ruby('名産品', 'めいさんひん'), meiHTML));

  // 有名な場所（観光スポット）＋どんな場所か
  scroll.appendChild(zSection('🗺', ruby('有名', 'ゆうめい') + 'な' + ruby('場所', 'ばしょ'), zList(z.spots)));

  // その土地の行事
  scroll.appendChild(zSection('🎊', ruby('行事', 'ぎょうじ') + '・おまつり', zList(z.fes)));

  // 豆知識（既存カードの mame も活かす）
  scroll.appendChild(zSection('💡', 'まめちしき', '<div class="zp-d">' + card.mame + '</div>'));

  right.appendChild(scroll);
  var go = document.createElement('button');
  go.className = 'big-btn';
  // ずかんは まだ ぼうけんで 行っていない県も 読めるので、ここからのクイズは
  // れんしゅう（きろくは のこらない）にして、ぼうけんの すすみ方を こわさない。
  go.innerHTML = '🎯 この' + ruby('県', 'けん') + 'の クイズで ためす' +
    '<br><span class="btn-sub">れんしゅう（クリアきろくは のこらない）</span>';
  go.addEventListener('click', function () { freeMode = true; quizFrom = 'zpref'; startQuiz(code); });
  right.appendChild(go);
  split.appendChild(right);
  el.appendChild(split);
  show('view-zpref', '📖 ' + prefRuby(code));
}
function zSection(icon, title, innerHTML) {
  var d = document.createElement('div');
  d.className = 'zp-sec';
  d.innerHTML = '<div class="zp-h">' + icon + ' ' + title + '</div>' + innerHTML;
  return d;
}
// [[名前, せつめい], ...] を「名前＋どんな場所か」のリストにする
function zList(items) {
  var h = '';
  items.forEach(function (it) {
    h += '<div class="zp-item"><div class="zp-n">' + it[0] + '</div><div class="zp-d">' + it[1] + '</div></div>';
  });
  return h;
}

/* =============== コンフェッティ（自前・軽量） =============== */
function confettiBurst() {
  sfxWin();  // お祝い演出はすべてここを通るので、ファンファーレも一緒に鳴らす
  var colors = ['#f44336', '#ff9800', '#ffee58', '#66bb6a', '#42a5f5', '#ab47bc'];
  for (var i = 0; i < 60; i++) {
    var d = document.createElement('div');
    d.className = 'confetti';
    d.style.left = (Math.random() * 100) + 'vw';
    d.style.background = colors[i % colors.length];
    d.style.animationDelay = (Math.random() * 0.7) + 's';
    document.body.appendChild(d);
    setTimeout((function (el2) { return function () { if (el2.parentNode) el2.parentNode.removeChild(el2); }; })(d), 3200);
  }
}

/* =============== 効果音（Web Audio・音源ファイルなし＝完全オフライン） =============== */
// タップ（ユーザー操作）の中でしか鳴らさないので iOS Safari の自動再生制限にかからない。
var _actx = null, muted = false;
try { muted = localStorage.getItem('todofuken_muted') === '1'; } catch (e) {}
function actx() {
  if (!_actx) {
    try { _actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { _actx = null; }
  }
  if (_actx && _actx.state === 'suspended') { try { _actx.resume(); } catch (e) {} }
  return _actx;
}
function beep(freq, start, dur, type, vol) {
  var ac = actx();
  if (!ac || muted) return;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  var t = ac.currentTime + start;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol || 0.15, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
function sfxOk()  { beep(660, 0, 0.12, 'sine', 0.16); beep(990, 0.08, 0.16, 'sine', 0.16); }
function sfxNg()  { beep(210, 0, 0.18, 'square', 0.10); }
function sfxWin() { [523, 659, 784, 1047].forEach(function (f, i) { beep(f, i * 0.09, 0.2, 'triangle', 0.15); }); }
function updateMuteBtn() { var b = $('btn-sound'); if (b) b.textContent = muted ? '🔇' : '🔊'; }
function toggleMute() {
  muted = !muted;
  try { localStorage.setItem('todofuken_muted', muted ? '1' : '0'); } catch (e) {}
  updateMuteBtn();
  if (!muted) sfxOk();  // ONにしたら「鳴るよ」の合図
}

/* =============== 起動 =============== */
// URLハッシュで画面を直接開ける（動作確認用。例: #r0=地方 / #t2=たんけん / #q2=クイズ / #m0=マスター / #ta0=タイムアタック / #zukan）
measureBoxes();
updateMuteBtn();
var bootHash = location.hash;
if (/^#r\d+$/.test(bootHash)) openRegion(Number(bootHash.slice(2)));
else if (/^#t\d+$/.test(bootHash)) openTanken(Number(bootHash.slice(2)));
else if (/^#q\d+$/.test(bootHash)) startQuiz(Number(bootHash.slice(2)));
else if (/^#m\d+$/.test(bootHash)) startMaster(Number(bootHash.slice(2)));
else if (bootHash === '#taall') startTA('all');
else if (/^#ta\d+$/.test(bootHash)) startTA(Number(bootHash.slice(3)));
else if (bootHash === '#zen') startZenkoku();
else if (bootHash === '#sv') startSurvival();
else if (bootHash === '#vs') openVSSetup();
else if (/^#vsg(\d+|all)$/.test(bootHash)) startVS(bootHash.slice(4) === 'all' ? 'all' : Number(bootHash.slice(4)));
else if (bootHash === '#free') openFreePick();
else if (bootHash === '#zukan') openZukan();
else renderHome();

// PWA: Service Worker 登録（オフライン起動用）
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
