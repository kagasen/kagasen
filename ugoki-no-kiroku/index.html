<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#38BDF8">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>うごきのきろく</title>
<style>
:root{
  --sky:#38BDF8; --sky-dark:#0EA5E9; --sky-deep:#0284C7;
  --orange:#FB923C; --orange-dark:#F97316;
  --green:#4ADE80; --green-dark:#22C55E;
  --pink:#F472B6; --purple:#A78BFA; --yellow:#FACC15;
  --bg:#F0F9FF; --card:#FFFFFF; --ink:#0F3350; --ink-soft:#5B7A94;
  --line:#DBEEFB; --shadow:0 4px 14px rgba(14,116,180,.12);
  --radius:20px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','BIZ UDPGothic','Yu Gothic UI','Yu Gothic',sans-serif;
  background:
    radial-gradient(circle at 100% 0%, #E7F6FF 0%, rgba(231,246,255,0) 42%),
    radial-gradient(circle at 0% 100%, #FFF6E2 0%, rgba(255,246,226,0) 40%),
    radial-gradient(#D8EDFA 1.6px, transparent 1.7px) 0 0/24px 24px,
    var(--bg);
  color:var(--ink); font-size:16px; line-height:1.55;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  user-select:none; -webkit-user-select:none;
}
input,select,textarea{user-select:text; -webkit-user-select:text;}
#app{max-width:640px;margin:0 auto;padding:12px 14px 20px;}

/* ---------- header ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:6px 2px 10px;}
.topbar .logo{font-size:22px;font-weight:800;color:var(--sky-deep);letter-spacing:.02em;}
.topbar .logo span{color:var(--orange-dark);}
.back-btn{
  border:none;background:var(--card);box-shadow:var(--shadow);color:var(--sky-deep);
  border-radius:14px;min-width:48px;height:44px;font-size:17px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 14px;
}
.page-title{font-size:21px;font-weight:800;margin:4px 0 13px;display:flex;align-items:center;gap:9px;}
.page-title .em{font-size:28px;filter:drop-shadow(0 2px 3px rgba(14,116,180,.25));}
.page-title:after{content:'';flex:1;height:5px;border-radius:999px;
  background:linear-gradient(90deg,#BAE6FD,rgba(186,230,253,0));}
.topbar .logo{text-shadow:0 2px 0 rgba(255,255,255,.9);}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
.card h3{margin:0 0 10px;font-size:16.5px;color:var(--sky-deep);display:flex;align-items:center;gap:7px;
  padding-left:10px;position:relative;}
.card h3:before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:5px;height:19px;border-radius:999px;background:linear-gradient(180deg,var(--sky),var(--sky-deep));}
.muted{color:var(--ink-soft);font-size:13px;}
.small{font-size:12px;}
.center{text-align:center;}

/* ---------- buttons ---------- */
.btn{
  border:none;border-radius:16px;font-family:inherit;font-weight:800;cursor:pointer;
  min-height:48px;font-size:16px;padding:10px 18px;color:#fff;
  background:linear-gradient(180deg,var(--sky),var(--sky-dark));
  box-shadow:0 4px 0 rgba(2,132,199,.45);transition:transform .06s;
}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(2,132,199,.45);}
.btn.orange{background:linear-gradient(180deg,var(--orange),var(--orange-dark));box-shadow:0 4px 0 rgba(194,90,10,.4);}
.btn.orange:active{box-shadow:0 2px 0 rgba(194,90,10,.4);}
.btn.green{background:linear-gradient(180deg,var(--green),var(--green-dark));box-shadow:0 4px 0 rgba(21,128,61,.4);}
.btn.green:active{box-shadow:0 2px 0 rgba(21,128,61,.4);}
.btn.ghost{background:#EFF8FF;color:var(--sky-deep);box-shadow:inset 0 0 0 2px var(--line);}
.btn.danger{background:linear-gradient(180deg,#F87171,#EF4444);box-shadow:0 4px 0 rgba(153,27,27,.35);}
.btn.wide{width:100%;}
.btn.smallbtn{min-height:40px;font-size:14px;padding:6px 12px;border-radius:12px;}
.btn:disabled{opacity:.45;cursor:default;}

/* ---------- home: そらとおかの ステージ ---------- */
.hero{
  background:linear-gradient(172deg,#A8E1FF 0%,#D7F1FF 38%,#EFFAFF 62%,#FFF6DF 100%);
  border-radius:28px;padding:16px 15px 40px;margin-bottom:16px;
  position:relative;overflow:hidden;border:3px solid #fff;
  box-shadow:0 12px 26px rgba(14,116,180,.20), inset 0 -2px 0 rgba(255,255,255,.6);
}
.hero>*{position:relative;z-index:2;}
.hero .sun{position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;z-index:0;
  background:radial-gradient(circle,#FFF6C9 0%,#FFE9A3 48%,rgba(255,233,163,0) 72%);}
.hero .cloud{position:absolute;z-index:0;background:#fff;border-radius:999px;opacity:.9;}
.hero .cloud:before,.hero .cloud:after{content:'';position:absolute;background:#fff;border-radius:50%;}
.hero .c1{width:64px;height:20px;left:14px;top:20px;animation:drift 9s ease-in-out infinite;}
.hero .c1:before{width:26px;height:26px;left:10px;top:-12px;}
.hero .c1:after{width:20px;height:20px;left:34px;top:-9px;}
.hero .c2{width:48px;height:16px;right:56px;top:56px;opacity:.75;animation:drift 12s ease-in-out infinite reverse;}
.hero .c2:before{width:20px;height:20px;left:8px;top:-10px;}
.hero .c2:after{width:15px;height:15px;left:25px;top:-7px;}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
.hero .hill{position:absolute;left:-6%;right:-6%;bottom:-30px;height:86px;z-index:0;
  background:linear-gradient(180deg,#BDF2CE 0%,#8FE3AF 62%,#6ED396 100%);
  border-radius:50% 50% 0 0/60px 60px 0 0;box-shadow:inset 0 3px 0 rgba(255,255,255,.55);}
.hero .char-wrap{display:flex;align-items:center;gap:12px;}
.hero .char-hold{position:relative;flex:none;}
.hero .char-hold:before{content:'';position:absolute;left:50%;top:52%;width:126px;height:126px;margin:-63px 0 0 -63px;
  border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,255,255,0) 68%);}
.hero .char-svg{position:relative;width:126px;height:126px;display:block;
  filter:drop-shadow(0 8px 10px rgba(14,116,180,.22));animation:bob 2.8s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.hero .char-info{flex:1;min-width:0;}
.hero .char-name{font-size:20px;font-weight:800;text-shadow:0 2px 0 rgba(255,255,255,.7);}
.hero .char-stage{font-size:12px;color:#3D6B8C;margin-bottom:7px;text-shadow:0 1px 0 rgba(255,255,255,.6);}
.lv-chip{
  display:inline-block;color:#fff;font-weight:800;font-size:14px;border-radius:999px;padding:3px 14px;margin-right:6px;
  background:linear-gradient(180deg,#38BDF8,#0284C7);box-shadow:0 3px 0 rgba(2,132,199,.5),inset 0 1px 0 rgba(255,255,255,.6);
}
.xpbar{
  height:20px;background:#E3F2FB;border-radius:999px;overflow:hidden;margin-top:9px;
  box-shadow:inset 0 2px 4px rgba(2,60,100,.16),0 1px 0 rgba(255,255,255,.8);position:relative;
}
.xpbar .fill{
  height:100%;border-radius:999px;position:relative;
  background:linear-gradient(180deg,#7BE8A6,#34D399 55%,#22C55E);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.10),inset 0 2px 0 rgba(255,255,255,.55);
  transition:width .7s cubic-bezier(.22,1.2,.36,1);
}
.xpbar .fill:after{content:'';position:absolute;inset:0;border-radius:999px;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.30) 0 8px,rgba(255,255,255,0) 8px 18px);
  animation:xpflow 1.6s linear infinite;}
@keyframes xpflow{to{background-position:36px 0}}
.xp-label{font-size:12px;color:#3D6B8C;margin-top:5px;display:flex;justify-content:space-between;font-weight:700;}
.streak-chip{
  display:inline-flex;align-items:center;gap:5px;background:linear-gradient(180deg,#FFF6E6,#FFE9C7);color:#B45309;
  border-radius:999px;padding:5px 14px;font-weight:800;font-size:13.5px;margin-top:11px;
  box-shadow:0 2px 0 rgba(180,83,9,.22),inset 0 1px 0 rgba(255,255,255,.8);
}
.kyu-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.kyu-chip{background:rgba(255,255,255,.95);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;color:var(--sky-deep);
  box-shadow:0 2px 5px rgba(14,116,180,.18);}

/* ---------- sport grid ---------- */
.sport-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sport-card{
  border:none;border-radius:22px;padding:14px 10px 11px;cursor:pointer;color:#fff;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  font-family:inherit;transition:transform .1s,box-shadow .1s;min-height:118px;
  position:relative;overflow:hidden;isolation:isolate;
  box-shadow:0 6px 0 rgba(9,45,75,.22),0 10px 18px rgba(14,116,180,.20),inset 0 2px 0 rgba(255,255,255,.35);
}
/* 上のつやと、うっすらした水玉もよう */
.sport-card:before{content:'';position:absolute;z-index:-1;left:-20%;top:-60%;width:140%;height:110%;
  background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.42),rgba(255,255,255,0) 70%);}
.sport-card:after{content:'';position:absolute;z-index:-1;inset:0;opacity:.20;
  background-image:radial-gradient(#fff 1.6px,transparent 1.7px);background-size:15px 15px;}
.sport-card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(9,45,75,.22),0 4px 10px rgba(14,116,180,.18);}
.sport-card .em{font-size:40px;line-height:1.05;filter:drop-shadow(0 3px 4px rgba(0,0,0,.22));}
/* 自前SVGアイコン(てつぼうなど)を絵文字と同じ大きさでそろえる */
.em.ic{display:inline-flex;align-items:center;justify-content:center;}
.em.ic svg{width:1em;height:1em;display:block;}
.tl-item .em.ic svg,.dk-head .em.ic svg{width:1em;height:1em;}
.tl-item .em.ic{width:34px;height:34px;overflow:hidden;}
.tl-item .em.ic img{width:100%;height:100%;display:block;object-fit:contain;}
.dk-head .em.ic{width:42px;height:42px;overflow:hidden;}
.dk-head .em.ic img{width:100%;height:100%;display:block;object-fit:contain;}
.page-title .em svg{width:1.05em;height:1.05em;display:block;}
.dk-yet button svg{width:1.25em;height:1.25em;vertical-align:-0.25em;display:inline-block;}
.sport-card .nm{font-weight:800;font-size:16px;text-shadow:0 1px 2px rgba(0,0,0,.18);}
.sport-card .sub{font-size:11px;opacity:.95;}
/* しんちょく: つかうほどカードが「そだつ」 */
.sport-card .prog{display:flex;align-items:center;gap:6px;width:100%;padding:0 4px;margin-top:1px;}
.sport-card .prog .bar{flex:1;height:8px;border-radius:999px;background:rgba(9,45,75,.28);overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.18);}
.sport-card .prog .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(180deg,#FFF7C2,#FDE047);
  box-shadow:0 0 6px rgba(253,224,71,.7);transition:width .6s;}
.sport-card .prog .num{font-size:11.5px;font-weight:800;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.25);}
.sport-card .kmchip{font-size:11.5px;font-weight:800;background:rgba(255,255,255,.28);border-radius:999px;padding:2px 9px;}
.sc-nawatobi{background:linear-gradient(160deg,#38BDF8,#2563EB);}
.sc-tetsubo{background:linear-gradient(160deg,#FB923C,#EA580C);}
.sc-mat{background:linear-gradient(160deg,#4ADE80,#16A34A);}
.sc-tobibako{background:linear-gradient(160deg,#F472B6,#DB2777);}
.sc-suiei{background:linear-gradient(160deg,#22D3EE,#0891B2);}
.sc-marathon{background:linear-gradient(160deg,#A78BFA,#7C3AED);}
.sc-soccer{background:linear-gradient(160deg,#34D399,#059669);}
.sc-basket{background:linear-gradient(160deg,#F59E0B,#B45309);}
.sc-volley{background:linear-gradient(160deg,#FACC15,#A16207);}
.sc-baseball{background:linear-gradient(160deg,#94A3B8,#475569);}
.sc-dodge{background:linear-gradient(160deg,#F87171,#DC2626);}
.sc-relay{background:linear-gradient(160deg,#2DD4BF,#0D9488);}

/* ---------- skill cards ---------- */
.skill-card{
  background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:12px 14px;margin-bottom:10px;border-left:8px solid var(--line);
}
.skill-grid{display:grid;grid-template-columns:1fr;gap:12px;align-items:start;}
.skill-grid .skill-card{margin-bottom:0;min-width:0;}
.skill-card.done{border-left-color:var(--green-dark);background:linear-gradient(160deg,#F2FFF5,#fff);}
.skill-head{display:flex;align-items:center;gap:8px;}
.skill-name{font-weight:800;font-size:16px;flex:1;}
.skill-stars{color:var(--yellow);font-size:14px;letter-spacing:1px;text-shadow:0 1px 1px rgba(0,0,0,.12);}
.skill-kotsu{font-size:12.5px;color:var(--ink-soft);margin-top:5px;background:#F4FAFF;border-radius:10px;padding:7px 10px;}
.skill-kotsu b{color:var(--sky-deep);}
.skill-body{display:flex;gap:10px;margin-top:8px;align-items:stretch;flex-wrap:wrap;}
.skill-body .skill-kotsu{flex:1 1 150px;margin-top:0;}
.skill-art{flex:none;width:108px;min-height:84px;border:2px solid #E3F3FC;border-radius:14px;display:flex;align-items:center;
  background:linear-gradient(180deg,#F7FCFF 0%,#E9F6FE 62%,#DFF2FC 100%);
  box-shadow:inset 0 2px 4px rgba(14,116,180,.10);overflow:hidden;}
.skill-art svg{width:100%;height:auto;display:block;}
.skill-art.tetsubo-art{aspect-ratio:1/1;min-height:0;background:#fff;}
.skill-art.tetsubo-art img{width:100%;height:100%;display:block;object-fit:contain;}
.skill-art.nawatobi-art{width:100%;aspect-ratio:2/1;min-height:0;background:#fff;}
.skill-art.nawatobi-art img{width:100%;height:100%;display:block;object-fit:contain;}
.skill-art.mat-art{width:100%;aspect-ratio:2/1;min-height:0;background:#fff;}
.skill-art.mat-art img{width:100%;height:100%;display:block;object-fit:contain;}
.skill-art.tobibako-art{width:100%;aspect-ratio:2/1;min-height:0;background:#fff;}
.skill-art.tobibako-art img{width:100%;height:100%;display:block;object-fit:contain;}
.skill-art.soccer-art{width:100%;aspect-ratio:2/1;min-height:0;background:#fff;}
.skill-art.soccer-art img{width:100%;height:100%;display:block;object-fit:contain;}
.skill-art.basket-art{width:100%;aspect-ratio:2/1;min-height:0;background:#fff;}
.skill-art.basket-art img{width:100%;height:100%;display:block;object-fit:contain;}
.skill-art.volley-art{width:100%;aspect-ratio:2/1;min-height:0;background:#fff;}
.skill-art.volley-art img{width:100%;height:100%;display:block;object-fit:contain;}
.skill-art.baseball-art,.skill-art.dodge-art,.skill-art.relay-art{width:100%;aspect-ratio:2/1;min-height:0;background:#fff;}
.skill-art.baseball-art img,.skill-art.dodge-art img,.skill-art.relay-art img{width:100%;height:100%;display:block;object-fit:contain;}
.skill-art.suiei-art{width:100%;aspect-ratio:3/2;min-height:0;background:#E8F8FF;}
.skill-art.suiei-art img{width:100%;height:100%;display:block;object-fit:contain;object-position:center;}
.done-badge{background:var(--green-dark);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;flex:none;}
.best-chip{background:#E8F6FF;color:var(--sky-deep);font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;flex:none;}
.kyu-mini{background:var(--orange);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;flex:none;}
.check-big{
  width:46px;height:46px;border-radius:14px;border:3px dashed #BFE3F7;background:#F4FBFF;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;transition:all .15s;
}
.check-big.on{border:3px solid var(--green-dark);background:var(--green);color:#fff;}

/* count stepper */
.count-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.count-row input[type=number]{
  width:86px;height:48px;border-radius:14px;border:2px solid var(--line);font-size:20px;font-weight:800;
  text-align:center;font-family:inherit;color:var(--ink);background:#FBFEFF;
}
.step-btn{
  width:48px;height:48px;border-radius:14px;border:none;background:#E8F6FF;color:var(--sky-deep);
  font-size:22px;font-weight:800;cursor:pointer;flex:none;
}
.step-btn:active{background:#D3EDFC;}

/* dan buttons (tobibako) */
.dan-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.dan-btn{
  min-width:48px;height:44px;border-radius:12px;border:2px solid var(--line);background:#FBFEFF;
  font-family:inherit;font-weight:800;font-size:14px;color:var(--ink-soft);cursor:pointer;
}
.dan-btn.reached{background:linear-gradient(180deg,var(--pink),#DB2777);border-color:#DB2777;color:#fff;}
.dan-btn.max{outline:3px solid var(--yellow);}
.dan-btn.easy{min-width:112px;}

/* ---------- forms ---------- */
.form-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.form-row label{font-size:13px;font-weight:700;color:var(--ink-soft);min-width:64px;}
input[type=date],input[type=text],select{
  height:48px;border-radius:14px;border:2px solid var(--line);font-size:16px;font-family:inherit;
  padding:0 12px;color:var(--ink);background:#FBFEFF;
}
.quick-chip{
  border:none;background:#E8F6FF;color:var(--sky-deep);font-weight:800;font-size:13px;
  border-radius:999px;padding:8px 14px;cursor:pointer;font-family:inherit;
}
.quick-chip:active{background:#D3EDFC;}

/* ---------- progress bar ---------- */
.goalbar{height:20px;background:#E4F2FC;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.07);}
.goalbar .fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--yellow));border-radius:999px;transition:width .6s;}

/* ---------- timeline ---------- */
.tl-date{font-weight:800;color:var(--sky-deep);margin:16px 0 6px;font-size:14px;display:flex;align-items:center;gap:6px;}
.tl-item{
  background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px;margin-bottom:8px;
  display:flex;align-items:center;gap:10px;font-size:14px;
}
.tl-item .em{font-size:22px;flex:none;}
.tl-item .xp{margin-left:auto;color:var(--green-dark);font-weight:800;font-size:13px;flex:none;}

/* ---------- badges ---------- */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
.badge-cell{
  background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 6px 10px;text-align:center;
}
.badge-cell .em{font-size:34px;display:block;}
.badge-cell .nm{font-size:11.5px;font-weight:800;margin-top:4px;line-height:1.3;}
.badge-cell .cond{font-size:10px;color:var(--ink-soft);margin-top:2px;line-height:1.3;}
.badge-cell.locked{opacity:.85;}
.badge-cell.locked .em{filter:grayscale(1);opacity:.45;}
.badge-cell.locked .nm{color:#9DB4C6;}
.badge-cell.got{background:linear-gradient(160deg,#FFFBEB,#fff);outline:2px solid #FDE68A;}

/* stat grid */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-box{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px;text-align:center;}
.stat-box .val{font-size:24px;font-weight:800;color:var(--sky-deep);}
.stat-box .lbl{font-size:11.5px;color:var(--ink-soft);}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.nav button{
  border:none;background:none;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  font-size:10.5px;font-weight:800;color:#9DB4C6;min-width:56px;padding:4px 2px;border-radius:12px;
}
.nav button .em{font-size:22px;line-height:1.2;filter:grayscale(1);opacity:.6;}
.nav button.active{color:var(--sky-deep);background:#EAF6FF;}
.nav button.active .em{filter:none;opacity:1;}

/* ---------- modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(8,47,73,.55);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadein .25s;
}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* 入力があるモーダル(初回セットアップ)は上寄せ＋スクロール可に。
   iPadでソフトウェアキーボードが出てもボタンが下に隠れて押せなくならないようにするため */
.modal-overlay.form-modal{align-items:flex-start;overflow-y:auto;padding-top:24px;padding-bottom:24px;}
.modal-box{
  background:#fff;border-radius:26px;padding:26px 22px;max-width:340px;width:100%;text-align:center;
  animation:zoomin .45s cubic-bezier(.18,1.5,.4,1);position:relative;max-height:85vh;overflow-y:auto;
}
@keyframes zoomin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box .big-em{font-size:76px;line-height:1.1;display:block;animation:pop .6s cubic-bezier(.18,2,.4,1) .15s backwards;}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
.modal-box h2{margin:8px 0 4px;font-size:21px;color:var(--orange-dark);}
.modal-box p{margin:4px 0 14px;color:var(--ink-soft);font-size:14px;}
.getxp{display:inline-block;background:#ECFDF3;color:var(--green-dark);font-weight:800;border-radius:999px;padding:4px 14px;font-size:14px;margin-bottom:12px;}

/* toast */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;font-weight:700;font-size:14px;border-radius:999px;
  padding:10px 20px;opacity:0;transition:all .3s;z-index:90;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:.95;transform:translateX(-50%) translateY(0);}

/* confetti canvas */
#confetti{position:fixed;inset:0;z-index:110;pointer-events:none;}

/* chart */
.chart-wrap{overflow-x:auto;}
.bench-msg{
  background:linear-gradient(160deg,#FFF9E6,#FFF);border:2px dashed var(--yellow);
  border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:700;color:#92600A;margin-top:10px;
}
.rec-list{margin:0;padding:0;list-style:none;}
.rec-list li{display:flex;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:14px;}
.rec-list li .d{color:var(--ink-soft);font-size:12px;min-width:74px;}
.rec-list li .v{font-weight:800;}
.del-x{margin-left:auto;border:none;background:#FEF2F2;color:#DC2626;border-radius:10px;width:34px;height:34px;font-size:15px;cursor:pointer;flex:none;}

.section-tabs{display:flex;gap:8px;margin-bottom:12px;}
.section-tabs button{
  flex:1;border:none;border-radius:14px;min-height:44px;font-family:inherit;font-weight:800;font-size:14px;
  background:#E8F6FF;color:var(--sky-deep);cursor:pointer;
}
.section-tabs button.active{background:var(--sky-dark);color:#fff;}

/* ---------- できたことリスト(あしあと) ---------- */
.dk-card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px;}
.dk-head{
  width:100%;border:none;font-family:inherit;color:#fff;cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;
}
.dk-head:active{filter:brightness(.94);}
.dk-head .em{font-size:27px;line-height:1;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));}
.dk-head .nm{font-weight:800;font-size:16px;flex:1;min-width:0;line-height:1.25;}
.dk-head .nm .sb{display:block;font-size:11.5px;font-weight:700;opacity:.95;}
.dk-head .cnt{font-size:21px;font-weight:800;flex:none;}
.dk-head .cnt .tt{font-size:12px;opacity:.85;}
.dk-head .go{font-size:13px;opacity:.9;flex:none;}
.dk-bar{height:8px;background:#EDF4F9;}
.dk-bar .fill{height:100%;border-radius:0 999px 999px 0;transition:width .6s;}
.dk-chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 12px;}
.dk-chip{
  border-radius:12px;padding:6px 10px;font-size:12.5px;font-weight:700;line-height:1.35;
  display:inline-flex;gap:6px;align-items:baseline;max-width:100%;
}
.dk-chip b{font-weight:800;white-space:nowrap;}
.dk-yet{display:flex;flex-wrap:wrap;gap:8px;}
.dk-yet button{
  border:2px dashed var(--line);background:#F8FCFF;color:#9DB4C6;border-radius:14px;
  padding:8px 12px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;min-height:48px;
}

/* ---------- アプリ集へもどるカード ---------- */
.portal-card{
  display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);
  background:linear-gradient(160deg,#FFFDF5,#FFF4DC);border:2px solid #FDE9C0;
  border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px;min-height:64px;
}
.portal-card:active{transform:translateY(2px);}
.portal-card .pc-icon{font-size:30px;line-height:1;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15));}
.portal-card .pc-tx{flex:1;min-width:0;line-height:1.35;}
.portal-card .pc-tx b{display:block;font-size:15px;font-weight:800;color:#B45309;}
.portal-card .pc-tx small{display:block;font-size:12px;color:var(--ink-soft);}
.portal-card .pc-go{flex:none;color:#B45309;font-weight:800;font-size:13px;}

/* ---------- スモールステップ（わざカードの中の折りたたみ） ---------- */
.step-wrap{margin-top:8px;}
.step-head{
  width:100%;border:none;font-family:inherit;cursor:pointer;text-align:left;
  background:#FFF7E8;color:#B45309;border-radius:12px;min-height:48px;padding:8px 12px;
  font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:7px;
}
.step-head.all{background:#EDFCF2;color:var(--green-dark);}
.step-head .ar{font-size:11px;flex:none;}
.step-head .cnt{margin-left:auto;background:#fff;border-radius:999px;padding:2px 10px;font-size:12.5px;flex:none;}
.step-list{margin-top:6px;}
.step-item{
  display:flex;gap:9px;align-items:flex-start;cursor:pointer;
  background:#FBFDFF;border:2px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:6px;min-height:48px;
}
.step-item.on{background:linear-gradient(160deg,#F2FFF5,#fff);border-color:var(--green-dark);}
.step-item .bx{
  width:30px;height:30px;border-radius:9px;flex:none;background:#E8F6FF;color:var(--sky-deep);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;margin-top:1px;
}
.step-item.on .bx{background:var(--green-dark);color:#fff;}
.step-item .tx{flex:1;min-width:0;}
.step-item .tx b{display:block;font-size:14.5px;font-weight:800;line-height:1.35;}
.step-item .tx small{display:block;font-size:12px;color:var(--ink-soft);line-height:1.4;margin-top:2px;}
.step-item.marathon-step{flex-wrap:wrap;padding:8px;}
.step-item.marathon-step .step-image{
  order:-1;width:100%;aspect-ratio:2/1;display:block;object-fit:cover;
  border-radius:10px;border:1px solid #E9DDFE;background:#F8F5FF;
}
.step-chip{background:#FFF7E8;color:#B45309;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;
  display:inline-block;margin-top:6px;}

/* ---------- まいにち筋トレ（競技とは別のデイリーメニュー） ---------- */
.daily-training-card{
  width:100%;border:0;border-radius:24px;padding:18px 20px;margin:0 0 18px;text-align:left;cursor:pointer;
  color:#fff;font-family:inherit;background:linear-gradient(135deg,#7C3AED 0%,#DB2777 58%,#F97316 100%);
  box-shadow:0 14px 30px rgba(124,58,237,.24);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
}
.daily-training-card:active{transform:translateY(2px)}
.daily-training-card .dt-icon{width:66px;height:66px;border-radius:20px;background:rgba(255,255,255,.19);display:flex;align-items:center;justify-content:center;font-size:38px}
.daily-training-card .dt-icon img{width:100%;height:100%;display:block;object-fit:cover;border-radius:20px}
.daily-training-card .dt-copy{min-width:0}.daily-training-card .dt-kicker{display:block;font-size:10px;font-weight:900;letter-spacing:.13em;opacity:.8}
.daily-training-card .dt-name{display:block;font-size:22px;font-weight:900;line-height:1.2;margin-top:3px}.daily-training-card .dt-sub{display:block;font-size:12px;font-weight:700;opacity:.9;margin-top:5px}
.daily-training-card .dt-score{min-width:86px;text-align:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:18px;padding:10px}
.daily-training-card .dt-score b{display:block;font-size:24px;line-height:1}.daily-training-card .dt-score small{display:block;font-size:10px;font-weight:800;margin-top:5px}
.training-hero{background:linear-gradient(145deg,#F5F0FF,#FFF1F2 58%,#FFF7ED);border:2px solid #E9D5FF}
.training-progress-row{display:flex;align-items:center;gap:14px;margin-top:10px}.training-progress-ring{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.training-progress-ring:before{content:'';position:absolute;inset:8px;border-radius:50%;background:#fff}.training-progress-ring b{position:relative;font-size:20px;color:#7C3AED}.training-progress-copy{flex:1;min-width:0}.training-progress-copy strong{display:block;font-size:17px}.training-progress-copy small{color:var(--ink-soft);line-height:1.5}
.training-group-title{font-size:14px;font-weight:900;color:#6D28D9;margin:18px 2px 8px;display:flex;align-items:center;gap:6px}
.training-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.training-exercise{border:2px solid #E9DDFE;background:#fff;border-radius:16px;padding:11px;text-align:left;font-family:inherit;color:var(--ink);min-width:0;box-shadow:0 4px 12px rgba(76,29,149,.07)}
.training-exercise .te-image{width:100%;aspect-ratio:2/1;display:block;object-fit:cover;border-radius:11px;margin-bottom:9px;background:#F5F9FF;border:1px solid #E0E7FF}
.training-exercise.done{border-color:#22C55E;background:linear-gradient(150deg,#F0FDF4,#fff)}
.training-exercise .te-top{display:flex;gap:9px;align-items:center}.training-exercise .te-icon{width:42px;height:42px;border-radius:13px;background:#F3E8FF;display:grid;place-items:center;font-size:24px;flex:none}
.training-exercise.done .te-icon{background:#DCFCE7}.training-exercise .te-title{font-size:14px;font-weight:900;line-height:1.3;flex:1}.training-exercise .te-check{width:27px;height:27px;border:2px solid #C4B5FD;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:900;flex:none}
.training-exercise.done .te-check{background:#22C55E;border-color:#22C55E}.training-exercise .te-target{display:inline-block;margin-top:7px;background:#FFF7ED;color:#C2410C;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:900}
.training-exercise .te-how{display:block;color:var(--ink-soft);font-size:11.5px;line-height:1.45;margin-top:6px}
.training-best{display:inline-block;margin:7px 0 0 5px;background:#F3E8FF;color:#6D28D9;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:900}
.training-record-row{display:grid;grid-template-columns:38px minmax(62px,1fr) 38px auto;gap:6px;align-items:center;margin-top:10px}
.training-record-row input{width:100%;height:40px;border:2px solid #DDD6FE;border-radius:11px;text-align:center;font:900 16px/1 inherit;color:var(--ink);background:#fff;min-width:0}
.training-record-row .step-btn{width:38px;height:40px;border-radius:11px}
.training-record-row .btn{height:40px;padding:0 12px;white-space:nowrap}
.training-reset-best{display:block;margin:8px 0 0 auto;border:0;background:transparent;color:#7C3AED;text-decoration:underline;font:800 11px/1.4 inherit;cursor:pointer;padding:2px}
.training-reset-all{margin-top:12px;border-color:#DDD6FE;color:#6D28D9;background:#FAF5FF}
.training-note{font-size:12px;line-height:1.6;color:#7C2D12;background:#FFF7ED;border:1px solid #FED7AA;border-radius:13px;padding:10px 12px;margin-top:14px}
@media(max-width:560px){.daily-training-card{grid-template-columns:auto 1fr;padding:15px}.daily-training-card .dt-icon{width:54px;height:54px;font-size:31px}.daily-training-card .dt-name{font-size:19px}.daily-training-card .dt-score{grid-column:1/-1;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px}.daily-training-card .dt-score b{font-size:20px}.daily-training-card .dt-score small{margin:0}.training-grid{grid-template-columns:1fr}.training-record-row{grid-template-columns:38px minmax(54px,1fr) 38px}.training-record-row .btn{grid-column:1/-1;width:100%}}

@media (min-width:520px){
  .sport-grid{grid-template-columns:repeat(3,1fr);}
}
/* iPad・PCの種目詳細: わざカードを一覧しやすい2〜3列にする */
@media (min-width:700px){
  #app.sport-detail{max-width:1180px;padding-left:20px;padding-right:20px;}
  .skill-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
}
@media (min-width:1100px){
  .skill-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
}
/* スマホのせまい幅: キャラを少し小さくして、XPの字が おりかえさないように */
@media (max-width:400px){
  .hero{padding:14px 12px 34px;}
  .hero .char-svg{width:104px;height:104px;}
  .hero .char-hold:before{width:106px;height:106px;margin:-53px 0 0 -53px;}
  .hero .char-name{font-size:18px;}
  .hero .char-info .small{font-size:11px;}
  .xp-label{font-size:11px;}
  .xp-label span{white-space:nowrap;}
  .lv-chip{font-size:13px;padding:3px 11px;}
}

.athlete-img{object-fit:contain;display:block;margin:auto;}

/* ---------------- わざイラスト(SVG) ----------------
   すべてのイラストは この共通パーツからできている。
   ここの見た目をよくすると、100いじょうのわざの絵がまとめてよくなる。
   手足は「こい輪郭＋はだ色の中身」の2本がさねにして、線画っぽさを出している */
const INK='#1E3A5F', SKIN='#FFD9B0', SKIN_D='#E9A96F', SHIRT='#F43F5E', SHIRT_D='#BE1236', ARW='#F97316';
/* あたま(かみの毛・かお つき)。rotでむきを回せる(さかさま=180) */
function aHead(x,y,rot){
  return `<g transform="translate(${x},${y})${rot?` rotate(${rot})`:''}">
    <circle r="7.1" fill="${SKIN}" stroke="${INK}" stroke-width="2"/>
    <path d="M-7.1,-2.2 A7.1,7.1 0 0 1 7.1,-2.2 Q4,-4.6 0,-4 Q-4,-4.6 -7.1,-2.2Z" fill="${INK}"/>
    <path d="M-7,-2.6 A7,7 0 0 1 7,-2.6" fill="none" stroke="${INK}" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="-2.6" cy="1.4" r="1.15" fill="${INK}"/><circle cx="2.6" cy="1.4" r="1.15" fill="${INK}"/>
    <path d="M-2,4.2 Q0,5.8 2,4.2" fill="none" stroke="${INK}" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="-4.8" cy="3.2" r="1.5" fill="#FB9BAF" opacity=".65"/>
    <circle cx="4.8" cy="3.2" r="1.5" fill="#FB9BAF" opacity=".65"/>
    <circle cx="-3.1" cy="-1.1" r="1.5" fill="#fff" opacity=".35"/>
  </g>`;
}
function aTorso(pts){
  return `<polyline points="${pts}" fill="none" stroke="${SHIRT_D}" stroke-width="9.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="${pts}" fill="none" stroke="${SHIRT}" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"/>

/* ---------------- ボールしゅもくイラスト ---------------- */
function aBall(x,y,type){
  const r = type==='base'?4.5 : type==='dodge'?7 : 6.5;
  let fill='#fff', line=INK;
  if(type==='basket'){ fill='#F59E0B'; line='#7C2D12'; }
  if(type==='dodge'){ fill='#F87171'; line='#B91C1C'; }
  if(type==='volley'){ fill='#FDE68A'; line='#B45309'; }
  let s = `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${line}" stroke-width="2.2"/>`;
  if(type==='soccer') s += `<circle cx="${x}" cy="${y}" r="2.4" fill="${INK}"/>`;
  if(type==='basket') s += `<path d="M${x-r},${y} h${2*r} M${x},${y-r} v${2*r}" stroke="${line}" stroke-width="1.5" fill="none"/>`;
  if(type==='volley') s += `<path d="M${x-r+1},${y-2} q${r-1},4 ${2*r-2},0" stroke="${line}" stroke-width="1.5" fill="none"/>`;
  if(type==='base') s += `<path d="M${x-2.4},${y-3} q2,3 0,6 M${x+2.4},${y-3} q-2,3 0,6" stroke="#DC2626" stroke-width="1.3" fill="none"/>`;
  return s;
}

  n11:{back:1,cross:1,label:'ひらく⇄クロス'}, n12:{back:1,cross:1,label:'クロスのまま'},
  n13:{multi:2}, n14:{cross:1,multi:2}, n15:{cross:1,multi:2,label:'クロスのまま'},
  n16:{back:1,multi:2}, n17:{back:1,cross:1,multi:2}, n18:{back:1,cross:1,multi:2,label:'クロスのまま'},

function nawaArt(o){
  o = o||{};
  let s = `<ellipse cx="60" cy="71" rx="17" ry="3.2" fill="rgba(30,58,95,.12)"/>`;
  s += `<path d="M46,46 C30,86 90,86 74,46" fill="none" stroke="${ARW}" stroke-width="3"/>`;
  s += `<path d="M46,46 C30,6 90,6 74,46" fill="none" stroke="${ARW}" stroke-width="2.5" stroke-dasharray="4 5" opacity=".55"/>`;
  s += aTip(60,16,o.back?180:0);
  s += `<line x1="46" y1="42.5" x2="46" y2="49" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`;
  s += `<line x1="74" y1="42.5" x2="74" y2="49" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`;
  s += aTorso('60,33 60,48');
  if(o.cross){ s += aLimb('56,36 64,41 72,44')+aLimb('64,36 56,41 48,44'); }
  else { s += aLimb('60,37 52,42 47,45')+aLimb('60,37 68,42 73,45'); }
  const legs = {
    both:'60,48 55,57 54,66|60,48 65,57 66,66',
    run:'60,48 50,54 52,63|60,48 64,56 66,65',
    pa:'60,48 48,56 46,66|60,48 72,56 74,66',
    choki:'60,48 51,55 50,63|60,48 69,53 71,60',
    side:'60,48 67,56 69,64|60,48 73,52 76,58',
    swing:'60,48 69,54 77,52|60,48 63,57 64,66',
  }[o.feet||'both'];
  legs.split('|').forEach(l=>{ s += aLimb(l); });
  s += aHead(60,26);
  if(o.multi) s += `<circle cx="103" cy="16" r="13" fill="#FACC15"/><text x="103" y="21" text-anchor="middle" font-size="13" font-weight="800" fill="#7C2D12">×${o.multi}</text>`;
  if(o.label) s += aLabel(o.label);
  return s;
}

function skillArt(sport, id){
  if(sport==='soccer' && SOCCER_IMAGES[id]){
    return `<div class="skill-art soccer-art"><img src="./images/soccer/${SOCCER_IMAGES[id]}" alt="" loading="lazy"></div>`;
  }
  if(sport==='basket' && BASKET_IMAGES[id]){
    return `<div class="skill-art basket-art"><img src="./images/basket/${BASKET_IMAGES[id]}" alt="" loading="lazy"></div>`;
  }
  if(sport==='volley' && VOLLEY_IMAGES[id]){
    return `<div class="skill-art volley-art"><img src="./images/volley/${VOLLEY_IMAGES[id]}" alt="" loading="lazy"></div>`;
  }
  if(sport==='baseball' && BASEBALL_IMAGES[id]){
    return `<div class="skill-art baseball-art"><img src="./images/baseball/${BASEBALL_IMAGES[id]}" alt="" loading="lazy"></div>`;
  }
  if(sport==='dodge' && DODGE_IMAGES[id]){
    return `<div class="skill-art dodge-art"><img src="./images/dodge/${DODGE_IMAGES[id]}" alt="" loading="lazy"></div>`;
  }
  if(sport==='relay' && RELAY_IMAGES[id]){
    return `<div class="skill-art relay-art"><img src="./images/relay/${RELAY_IMAGES[id]}" alt="" loading="lazy"></div>`;
  }
  if(sport==='suiei' && SUIEI_IMAGES[id]){
    return `<div class="skill-art suiei-art"><img src="./images/suiei/${SUIEI_IMAGES[id]}" alt="" loading="lazy"></div>`;
  }
  if(sport==='mat' && MAT_IMAGES[id]){
    return `<div class="skill-art mat-art"><img src="./images/mat/${MAT_IMAGES[id]}" alt="" loading="lazy"></div>`;
  }
  if(sport==='tobibako' && TOBIBAKO_IMAGES[id]){
    return `<div class="skill-art tobibako-art"><img src="./images/tobibako/${TOBIBAKO_IMAGES[id]}" alt="" loading="lazy"></div>`;
  }
  if(sport==='nawatobi' && NAWATOBI_IMAGES[id]){
    return `<div class="skill-art nawatobi-art"><img src="./images/nawatobi/${NAWATOBI_IMAGES[id]}" alt="" loading="lazy"></div>`;
  }
  if(sport==='tetsubo' && TETSUBO_IMAGES[id]){
    return `<div class="skill-art tetsubo-art"><img src="./images/tetsubo/${TETSUBO_IMAGES[id]}" alt="" loading="lazy"></div>`;
  }
  let inner = '';
  if(sport==='nawatobi') inner = nawaArt(NAWA_ART[id]);
  else if(sport==='tetsubo') inner = aBar()+(TETSU_ART[id]?TETSU_ART[id]():'');
  else if(sport==='mat') inner = aMat()+(MAT_ART[id]?MAT_ART[id]():'');
  else if(sport==='tobibako') inner = (TOBI_ART[id]?TOBI_ART[id]():'');
  else if(sport==='suiei') inner = (SUIEI_ART[id]?SUIEI_ART[id]():'');
  else if(BALL_SPORTS[sport]){
    const sk = BALL_SPORTS[sport].skills.find(k=>k.id===id);
    inner = (sk && sk.art) ? sk.art() : '';
  }
  if(!inner) return '';
  return `<div class="skill-art"><svg viewBox="0 0 120 92" xmlns="http://www.w3.org/2000/svg">${inner}</svg></div>`;
}

function uniqueDays(s){ return new Set(s.records.map(r=>r.date)).size; }
function swimTotal(s){ return s.suiei.log.reduce((a,l)=>a+l.m,0); }
function lvl(s){ return levelInfo(s.profile.totalXp).level; }
function tridaySports(s){
  const m = {};
  for(const r of s.records){ if(SPORTS[r.sport]) (m[r.date]||(m[r.date]=new Set())).add(r.sport); }
  for(const k in m){ if(m[k].size>=3) return true; }
  return false;
}

let S = load();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    const d = defaultState(), s = JSON.parse(raw);
    // ふるいデータにあたらしいキーをおぎなう
    for(const k of Object.keys(d)) if(s[k]===undefined) s[k]=d[k];
    if(!s.body || typeof s.body!=='object') s.body={arms:0,chest:0,core:0,legs:0};
    if(s.body.system===3){
      s.body.points=Math.max(0,Math.floor(Number(s.body.points)||0));
      s.body.title=typeof s.body.title==='string'?s.body.title:'';
      s.body.titles=Array.isArray(s.body.titles)?s.body.titles:[];
      s.body.heroes=Array.isArray(s.body.heroes)?s.body.heroes.slice(0,BODY_HEROES.length).map(normalizeHeroBody):[];
      while(s.body.heroes.length<BODY_HEROES.length) s.body.heroes.push(blankHeroBody());
      s.body.active=Math.max(0,Math.min(BODY_HEROES.length-1,Math.floor(Number(s.body.active)||0)));
    }else if(s.body.system===2){
      const boy=normalizeHeroBody(s.body);
      s.body={system:3,points:Math.max(0,Math.floor(Number(s.body.points)||0)),active:0,heroes:[boy,...BODY_HEROES.slice(1).map(()=>blankHeroBody())],title:typeof s.body.title==='string'?s.body.title:'',titles:Array.isArray(s.body.titles)?s.body.titles:[]};
    }else{
      const old = {};
      for(const key of ['arms','chest','core','legs']) old[key]=Math.max(0,Math.min(5,Number(s.body[key])||0));
      const oldSpent = Object.values(old).reduce((a,n)=>a+n,0);
      const pastChallenges = Array.isArray(s.records) ? s.records.filter(r=>(Number(r.xp)||0)>0).length : 0;
      const unusedLevelPoints = Math.max(0,levelInfo(Number(s.profile&&s.profile.totalXp)||0).level-1-oldSpent);
      const boy=normalizeHeroBody({arms:old.arms*2,chest:old.chest*2,core:old.core*2,legs:old.legs*2});
      s.body={system:3,points:pastChallenges+unusedLevelPoints,active:0,heroes:[boy,...BODY_HEROES.slice(1).map(()=>blankHeroBody())],title:'',titles:[]};
    }
    const migratedSpent=s.body.heroes.reduce((sum,h)=>sum+Object.values(h).reduce((a,n)=>a+(Number(n)||0),0),0);
    for(const t of BODY_TITLES){
      const open=t.part ? Math.max(...s.body.heroes.map(h=>Number(h[t.part])||0))>=t.need : migratedSpent>=t.need;
      if(open && !s.body.titles.includes(t.id)) s.body.titles.push(t.id);
    }
    // 旧すいえい12だんかい(s10〜sS2)のごうかくを、22だんかい版(sw〜)へひきつぐ
    const mig = { s10:['sw14'], s9:['sw16','sw15'], s8:['sw11','sw10'], s7:['sw9'], s6:['sw8'],
                  s5:['sw7'], s4:['sw6'], s3:['sw5'], s2:['sw4'], s1:['sw3'], sS1:['sw1'], sS2:['swS2'] };
    const remap = a=>{ const out=[]; (a||[]).forEach(id=>{ if(mig[id]) out.push(...mig[id]); else out.push(id); }); return [...new Set(out)]; };
    if(s.suiei && s.suiei.kyu.some(id=>mig[id])) s.suiei.kyu = remap(s.suiei.kyu);
    if(s.ever_suiei && s.ever_suiei.some(id=>mig[id])) s.ever_suiei = remap(s.ever_suiei);
    // 小学生版は6段まで。以前の7・8段記録も表示・保存時に6段へそろえる。
    if(s.tobibako && s.tobibako.dan){
      for(const id of Object.keys(s.tobibako.dan)) s.tobibako.dan[id]=Math.min(6,Number(s.tobibako.dan[id])||0);
    }
    if(Array.isArray(s.records)){
      s.records.forEach(r=>{ if(r.sport==='tobibako' && typeof r.label==='string') r.label=r.label.replace(/[78]だん/g,'6だん'); });
    }
    if(Array.isArray(s.badges)) s.badges=s.badges.filter(id=>id!=='dan8');
    return s;
  }catch(e){ return defaultState(); }
}

/* ---------------- レベル計算 ---------------- */
function levelInfo(xp){
  let level=1, acc=0, need=100;
  while(xp >= acc+need){ acc+=need; level++; need = 100+(level-1)*25; }
  return { level, cur:xp-acc, need };
}
function activeHeroBody(){
  if(!S.body||!Array.isArray(S.body.heroes)) return blankHeroBody();
  return S.body.heroes[Math.max(0,Math.min(BODY_HEROES.length-1,Number(S.body.active)||0))] || S.body.heroes[0];
}
function activeHero(){ return BODY_HEROES[Math.max(0,Math.min(BODY_HEROES.length-1,Number(S.body&&S.body.active)||0))] || BODY_HEROES[0]; }
function selectBodyHero(index){
  const i=Math.max(0,Math.min(BODY_HEROES.length-1,Math.floor(Number(index)||0)));
  S.body.active=i; save(); render(); showToast(BODY_HEROES[i].name+'を選んだよ！');
}
function bodySpent(index){
  const h=index==null?activeHeroBody():(S.body&&S.body.heroes&&S.body.heroes[index]);
  return BODY_PARTS.reduce((sum,p)=>sum+(Number(h&&h[p.key])||0),0);
}
function bodyTotalSpent(){ return BODY_HEROES.reduce((sum,_,i)=>sum+bodySpent(i),0); }
function bodyPointsAvailable(){ return Math.max(0,Math.floor(Number(S.body&&S.body.points)||0)); }
function bodyTitleUnlocked(t){
  if(S.body&&Array.isArray(S.body.titles)&&S.body.titles.includes(t.id)) return true;
  return t.part ? Math.max(...S.body.heroes.map(h=>Number(h[t.part])||0))>=t.need : bodyTotalSpent()>=t.need;
}
function unlockedBodyTitles(){ return BODY_TITLES.filter(bodyTitleUnlocked); }
function currentBodyTitle(){
  const chosen = BODY_TITLES.find(t=>t.id===(S.body&&S.body.title));
  if(chosen && bodyTitleUnlocked(chosen)) return chosen;
  const general = BODY_TITLES.filter(t=>!t.part && bodyTitleUnlocked(t));
  return general[general.length-1] || BODY_TITLES[0];
}
function equipBodyTitle(id){
  const title = BODY_TITLES.find(t=>t.id===id);
  if(!title || !bodyTitleUnlocked(title)) return;
  S.body.title=id; save(); render(); showToast('「'+title.name+'」をつけたよ！');
}
function upgradeBodyPart(key){
  const part = BODY_PARTS.find(p=>p.key===key);
  const body=activeHeroBody();
  if(!part) return;
  if(bodyPointsAvailable()<1){ showToast('つかえる からだポイントがないよ'); return; }
  if((body[key]||0)>=BODY_MACHO_AT){ showToast(part.name+'はマッチョMAX！'); return; }
  const before = new Set(unlockedBodyTitles().map(t=>t.id));
  S.body.points=Math.max(0,bodyPointsAvailable()-1);
  body[key]=(body[key]||0)+1;
  const newTitles = unlockedBodyTitles().filter(t=>!before.has(t.id));
  if(!Array.isArray(S.body.titles)) S.body.titles=[];
  newTitles.forEach(title=>{ if(!S.body.titles.includes(title.id)) S.body.titles.push(title.id); });
  newTitles.forEach(title=>celebrationQueue.push({type:'title',title}));
  let heroAdvanced=false;
  if(heroBodyComplete(body)){
    const finished=activeHero();
    celebrationQueue.push({type:S.body.heroes.every(heroBodyComplete)?'hero-final':'hero',finished});
    heroAdvanced=true;
  }
  save(); render();
  if(newTitles.length||heroAdvanced) playCelebrations();
  else { showToast(part.name+'が '+body[key]+'/'+BODY_MACHO_AT+' にパワーアップ！'); confettiBurst(); }
}
function resetBodyParts(){
  if(bodySpent()===0) return;
  if(!confirm(activeHero().name+'のポイントをぜんぶ振り直す？\n使ったポイントはすべてもどるよ。')) return;

/* ---------------- 級の計算 ---------------- */
function rankLabel(k){ return k===0?'とっきゅう':(k===0.5?'じゅんとっきゅう':k+'きゅう'); }
/* なわとび: 各わざのベスト回数から とうたつ級(いちばん良いもの) */
function nawaSkillKyu(skill, count){
  if(!count) return null;
  let best = null;
  for(const [kyu,need] of skill.lv){ if(count>=need && (best===null||kyu<best)) best=kyu; }
  return best;
}
function nawaKyu(s){
  let best = null;
  for(const sk of NAWATOBI_SKILLS){
    const k = nawaSkillKyu(sk, s.nawatobi.best[sk.id]||0);
    if(k!==null && (best===null||k<best)) best=k;
  }
  return best;
}
/* ---------------- スモールステップの計算 ----------------
   ステップぜんぶ達成 = そのわざ「はんぶん(0.5わざ)」ぶんとしてカウントする。
   てつぼうは わざの数で級が決まるので、この0.5ぶんで級も上がる。
   （なわとび=回数・すいえい=検定そのものが級の定義なので、そちらの級は動かさない） */
function stepsOf(id){ return STEPS[id] || []; }
function stepDone(stepId){ return (S.steps||[]).indexOf(stepId) >= 0; }
function stepDoneCount(id){ return stepsOf(id).filter(st=>stepDone(st.id)).length; }
function stepAll(id){ const a = stepsOf(id); return a.length>0 && a.every(st=>stepDone(st.id)); }
/* まだできていないわざのうち、ステップだけぜんぶ終わっているわざの数 */
function halfSkills(skills, doneIds){
  return skills.filter(k=>doneIds.indexOf(k.id)<0 && stepAll(k.id)).length;
}
/* しゅもくぜんたいで できたステップの数 */
function stepTotalOf(skills){ return skills.reduce((a,k)=>a+stepDoneCount(k.id), 0); }
function stepMaxOf(skills){ return skills.reduce((a,k)=>a+stepsOf(k.id).length, 0); }

/* てつぼう: できたわざの数 → 級 (20=特級, 2きざみ)。ステップは0.5わざぶんとして足す */
function tetsuPoints(s){
  return s.tetsubo.done.length + 0.5 * halfSkills(TETSUBO_SKILLS, s.tetsubo.done);
}
function tetsuKyu(s){
  if(s.tetsubo.done.length>=20) return 'とっきゅう';   // 特級は本わざ20こでのみ
  const n = Math.floor(tetsuPoints(s));
  if(n<2) return '10きゅう';
  return Math.max(1, 10-Math.floor(n/2))+'きゅう';
}
function suieiKyuLabel(s){
  let label = null;
  for(const k of SUIEI_KYU){ if(s.suiei.kyu.includes(k.id)) label = k.label; }
  return label;
}
function marathonTotal(s){ return s.marathon.log.reduce((a,r)=>a+r.m,0); }

/* ---------------- XP・きろく・バッジ判定 ---------------- */
let celebrationQueue = [];
function gainXp(n){
  const before = levelInfo(S.profile.totalXp).level;
  S.profile.totalXp += n;
  const after = levelInfo(S.profile.totalXp).level;
  if(after>before) celebrationQueue.push({type:'levelup', level:after});
}
function touchStreak(date){
  if(date!==todayStr()) return;                 // きょうのきろくだけ連続にカウント
  if(S.streak.last===date) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yStr = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  S.streak.count = (S.streak.last===yStr) ? S.streak.count+1 : 1;
  S.streak.last = date;
  if(S.streak.count>S.streak.best) S.streak.best = S.streak.count;
  if(S.streak.count>0 && S.streak.count%7===0){
    gainXp(XP.streak7);
    celebrationQueue.push({type:'streak', days:S.streak.count});
  }
}
/* きろくのとりけし: 該当するさいしんの1件をけして、もらったXPをもどす(レベルも自動でもどる) */
function removeRecordXp(pred){
  for(let i=S.records.length-1; i>=0; i--){
    if(pred(S.records[i])){
      const removed = S.records[i];
      S.profile.totalXp = Math.max(0, S.profile.totalXp - removed.xp);
      if((Number(removed.xp)||0)>0){
        if(bodyPointsAvailable()>0){
          S.body.points=bodyPointsAvailable()-1;
        }else{
          for(let heroIndex=S.body.active;heroIndex>=0;heroIndex--){
            const h=S.body.heroes[heroIndex];
            const invested=BODY_PARTS.map(p=>({key:p.key,value:Number(h[p.key])||0})).sort((a,b)=>b.value-a.value)[0];
            if(invested && invested.value>0){ h[invested.key]--; break; }
          }
        }
      }
      S.records.splice(i,1);
      return true;
    }
  }
  return false;
}
/* きろく1件ついか。baseXp省略時は通常の+10XP。 */
function addRecord(sport, label, extraXp, date, baseXp){
  const d = date || todayStr();
  const xp = (baseXp==null?XP.record:baseXp) + (extraXp||0);
  S.records.push({ id:uid(), sport, date:d, label, xp });
  if(xp>0) S.body.points=bodyPointsAvailable()+1;
  gainXp(xp);
  touchStreak(d);
  checkBadges();
  save();
}
function checkBadges(){
  for(const b of BADGES){
    if(S.badges.includes(b.id)) continue;
    let ok=false;
    try{ ok = b.test(S); }catch(e){ ok=false; }
    if(ok){
      S.badges.push(b.id);
      gainXp(XP.badge);
      celebrationQueue.push({type:'badge', badge:b});
      checkBadges();                            // でんせつのうんどうか の連鎖チェック
      return;
    }
  }
}

/* かんたんコンフェッティ(CDNなし・オフラインOK) */
const confCanvas = document.getElementById('confetti');
const confCtx = confCanvas.getContext('2d');
let confParts = [], confRunning = false;
function confettiBurst(){
  confCanvas.width = innerWidth; confCanvas.height = innerHeight;
  const colors = ['#38BDF8','#FB923C','#4ADE80','#F472B6','#FACC15','#A78BFA'];
  for(let i=0;i<120;i++){
    confParts.push({
      x: innerWidth/2 + (Math.random()-.5)*160,
      y: innerHeight*0.35,
      vx: (Math.random()-.5)*11,
      vy: -Math.random()*11-4,
      w: 6+Math.random()*6, h: 8+Math.random()*8,
      rot: Math.random()*Math.PI*2, vr:(Math.random()-.5)*.3,
      color: colors[i%colors.length], life: 130+Math.random()*60,
    });
  }
  if(!confRunning){ confRunning=true; confettiTick(); }
}
function confettiTick(){
  confCtx.clearRect(0,0,confCanvas.width,confCanvas.height);
  confParts = confParts.filter(p=>p.life>0 && p.y<confCanvas.height+30);
  for(const p of confParts){
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.28; p.vx*=0.99; p.rot+=p.vr; p.life--;
    confCtx.save();
    confCtx.translate(p.x,p.y); confCtx.rotate(p.rot);
    confCtx.globalAlpha = Math.min(1, p.life/40);
    confCtx.fillStyle = p.color;
    confCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    confCtx.restore();
  }
  if(confParts.length>0){ requestAnimationFrame(confettiTick); }
  else { confRunning=false; confCtx.clearRect(0,0,confCanvas.width,confCanvas.height); }
}

function trainingAdjust(id, d){

function saveTraining(id){

/* ---------------- SVG折れ線グラフ ---------------- */
function lineChart(series, opts){
  // series: [{color, points:[数値...]}] 同じ長さ / labels: X軸ラベル
  const o = Object.assign({w:560,h:180,pad:30}, opts||{});
  const all = series.flatMap(s=>s.points).filter(v=>v!=null);
  if(all.length===0) return '';
  const maxV = Math.max(...all, o.minMax||10);
  const n = Math.max(...series.map(s=>s.points.length));
  const iw = o.w-o.pad*2, ih = o.h-o.pad*2;
  const x = i => o.pad + (n<=1 ? iw/2 : i*(iw/(n-1)));
  const y = v => o.pad + ih - (v/maxV)*ih;
  let g = `<svg viewBox="0 0 ${o.w} ${o.h}" style="width:100%;min-width:280px" xmlns="http://www.w3.org/2000/svg">`;
  // よこ線
  for(let i=0;i<=4;i++){
    const vy = o.pad + ih*i/4;
    const vv = Math.round(maxV*(4-i)/4);
    g += `<line x1="${o.pad}" y1="${vy}" x2="${o.w-o.pad}" y2="${vy}" stroke="#E3F1FA" stroke-width="1.5"/>
          <text x="${o.pad-6}" y="${vy+4}" font-size="10" fill="#8AA8BF" text-anchor="end">${vv}</text>`;
  }
  for(const s of series){
    const pts = s.points.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
    if(pts.length>1) g += `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${s.color}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    for(const p of pts) g += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${s.color}" stroke="#fff" stroke-width="2"/>`;
  }
  if(o.labels) o.labels.forEach((lb,i)=>{ if(i<n) g += `<text x="${x(i)}" y="${o.h-8}" font-size="10" fill="#8AA8BF" text-anchor="middle">${lb}</text>`; });
  return g+'</svg>';
}

/* ---------------- スモールステップのUI ----------------
   わざカードの中に折りたたみで入る。ふだんは閉じていて、つまずいた子だけ開く。

let openSteps = {};
function toggleStepOpen(id){ openSteps[id] = !openSteps[id]; render(); }
function skillNameOf(id){
  if(id==='mara') return 'マラソン';
  const all = [].concat(NAWATOBI_SKILLS, TETSUBO_SKILLS, MAT_SKILLS, TOBIBAKO_SKILLS,
    SUIEI_KYU.map(k=>({id:k.id, name:k.label})),
    Object.keys(BALL_SPORTS).map(k=>BALL_SPORTS[k].skills).reduce((a,b)=>a.concat(b), []));
  const f = all.find(x=>x.id===id);
  return f ? f.name : id;
}
function stepsHtml(sport, skillId){
  const list = stepsOf(skillId);
  if(list.length===0) return '';
  const n = list.filter(st=>stepDone(st.id)).length;
  const open = !!openSteps[skillId];
  return `<div class="step-wrap">
    <button class="step-head ${n===list.length?'all':''}" onclick="toggleStepOpen('${skillId}')">
      <span class="ar">${open?'▼':'▶'}</span>${n===list.length?'ステップ ぜんぶできた!':'できるまでの ステップ'}
      <span class="cnt">${n}/${list.length}</span>
    </button>
    ${open?`<div class="step-list">
      ${list.map((st,i)=>{
        const on = stepDone(st.id);
        const marathonImage = sport==='marathon' && MARATHON_IMAGES[st.id]
          ? `<img class="step-image" src="./images/marathon/${MARATHON_IMAGES[st.id]}" alt="${st.name}のイラスト" loading="lazy">`
          : '';
        return `<div class="step-item ${sport==='marathon'?'marathon-step ':''}${on?'on':''}" onclick="toggleStep('${sport}','${skillId}','${st.id}')">
          ${marathonImage}
          <span class="bx">${on?'✓':(i+1)}</span>
          <span class="tx"><b>${st.name}</b><small>${st.kotsu}</small></span>
        </div>`;
      }).join('')}
    </div>`:''}
  </div>`;
}
function toggleStep(sport, skillId, stepId){
  const st = stepsOf(skillId).find(x=>x.id===stepId);
  if(!st) return;
  if(!S.steps) S.steps = [];
  const label = skillNameOf(skillId)+'／ステップ「'+st.name+'」できた!';
  if(stepDone(stepId)){
    if(!confirm('「'+st.name+'」のチェックをはずす?\n(もらったXPももどるよ)')) return;
    S.steps = S.steps.filter(x=>x!==stepId);
    removeRecordXp(r=>r.sport===sport && r.label===label);
    S.ever_steps = (S.ever_steps||[]).filter(x=>x!==stepId);
    save(); render();
    showToast('チェックをはずして XPをもどしたよ');
    return;
  }
  S.steps.push(stepId);
  if(!S.ever_steps) S.ever_steps = [];
  let extra = 0;
  if(S.ever_steps.indexOf(stepId)<0){ S.ever_steps.push(stepId); extra = XP.step; }
  addRecord(sport, label, extra);
  showToast('👍 '+st.name+' できた! +'+(XP.record+extra)+'XP');
  render(); playCelebrations();
}

function stepSummaryHtml(skills){
  const now = stepTotalOf(skills), max = stepMaxOf(skills);
  if(max===0) return '';
  return `<div class="step-chip">🪜 スモールステップ ${now} / ${max}</div>`;
}

/* ---------------- チェックカードしき (てつぼう・マット) ---------------- */
function checkSkillsHtml(sport, skills){
  const done = S[sport].done;
  return `<div class="skill-grid">${skills.map(sk=>{
    const on = done.includes(sk.id);
    return `<div class="skill-card ${on?'done':''}">
      <div class="skill-head">
        <div class="check-big ${on?'on':''}" onclick="toggleSkill('${sport}','${sk.id}')">${on?'✓':''}</div>
        <span class="skill-name">${sk.name}</span>
        <span class="skill-stars">${'★'.repeat(sk.st)}${'☆'.repeat(3-sk.st)}</span>
        ${on?'<span class="done-badge">できた!</span>':''}
      </div>
      <div class="skill-body">${skillArt(sport,sk.id)}
        <div class="skill-kotsu"><b>コツ:</b> ${sk.kotsu}</div>
      </div>
      ${stepsHtml(sport, sk.id)}
    </div>`;
  }).join('')}</div>`;
}
function toggleSkill(sport, id){
  const arr = S[sport].done;
  const skills = sport==='tetsubo' ? TETSUBO_SKILLS
               : sport==='mat' ? MAT_SKILLS
               : BALL_SPORTS[sport].skills;
  const sk = skills.find(s=>s.id===id);
  const everKey = 'ever_'+sport;
  if(arr.includes(id)){
    if(!confirm('「'+sk.name+'」のチェックをはずす?\n(もらったXPももどるよ)')) return;
    S[sport].done = arr.filter(x=>x!==id);
    removeRecordXp(r=>r.sport===sport && r.label===sk.name+' できた!');
    S[everKey] = (S[everKey]||[]).filter(x=>x!==id);
    save(); render();
    showToast('チェックをはずして XPをもどしたよ');
    return;
  }
  arr.push(id);
  if(!S[everKey]) S[everKey]=[];
  let extra = 0;
  if(!S[everKey].includes(id)){ S[everKey].push(id); extra = XP.firstSkill; }
  addRecord(sport, sk.name+' できた!', extra);
  showToast('🎉 '+sk.name+' たっせい! +'+(XP.record+extra)+'XP');
  render(); playCelebrations();
}

      <div class="skill-head">
        <span class="skill-name">${sk.name}</span>
        <span class="skill-stars">${'★'.repeat(sk.st)}${'☆'.repeat(3-sk.st)}</span>
        ${cur>0?`<span class="best-chip">${sk.dan===false?'できた!':'さいこう '+cur+'だん'}</span>`:''}
      </div>
      <div class="skill-body">${skillArt('tobibako',sk.id)}
        <div class="skill-kotsu"><b>コツ:</b> ${sk.kotsu}</div>
      </div>
      <div class="dan-row">
        ${sk.dan===false
          ? `<button class="dan-btn easy ${cur>=1?'reached max':''}" onclick="saveDan('${sk.id}',1)">できた!</button>`
          : DAN_LIST.map(d=>`<button class="dan-btn ${cur>=d?'reached':''} ${cur===d?'max':''}"
            onclick="saveDan('${sk.id}',${d})">${d}だん</button>`).join('')}
      </div>
      ${stepsHtml('tobibako', sk.id)}
    </div>`;
  }).join('')}</div>`;
}
function saveDan(id, dan){
  const sk = TOBIBAKO_SKILLS.find(s=>s.id===id);
  const prev = S.tobibako.dan[id]||0;
  if(sk.dan===false){
    const extra = prev===0 ? XP.firstSkill : 0;
    if(prev===0) S.tobibako.dan[id]=1;
    addRecord('tobibako', sk.name+' できた!', extra);
    showToast((prev===0?'🎉 '+sk.name+' はじめてせいこう!':sk.name+' できた!')+' +'+(XP.record+extra)+'XP');
    render(); playCelebrations();
    return;
  }
  let extra = 0, msg = sk.name+' '+dan+'だん きろく!';
  if(prev===0){ extra += XP.firstSkill; msg = '🎉 '+sk.name+' はじめてせいこう!'; }
  else if(dan>prev){ extra += XP.best; msg = '🏆 きろくこうしん! '+prev+'だん→'+dan+'だん'; }
  if(dan>prev) S.tobibako.dan[id]=dan;
  addRecord('tobibako', sk.name+' '+dan+'だん', extra);
  showToast(msg+' +'+(XP.record+extra)+'XP');
  render(); playCelebrations();
}

    <div class="chart-wrap">${lineChart(

function paceStr(m, sec){
  const spk = sec/(m/1000);
  return '1kmあたり'+Math.floor(spk/60)+'ふん'+Math.round(spk%60)+'びょう';
}
function saveRun(){
  const date = document.getElementById('mr-date').value || todayStr();
  const m = parseInt(document.getElementById('mr-m').value)||0;
  if(m<=0){ showToast('きょりを入れてね'); return; }
  const min = parseInt(document.getElementById('mr-min').value)||0;
  const s = parseInt(document.getElementById('mr-sec').value)||0;
  const sec = (min*60+s)||null;
  S.marathon.log.push({id:uid(), date, m, sec});
  S.marathon.log.sort((a,b)=>a.date<b.date?-1:1);
  addRecord('marathon', m+'m はしった'+(sec?(' ('+Math.floor(sec/60)+'ふん'+(sec%60)+'びょう)'):''), 0, date);
  showToast('きろくした! +'+XP.record+'XP');
  render(); playCelebrations();
}
function delRun(id){
  const run = S.marathon.log.find(r=>r.id===id);
  if(!run) return;
  if(!confirm('このきろくをけす?\n(もらったXPももどるよ)')) return;
  S.marathon.log = S.marathon.log.filter(r=>r.id!==id);
  removeRecordXp(r=>r.sport==='marathon' && r.date===run.date && r.label.indexOf(run.m+'m ')===0);
  save(); render();
  showToast('きろくをけして XPをもどしたよ');
}

/* ---------------- ボールしゅもく(サッカーなど6しゅもく) ---------------- */
/* ★のかずでやさしい順にならべる（あとから足したチャレンジも正しい位置に入る） */
function ballSorted(sportId){ return BALL_SPORTS[sportId].skills.slice().sort((a,b)=>a.st-b.st); }
function ballDoneIds(sportId){
  return BALL_SPORTS[sportId].skills.filter(k=>
    k.type==='check' ? S[sportId].done.includes(k.id) : (S[sportId].best[k.id]||0)>0
  ).map(k=>k.id);
}
function ballHalf(sportId){ return halfSkills(BALL_SPORTS[sportId].skills, ballDoneIds(sportId)); }
function ballDoneCount(sportId){
  return BALL_SPORTS[sportId].skills.filter(k=>
    k.type==='check' ? S[sportId].done.includes(k.id) : (S[sportId].best[k.id]||0)>0
  ).length;
}
function viewBallSport(sportId){
  const cfg = BALL_SPORTS[sportId], sp = SPORTS[sportId];
  const total = cfg.skills.length, done = ballDoneCount(sportId), skills = ballSorted(sportId);
  return headerHtml(sp.name, sp.em, 'home')+`
  <div class="card center" style="background:linear-gradient(160deg,#F0FDF9,#fff)">
    <div class="muted small">できたチャレンジ</div>
    <div style="font-size:30px;font-weight:800;color:var(--sky-deep)">${done} / ${total}</div>
    <div class="goalbar" style="margin-top:6px"><div class="fill" style="width:${Math.min(100,(done+ballHalf(sportId)*0.5)/total*100)}%"></div></div>
    <div class="muted small" style="margin-top:6px">かんたんなチャレンジからじゅんばんに ${total}こ! むずかしいのは ★の数でわかるよ</div>
    ${stepSummaryHtml(cfg.skills)}
  </div>
  <div class="skill-grid">${skills.map(sk=>{
    if(sk.type==='check'){
      const on = S[sportId].done.includes(sk.id);
      return `<div class="skill-card ${on?'done':''}">
        <div class="skill-head">
          <div class="check-big ${on?'on':''}" onclick="toggleSkill('${sportId}','${sk.id}')">${on?'✓':''}</div>
          <span class="skill-name">${sk.name}</span>
          <span class="skill-stars">${'★'.repeat(sk.st)}${'☆'.repeat(3-sk.st)}</span>
          ${on?'<span class="done-badge">できた!</span>':''}
        </div>
        <div class="skill-body">${skillArt(sportId,sk.id)}
          <div class="skill-kotsu"><b>コツ:</b> ${sk.kotsu}</div>
        </div>
        ${stepsHtml(sportId, sk.id)}
      </div>`;
    }
    const best = S[sportId].best[sk.id]||0;
    return `<div class="skill-card ${best>0?'done':''}">
      <div class="skill-head">
        <span class="skill-name">${sk.name}</span>
        <span class="skill-stars">${'★'.repeat(sk.st)}${'☆'.repeat(3-sk.st)}</span>
        ${best>0?`<span class="best-chip">ベスト ${best}${sk.unit}</span>`:''}
      </div>
      <div class="skill-body">${skillArt(sportId,sk.id)}
        <div class="skill-kotsu"><b>コツ:</b> ${sk.kotsu}</div>
      </div>
      <div class="count-row">
        <button class="step-btn" onclick="stepCount('${sk.id}',-1)">−</button>
        <input type="number" id="cnt-${sk.id}" min="0" max="99999" step="${sk.low?'0.1':'1'}" inputmode="decimal" placeholder="${sk.unit}">
        <button class="step-btn" onclick="stepCount('${sk.id}',1)">＋</button>
        <button class="btn green smallbtn" onclick="saveBallCount('${sportId}','${sk.id}')">きろく!</button>
      </div>
      ${stepsHtml(sportId, sk.id)}
    </div>`;

function saveBallCount(sportId, id){
  const sk = BALL_SPORTS[sportId].skills.find(k=>k.id===id);
  const el = document.getElementById('cnt-'+id);
  const n = Math.round((parseFloat(el.value)||0)*10)/10;
  if(n<=0){ showToast(sk.low?'タイムを入れてね':'かずを入れてね'); return; }
  const prev = S[sportId].best[id]||0;
  let extra = 0, msg = sk.name+' '+n+sk.unit+' きろく!';
  if(prev===0){
    extra = XP.firstSkill; msg = '🎉 '+sk.name+' はじめてのきろく!';
    S[sportId].best[id] = n;
  }else if(sk.low ? n<prev : n>prev){
    extra = XP.best; msg = '🏆 じこベストこうしん! '+prev+sk.unit+'→'+n+sk.unit;
    S[sportId].best[id] = n;
  }
  addRecord(sportId, sk.name+' '+n+sk.unit, extra);
  showToast(msg+' +'+(XP.record+extra)+'XP');
  render(); playCelebrations();
}

const SPORT_VIEWS = {
  nawatobi:viewNawatobi, tetsubo:viewTetsubo, mat:viewMat,
  tobibako:viewTobibako, suiei:viewSuiei, marathon:viewMarathon,
  soccer:()=>viewBallSport('soccer'), basket:()=>viewBallSport('basket'),
  volley:()=>viewBallSport('volley'), baseball:()=>viewBallSport('baseball'),
  dodge:()=>viewBallSport('dodge'), relay:()=>viewBallSport('relay'),
};
/* ---------------- せいちょうのあしあと ---------------- */
/* しゅもくごとに「いまできること」をあつめる。
   items: {nm:なまえ, val:きろく, ex:1ならおまけ(できたかず にはカウントしない)} */
function dekitaOf(id){
  const out = { items:[], total:0, sub:'' };
  if(id==='nawatobi'){
    out.total = NAWATOBI_SKILLS.length;
    NAWATOBI_SKILLS.forEach(sk=>{
      const b = S.nawatobi.best[sk.id]||0;
      if(b>0){
        const k = nawaSkillKyu(sk, b);
        out.items.push({ nm:sk.name, val:b+'かい'+(k!==null?' ('+rankLabel(k)+')':'') });
      }
    });
    const mae = Math.max(0,...S.nawatobi.speed.map(r=>r.mae||0));
    const ushiro = Math.max(0,...S.nawatobi.speed.map(r=>r.ushiro||0));
    if(mae) out.items.push({ nm:'30びょう まえまわし', val:mae+'かい', ex:1 });
    if(ushiro) out.items.push({ nm:'30びょう うしろまわし', val:ushiro+'かい', ex:1 });
    const k = nawaKyu(S);
    if(k!==null) out.sub = 'いまは '+rankLabel(k);
  }else if(id==='tetsubo' || id==='mat'){
    const skills = id==='tetsubo' ? TETSUBO_SKILLS : MAT_SKILLS;
    out.total = skills.length;
    skills.forEach(sk=>{ if(S[id].done.includes(sk.id)) out.items.push({ nm:sk.name, val:'できた!' }); });
    if(id==='tetsubo' && S.tetsubo.done.length>0) out.sub = 'いまは '+tetsuKyu(S);
  }else if(id==='tobibako'){
    out.total = TOBIBAKO_SKILLS.length;
    TOBIBAKO_SKILLS.forEach(sk=>{
      const d = S.tobibako.dan[sk.id]||0;
      if(tobibakoCleared(sk,d)) out.items.push({ nm:sk.name, val:sk.dan===false?'できた!':d+'だん' });
    });
    const mx = danMax(S);
    if(mx) out.sub = 'さいこう '+mx+'だん';
  }else if(id==='suiei'){
    out.total = SUIEI_KYU.length;
    SUIEI_KYU.forEach(k=>{ if(S.suiei.kyu.includes(k.id)) out.items.push({ nm:k.label, val:k.name }); });
    const totals = {};
    for(const l of S.suiei.log) totals[l.stroke] = (totals[l.stroke]||0) + l.m;
    STROKES.forEach(st=>{ if(totals[st.id]) out.items.push({ nm:st.em+' '+st.name, val:'るいけい '+totals[st.id]+'m', ex:1 }); });
    const lb = suieiKyuLabel(S);
    if(lb) out.sub = 'いまは '+lb;
  }else if(id==='marathon'){
    const total = marathonTotal(S);
    if(total>0){
      const longest = Math.max(0,...S.marathon.log.map(r=>r.m));
      out.items.push({ nm:'るいけい', val:(total/1000).toFixed(1)+'km', ex:1 });
      out.items.push({ nm:'はしったかいすう', val:S.marathon.log.length+'かい', ex:1 });
      out.items.push({ nm:'いちばんながい日', val:(longest/1000).toFixed(1)+'km', ex:1 });
      out.sub = 'ぜんぶで '+(total/1000).toFixed(1)+'km';
    }
  }else if(BALL_SPORTS[id]){
    const skills = ballSorted(id);
    out.total = skills.length;
    skills.forEach(sk=>{
      if(sk.type==='check'){
        if(S[id].done.includes(sk.id)) out.items.push({ nm:sk.name, val:'できた!' });
      }else{
        const b = S[id].best[sk.id]||0;
        if(b>0) out.items.push({ nm:sk.name, val:'ベスト '+b+sk.unit });
      }
    });
  }
  /* スモールステップの がんばりも ならべる（わざはまだでも ここに出る） */
  const skills = skillsOfSport(id);
  let stepN = 0;
  skills.forEach(sk=>{
    stepN += stepDoneCount(sk.id);
    const already = out.items.some(i=>i.nm===sk.name || i.nm===sk.label);
    if(!already && stepAll(sk.id)) out.items.push({ nm:sk.name||sk.label, val:'ステップ ぜんぶ!', ex:1 });
  });
  if(stepN>0) out.items.push({ nm:'🪜 スモールステップ', val:stepN+'こクリア', ex:1 });
  return out;
}
/* しゅもく → わざの配列（できたことリストとステップ集計で共用） */
function skillsOfSport(id){
  if(id==='nawatobi') return NAWATOBI_SKILLS;
  if(id==='tetsubo')  return TETSUBO_SKILLS;
  if(id==='mat')      return MAT_SKILLS;
  if(id==='tobibako') return TOBIBAKO_SKILLS;
  if(id==='suiei')    return SUIEI_KYU.map(k=>({id:k.id, name:k.label}));
  if(id==='marathon') return [{id:'mara', name:'はしるじゅんび'}];
  if(BALL_SPORTS[id]) return BALL_SPORTS[id].skills;
  return [];
}

/* できたことリスト本体。しゅもくカードは色わけ(SPORTS の col/bg) */
function dekitaHtml(){
  const cards = [], yet = [];
  let allDone = 0;
  Object.keys(SPORTS).forEach(id=>{
    const sp = SPORTS[id], d = dekitaOf(id);
    const done = d.items.filter(i=>!i.ex).length;
    allDone += done;
    if(d.items.length===0){ yet.push({ id, sp }); return; }
    cards.push(`<div class="dk-card">
      <button class="dk-head ${sp.cls}" onclick="go('sport/${id}')">
        ${sportIcon(sp)}
        <span class="nm">${sp.name}${d.sub?`<span class="sb">${d.sub}</span>`:''}</span>
        ${d.total?`<span class="cnt">${done}<span class="tt">/${d.total}</span></span>`:''}
        <span class="go">▶</span>
      </button>
      ${d.total?`<div class="dk-bar"><div class="fill" style="width:${done/d.total*100}%;background:${sp.col}"></div></div>`:''}
      <div class="dk-chips">
        ${d.items.map(i=>`<span class="dk-chip" style="background:${sp.bg};color:${sp.col}">${esc(i.nm)}<b>${esc(i.val)}</b></span>`).join('')}
      </div>
    </div>`);
  });
  if(cards.length===0){
    return `<div class="card center">
      <div style="font-size:44px">🌱</div>
      <p class="muted">まだ「できたこと」がないよ。<br>わざができたら ここにどんどんならんでいくよ!</p>
      <button class="btn wide orange" onclick="go('home')">きろくをはじめる!</button>
    </div>`;
  }
  return `<div class="card center" style="background:linear-gradient(160deg,#FFFBEB,#fff)">
    <div class="muted small">いま できるようになったこと</div>
    <div style="font-size:30px;font-weight:800;color:var(--orange-dark)">ぜんぶで ${allDone}こ!</div>
    <div class="muted small">しゅもくの いろのバーをおすと れんしゅうページにいけるよ</div>
  </div>
  ${cards.join('')}
  ${yet.length?`<div class="card">
    <h3>🌱 これからチャレンジ</h3>
    <div class="dk-yet">
      ${yet.map(y=>`<button onclick="go('sport/${y.id}')">${y.sp.icon?y.sp.icon:y.sp.em} ${y.sp.name}</button>`).join('')}
    </div>
  </div>`:''}`;
}

let progressTab = 'dekita';
function setProgressTab(t){ progressTab=t; render(); scrollTo(0,0); }

function viewProgress(){
  const days = [...new Set(S.records.map(r=>r.date))].sort().reverse();
  const li = levelInfo(S.profile.totalXp);
  const recent = days.slice(0,14);
  const timeline = recent.length===0
    ? `<div class="card center">
        <div style="font-size:44px">🌱</div>
        <p class="muted">まだきろくがないよ。<br>きょうのうんどうをきろくして、あしあとをのこそう!</p>
        <button class="btn wide orange" onclick="go('home')">きろくをはじめる!</button>
      </div>`
    : recent.map(d=>{
        const recs = S.records.filter(r=>r.date===d).slice().reverse();
        return `<div class="tl-date">📅 ${fmtDate(d)}${d===todayStr()?' (きょう)':''}</div>`+
          recs.map(r=>`<div class="tl-item">
            ${r.sport==='training'?'<span class="em">💪</span>':r.sport==='free'?'<span class="em">✍️</span>':SPORTS[r.sport]?sportIcon(SPORTS[r.sport]):'<span class="em">🏅</span>'}
            <span>${esc(r.label)}</span>
            <span class="xp">+${r.xp}XP</span></div>`).join('');
      }).join('')
      + (days.length>14?`<div class="center muted small" style="margin-top:10px">さいきん14日ぶんをひょうじしているよ</div>`:'');

  return headerHtml('せいちょうのあしあと','👣')+`
  <div class="stat-grid" style="margin-bottom:14px">
    <div class="stat-box"><div class="val">${S.records.length}</div><div class="lbl">きろくしたかいすう</div></div>
    <div class="stat-box"><div class="val">${days.length}</div><div class="lbl">うんどうした日</div></div>
    <div class="stat-box"><div class="val">Lv.${li.level}</div><div class="lbl">${esc(S.profile.name)||'きみ'}のボディレベル</div></div>
    <div class="stat-box"><div class="val">${S.badges.length}<span style="font-size:13px;color:var(--ink-soft)">/${BADGES.length}</span></div><div class="lbl">あつめたバッジ</div></div>
    <div class="stat-box"><div class="val">🔥${S.streak.best}</div><div class="lbl">さいこうれんぞく日すう</div></div>
    <div class="stat-box"><div class="val">${(marathonTotal(S)/1000).toFixed(1)}<span style="font-size:13px;color:var(--ink-soft)">km</span></div><div class="lbl">はしったきょり</div></div>
  </div>
  <div class="section-tabs">
    <button class="${progressTab==='dekita'?'active':''}" onclick="setProgressTab('dekita')">🌟 できたこと</button>
    <button class="${progressTab==='log'?'active':''}" onclick="setProgressTab('log')">📅 さいきんのきろく</button>
  </div>
  ${progressTab==='dekita' ? dekitaHtml() : timeline}`;
}

/* ---------------- バッジずかん ---------------- */
function viewBadges(){
  const got = S.badges.filter(id=>BADGES.some(b=>b.id===id)).length;
  const cats = [...new Set(BADGES.map(b=>b.cat))];
  return headerHtml('バッジずかん','🏅')+`
  <div class="card center" style="background:linear-gradient(160deg,#FFFBEB,#fff)">
    <div style="font-size:26px;font-weight:800;color:var(--orange-dark)">${got} / ${BADGES.length} こ</div>
    <div class="goalbar" style="margin-top:6px"><div class="fill" style="width:${got/BADGES.length*100}%"></div></div>
    <div class="muted small" style="margin-top:6px">${BADGES.length}こぜんぶあつめたら…でんせつのうんどうか!</div>
  </div>
  ${cats.map(c=>{
    const list = BADGES.filter(b=>b.cat===c);
    const g = list.filter(b=>S.badges.includes(b.id)).length;
    return `<div class="tl-date">🏷️ ${c} <span class="muted small" style="font-weight:700">${g} / ${list.length}</span></div>
    <div class="badge-grid" style="margin-bottom:6px">
      ${list.map(b=>{
        const on = S.badges.includes(b.id);
        return `<div class="badge-cell ${on?'got':'locked'}">
          <span class="em">${b.em}</span>
          <span class="nm">${on?b.name:'？？？'}</span>
          <span class="cond">${b.cond}</span>
        </div>`;
      }).join('')}
    </div>`;
  }).join('')}`;
}

/* ---------------- せってい ---------------- */
function viewSettings(){
  return headerHtml('せってい','⚙️')+`
  <div class="card">
    <h3>👤 きみのこと</h3>
    <div class="form-row"><label>なまえ</label>
      <input type="text" id="set-name" maxlength="12" value="${esc(S.profile.name)}" placeholder="なまえ" style="flex:1"></div>
    <div class="form-row"><label>がくねん</label>
      <select id="set-grade">
        <option value="0" ${!S.profile.grade?'selected':''}>えらぶ</option>
        ${[1,2,3,4,5,6].map(g=>`<option value="${g}" ${S.profile.grade===g?'selected':''}>${g}年生</option>`).join('')}
      </select></div>
    <button class="btn wide" onclick="saveProfile()">ほぞんする</button>
  </div>
  <div class="card">
    <h3>💾 きろくを まもる</h3>
    <button class="btn wide" onclick="BackupKit.open()" style="margin-bottom:8px">バックアップ＆ひきつぎ</button>
    <div class="muted small" style="margin-bottom:12px">きろくをファイルにのこしたり、あたらしいたんまつにひきつげるよ。おうちの人といっしょにつかってね。</div>
    <button class="btn danger wide" onclick="resetData()">ぜんぶリセットする</button>
  </div>
  <div class="card muted small">
    うごきのきろく — インターネットがなくてもつかえるよ。<br>
    けんてい・きゅうのひょうは「みんなが使えるチャレンジカード集」(栃木県教育委員会)をさんこうにしています。

function saveProfile(){
  S.profile.name = document.getElementById('set-name').value.trim();
  S.profile.grade = parseInt(document.getElementById('set-grade').value)||0;
  save();
  showToast('ほぞんしたよ!');
  render();
}
/* バックアップ＆ひきつぎ（backup-kit.js 共通部品）。
   旧「データをほぞん」の封筒なしJSONも looksLike 判定で読み込める */
BackupKit.init({
  appId: 'ugoki-no-kiroku',
  appName: 'うごきのきろく',
  storageKey: LS_KEY,
  looksLike: d => !!(d && typeof d==='object' && d.profile && Array.isArray(d.records)),
  summarize(d){
    const xp = (d.profile&&d.profile.totalXp)||0;
    const last = (d.records||[]).reduce((a,r)=>(r.date&&r.date>a)?r.date:a, '');
    return [
      {label:'なまえ', value:(d.profile&&d.profile.name)||'（なし）'},
      {label:'レベル', value:'Lv.'+levelInfo(xp).level},
      {label:'XP', value:String(xp)},
      {label:'きろくのかず', value:(d.records||[]).length+'こ'},
      {label:'バッジ', value:(d.badges||[]).length+'こ'},
      {label:'さいごのきろく', value:last?fmtDate(last):'—'},
    ];
  },
});
function resetData(){
  if(!confirm('ほんとうにぜんぶけす?\nきろく・バッジ・レベルがすべてきえます!')) return;
  if(!confirm('もういちどかくにん。ほんとうにリセットする?')) return;
  localStorage.removeItem(LS_KEY);
  S = defaultState();
  showToast('リセットしたよ');
  go('home'); render();
}

/* ---------------- はじめてのセットアップ ---------------- */
function firstRunModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay form-modal"><div class="modal-box">
    ${charSvg(1,100)}
    <h2>うごきのきろくへようこそ!</h2>
    <p>うんどうをきろくすると、きみのアバターが<br>どんどん強く、たくましくなるよ!</p>
    <input type="text" id="fr-name" maxlength="12" placeholder="なまえ(あとでもOK)" style="width:100%;margin-bottom:8px">
    <button class="btn orange wide" id="fr-go">ぼうけんスタート!</button>
  </div></div>`;
  const start = ()=>{
    S.profile.name = document.getElementById('fr-name').value.trim();
    S.profile.createdAt = todayStr();
    save();
    root.innerHTML='';
    confettiBurst();
    render();
  };
  document.getElementById('fr-go').onclick = start;
  // iPadのキーボードでボタンが隠れても、Enter(かんりょう)キーでスタートできるように
  [ 'fr-name' ].forEach(id=>{
    document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); start(); } });
  });
}

/* ---------------- 起動 ---------------- */
window.addEventListener('resize', ()=>{ confCanvas.width=innerWidth; confCanvas.height=innerHeight; });
render();
if(!S.profile.createdAt){
  firstRunModal();
}else{
  // アップデートであたらしいバッジがふえたとき、これまでのがんばりぶんをさかのぼってプレゼント
  checkBadges();
  save();
  render();
  playCelebrations();
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
